services:
  dima-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DIMA_DATABASE_URL: ${DIMA_DATABASE_URL:-}
      DIMA_METABASE_NATIVE_BASE_URL: ${DIMA_METABASE_NATIVE_BASE_URL:-}
      DIMA_JWT_SECRET: ${DIMA_JWT_SECRET:-}
      DIMA_JWT_REFRESH_SECRET: ${DIMA_JWT_REFRESH_SECRET:-}
      DIMA_CORS_ORIGINS: ${DIMA_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${DIMA_PORT:-8000}:8000"
    volumes:
      - dima_logs:/app/logs

volumes:
  dima_logs:
