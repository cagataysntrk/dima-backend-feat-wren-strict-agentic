version: '3.8'

services:
  wren-engine:
    image: ghcr.io/canner/wren-engine:latest
    container_name: dima-wren-engine
    ports:
      - "8080:8080"
    environment:
      - WREN_ENGINE_PORT=8080
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dima-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  dima-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dima-backend-core
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - WREN_ENGINE_URL=http://wren-engine:8080
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${DIMA_OPENROUTER_API_KEY}}
      - DIMA_OPENROUTER_API_KEY=${DIMA_OPENROUTER_API_KEY}
      - DIMA_OPENROUTER_MODEL=${DIMA_OPENROUTER_MODEL}
    depends_on:
      - wren-engine
      - qdrant
    restart: always

volumes:
  qdrant_data:
