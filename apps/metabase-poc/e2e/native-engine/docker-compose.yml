services:
  analytics-db:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: boyahane
      POSTGRES_USER: boyahane_owner
      POSTGRES_PASSWORD: ${BOYAHANE_OWNER_PASSWORD}
    ports: ["127.0.0.1:55442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boyahane_owner -d boyahane"]
      interval: 2s
      timeout: 3s
      retries: 60

  engine-app-db:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase_app
      POSTGRES_PASSWORD: ${ENGINE_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase_app -d metabase"]
      interval: 2s
      timeout: 3s
      retries: 60

  auth-db:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: dima_auth
      POSTGRES_USER: dima
      POSTGRES_PASSWORD: ${DIMA_AUTH_DB_PASSWORD}
    ports: ["127.0.0.1:55443:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dima -d dima_auth"]
      interval: 2s
      timeout: 3s
      retries: 60

  engine:
    image: ghcr.io/upcytech/dima-metabase-engine@sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b
    depends_on:
      analytics-db: {condition: service_healthy}
      engine-app-db: {condition: service_healthy}
    ports: ["127.0.0.1:3312:3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: engine-app-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${ENGINE_APP_DB_PASSWORD}
      MB_AI_FEATURES_ENABLED: "true"
      MB_METABOT_ENABLED: "true"
      MB_AGENT_API_ENABLED: "true"
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_MCP_EXECUTE_SQL_ENABLED: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_LLM_OPENROUTER_API_KEY: ${DIMA_OPENROUTER_API_KEY}
      MB_LLM_METABOT_PROVIDER: openrouter/openai/gpt-5.6-luna
