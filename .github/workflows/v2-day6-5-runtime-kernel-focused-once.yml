name: v2-day6-5-runtime-kernel-focused-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-runtime-kernel-focused-once.yml"

jobs:
  runtime-kernel-focused:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run runtime-kernel focused gate'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install focused dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile runtime-kernel boundary
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/agent_runtime.py \
            app/v2/standard_builder.py \
            app/v2/standard_projection.py \
            app/v2/standard_authority.py \
            app/v2/standard_coverage.py \
            tests/test_v2_day6_5_agent_runtime.py \
            tests/test_v2_day6_5_standard_builder.py
      - name: Focused provider-free kernel gate
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_agent_runtime.py \
            tests/test_v2_day6_5_standard_builder.py \
            tests/test_v2_day6_5_standard_authority.py \
            tests/test_v2_day6_5_standard_coverage.py
