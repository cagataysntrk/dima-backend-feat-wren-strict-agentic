# DMP-DEC-0055 exact-current live-preparation seal candidate
name: dima-metabase-p19-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/hypothesis_root_cause.py"
      - "backend/app/v3/hypothesis_root_cause_provider.py"
      - "backend/control_plane/models.py"
      - "backend/migrations/versions/f6b2e8c4a917_p19_hypothesis_root_cause.py"
      - "backend/tests/test_v3_p19_hypothesis_root_cause.py"
      - "backend/tests/test_v3_p19_provider.py"
      - "backend/tests/test_v3_p19_autonomous_eval.py"
      - "backend/lab/metabase/p19/**"
      - "backend/belgeler/metabase/predev/P19_HYPOTHESIS_ROOT_CAUSE_PREDEVELOPMENT_REVIEW.md"
      - "backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
      - "DIMA-METABASE-DURUM.md"
      - "DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md"
      - "backend/belgeler/metabase/DIMA_METABASE_CURRENT_PRODUCT_PLAN.md"
      - ".github/workflows/dima-metabase-p19-provider-free.yml"
      - ".github/workflows/dima-metabase-p19-live.yml"
      - ".github/workflows/dima-metabase-governance.yml"
      - ".github/workflows/dima-metabase-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p19-provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce DMP-DEC-0055 minimal P19 boundary
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P19_HYPOTHESIS_ROOT_CAUSE_PREDEVELOPMENT_REVIEW.md"
          DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
          grep -q "DMP-DEC-0055" "$REVIEW"
          grep -q "P19 MINIMAL IMPLEMENTATION AUTHORIZED" "$REVIEW"
          grep -q "DMP-DEC-0055 — MINIMAL HYPOTHESIS / ROOT-CAUSE EPISTEMIC AUTHORITY" "$DECISIONS"
          grep -q "P17 InvestigationGraph != P19 causal graph" "$REVIEW"
          grep -q "P18 business-policy direction != causal direction" "$REVIEW"
          grep -q "NO_DEFENSIBLE_ROOT_CAUSE_ESTABLISHED" "$REVIEW"

      - name: Compile P19 authority slice
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile             app/v3/hypothesis_root_cause.py             control_plane/models.py             migrations/versions/f6b2e8c4a917_p19_hypothesis_root_cause.py             tests/test_v3_p19_hypothesis_root_cause.py
          if [ -f app/v3/hypothesis_root_cause_provider.py ]; then
            python -m py_compile app/v3/hypothesis_root_cause_provider.py
          fi
          if [ -f tests/test_v3_p19_provider.py ]; then
            python -m py_compile tests/test_v3_p19_provider.py
          fi
          if [ -f tests/test_v3_p19_autonomous_eval.py ]; then
            python -m py_compile tests/test_v3_p19_autonomous_eval.py
          fi
          if [ -f lab/metabase/p19/autonomous_canary.py ]; then
            python -m py_compile lab/metabase/p19/autonomous_canary.py
          fi
          if [ -f lab/metabase/p19/autonomous_eval.py ]; then
            python -m py_compile lab/metabase/p19/autonomous_eval.py
          fi

      - name: Verify single Alembic head retains sealed P19 revision
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic heads > /tmp/p19-heads.txt
          test "$(grep -Ec '^[0-9a-f]+' /tmp/p19-heads.txt)" -eq 1
          python -m alembic history --verbose > /tmp/p19-history.txt
          grep -q 'Rev: f6b2e8c4a917' /tmp/p19-history.txt

      - name: Guard P19 as epistemic authority only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/v3/hypothesis_root_cause.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module or "")

          forbidden = (
              "app.v3.substrate.metabase",
              "app.v3.research_native_gateway",
              "app.v3.research_followup",
              "app.v3.native_execution",
              "app.wren",
              "numpy",
              "pandas",
              "scipy",
              "statistics",
          )
          bad = sorted(x for x in imports if x.startswith(forbidden))
          assert not bad, bad

          for symbol in (
              "NativeEngineBridge",
              "MetabaseAgentClient",
              "execute_dataset",
              "explore_adhoc",
              "attest_native_query",
              "execute_native_query",
              "wren_service",
              "InvestigationGraph",
              "ResearchManager.add_hypothesis",
              "HypothesisState",
              "DimaQueryReceipt(",
              "EvidenceArtifact(",
          ):
              assert symbol not in source, symbol

          models = Path("backend/control_plane/models.py")
          model_tree = ast.parse(models.read_text(encoding="utf-8"))
          p19_tables = set()
          for node in model_tree.body:
              if not isinstance(node, ast.ClassDef):
                  continue
              for item in node.body:
                  if (
                      isinstance(item, ast.Assign)
                      and any(
                          isinstance(target, ast.Name)
                          and target.id == "__tablename__"
                          for target in item.targets
                      )
                      and isinstance(item.value, ast.Constant)
                      and isinstance(item.value.value, str)
                      and item.value.value.startswith("p19_")
                  ):
                      p19_tables.add(item.value.value)
          assert p19_tables == {
              "p19_hypothesis",
              "p19_hypothesis_grounding",
              "p19_root_cause_assessment",
          }, p19_tables
          PY

      - name: P19 focused provider-free proof
        working-directory: backend
        run: pytest -q tests/test_v3_p19_hypothesis_root_cause.py

      - name: P19 provider/evaluator proof when present
        working-directory: backend
        run: |
          set -euo pipefail
          files=()
          [ ! -f tests/test_v3_p19_provider.py ] || files+=(tests/test_v3_p19_provider.py)
          [ ! -f tests/test_v3_p19_autonomous_eval.py ] || files+=(tests/test_v3_p19_autonomous_eval.py)
          if [ "${#files[@]}" -gt 0 ]; then
            pytest -q "${files[@]}"
          fi

      - name: P18 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p18_business_relationship_policy.py

      - name: P17 provider-free regressions remain GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p17_authorization_transport.py tests/test_v3_p17_autonomous_provider_schema.py tests/test_v3_p17_autonomous_manager_eval.py tests/test_v3_p17_research_manager.py

      - name: P16 claim-lineage remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p16_claim_lineage.py

      - name: P15 native Exploration remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p15_native_exploration.py

      - name: P14 native-direct remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p14_product.py tests/test_v3_p14_native_gateway.py

      - name: Verify engine identity unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"

      - name: Verify P19 paid work is isolated from production owner
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'openrouter|openai/gpt|Luna|Sol|C1' backend/app/v3/hypothesis_root_cause.py

      - name: Verify bounded P19 live lab has zero analytical execution authority
        shell: bash
        run: |
          set -euo pipefail
          CANARY="backend/lab/metabase/p19/autonomous_canary.py"
          LIVE=".github/workflows/dima-metabase-p19-live.yml"
          test -f "$CANARY"
          test -f "$LIVE"
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/lab/metabase/p19/autonomous_canary.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module or "")

          forbidden = (
              "app.v3.substrate.metabase",
              "app.v3.research_native_gateway",
              "app.v3.research_followup",
              "app.v3.native_execution",
              "app.wren",
              "numpy",
              "pandas",
              "scipy",
              "statistics",
          )
          bad = sorted(name for name in imports if name.startswith(forbidden))
          assert not bad, bad
          for symbol in (
              "NativeEngineBridge",
              "MetabaseAgentClient",
              "execute_dataset",
              "explore_adhoc",
              "execute_native_query",
              "wren_service",
          ):
              assert symbol not in source, symbol
          assert "StructuredP19AssessmentManager" in source
          assert "evaluate_p19_canary" in source
          PY
          grep -q 'MANAGER_MODEL_IDENTIFIER: openai/gpt-5.6-luna' "$LIVE"
          ! grep -nE 'docker[[:space:]]+(build|buildx[[:space:]]+build|run)|/api/dataset|MB_METABOT|MB_LLM|wren_service|openai/gpt-5.6-sol|C1' "$LIVE"
