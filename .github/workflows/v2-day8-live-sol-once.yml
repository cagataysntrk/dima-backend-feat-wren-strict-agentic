name: v2-day8-live-sol-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day8-live-sol-once.yml"

jobs:
  live-sol-once:
    if: "${{ github.event.head_commit.message == 'test(v2-day8): run one live Sol root-cause sentinel' }}"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 20
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_MODEL: "openai/gpt-5.6-sol"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend live-eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Provider-free Day8 live sentinel preflight
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day8_live_sol_contract.py \
            tests/test_v2_day8_manager_root_cause_loop.py

      - name: Workers=1 one-case LIVE SOL
        working-directory: backend
        run: |
          python lab/v2_day8_root_cause_live_sol.py \
            --max-model-calls 8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day8-live-sol-once-${{ github.run_id }}
          path: backend/lab/reports/v2_day8_root_cause_live_sol.json
          retention-days: 90
