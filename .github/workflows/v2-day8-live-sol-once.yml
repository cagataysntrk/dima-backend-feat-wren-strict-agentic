name: v2-day8-live-sol-once
# Post-fix re-measurement: same canonical scenario + same harness; paid ceiling = 5.

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day8-live-sol-once.yml"

jobs:
  live-sol-once:
    if: "${{ github.event.head_commit.message == 'test(v2-day8): run one live Sol root-cause sentinel' }}"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 20
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_MODEL: "openai/gpt-5.6-sol"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend live-eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Provider-free Day8 live sentinel preflight
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day8_live_sol_contract.py \
            tests/test_v2_day8_manager_root_cause_loop.py

      - name: Workers=1 one-case LIVE SOL
        id: live
        working-directory: backend
        run: |
          python lab/v2_day8_root_cause_live_sol.py \
            --max-model-calls 5

      - name: Seal measurement identity receipt
        if: always()
        working-directory: backend
        env:
          PRODUCT_BEHAVIOR_SHA: "3091651aea93e42e00521654af8d5dc2c51dc9c3"
          EXPECTED_SCENARIO_HASH: "8379daa7fc70a678514b7f87dcb41fcdfec4d317d8ded4cc2712ee7cfb4c8d6a"
          EXPECTED_HARNESS_BLOB_SHA: "4ae479eb171eccb709eb326309734779533079ab"
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          harness = Path("lab/v2_day8_root_cause_live_sol.py")
          report = Path("lab/reports/v2_day8_root_cause_live_sol.json")

          tree = ast.parse(harness.read_text(encoding="utf-8"))
          scenario = None
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef) and node.name == "_build_fixture":
                  for item in node.body:
                      if isinstance(item, ast.Assign):
                          if any(isinstance(t, ast.Name) and t.id == "question" for t in item.targets):
                              scenario = ast.literal_eval(item.value)
                              break
          if not isinstance(scenario, str) or not scenario:
              raise SystemExit("canonical live scenario could not be extracted")

          scenario_hash = hashlib.sha256(scenario.encode("utf-8")).hexdigest()
          if scenario_hash != os.environ["EXPECTED_SCENARIO_HASH"]:
              raise SystemExit(
                  f"scenario drift: {scenario_hash} != {os.environ['EXPECTED_SCENARIO_HASH']}"
              )

          harness_blob_sha = subprocess.check_output(
              ["git", "hash-object", str(harness)],
              text=True,
          ).strip()
          if harness_blob_sha != os.environ["EXPECTED_HARNESS_BLOB_SHA"]:
              raise SystemExit(
                  f"harness drift: {harness_blob_sha} != {os.environ['EXPECTED_HARNESS_BLOB_SHA']}"
              )

          payload = {}
          if report.exists():
              payload = json.loads(report.read_text(encoding="utf-8"))
          payload.update(
              {
                  "product_behavior_sha": os.environ["PRODUCT_BEHAVIOR_SHA"],
                  "current_head": subprocess.check_output(
                      ["git", "rev-parse", "HEAD"], text=True
                  ).strip(),
                  "scenario_hash": scenario_hash,
                  "harness_identity": str(harness),
                  "harness_version": harness_blob_sha,
              }
          )
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day8-live-sol-once-${{ github.run_id }}
          path: backend/lab/reports/v2_day8_root_cause_live_sol.json
          retention-days: 90
