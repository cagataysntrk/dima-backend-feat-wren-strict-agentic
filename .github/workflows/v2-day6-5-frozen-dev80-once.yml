name: v2-day6-5-frozen-dev80-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-frozen-dev80-once.yml"

jobs:
  dev80:
    if: "github.event.head_commit.message == 'eval(v2-day6.5): run frozen DEV80'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 60
    env:
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8961a60a0255df691e5f1f42cf2131e83f8af674
      - name: Verify exact frozen SHA
        run: test "$(git rev-parse HEAD)" = "8961a60a0255df691e5f1f42cf2131e83f8af674"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Provider-free architecture sentinel
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_preacceptance_protocol.py \
            tests/test_v2_day6_5_capability_algebra.py \
            tests/test_v2_day6_5_manager_authority.py \
            tests/test_v2_day6_5_correctness_closure.py \
            tests/test_v2_day6_5_adaptive_branch.py \
            tests/test_v2_day6_5_dev_corpus.py
      - name: Sol frozen DEV80 workers=1
        working-directory: backend
        run: |
          python lab/v2_day6_5_manager_eval.py \
            --require-live \
            --workers 1 \
            --model openai/gpt-5.6-sol \
            --output lab/reports/v2_day6_5_frozen_dev80.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-frozen-dev80
          path: backend/lab/reports/v2_day6_5_frozen_dev80.json
          retention-days: 30
