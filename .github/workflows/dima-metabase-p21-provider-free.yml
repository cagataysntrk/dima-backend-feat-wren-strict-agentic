# DMP-DEC-0057 minimal provider-free DecisionBrief authority
name: dima-metabase-p21-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/decision_intelligence.py"
      - "backend/control_plane/models.py"
      - "backend/migrations/versions/f8d5b3e9c041_p21_decision_brief.py"
      - "backend/tests/test_v3_p21_decision_intelligence.py"
      - "backend/belgeler/metabase/predev/P21_DECISION_INTELLIGENCE_PREDEVELOPMENT_REVIEW.md"
      - "backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
      - "DIMA-METABASE-DURUM.md"
      - "DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md"
      - "backend/belgeler/metabase/DIMA_METABASE_CURRENT_PRODUCT_PLAN.md"
      - ".github/workflows/dima-metabase-p21-provider-free.yml"
      - ".github/workflows/dima-metabase-p20-provider-free.yml"
      - ".github/workflows/dima-metabase-governance.yml"
      - ".github/workflows/dima-metabase-m1.yml"
      - "backend/belgeler/metabase/predev/POST_P21_HUMAN_ADOPTION_ACTION_BOUNDARY_PREDEVELOPMENT_REVIEW.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p21-provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce DMP-DEC-0057 append-only implementation authority
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P21_DECISION_INTELLIGENCE_PREDEVELOPMENT_REVIEW.md"
          DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
          grep -q "PRE-DEVELOPMENT REVIEW COMPLETE / DMP-DEC-0057 / IMPLEMENTATION NOT AUTHORIZED" "$REVIEW"
          grep -q "## 22. DMP-DEC-0057 lifecycle — minimal implementation authorization" "$REVIEW"
          grep -q "P21 MINIMAL PROVIDER-FREE IMPLEMENTATION AUTHORIZED" "$REVIEW"
          grep -q "DMP-DEC-0057 lifecycle — MINIMAL P21 IMPLEMENTATION AUTHORIZATION" "$DECISIONS"
          grep -q "DecisionBrief != legacy DecisionRecord" "$REVIEW"

      - name: Compile P21 authority slice
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile             app/v3/decision_intelligence.py             control_plane/models.py             migrations/versions/f8d5b3e9c041_p21_decision_brief.py             tests/test_v3_p21_decision_intelligence.py

      - name: Verify single Alembic head
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic heads > /tmp/p21-heads.txt
          test "$(grep -Ec '^[0-9a-f]+' /tmp/p21-heads.txt)" -eq 1
          grep -q '^f8d5b3e9c041' /tmp/p21-heads.txt
          python -m alembic history --verbose > /tmp/p21-history.txt
          grep -q 'Rev: f7c4a2d8b930' /tmp/p21-history.txt

      - name: Guard P21 as advisory authority only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/v3/decision_intelligence.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          imports = set()
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module or "")
                  imported.update(alias.name for alias in node.names)

          forbidden = (
              "app.v3.substrate.metabase",
              "app.v3.research",
              "app.v3.claim_lineage",
              "app.v3.hypothesis_root_cause",
              "app.v3.business_relationship_policy",
              "app.wren",
              "numpy",
              "pandas",
              "scipy",
              "statistics",
          )
          bad = sorted(name for name in imports if name.startswith(forbidden))
          assert not bad, bad
          assert "DecisionRecord" not in imported
          assert "ReportDocumentRecord" not in imported

          models = Path("backend/control_plane/models.py")
          model_tree = ast.parse(models.read_text(encoding="utf-8"))
          tables = set()
          for node in model_tree.body:
              if not isinstance(node, ast.ClassDef):
                  continue
              for item in node.body:
                  if (
                      isinstance(item, ast.Assign)
                      and any(
                          isinstance(target, ast.Name)
                          and target.id == "__tablename__"
                          for target in item.targets
                      )
                      and isinstance(item.value, ast.Constant)
                      and isinstance(item.value.value, str)
                      and item.value.value.startswith("p21_")
                  ):
                      tables.add(item.value.value)
          assert tables == {"p21_decision_brief"}, tables
          PY

          test ! -f backend/app/routers/decision_intelligence.py
          test ! -f backend/app/v3/action.py
          ! grep -nE 'openrouter|openai/gpt|Luna|Sol|C1' backend/app/v3/decision_intelligence.py
          ! grep -nE 'docker[[:space:]]+(build|buildx[[:space:]]+build)' .github/workflows/dima-metabase-p21-provider-free.yml

      - name: Verify legacy and sealed owner source remain untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD^ HEAD -- backend/app/decision.py backend/app/routers/decisions.py)"
          test -z "$(git diff --name-only HEAD^ HEAD -- backend/app/v3/report_document.py backend/migrations/versions/f7c4a2d8b930_p20_report_document.py)"
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"

      - name: P21 focused provider-free proof
        working-directory: backend
        run: pytest -q tests/test_v3_p21_decision_intelligence.py

      - name: P20 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p20_report_document.py

      - name: P19 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p19_hypothesis_root_cause.py tests/test_v3_p19_provider.py tests/test_v3_p19_autonomous_eval.py

      - name: P18 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p18_business_relationship_policy.py

      - name: P17 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p17_authorization_transport.py tests/test_v3_p17_autonomous_provider_schema.py tests/test_v3_p17_autonomous_manager_eval.py tests/test_v3_p17_research_manager.py

      - name: P16 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p16_claim_lineage.py

      - name: P15 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p15_native_exploration.py

      - name: P14 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p14_product.py tests/test_v3_p14_native_gateway.py

      - name: Verify P21 is provider-free and side-effect-free
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'openrouter|openai/gpt|Luna|Sol|C1' backend/app/v3/decision_intelligence.py
          ! grep -nE 'email|slack|ticket|workflow trigger|scheduled action' backend/app/v3/decision_intelligence.py
