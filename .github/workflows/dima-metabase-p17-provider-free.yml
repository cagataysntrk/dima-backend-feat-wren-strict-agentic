# P17 recursive authority provider-free closure. Paid cognition is a separate one-canary gate.
# Closure candidate includes portable strict live-manager schema and compiled canary harness.
# Final pre-paid candidate also locks model-owned branch selection with deterministic topology identity.
# Post-live-RED closure verifies the typed nullability root fix without another paid run.
name: dima-metabase-p17-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/research_manager.py"
      - "backend/app/v3/research_manager_provider.py"
      - "backend/lab/metabase/p17/recursive_manager_canary.py"
      - ".github/workflows/dima-metabase-p17-recursive-live.yml"
      - "backend/app/v3/research_followup.py"
      - "backend/app/v3/research_product.py"
      - "backend/app/v3/research_store.py"
      - "backend/app/v3/research_exploration.py"
      - "backend/app/v3/claim_lineage.py"
      - "backend/app/v3/research.py"
      - "backend/control_plane/models.py"
      - "backend/migrations/versions/d9f6a1c3e742_p17_research_reasoning.py"
      - "backend/migrations/versions/e1a7b4c9d305_p17_followup_execution_lineage.py"
      - "backend/migrations/versions/f3c9d6e2a814_p17_recursive_investigation_topology.py"
      - "backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
      - "DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md"
      - "backend/tests/test_v3_p17_research_manager.py"
      - "backend/tests/test_v3_p16_claim_lineage.py"
      - "backend/tests/test_v3_p15_native_exploration.py"
      - "backend/tests/test_v3_p14_native_gateway.py"
      - "backend/belgeler/metabase/predev/P17_RESEARCH_MANAGER_MATURATION_PREDEVELOPMENT_REVIEW.md"
      - ".github/workflows/dima-metabase-p17-provider-free.yml"
      - ".github/workflows/dima-metabase-governance.yml"
      - ".github/workflows/dima-metabase-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-manager-provider-free:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p17-seal]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce P17 investigation-manager boundary
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P17_RESEARCH_MANAGER_MATURATION_PREDEVELOPMENT_REVIEW.md"
          DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
          grep -q "SEALED / P17 RESEARCH MANAGER MATURATION IMPLEMENTATION AUTHORIZED" "$REVIEW"
          grep -q "DMP-DEC-0049 — RECURSIVE INVESTIGATION" "$DECISIONS"
          HOT=(
            "backend/app/v3/research_manager.py"
            "backend/app/v3/research_manager_provider.py"
            "backend/app/v3/research_followup.py"
          )
          FORBIDDEN='NativeStandardTrustOrchestrator|ResolvedAnalyticsIntent|TemporalBindingEngine|MetabaseProjectionCompiler|MetabaseCanonicalizer|attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(|app\.wren|wren_service|MetabaseAgentClient'
          for file in "${HOT[@]}"; do
            ! grep -nE "$FORBIDDEN" "$file"
            ! grep -nE '^(from|import)[[:space:]]+(numpy|pandas|scipy|statistics)([[:space:].]|$)' "$file"
            ! grep -nE '(breakdown|trend|rank|compare)[[:space:]]*\(' "$file"
          done
          grep -q "SEEK_COUNTER_EVIDENCE" backend/app/v3/research_manager.py
          grep -q "NO_PROGRESS" backend/app/v3/research_manager.py
          grep -q "ResearchReasoningStepRecord" backend/app/v3/research_manager.py
          grep -q "NativeResearchOccurrenceRunner" backend/app/v3/research_followup.py
          ! grep -nE 'execute_dataset[[:space:]]*\(|bridge\.invoke[[:space:]]*\(' backend/app/v3/research_followup.py

      - name: Compile P17 reasoning slice
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/research_manager.py \
            app/v3/research_manager_provider.py \
            app/v3/research_followup.py \
            app/v3/research_product.py \
            app/v3/research.py \
            app/v3/research_store.py \
            app/v3/research_exploration.py \
            app/v3/claim_lineage.py \
            control_plane/models.py \
            migrations/versions/d9f6a1c3e742_p17_research_reasoning.py \
            migrations/versions/e1a7b4c9d305_p17_followup_execution_lineage.py \
            migrations/versions/f3c9d6e2a814_p17_recursive_investigation_topology.py \
            tests/test_v3_p17_research_manager.py

      - name: Verify single Alembic head includes P17 durability
        working-directory: backend
        run: |
          set -euo pipefail
          heads="$(python -m alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -Ec '^[0-9a-f]+')" -eq 1
          printf '%s\n' "$heads" | grep -q '^f3c9d6e2a814'

      - name: P17 focused provider-free reasoning proof
        working-directory: backend
        run: pytest -q tests/test_v3_p17_research_manager.py

      - name: P16 claim-lineage authority remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p16_claim_lineage.py

      - name: P15 native Exploration authority remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p15_native_exploration.py

      - name: P14 native-direct authority remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p14_product.py tests/test_v3_p14_native_gateway.py
