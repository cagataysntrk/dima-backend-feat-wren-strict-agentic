name: dima-brain-v2-phase1-provider-free

on:
  push:
    branches:
      - feat/dima-brain-v2
      - feat/dima-brain-v2-1-discovery-simplification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-provider-free:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[brain-v2-phase1-provider-free]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dima
          POSTGRES_PASSWORD: dima
          POSTGRES_DB: dima_brain_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dima -d dima_brain_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_BRAIN_V2_TEST_POSTGRES_DSN: "postgresql://dima:dima@127.0.0.1:5432/dima_brain_v2_test"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Brain V2 architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "d5c60dc9f37a9ec9c5b0117f178146bbcb8dca88"
          test -d backend/app/v3/brain_v2
          ! grep -R -nE 'DEV80|Validation50|Hidden50|30-case|F0[0-9]|F10|T[1-7]' backend/app/v3/brain_v2
          ! grep -R -nE 'sqlalchemy|sqlmodel|app\.v3\.substrate\.metabase\.(compiler|execution_adapter)' backend/app/v3/brain_v2
          python -m compileall -q backend/app/v3/brain_v2
          python -m py_compile \
            backend/lab/metabase/brain_v2/phase1_live.py \
            backend/lab/metabase/brain_v2/live_support.py \
            backend/lab/metabase/brain_v2/final_probes.py \
            backend/lab/metabase/brain_v2/final_mechanical.py

      - name: Brain V2 deterministic closure
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_brain_v2_contracts.py             tests/test_v3_brain_v2_graph.py             tests/test_v3_brain_v2_adaptive_material_delta.py             tests/test_v3_brain_v2_material_stateful.py             tests/test_v3_brain_v2_material_groups.py             tests/test_v3_brain_v2_requirement_dispatch.py             tests/test_v3_brain_v2_discovery_stateful.py             tests/test_v3_brain_v2_owner_integration.py             tests/test_v3_brain_v2_postgres_checkpoint.py             tests/test_v3_brain_v2_live_harness.py             tests/test_v3_brain_v2_telemetry.py             tests/test_v3_brain_v2_runtime_guardrails.py             tests/test_v3_brain_v2_forward_phase2.py             tests/test_v3_brain_v2_final_mechanical.py

      - name: Migration graph remains single-head
        working-directory: backend
        run: |
          set -euo pipefail
          test "$(alembic heads | wc -l)" -eq 1
          alembic heads

      - name: Research and scope authority regressions
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_research_intake.py             tests/test_v3_research_scope_patch.py             tests/test_v3_research_scope_patch_stateful.py             tests/test_v3_v1_scope_contract.py             tests/test_v3_v1_scope_integration.py             tests/test_v3_p12x_c2_native_engine_bridge.py             tests/test_v3_p14_product.py             tests/test_v3_p14_native_direct.py::test_native_agent_continuation_state_roundtrips_with_fingerprint             tests/test_v3_p14_native_direct.py::test_native_agent_continuation_state_missing_fails_closed             tests/test_v3_p14_native_direct.py::test_native_agent_continuation_state_tamper_fails_closed             tests/test_v3_p14_native_direct.py::test_native_agent_continuation_state_rejects_unknown_engine_keys             tests/test_v3_p17_native_continuation_history.py             tests/test_v3_p14_research.py             tests/test_v3_p14_native_gateway.py             tests/test_v3_research_material_coverage.py

      - name: P17 investigation regressions
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p17_authorization_transport.py             tests/test_v3_p17_autonomous_provider_schema.py             tests/test_v3_p17_autonomous_manager_eval.py             tests/test_v3_p17_request_differential.py             tests/test_v3_p17_research_manager.py

      - name: P19 epistemic regressions
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p19_hypothesis_root_cause.py             tests/test_v3_p19_provider.py             tests/test_v3_p19_autonomous_eval.py

      - name: P20 report and Core-B semantic regressions
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p20_report_document.py             tests/test_v3_core_b_closure_v2.py             tests/test_v3_core_b_relationship_root_regression.py

      - name: Security and repository hygiene
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_control_plane_security.py             tests/test_repository_hygiene.py
