name: dima-phase1-5-dev-focused

on:
  push:
    branches:
      - phase1-5-surgical-convergence-20260930
    paths:
      - "backend/tests/test_v3_phase1_5_architecture_xray.py"
      - "backend/app/v3/research_intake.py"
      - "backend/app/v3/research_contracts.py"
      - "backend/app/v3/research_analytical_scope.py"
      - "backend/app/v3/product/**"
      - "backend/app/v3/business_relationship_v1.py"
      - "backend/app/v3/hypothesis_root_cause*.py"
      - ".github/workflows/dima-phase1-5-dev-focused.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Phase 1.5 focused X-ray
        working-directory: backend
        run: |
          python -m py_compile tests/test_v3_phase1_5_architecture_xray.py
          pytest -q tests/test_v3_phase1_5_architecture_xray.py
