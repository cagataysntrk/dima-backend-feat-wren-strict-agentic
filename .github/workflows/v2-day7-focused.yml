name: v2-day7-focused

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - "backend/app/wren_service.py"
      - "backend/tests/test_v2_day7_fanout_certificate_version.py"
      - "backend/app/fanout.py"
      - "backend/app/v2/research_tools.py"
      - "backend/app/v2/manager_tools.py"
      - "backend/app/v2/manager_executor.py"
      - "backend/tests/test_v2_day7_research_tool_contract.py"
      - "backend/tests/test_v2_day7_research_wren_vertical.py"
      - "backend/tests/test_v2_day7_wren_schema_grain_metadata.py"
      - "backend/tests/test_v2_day7_real_adaptive_wren.py"
      - "backend/app/v2/research_state.py"
      - "backend/app/v2/research_tasks.py"
      - "backend/app/v2/research_fanout.py"
      - "backend/app/v2/cross_domain_join.py"
      - "backend/app/v2/manager_runtime.py"
      - "backend/app/v2/manager_models.py"
      - "backend/app/v2/manager_loop.py"
      - "backend/app/v2/models.py"
      - "backend/tests/test_v2_day7_research_task_lifecycle.py"
      - "backend/tests/test_v2_day7_research_task_registry.py"
      - "backend/tests/test_v2_day7_research_task_registry_execution.py"
      - "backend/tests/test_v2_day7_research_fanout.py"
      - "backend/tests/test_v2_day7_same_domain_tools.py"
      - "backend/tests/test_v2_day7_cross_domain_join_gate.py"
      - "backend/tests/test_v2_day7_research_manager_loop.py"
      - "backend/tests/test_v2_day7_result_aware_loop.py"
      - "backend/app/v2/cross_domain_facts.py"
      - "backend/tests/test_v2_day7_cross_domain_facts.py"
      - "backend/app/v2/manager_core_adapter.py"
      - "backend/app/v2/relationship_adapter.py"
      - "backend/tests/test_v2_day7_real_relationship_vertical.py"
      - ".github/workflows/v2-day7-focused.yml"
  workflow_dispatch:

jobs:
  research-tool-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile Day7 slice
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/research_tools.py \
            app/v2/research_state.py \
            app/v2/research_tasks.py \
            app/v2/research_fanout.py \
            app/v2/cross_domain_join.py \
            app/v2/cross_domain_facts.py \
            app/v2/relationship_adapter.py \
            app/v2/manager_core_adapter.py \
            app/v2/manager_tools.py \
            app/v2/manager_executor.py \
            app/v2/manager_runtime.py \
            app/v2/manager_models.py \
            app/v2/manager_loop.py \
            app/v2/models.py
      - name: Focused provider-free Day7 test
        working-directory: backend
        run: pytest -q tests/test_v2_day7_research_tool_contract.py

      - name: Research task lifecycle
        working-directory: backend
        run: pytest -q tests/test_v2_day7_research_task_lifecycle.py

      - name: ResearchTaskRegistry lifecycle
        working-directory: backend
        run: pytest -q tests/test_v2_day7_research_task_registry.py

      - name: ResearchTaskRegistry execution path
        working-directory: backend
        run: pytest -q tests/test_v2_day7_research_task_registry_execution.py

      - name: Cardinality-aware Research fanout
        working-directory: backend
        run: pytest -q tests/test_v2_day7_research_fanout.py

      - name: Governed same-domain Research tools
        working-directory: backend
        run: pytest -q tests/test_v2_day7_same_domain_tools.py

      - name: Governed cross-domain fact construction
        working-directory: backend
        run: pytest -q tests/test_v2_day7_cross_domain_facts.py

      - name: CrossDomainJoinGate attacks
        working-directory: backend
        run: pytest -q tests/test_v2_day7_cross_domain_join_gate.py

      - name: Fanout certificate MDL freshness
        working-directory: backend
        run: pytest -q tests/test_v2_day7_fanout_certificate_version.py

      - name: Manager loop Research contract mode
        working-directory: backend
        run: pytest -q tests/test_v2_day7_research_manager_loop.py

      - name: Result-aware adaptive loop
        working-directory: backend
        run: pytest -q tests/test_v2_day7_result_aware_loop.py

      - name: Real Wren schema grain metadata
        working-directory: backend
        run: pytest -q tests/test_v2_day7_wren_schema_grain_metadata.py

      - name: Real Wren Day7 vertical
        working-directory: backend
        run: pytest -q tests/test_v2_day7_research_wren_vertical.py

      - name: Real two-Wren adaptive Research vertical
        working-directory: backend
        run: pytest -q tests/test_v2_day7_real_adaptive_wren.py

      - name: Real governed RELATIONSHIP vertical
        working-directory: backend
        run: pytest -q tests/test_v2_day7_real_relationship_vertical.py
