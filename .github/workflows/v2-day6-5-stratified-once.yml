name: v2-day6-5-stratified-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-stratified-once.yml"

jobs:
  stratified:
    if: "github.event.head_commit.message == 'eval(v2-day6.5): run final stratified probe'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 15
    env:
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: openai/gpt-5.6-luna
      DIMA_OPENROUTER_MODEL: openai/gpt-5.6-luna
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Provider-free morphology guard
        working-directory: backend
        run: |
          python -m py_compile app/v2/resolver.py
          pytest -q \
            tests/test_v2_day6_5_manager_authority.py::test_opposite_breakdown_polarity_conflicts_on_same_semantic_dimension \
            tests/test_v2_day6_5_manager_authority.py::test_required_product_breakdown_and_excluded_region_breakdown_are_not_conflicting \
            tests/test_v2_day6_5_correctness_closure.py::test_missing_binding_rejection_is_governed_clarification_but_invalid_handle_is_not
      - name: Final stratified Day 6.5 probe
        working-directory: backend
        run: |
          python lab/v2_day6_5_manager_eval.py --require-live --workers 2 --model openai/gpt-5.6-luna \
            --case-id d65-dev-063 \
            --case-id d65-dev-067
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-final-stratified
          path: backend/lab/reports/v2_day6_5_manager_eval.json
          retention-days: 14

