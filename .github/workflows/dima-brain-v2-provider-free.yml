name: dima-brain-v2-provider-free

on:
  push:
    branches:
      - feat/dima-brain-v2
      - feat/dima-brain-v2-1-discovery-simplification
      - feat/dima-brain-v2-1-specification-closure
    paths:
      - ".github/workflows/dima-brain-v2-provider-free.yml"
      - "engine/metabase"
      - "backend/pyproject.toml"
      - "backend/app/v3/brain_v2/**"
      - "backend/app/v3/business_relationship_v1.py"
      - "backend/app/v3/business_relationship_policy.py"
      - "backend/control_plane/models.py"
      - "backend/migrations/versions/*p18*"
      - "backend/tests/test_v3_brain_v2_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-v2-provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Exact certified engine gitlink
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "468643040c74959ffaad6e378b110d5841567f7c"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Brain V2 test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Brain V2 import smoke
        working-directory: backend
        run: |
          python - <<'PY'
          import langgraph
          import app.v3.brain_v2
          import app.v3.brain_v2.owner_adapter
          import app.v3.brain_v2.checkpoint
          from app.v3.brain_v2.state import BrainGraphState
          from app.v3.brain_v2.keys import CognitionRequestKey, NativeMaterialRequestKey
          from app.v3.brain_v2.views import EvidenceDigest
          print("Brain V2 contracts import OK")
          PY
          python -m compileall -q app/v3/brain_v2
          python -m py_compile \
            lab/metabase/brain_v2/phase1_live.py \
            lab/metabase/brain_v2/live_support.py \
            lab/metabase/brain_v2/final_probes.py \
            lab/metabase/brain_v2/final_mechanical.py

      - name: Brain V2 focused provider-free contracts
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_brain_v2_contracts.py \
            tests/test_v3_brain_v2_graph.py \
            tests/test_v3_brain_v2_discovery_stateful.py \
            tests/test_v3_brain_v2_owner_integration.py \
            tests/test_v3_brain_v2_telemetry.py \
            tests/test_v3_brain_v2_runtime_guardrails.py \
            tests/test_v3_brain_v2_forward_phase2.py \
            tests/test_v3_p18_relationship_interpreter.py \
            tests/test_v3_p18_business_relationship_policy.py \
            tests/test_v3_brain_v2_final_mechanical.py \
            tests/test_v3_p18_relationship_result.py \
            tests/test_v3_product_composition.py::test_relationship_p18_adjudication_emits_observation_only_span \
            tests/test_v3_product_composition.py::test_explain_deliverable_reuses_terminal_p18_without_new_report_or_material \
            tests/test_v3_product_contracts.py::test_contextual_report_reuses_current_research_without_scope_mutation \
            tests/test_v3_research_intake.py::test_followup_scope_patch_noop_inherits_prior_scope_without_new_version \
            tests/test_v3_brain_v2_phase2_headless.py::test_t6_contextual_report_is_projection_only_and_cannot_reopen_analytics
