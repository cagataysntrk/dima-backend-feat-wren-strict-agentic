name: v2-day6-5-j1-corrected-smoke-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-j1-corrected-smoke-once.yml"

jobs:
  corrected-smoke:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run corrected J1 primary transport smoke'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 30
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Corrected provider-free contract gate
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_j1_benchmark.py

      - name: Primary peer transport smoke
        working-directory: backend
        shell: bash
        run: |
          set +e
          failed=0
          models=(
            "google/gemini-2.5-flash-lite"
            "typesafe/jev-1.13"
            "openai/gpt-5.6-luna"
          )
          for model in "${models[@]}"; do
            for track in J1S J1T; do
              echo "::group::choice $track | $model"
              python lab/v2_day6_5_j1_benchmark.py \
                --track "$track" --mode choice --model "$model" --smoke
              rc=$?
              echo "::endgroup::"
              [[ $rc -ne 0 ]] && failed=1
            done

            echo "::group::contract-fidelity J1T | $model"
            python lab/v2_day6_5_j1_benchmark.py \
              --track J1T --mode contract-fidelity --model "$model" --smoke
            rc=$?
            echo "::endgroup::"
            [[ $rc -ne 0 ]] && failed=1
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-j1-corrected-smoke
          path: backend/lab/reports/v2_day6_5_j1*.json
          retention-days: 90
