# R8 dima.8 provider-free closure trigger
name: dima-v1-phase1-final-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - ".github/workflows/dima-v1-phase1-final-provider-free.yml"
      - "backend/app/v3/research.py"
      - "backend/tests/test_v3_r7_native_contract_delivery.py"
      - ".github/workflows/dima-metabase-p14-provider-free.yml"
      - "backend/tests/test_v3_p14_native_gateway.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_BEHAVIOR_SHA: "af5f0477176c0b3b1ec3b7f733ad393e5fe80bb3"
  DIMA_VQR_EMBEDDER: "off"
  DIMA_SCHEDULER_ENABLED: "false"
  DIMA_INTERACTION_LOG: "false"

jobs:
  r5-p14-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Verify certified dima.8 pin without building engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path("backend/lab/metabase/core_b/runtime/engine_runtime_lock.json").read_text())
          assert lock["engine_sha"] == "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"
          assert lock["runtime_tag"] == "v0.63.18-dima.8"
          assert lock["certification_run_id"] == "36610103287"
          assert lock["registry_digest"] == "sha256:b1130357b9046d1208880c196ca0b5f3afba56580fca91fadede89a464521577"
          PY
      - name: R5 ordinary Research and P14 provider-free proof
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p14_research.py             tests/test_v3_p14_product.py             tests/test_v3_p14_native_gateway.py             tests/test_v3_r7_native_contract_delivery.py
      - name: R1 scope and currentness proof
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_v1_scope_contract.py             tests/test_v3_v1_scope_integration.py             tests/test_v3_research_intake.py
      - name: P14 two-turn lineage proof on one candidate
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p14_product.py::test_product_research_runs_native_turn_and_persists_receipted_evidence             tests/test_v3_v1_scope_integration.py::test_real_follow_up_path_mints_new_scope_authority_and_preserves_lineage             tests/test_v3_v1_scope_integration.py::test_product_reads_historical_scope_without_treating_it_as_current_truth             tests/test_v3_v1_scope_integration.py::test_scope_v1_evidence_cannot_satisfy_scope_v2_obligation

  phase1-p12-coreb:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: P12 and Phase-1 deterministic contracts
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_v1_phase1_eval_contract.py             tests/test_v3_v1_phase1_metamorphic.py             tests/test_v3_phase1_pinpoint_live_contract.py             tests/test_v3_openrouter_counting_proxy.py
      - name: P17 and Core-B provider-free closure
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p17_authorization_transport.py             tests/test_v3_p17_autonomous_provider_schema.py             tests/test_v3_p17_autonomous_manager_eval.py             tests/test_v3_p17_research_manager.py             tests/test_v3_p17_request_differential.py             tests/test_v3_product_contracts.py             tests/test_v3_product_composition.py             tests/test_v3_product_process_manager.py             tests/test_v3_core_b_closure_v2.py             tests/test_v3_owner_scoped_must_accounting.py
      - name: P18 through P21 sealed owner regressions
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p18_business_relationship_policy.py             tests/test_v3_p19_hypothesis_root_cause.py             tests/test_v3_p19_provider.py             tests/test_v3_p19_autonomous_eval.py             tests/test_v3_p20_report_document.py             tests/test_v3_p21_decision_intelligence.py

  corea-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Repository governance and security
        working-directory: backend
        run: |
          pytest -q             tests/test_repository_hygiene.py             tests/test_v3_control_plane_security.py             tests/test_v3_p10_security_identity.py
      - name: Core-A retained closed-loop proof
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_action_authorization.py             tests/test_v3_decision_adoption.py             tests/test_v3_action_work.py             tests/test_v3_outcome_observation.py             tests/test_v3_institutional_memory.py             tests/test_v3_watch_signal.py             tests/test_v3_ux_foundations.py

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phase-1 architecture scans
        shell: bash
        run: |
          set -euo pipefail
          HOT=(
            backend/app/v3/research.py
            backend/app/v3/research_product.py
            backend/app/v3/research_native_gateway.py
            backend/app/v3/research_analytical_scope.py
          )
          ! grep -nE 'attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(' "${HOT[@]}"
          ! grep -nE 'sqlparse|parse_mbql|MetabaseProjectionCompiler|MetabaseCanonicalizer|TemporalBindingEngine|ResolvedAnalyticsIntent' "${HOT[@]}"
          ! grep -R -nE 'SCOPE_CURRENTNESS_HARD_V[0-9]|RCA_P19_HARD_V[0-9]' backend/app backend/control_plane
          ! grep -R -nE 'app\.wren|wren_service|WrenAI' backend/app/v3 backend/control_plane
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"
          test ! -d WrenAI-main
          test ! -d frontend
          test ! -d web
          test ! -d ui
      - name: Single migration head
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m alembic heads | tee /tmp/heads.txt
          test "$(grep -Ec '^[0-9a-f]+' /tmp/heads.txt)" -eq 1
          grep -q '^fd2a7c9e4b61' /tmp/heads.txt

  closure:
    if: always()
    needs:
      - r5-p14-r1
      - phase1-p12-coreb
      - corea-security
      - architecture
    runs-on: ubuntu-latest
    steps:
      - name: Require every provider-free owner GREEN
        env:
          R5: ${{ needs.r5-p14-r1.result }}
          COREB: ${{ needs.phase1-p12-coreb.result }}
          COREA: ${{ needs.corea-security.result }}
          ARCH: ${{ needs.architecture.result }}
        run: |
          set -euo pipefail
          test "$R5" = success
          test "$COREB" = success
          test "$COREA" = success
          test "$ARCH" = success
          echo PHASE1_FINAL_PROVIDER_FREE_GREEN
