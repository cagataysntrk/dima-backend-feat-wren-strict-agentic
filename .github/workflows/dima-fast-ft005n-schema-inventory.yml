name: dima-fast-ft005n-schema-inventory

on:
  push:
    branches:
      - feat/dima-metabase-product-fast-track
    paths:
      - ".github/workflows/dima-fast-ft005n-schema-inventory.yml"
      - "backend/lab/ft005n/schema_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Fast
        uses: actions/checkout@v4

      - name: Checkout frozen Boyahane control
        uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: f0c4a6b053ead52ca2eac80002c448323dc34a35
          path: boyahane-control

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata-only dependency
        run: pip install duckdb

      - name: Record Boyahane schema inventory
        run: |
          mkdir -p backend/lab/ft005n/artifacts
          python backend/lab/ft005n/schema_inventory.py             --source boyahane-control/data/boyahane.duckdb             --out backend/lab/ft005n/artifacts/boyahane-schema.json

      - name: Verify frozen source shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("backend/lab/ft005n/artifacts/boyahane-schema.json")
          data=json.loads(p.read_text())
          assert data["table_count"] == 80, data["table_count"]
          assert sum(x["row_count"] for x in data["tables"]) == 462_962
          PY

      - name: Upload schema inventory
        uses: actions/upload-artifact@v4
        with:
          name: dima-fast-ft005n-schema-inventory-${{ github.sha }}
          path: backend/lab/ft005n/artifacts/boyahane-schema.json
          retention-days: 14
