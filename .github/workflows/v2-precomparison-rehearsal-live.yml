name: v2-precomparison-rehearsal-live

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/V2_PRECOMPARISON_REHEARSAL_TRIGGER"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PRECOMPARISON_REHEARSAL"
        required: true
        default: ""
        type: string
      max_total_model_calls:
        description: "Hard global provider-call ceiling; 1..200"
        required: true
        default: 180
        type: number

jobs:
  rehearsal:
    if: "${{ github.event_name == 'push' || (inputs.confirm == 'PRECOMPARISON_REHEARSAL' && inputs.max_total_model_calls > 0 && inputs.max_total_model_calls <= 200) }}"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 120
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_FAST_LANGUAGE_PROVIDER: openrouter
      DIMA_V2_FAST_LANGUAGE_MODEL: "google/gemini-2.5-flash-lite"
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_MODEL: "openai/gpt-5.6-sol"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Provider-free rehearsal preflight
        working-directory: backend
        run: |
          python -m compileall -q lab/v2_precomparison_rehearsal_live.py
          pytest -q \
            tests/test_v2_precomparison_rehearsal_contract.py \
            tests/test_v2_precomparison_canary.py
      - name: Real LLM + real Wren 20-case development rehearsal
        working-directory: backend
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            max_calls=180
          else
            max_calls="${{ inputs.max_total_model_calls }}"
          fi
          python lab/v2_precomparison_rehearsal_live.py \
            --max-total-model-calls "$max_calls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-precomparison-rehearsal-${{ github.run_id }}
          path: backend/lab/reports/v2_precomparison_rehearsal.json
          retention-days: 90
