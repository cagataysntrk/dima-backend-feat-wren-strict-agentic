name: dima-metabase-p13c-provider-free

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile bounded P13C trust plane
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/native_standard/contracts.py \
            app/v3/native_standard/trust.py \
            app/v3/native_execution.py \
            app/v3/security_identity.py \
            app/v3/entity_value_gate.py \
            lab/metabase/p13c/common.py \
            lab/metabase/p13c/semantic_availability.py \
            lab/metabase/p13c/provider_free_integration.py \
            lab/metabase/p13c/live_standard.py \
            tests/test_v3_p13c_native_standard.py

      - name: P13C provider-free attack matrix
        working-directory: backend
        run: pytest -q tests/test_v3_p13c_native_standard.py

      - name: P13B no-filter regression
        working-directory: backend
        run: pytest -q tests/test_v3_p13b_native_standard.py

      - name: P13A/P10/P11 authority regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p13_native_trust.py \
            tests/test_v3_p10_security_identity.py \
            tests/test_v3_p11_entity_value_gate.py
