name: v2-day6-5-targeted-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-targeted-once.yml"

jobs:
  day65-targeted:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run targeted correctness closure'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile Day 6.5 control plane
        working-directory: backend
        run: |
          python -m py_compile             app/v2/manager_models.py             app/v2/manager_tools.py             app/v2/manager_errors.py             app/v2/manager_runtime.py             app/v2/manager_semantics.py             app/v2/manager_core_adapter.py             app/v2/manager_executor.py             app/v2/obligation_verifier.py             app/v2/representability.py             app/v2/temporal.py             app/v2/manager_loop.py             app/v2/manager_lab.py
      - name: Day 6.5 targeted provider-free correctness
        working-directory: backend
        run: |
          pytest -q             tests/test_v2_day6_5_manager_authority.py             tests/test_v2_day6_5_correctness_closure.py
