name: dima-metabase-p12x-c2-stock-live

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/lab/metabase/p12x/c2_stock_live_canary.py"
      - ".github/workflows/dima-metabase-p12x-c2-stock-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DIMA_OPENROUTER_API_KEY
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      MB_ADMIN_EMAIL: admin@c2-stock.local
      MB_ADMIN_PASSWORD: DimaC2StockAdmin2026!
      MB_RESTRICTED_EMAIL: restricted@c2-stock.local
      MB_RESTRICTED_PASSWORD: DimaC2StockRestricted2026!
      MB_RESTRICTED_GROUP: Dima C2 Stock Restricted
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
      - uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: f0c4a6b053ead52ca2eac80002c448323dc34a35
          path: boyahane
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27" "pydantic>=2" "duckdb==1.4.3" "psycopg[binary]==3.3.3"
      - name: Freeze oracle
        working-directory: platform/backend
        env:
          BOYAHANE_DUCKDB: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          P12X_OUT: lab/metabase/p12x/c2-stock-artifacts
        run: python lab/metabase/p12x/build_oracle.py
      - name: Start database and import Boyahane
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-c2-stock
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-c2-stock --network-alias analytics-db -p 127.0.0.1:55442:5432 \
            -e POSTGRES_DB=boyahane -e POSTGRES_USER=boyahane_owner -e POSTGRES_PASSWORD=boyahane-owner-c2 "$PG"
          docker run -d --name app-db --network dima-c2-stock --network-alias app-db \
            -e POSTGRES_DB=metabase_c2 -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD=metabase-app-c2 "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do docker exec "$n" pg_isready >/dev/null 2>&1 && break; sleep 2; done
          done
          SOURCE_DATABASE="${{ github.workspace }}/boyahane/data/boyahane.duckdb" \
          PGHOST=127.0.0.1 PGPORT=55442 PGDATABASE=boyahane PGUSER=boyahane_owner \
          PGPASSWORD=boyahane-owner-c2 BOYAHANE_READONLY_PASSWORD=boyahane-readonly-c2 \
          python boyahane/importer/import_boyahane.py
      - name: Start pinned native runtime
        run: |
          docker run -d --name mb-c2-stock --network dima-c2-stock -p 127.0.0.1:3311:3000 \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_c2 -e MB_DB_USER=metabase_app -e MB_DB_PASS=metabase-app-c2 \
            -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true -e MB_AGENT_API_ENABLED=true \
            -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY" \
            -e MB_LLM_METABOT_PROVIDER=openrouter/openai/gpt-5.6-luna \
            metabase/metabase@sha256:1160b570cb11c107bce00e71293552df8a8363e01a32c2c7a048cee002dc8a73
      - name: Bootstrap restricted principal
        working-directory: platform/backend
        env:
          METABASE_URL: http://127.0.0.1:3311
          MB_SITE_NAME: Dima C2 Stock
          ANALYTICS_DB_NAME: boyahane
          ANALYTICS_DB_USER: metabase_boyahane
          ANALYTICS_DB_PASSWORD: boyahane-readonly-c2
          PGPASSWORD: boyahane-owner-c2
        run: python lab/metabase/scripts/bootstrap.py
      - name: Run bridge live transport canary
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p12x/c2_stock_live_canary.py \
            --base-url http://127.0.0.1:3311 \
            --email "$MB_RESTRICTED_EMAIL" --password "$MB_RESTRICTED_PASSWORD" \
            --oracle lab/metabase/p12x/c2-stock-artifacts/oracle_v1.json \
            --output lab/metabase/p12x/c2-stock-artifacts/C2_STOCK_LIVE_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12x-c2-stock-live-${{ github.sha }}
          path: platform/backend/lab/metabase/p12x/c2-stock-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: |
          docker rm -f mb-c2-stock analytics-db app-db 2>/dev/null || true
          docker network rm dima-c2-stock 2>/dev/null || true
