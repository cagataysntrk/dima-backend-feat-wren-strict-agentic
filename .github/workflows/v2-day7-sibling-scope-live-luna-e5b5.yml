name: v2-day7-sibling-scope-live-luna-e5b5

"on":
  push:
    branches:
      - ops/day7-sibling-scope-live-luna-e5b5
    paths:
      - ".github/workflows/v2-day7-sibling-scope-live-luna-e5b5.yml"

jobs:
  sibling-scope-live-luna:
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 20
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_DAY7_LIVE_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_DAY7_LIVE_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_DAY7_LIVE_TEMPORAL_MODEL: "openai/gpt-5.6-sol"
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - name: Checkout exact LAB checkpoint
        uses: actions/checkout@v4
        with:
          ref: e5b5e1c1759004a82a8683b02ad12be5787189ec

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend LAB dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run focused LIVE Luna sibling-scope LAB
        working-directory: backend
        run: python lab/v2_day7_sibling_scope_live_luna.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day7-sibling-scope-live-luna-e5b5-${{ github.run_id }}
          path: backend/lab/reports/v2_day7_sibling_scope_live_luna.json
          retention-days: 90
