name: v2-day6-5-j1-live-benchmark

"on":
  workflow_dispatch:
    inputs:
      model_set:
        description: "PRIMARY peer set or one explicitly scoped model"
        required: true
        type: choice
        default: PRIMARY
        options:
          - PRIMARY
          - google/gemini-2.5-flash-lite
          - typesafe/jev-1.13
          - openai/gpt-5.6-luna
          - REFERENCE_CEILING_SOL
          - CONDITIONAL_TERRA
      smoke:
        description: "2-case transport smoke instead of frozen full scope"
        required: true
        type: boolean
        default: true

jobs:
  live-benchmark:
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 45
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Verify corrected frozen J1 contract first
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_j1_benchmark.py
      - name: Run corrected J1 benchmark
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.model_set }}" in
            PRIMARY)
              models=(
                "google/gemini-2.5-flash-lite"
                "typesafe/jev-1.13"
                "openai/gpt-5.6-luna"
              )
              ;;
            REFERENCE_CEILING_SOL)
              models=("openai/gpt-5.6-sol")
              ;;
            CONDITIONAL_TERRA)
              echo "::error::Terra is a consult-gated second stage. Do not dispatch this option before user approval."
              exit 3
              ;;
            *)
              models=("${{ inputs.model_set }}")
              ;;
          esac

          for model in "${models[@]}"; do
            for track in J1S J1T; do
              args=(--track "$track" --mode choice --model "$model")
              if [[ "${{ inputs.smoke }}" == "true" ]]; then
                args+=(--smoke)
              fi
              python lab/v2_day6_5_j1_benchmark.py "${args[@]}"
            done

            fidelity=(--track J1T --mode contract-fidelity --model "$model")
            if [[ "${{ inputs.smoke }}" == "true" ]]; then
              fidelity+=(--smoke)
            fi
            python lab/v2_day6_5_j1_benchmark.py "${fidelity[@]}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j1-corrected-${{ inputs.model_set }}-${{ github.run_id }}
          path: backend/lab/reports/v2_day6_5_j1*.json
          retention-days: 90
