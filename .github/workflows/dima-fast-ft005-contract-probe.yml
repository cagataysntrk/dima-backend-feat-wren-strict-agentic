name: dima-fast-ft005-contract-probe

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lock eval-only probe
        working-directory: backend
        run: pytest -q tests/test_fast_model_eval.py

  luna-contract-probe:
    runs-on: ubuntu-latest
    needs: provider-free
    timeout-minutes: 25
    environment: DIMA_OPENROUTER_API_KEY
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_FAST_FT005_PROVIDER: "openrouter"
      DIMA_FAST_FT005_TRANSPORT: "openrouter_strict_benchmark"
      DIMA_FAST_FT005_MODEL: "openai/gpt-5.6-luna"
      DIMA_FAST_FT005_CANONICAL_MODEL: "gpt-5.6-luna"
      DIMA_FAST_FT005_MODEL_ROLE: "LUNA_BASELINE"
      DIMA_FAST_FT005_MEASUREMENT_MODE: "CONTRACT_PROBE"
      DIMA_FAST_FT005_REASONING_EFFORT: "disabled"
      DIMA_FAST_FT005_PROMPT_VARIANT: "contract_probe"
      DIMA_FAST_FT005_MODEL_RECEIPT: "lab/metabase/artifacts/ft005-contract-probe-luna.json"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Require OpenRouter credential
        run: test -n "$DIMA_OPENROUTER_API_KEY"
      - name: Run frozen 9-case Luna contract probe
        working-directory: backend
        run: |
          mkdir -p lab/metabase/artifacts
          python lab/fast_ft005_model_sentinel.py
      - name: Upload contract probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dima-fast-ft005-contract-probe-luna-${{ github.sha }}
          path: backend/lab/metabase/artifacts/ft005-contract-probe-luna.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show contract probe
        if: always()
        working-directory: backend
        run: |
          test ! -f lab/metabase/artifacts/ft005-contract-probe-luna.json || cat lab/metabase/artifacts/ft005-contract-probe-luna.json
