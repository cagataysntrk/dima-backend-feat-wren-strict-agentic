name: v2-day6-5-case019-linker-ab-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-case019-linker-ab-once.yml"

jobs:
  case019-linker-ab:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run case019 linker same-sha ab'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 12
    env:
      TARGET_SHA: "f5ca942f83aaee0806d7119957c543ab17a59a37"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: "openrouter"
      DIMA_V2_RESEARCH_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: "openrouter"
      DIMA_V2_SEMANTIC_LINKER_MODEL: "openai/gpt-5.6-sol"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - name: Capture A/B identity
        shell: bash
        run: |
          echo "workflow_source_sha=$GITHUB_SHA"
          echo "tested_target_sha=$TARGET_SHA"
          echo "manager_model=$DIMA_V2_RESEARCH_MANAGER_MODEL"
          echo "semantic_linker_model=$DIMA_V2_SEMANTIC_LINKER_MODEL"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify exact tested SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Case 019 same-SHA strong-linker A/B
        working-directory: backend
        run: |
          python lab/v2_day6_5_manager_eval.py \
            --require-live \
            --workers 1 \
            --model "openai/gpt-5.6-sol" \
            --case-id d65-dev-019 \
            --case-id d65-dev-026
