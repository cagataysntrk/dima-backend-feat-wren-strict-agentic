name: v2-day6-5-d65g-family-closure-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-d65g-family-closure-once.yml"

jobs:
  family-closure:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run D65-G family closure'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: "ffbdc224066dc4c85a9e46b510ae3535f83f3416"
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - name: Capture identity
        shell: bash
        run: |
          echo "workflow_source_sha=$GITHUB_SHA"
          echo "requested_code_sha=$TARGET_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Verify exact tested SHA
        shell: bash
        run: |
          tested="$(git rev-parse HEAD)"
          echo "tested_code_sha=$tested"
          test "$tested" = "$TARGET_SHA"
      - name: Compile full Day 6.5 boundary
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/agent_runtime.py \
            app/v2/semantic_retriever.py \
            app/v2/semantic_linker.py \
            app/v2/temporal_intent.py \
            app/v2/manager_semantics.py \
            app/v2/manager_preacceptance.py \
            app/v2/acceptance.py \
            app/v2/standard_projection.py \
            app/v2/representability.py \
            app/v2/standard_builder.py \
            app/v2/standard_authority.py \
            app/v2/standard_coverage.py \
            app/v2/manager_loop.py \
            app/v2/manager_lab.py \
            tests/test_v2_day6_5_no_legacy_semantic_fallback.py
      - name: Full provider-free family closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_agent_runtime.py \
            tests/test_v2_day6_5_no_legacy_semantic_fallback.py \
            tests/test_v2_day6_5_semantic_linker.py \
            tests/test_v2_day6_5_typed_temporal.py \
            tests/test_v2_day6_5_preacceptance_protocol.py \
            tests/test_v2_day6_5_capability_algebra.py \
            tests/test_v2_day6_5_manager_authority.py \
            tests/test_v2_day6_5_correctness_closure.py \
            tests/test_v2_day6_5_adaptive_branch.py \
            tests/test_v2_day6_5_real_trust_plane.py \
            tests/test_v2_day6_5_transport_budget.py \
            tests/test_v2_day6_5_dev_corpus.py \
            tests/test_v2_day6_5_standard_builder.py \
            tests/test_v2_day6_5_standard_authority.py \
            tests/test_v2_day6_5_standard_coverage.py
