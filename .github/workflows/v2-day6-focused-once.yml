name: v2-day6-focused-once
# final source-audited Day6 closure
# graph-owner fixes rerun
# native-schema + source-ref operation-graph rerun
# source-graph + native-schema closure rerun
# native-structured-transport rerun
# capability-routing closure rerun
# unified relationship-capability rerun
# unified-contract final rerun
# provenance-order final rerun
# contract-routing refactor rerun
# deliverable-axis rerun — deliverable-contract rerun
# current-head flat-schema migration audit
# flat-schema + capability-registry + model-role closure
# current-head reference-role closure
# internal-deliverable-boundary final rerun
# role-scoped reasoning closure

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-focused-once.yml"

jobs:
  day6-contract:
    if: "github.event.head_commit.message == 'test(v2-day6): run final provider-free integration gate'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile Day 6 evaluator and contracts
        working-directory: backend
        run: python -m py_compile app/config.py app/v2/models.py app/v2/interpreter.py app/v2/resolver.py app/v2/capabilities.py app/v2/model_policy.py app/v2/research.py app/v2/orchestrator.py app/v2/finalizer.py lab/v2_day6_research_eval.py
      - name: V2 Day 1-6 targeted deterministic integration
        working-directory: backend
        run: pytest -q tests/test_v2_day1.py tests/test_v2_day2.py tests/test_v2_day3.py tests/test_v2_day4.py tests/test_v2_day5.py tests/test_v2_day5_http.py tests/test_v2_day6.py
      - name: Validate Day 6 holdout shape
        working-directory: backend
        run: |
          python - <<'PY'
          import yaml
          cases = yaml.safe_load(open("eval/v2_day6_research_cases.yaml", encoding="utf-8"))["cases"]
          ids = [case["id"] for case in cases]
          assert len(cases) >= 40, len(cases)
          assert len(ids) == len(set(ids)), ids
          assert sum(bool(case.get("expect_research", True)) for case in cases) >= 30
          assert sum(not bool(case.get("expect_research", True)) for case in cases) >= 8

          frozen = yaml.safe_load(open("eval/v2_day6_frozen16.yaml", encoding="utf-8"))
          frozen_ids = list(frozen["case_ids"])
          assert frozen["version"] == "day6-frozen16-v1"
          assert len(frozen_ids) == 16, frozen_ids
          assert len(frozen_ids) == len(set(frozen_ids)), frozen_ids
          assert set(frozen_ids) <= set(ids), sorted(set(frozen_ids) - set(ids))
          print({
              "cases": len(cases),
              "research": sum(bool(c.get("expect_research", True)) for c in cases),
              "negative": sum(not bool(c.get("expect_research", True)) for c in cases),
              "frozen16": len(frozen_ids),
          })
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Activate canonical pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
      - name: Install frontend dependencies
        working-directory: dima-frontend-demo-master
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Day 6 frontend contract typecheck
        working-directory: dima-frontend-demo-master
        run: pnpm exec tsc --noEmit
