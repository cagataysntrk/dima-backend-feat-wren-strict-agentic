name: v2-day6-focused-once
# relationship-proof rerun

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-focused-once.yml"

jobs:
  day6-contract:
    if: "github.event.head_commit.message == 'test(v2-day6): run relationship-proof gate'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Changed-owner regression gate
        working-directory: backend
        run: pytest -q tests/test_v2_day5.py tests/test_v2_day6.py
