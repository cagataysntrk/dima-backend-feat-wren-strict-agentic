name: dima-brain-v2-1-spec-closure-live

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  METABOT_MODEL_IDENTIFIER: openrouter/openai/gpt-5.6-luna
  DIMA_COGNITION_MODEL: openai/gpt-5.6-luna
  MB_ADMIN_EMAIL: admin@brain-v21-recovery.local
  MB_RESTRICTED_EMAIL: restricted@brain-v21-recovery.local
  MB_RESTRICTED_GROUP: Dima Brain V2.1 Recovery Restricted
  PROVIDER_PROXY_PORT: "8799"
  HARD_PROVIDER_REQUEST_CEILING: "14"
  PROMPT_TOKEN_CEILING: "350000"
  COMPLETION_TOKEN_CEILING: "30000"
  REASONING_TOKEN_CEILING: "25000"
  PROVIDER_COST_CEILING: "0.25"

concurrency:
  group: dima-brain-v2-1-spec-closure-live
  cancel-in-progress: false

jobs:
  surgical-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: DIMA_OPENROUTER_API_KEY

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 128
          submodules: false

      - name: Verify frozen surgical recovery authority
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          AUTH="backend/lab/metabase/brain_v2/spec_closure_live_authorization.json"
          python - "$AUTH" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          auth=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert auth["schema_version"]=="dima_brain_v2_1_spec_closure_live_authorization_v1"
          assert auth["enabled"] is True
          assert auth["broad_paid_allowed"] is False
          assert auth["thirty_case_allowed"] is False
          assert auth["automatic_retry_allowed"] is False
          assert auth["case_count"] == 1
          assert auth["candidate_product_sha"]=="4570babe0053a2779f71db7643cb44e5fb017460"
          assert auth["provider_free_phase1_run_id"]==37116278414
          assert auth["provider_free_phase2_run_id"]==37116278415
          assert auth["semantic_conformance_run_id"]==37116105631
          assert auth["semantic_holdout_run_id"]==37116105631
          assert auth["frozen_family_run_id"]==37116105606
          assert isinstance(auth["case_id"],str) and auth["case_id"]
          assert auth["engine_sha"]=="468643040c74959ffaad6e378b110d5841567f7c"
          assert auth["engine_release"]=="0.63.18-dima.10"
          assert auth["model_policy"]=="LUNA_LUNA_NO_CASCADE"
          subprocess.run(["git","cat-file","-e",auth["candidate_product_sha"]+"^{commit}"],check=True)
          subprocess.run(
              ["git","diff","--exit-code",auth["candidate_product_sha"]+"..HEAD","--",
               "backend/app","backend/pyproject.toml","engine/metabase"],
              check=True,
          )
          print("candidate="+auth["candidate_product_sha"])
          PY
          echo "candidate_sha=4570babe0053a2779f71db7643cb44e5fb017460" >> "$GITHUB_OUTPUT"
          echo "case_id=$(python -c 'import json; print(json.load(open("backend/lab/metabase/brain_v2/spec_closure_live_authorization.json"))["case_id"])')" >> "$GITHUB_OUTPUT"
          test -n "$DIMA_OPENROUTER_API_KEY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Provider-free recovery preflight
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile \
            lab/metabase/brain_v2/spec_closure_recovery_live.py \
            lab/metabase/brain_v2/live_support.py \
            lab/metabase/core_b/runtime/openrouter_counting_proxy.py \
            lab/metabase/core_b/runtime/seed_phase1_pinpoint_metrics.py \
            lab/metabase/core_b/runtime/seed_round2_fixture.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("eval/dima_neutral_feature_benchmark_round2.json").read_text())
          f=json.loads(Path("eval/round2_neutral_machine_fixture.json").read_text())
          assert m["version"]=="dima-neutral-feature-benchmark-round2-v2"
          assert m["case_count"]==30 and len(m["cases"])==30
          assert len({(x["feature_id"],x["difficulty"]) for x in m["cases"]})==30
          assert f["schema_version"]=="round2_neutral_machine_fixture_v1"
          assert len(f["rows"])==40
          PY
          pytest -q \
            tests/test_v3_brain_v2_contracts.py \
            tests/test_v3_brain_v2_graph.py \
            tests/test_v3_brain_v2_owner_integration.py \
            tests/test_v3_brain_v2_postgres_checkpoint.py

      - name: Derive ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          S="${GITHUB_SHA:0:12}"
          {
            echo "MB_ADMIN_PASSWORD=Adm-${S}-Aa1!"
            echo "MB_RESTRICTED_PASSWORD=Res-${S}-Aa1!"
            echo "PG_OWNER_PASSWORD=PgO-${S}-Aa1!"
            echo "CORE_B_READONLY_PASSWORD=PgR-${S}-Aa1!"
            echo "MB_APP_PASSWORD=MbA-${S}-Aa1!"
          } >> "$GITHUB_ENV"

      - name: Load exact certified engine runtime lock
        shell: bash
        run: |
          set -euo pipefail
          GITLINK_SHA="$(git ls-tree HEAD engine/metabase | awk '{print $3}')"
          python backend/lab/metabase/core_b/runtime/engine_runtime_lock.py \
            --lock backend/lab/metabase/core_b/runtime/engine_runtime_lock.json \
            --gitlink-sha "$GITLINK_SHA" \
            --github-env "$GITHUB_ENV"

      - name: Pull exact certified dima.10 digest
        shell: bash
        run: |
          set -euo pipefail
          test "$ENGINE_SHA" = "468643040c74959ffaad6e378b110d5841567f7c"
          test "$CERTIFICATION_RUN_ID" = "37106817330"
          test "$RUNTIME_TAG" = "v0.63.18-dima.10"
          test "$REGISTRY_DIGEST" = "sha256:34ce02396908e109aabcac9de6bedc3c832c79baa5450b7235c629f05455af17"
          docker pull "$IMMUTABLE_IMAGE_REF"
          docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$IMMUTABLE_IMAGE_REF" | grep -Fx "$IMMUTABLE_IMAGE_REF"

      - name: Start fail-closed zero-spend setup proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/eval/brain_v21_recovery
          nohup python backend/lab/metabase/core_b/runtime/openrouter_counting_proxy.py \
            --listen-host 0.0.0.0 \
            --listen-port "$PROVIDER_PROXY_PORT" \
            --ceiling 0 \
            --receipt backend/eval/brain_v21_recovery/provider_setup.json \
            >backend/eval/brain_v21_recovery/provider_setup_proxy.log 2>&1 &
          echo "PROVIDER_PROXY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PROVIDER_PROXY_PORT}/__dima__/health" >/dev/null && break
            sleep 1
            test "$i" -lt 30
          done

      - name: Start neutral databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-brain-v21-recovery
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db \
            --network dima-brain-v21-recovery --network-alias analytics-db \
            -p 127.0.0.1:55461:5432 \
            -e POSTGRES_DB=brain_v21_recovery \
            -e POSTGRES_USER=brain_v21_owner \
            -e POSTGRES_PASSWORD="$PG_OWNER_PASSWORD" "$PG"
          docker run -d --name app-db \
            --network dima-brain-v21-recovery --network-alias app-db \
            -p 127.0.0.1:55462:5432 \
            -e POSTGRES_DB=metabase_brain_v21_recovery \
            -e POSTGRES_USER=metabase_app \
            -e POSTGRES_PASSWORD="$MB_APP_PASSWORD" "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Seed exact frozen Round-2 neutral fixture
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55461"
          PGDATABASE: brain_v21_recovery
          PGUSER: brain_v21_owner
          PGPASSWORD: ${{ env.PG_OWNER_PASSWORD }}
          CORE_B_READONLY_USER: brain_v21_readonly
          CORE_B_READONLY_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
        run: |
          python lab/metabase/core_b/runtime/seed_round2_fixture.py \
            --fixture eval/round2_neutral_machine_fixture.json

      - name: Start exact certified dima.10 engine
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-brain-v21-recovery \
            --network dima-brain-v21-recovery \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:3361:3000 \
            -e MB_DB_TYPE=postgres \
            -e MB_DB_HOST=app-db \
            -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_brain_v21_recovery \
            -e MB_DB_USER=metabase_app \
            -e MB_DB_PASS="$MB_APP_PASSWORD" \
            -e MB_AI_FEATURES_ENABLED=true \
            -e MB_METABOT_ENABLED=true \
            -e MB_AGENT_API_ENABLED=false \
            -e MB_LOAD_SAMPLE_CONTENT=false \
            -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY" \
            -e MB_LLM_OPENROUTER_API_BASE_URL="http://host.docker.internal:${PROVIDER_PROXY_PORT}" \
            -e MB_LLM_METABOT_PROVIDER="$METABOT_MODEL_IDENTIFIER" \
            -e DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine \
            -e DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA" \
            -e DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA" \
            -e DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG" \
            -e DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY" \
            -e DIMA_ENGINE_IMAGE_IDENTITY="$REGISTRY_DIGEST" \
            "$IMMUTABLE_IMAGE_REF"

      - name: Bootstrap restricted analytical principal
        working-directory: backend
        env:
          METABASE_URL: http://127.0.0.1:3361
          MB_SITE_NAME: Dima Brain V2.1 Recovery
          ANALYTICS_DB_NAME: brain_v21_recovery
          ANALYTICS_DB_USER: brain_v21_readonly
          ANALYTICS_DB_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/core_b/runtime/bootstrap.py

      - name: Exhaust startup provider window at zero spend
        shell: bash
        run: |
          set -euo pipefail
          sleep 16
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("backend/eval/brain_v21_recovery/provider_setup.json").read_text())
          assert r["hard_provider_request_ceiling"] == 0
          assert r["actual_provider_request_count"] == 0
          assert r["blocked_request_count"] == 0
          PY

      - name: Create governed native metric resources
        working-directory: backend
        env:
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
        run: |
          python lab/metabase/core_b/runtime/seed_phase1_pinpoint_metrics.py \
            --base-url http://127.0.0.1:3361 \
            --fixture eval/round2_neutral_machine_fixture.json \
            --output eval/brain_v21_recovery/native_bindings.json

      - name: Arm single surgical paid provider window
        shell: bash
        run: |
          set -euo pipefail
          kill "$PROVIDER_PROXY_PID"
          wait "$PROVIDER_PROXY_PID" 2>/dev/null || true
          nohup python backend/lab/metabase/core_b/runtime/openrouter_counting_proxy.py \
            --listen-host 0.0.0.0 \
            --listen-port "$PROVIDER_PROXY_PORT" \
            --ceiling "$HARD_PROVIDER_REQUEST_CEILING" \
            --source-ceiling research_intake=60 \
            --source-ceiling metabase=260 \
            --source-ceiling p17_manager=30 \
            --source-ceiling p18_manager=40 \
            --source-ceiling p19_manager=60 \
            --prompt-token-ceiling "$PROMPT_TOKEN_CEILING" \
            --completion-token-ceiling "$COMPLETION_TOKEN_CEILING" \
            --reasoning-token-ceiling "$REASONING_TOKEN_CEILING" \
            --provider-cost-ceiling "$PROVIDER_COST_CEILING" \
            --receipt backend/eval/brain_v21_recovery/provider_live.json \
            >backend/eval/brain_v21_recovery/provider_live_proxy.log 2>&1 &
          echo "PROVIDER_PROXY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PROVIDER_PROXY_PORT}/__dima__/health" >/dev/null && break
            sleep 1
            test "$i" -lt 30
          done

      - name: Run exactly one frozen Brain V2.1 recovery counterexample
        working-directory: backend
        env:
          PYTHONPATH: .
          CHECKPOINT_DSN: postgresql://metabase_app:${{ env.MB_APP_PASSWORD }}@127.0.0.1:55462/metabase_brain_v21_recovery
        run: |
          set -euo pipefail
          python lab/metabase/brain_v2/spec_closure_recovery_live.py \
            --base-url http://127.0.0.1:3361 \
            --email "$MB_RESTRICTED_EMAIL" \
            --password "$MB_RESTRICTED_PASSWORD" \
            --binding-manifest eval/brain_v21_recovery/native_bindings.json \
            --manifest eval/dima_neutral_feature_benchmark_round2.json \
            --output eval/brain_v21_recovery/recovery_live.json \
            --control-db eval/brain_v21_recovery/recovery_live.db \
            --checkpoint-dsn "$CHECKPOINT_DSN" \
            --provider-proxy-base-url "http://127.0.0.1:${PROVIDER_PROXY_PORT}" \
            --provider-receipt eval/brain_v21_recovery/provider_live.json \
            --engine-sha "$ENGINE_SHA" \
            --upstream-sha "$UPSTREAM_BASE_SHA" \
            --runtime-tag "$RUNTIME_TAG" \
            --runtime-image-digest "$REGISTRY_DIGEST" \
            --build-identity "$BUILD_IDENTITY" \
            --image-identity "$REGISTRY_DIGEST" \
            --candidate-product-sha "${{ steps.auth.outputs.candidate_sha }}" \
            --checkout-sha "$GITHUB_SHA" \
            --case-id "${{ steps.auth.outputs.case_id }}"

      - name: Enforce surgical recovery artifact integrity
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("eval/brain_v21_recovery/recovery_live.json")
          r=json.loads(p.read_text())
          assert r["schema_version"]=="dima_brain_v2_1_recovery_live_v1"
          assert r["system"]=="DIMA_BRAIN_V2_1_LANGGRAPH"
          assert r["candidate_product_sha"]=="4570babe0053a2779f71db7643cb44e5fb017460"
          assert r["engine_sha"]=="468643040c74959ffaad6e378b110d5841567f7c"
          assert r["engine_release"]=="v0.63.18-dima.10"
          assert r["source_case_count"]==30
          assert r["case_count"]==1 and len(r["cases"])==1
          assert r["selected_case_ids"]==["${{ steps.auth.outputs.case_id }}"]
          assert r["case_exceptions"]==0
          assert r["duplicate_native"]==0
          assert r["stale_evidence"]==0
          assert r["agent_api_request_count"]==0
          assert r["model_topology"]["dima_cognition"]=="openai/gpt-5.6-luna"
          assert r["model_topology"]["metabot"]=="openrouter/openai/gpt-5.6-luna"
          assert r["model_topology"]["cascade"]=="NONE"
          assert r["provider_total"]["blocked_request_count"]==0, r["provider_total"]
          assert r["provider_total"]["privacy_contract"]["api_keys_persisted"] is False
          assert r["provider_total"]["privacy_contract"]["reasoning_text_persisted"] is False
          print("BRAIN_V21_ROUND2_ARTIFACT_READY")
          PY

      - name: Emit recovery summary
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("eval/brain_v21_recovery/recovery_live.json")
          if not p.exists():
              print("RECOVERY_ARTIFACT_MISSING")
              raise SystemExit(0)
          r=json.loads(p.read_text())
          print(json.dumps({
            "candidate":r.get("candidate_product_sha"),
            "case_count":r.get("case_count"),
            "raw_harness_passed":r.get("raw_harness_passed"),
            "exceptions":r.get("case_exceptions"),
            "duplicate_native":r.get("duplicate_native"),
            "stale_evidence":r.get("stale_evidence"),
            "latency":r.get("latency"),
            "provider_total":r.get("provider_total"),
          },ensure_ascii=False,sort_keys=True))
          if r.get("cases"):
              case=r["cases"][0]
              print("RECOVERY_CASE="+json.dumps({
                  "id":case.get("id"),
                  "expected":case.get("expected"),
                  "terminal_state":case.get("terminal_state"),
                  "workflow_status":case.get("workflow_status"),
                  "requirement_complete":case.get("requirement_complete"),
                  "mechanical_safety":case.get("mechanical_safety"),
                  "raw_harness_pass":case.get("raw_harness_pass"),
                  "exception":case.get("exception"),
                  "turns":case.get("turns"),
              },ensure_ascii=False,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dima-brain-v2-1-recovery-${{ steps.auth.outputs.case_id }}-${{ github.run_id }}
          path: |
            backend/eval/brain_v21_recovery/recovery_live.json
            backend/eval/brain_v21_recovery/provider_live.json
          if-no-files-found: warn
          retention-days: 90

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=2000 mb-brain-v21-recovery || true

      - name: Teardown
        if: always()
        run: |
          if [ -n "${PROVIDER_PROXY_PID:-}" ]; then
            kill "$PROVIDER_PROXY_PID" 2>/dev/null || true
          fi
          docker rm -f mb-brain-v21-recovery analytics-db app-db 2>/dev/null || true
          docker network rm dima-brain-v21-recovery 2>/dev/null || true
