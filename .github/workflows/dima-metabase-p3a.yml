name: dima-metabase-p3a

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/substrate/metabase/p3a_*.py"
      - "backend/tests/test_v3_p3a_bridge_preflight*.py"
      - ".github/workflows/dima-metabase-p3a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3a-bridge-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce P3A forbidden-file isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="7a4d1d12e59b52edf8493c0aa0b147947ff4ecf9"
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(backend/app/v2/|backend/app/routers/|backend/app/main\.py$|backend/app/config\.py$|backend/app/v3/(analytics_contract|semantic_spec|authority)\.py$|backend/app/v3/substrate/wren\.py$|docker-compose\.yml$|backend/lab/docker-compose\.yml$|WrenAI-main/)'; then
            echo "P3A forbidden file changed"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile P3A prototype
        working-directory: backend
        run: |
          python -m py_compile             app/v3/substrate/metabase/p3a_models.py             app/v3/substrate/metabase/p3a_preflight.py             app/v3/substrate/metabase/p3a_fixture.py

      - name: Provider-free eight-family preflight
        working-directory: backend
        run: pytest -q tests/test_v3_p3a_bridge_preflight.py

      - name: Start pinned M2 lab
        working-directory: backend/lab/metabase
        run: |
          cp .env.example .env
          docker compose --env-file .env up -d
          ./scripts/health.sh
          set -a
          source .env
          set +a
          python3 scripts/bootstrap.py

      - name: Live eight-family construct and execute proof
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source lab/metabase/.env
          set +a
          export DIMA_METABASE_P3A_LIVE=1
          pytest -q tests/test_v3_p3a_bridge_preflight_live.py

      - name: Teardown
        if: always()
        working-directory: backend/lab/metabase
        run: |
          test -f .env || cp .env.example .env
          docker compose --env-file .env down -v --remove-orphans || true
