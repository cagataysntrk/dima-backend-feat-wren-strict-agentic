name: v2-day6-5-stratified-canary16-reference-floor-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-stratified-canary16-reference-floor-once.yml"

jobs:
  canary16:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run canary16 at reference floor'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 20
    env:
      TARGET_SHA: "8dfde62d46d1418f05cce3ed44c26a8025b3b20e"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: "openrouter"
      DIMA_V2_RESEARCH_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: "openrouter"
      DIMA_V2_SEMANTIC_LINKER_MODEL: "openai/gpt-5.6-sol"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - name: Capture identity
        shell: bash
        run: |
          echo "workflow_source_sha=$GITHUB_SHA" | tee /tmp/day65_canary16_reference_receipt.txt
          echo "requested_code_sha=$TARGET_SHA" | tee -a /tmp/day65_canary16_reference_receipt.txt
          echo "manager_model=$DIMA_V2_RESEARCH_MANAGER_MODEL" | tee -a /tmp/day65_canary16_reference_receipt.txt
          echo "semantic_linker_model=$DIMA_V2_SEMANTIC_LINKER_MODEL" | tee -a /tmp/day65_canary16_reference_receipt.txt

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify exact tested SHA
        shell: bash
        run: |
          tested="$(git rev-parse HEAD)"
          echo "tested_code_sha=$tested" | tee -a /tmp/day65_canary16_reference_receipt.txt
          test "$tested" = "$TARGET_SHA"

      - name: Compile evaluator harness
        working-directory: backend
        run: python -m py_compile lab/v2_day6_5_manager_eval.py

      - name: Stratified 16-case reference-floor canary
        working-directory: backend
        shell: bash
        run: |
          python lab/v2_day6_5_manager_eval.py \
            --require-live \
            --workers 1 \
            --model "openai/gpt-5.6-sol" \
            --linker-model "openai/gpt-5.6-sol" \
            --case-id d65-dev-001 \
            --case-id d65-dev-009 \
            --case-id d65-dev-013 \
            --case-id d65-dev-019 \
            --case-id d65-dev-026 \
            --case-id d65-dev-025 \
            --case-id d65-dev-037 \
            --case-id d65-dev-005 \
            --case-id d65-dev-034 \
            --case-id d65-dev-047 \
            --case-id d65-dev-055 \
            --case-id d65-dev-056 \
            --case-id d65-dev-063 \
            --case-id d65-dev-067 \
            --case-id d65-dev-073 \
            --case-id d65-dev-079

      - name: Upload canary receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-stratified-canary16-reference-floor
          path: |
            backend/lab/reports/v2_day6_5_manager_eval.json
            /tmp/day65_canary16_reference_receipt.txt
          retention-days: 30
