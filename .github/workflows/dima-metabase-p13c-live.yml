name: dima-metabase-p13c-live

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/lab/metabase/engine_runtime_lock.json"
      - "backend/lab/metabase/scripts/engine_runtime_lock.py"
      - "backend/lab/metabase/p13c/**"
      - "backend/app/v3/native_standard/**"
      - "backend/app/v3/native_execution.py"
      - "backend/app/v3/security_identity.py"
      - "backend/app/v3/entity_value_gate.py"
      - ".github/workflows/dima-metabase-p13c-live.yml"

permissions:
  contents: read
  packages: read

env:
  BOYAHANE_SHA: f0c4a6b053ead52ca2eac80002c448323dc34a35
  MODEL_IDENTIFIER: openrouter/openai/gpt-5.6-luna
  LIVE_ATTEMPT_ID: p13c-01-textual-equality-dima4-pending
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  MB_ADMIN_EMAIL: admin@p13c-live.local
  MB_ADMIN_PASSWORD: DimaP13CLiveAdmin2026!
  MB_RESTRICTED_EMAIL: restricted@p13c-live.local
  MB_RESTRICTED_PASSWORD: DimaP13CLiveRestricted2026!
  MB_RESTRICTED_GROUP: Dima P13C Live Restricted

jobs:
  p13c-01-live:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[p13c-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: DIMA_OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: ${{ env.BOYAHANE_SHA }}
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load exact engine runtime lock
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          GITLINK_SHA="$(git ls-tree HEAD engine/metabase | awk '{print $3}')"
          test -n "$GITLINK_SHA"
          python backend/lab/metabase/scripts/engine_runtime_lock.py \
            --lock backend/lab/metabase/engine_runtime_lock.json \
            --gitlink-sha "$GITLINK_SHA" \
            --github-env "$GITHUB_ENV" \
            --print-json

      - name: Pull exact certified engine digest
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMMUTABLE_IMAGE_REF"
          docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$IMMUTABLE_IMAGE_REF" \
            | grep -Fx "$IMMUTABLE_IMAGE_REF"

      - name: Install live dependencies
        working-directory: platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install "duckdb==1.4.3" "psycopg[binary]==3.3.3"

      - name: Require one Luna credential
        run: test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Start live databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-p13c-live
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-p13c-live --network-alias analytics-db -p 127.0.0.1:55446:5432 \
            -e POSTGRES_DB=boyahane -e POSTGRES_USER=boyahane_owner -e POSTGRES_PASSWORD=boyahane-owner-p13c-live "$PG"
          docker run -d --name app-db --network dima-p13c-live --network-alias app-db \
            -e POSTGRES_DB=metabase_p13c_live -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD=metabase-app-p13c-live "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Import frozen Boyahane fixture
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55446"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: boyahane-owner-p13c-live
          BOYAHANE_READONLY_PASSWORD: boyahane-readonly-p13c-live
        run: python boyahane/importer/import_boyahane.py

      - name: Start exact pulled engine with Luna
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-p13c-live --network dima-p13c-live -p 127.0.0.1:3317:3000 \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_p13c_live -e MB_DB_USER=metabase_app -e MB_DB_PASS=metabase-app-p13c-live \
            -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true -e MB_AGENT_API_ENABLED=true \
            -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY" \
            -e MB_LLM_METABOT_PROVIDER="$MODEL_IDENTIFIER" \
            -e DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine \
            -e DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA" \
            -e DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA" \
            -e DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG" \
            -e DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY" \
            -e DIMA_ENGINE_IMAGE_IDENTITY="$REGISTRY_DIGEST" \
            "$IMMUTABLE_IMAGE_REF"

      - name: Bootstrap restricted analytical principal
        working-directory: platform/backend
        env:
          METABASE_URL: http://127.0.0.1:3317
          MB_SITE_NAME: Dima P13C Live
          ANALYTICS_DB_NAME: boyahane
          ANALYTICS_DB_USER: metabase_boyahane
          ANALYTICS_DB_PASSWORD: boyahane-readonly-p13c-live
          PGPASSWORD: boyahane-owner-p13c-live
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/scripts/bootstrap.py

      - name: Provision and verify Dima-managed metric without model
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13c/semantic_availability.py \
            --base-url http://127.0.0.1:3317 \
            --admin-email "$MB_ADMIN_EMAIL" --admin-password "$MB_ADMIN_PASSWORD" \
            --restricted-email "$MB_RESTRICTED_EMAIL" --restricted-password "$MB_RESTRICTED_PASSWORD" \
            --runtime-tag "$RUNTIME_TAG" --runtime-image-digest "$REGISTRY_DIGEST" \
            --engine-sha "$ENGINE_SHA" --platform-sha "$GITHUB_SHA" \
            --output lab/metabase/p13c/artifacts/P13C_SEMANTIC_AVAILABILITY_LIVE.json

      - name: Re-prove current-lens P11 evidence before model
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13c/provider_free_integration.py \
            --base-url http://127.0.0.1:3317 \
            --restricted-email "$MB_RESTRICTED_EMAIL" --restricted-password "$MB_RESTRICTED_PASSWORD" \
            --duckdb "${{ github.workspace }}/boyahane/data/boyahane.duckdb" \
            --semantic-availability-report lab/metabase/p13c/artifacts/P13C_SEMANTIC_AVAILABILITY_LIVE.json \
            --engine-sha "$ENGINE_SHA" --upstream-sha "$UPSTREAM_BASE_SHA" \
            --runtime-tag "$RUNTIME_TAG" --build-identity "$BUILD_IDENTITY" \
            --image-identity "$REGISTRY_DIGEST" --platform-sha "$GITHUB_SHA" \
            --output lab/metabase/p13c/artifacts/P13C_PROVIDER_FREE_PRELIVE.json

      - name: Run exactly one Luna P13C-01 user turn
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13c/live_standard.py \
            --base-url http://127.0.0.1:3317 \
            --email "$MB_RESTRICTED_EMAIL" --password "$MB_RESTRICTED_PASSWORD" \
            --duckdb "${{ github.workspace }}/boyahane/data/boyahane.duckdb" \
            --semantic-availability-report lab/metabase/p13c/artifacts/P13C_SEMANTIC_AVAILABILITY_LIVE.json \
            --output lab/metabase/p13c/artifacts/P13C_01_LIVE_STANDARD.json \
            --engine-sha "$ENGINE_SHA" --upstream-sha "$UPSTREAM_BASE_SHA" \
            --runtime-tag "$RUNTIME_TAG" --runtime-image-digest "$REGISTRY_DIGEST" \
            --build-identity "$BUILD_IDENTITY" --image-identity "$REGISTRY_DIGEST" \
            --model-identifier "$MODEL_IDENTIFIER" --platform-sha "$GITHUB_SHA" \
            --live-attempt-id "$LIVE_ATTEMPT_ID"

      - name: Upload P13C live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13c-01-live-${{ github.sha }}
          path: platform/backend/lab/metabase/p13c/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=800 mb-p13c-live || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f mb-p13c-live analytics-db app-db 2>/dev/null || true
          docker network rm dima-p13c-live 2>/dev/null || true
