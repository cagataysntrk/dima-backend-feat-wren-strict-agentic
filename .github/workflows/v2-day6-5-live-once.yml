name: v2-day6-5-live-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-live-once.yml"

jobs:
  day65-live:
    if: "github.event.head_commit.message == 'eval(v2-day6.5): run manual Manager live smoke'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 12
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: "openrouter"
      DIMA_V2_RESEARCH_MANAGER_MODEL: "openai/gpt-5.6-luna"
      DIMA_OPENROUTER_MODEL: "openai/gpt-5.6-luna"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Day 6.5 real-provider Manager smoke
        working-directory: backend
        run: |
          mkdir -p lab/reports
          python lab/v2_day6_5_manager_live_smoke.py
      - name: Upload Day 6.5 live smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-day6-5-manager-live-smoke
          path: backend/lab/reports/v2_day6_5_manager_live_smoke.json
          retention-days: 14
          if-no-files-found: warn

# rerun: strict native schema transport
