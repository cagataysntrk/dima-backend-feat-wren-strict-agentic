name: native-engine-live-e2e
# Canonical native-first compatibility certification.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-engine-official-ui
    paths:
      - ".github/workflows/native-engine-live-e2e.yml"
      - "apps/metabase-poc/e2e/native-engine/**"
      - "apps/metabase-poc/scripts/native-engine-bootstrap.py"
      - "apps/metabase-poc/scripts/native-ui-e2e.py"
      - "apps/metabase-poc/src/server/engine/**"
      - "apps/metabase-poc/src/app/api/chat/route.ts"
      - "apps/metabase-poc/src/lib/gateway.ts"
      - "apps/metabase-poc/src/app/app/chat/ChatView.tsx"

permissions:
  contents: read
  packages: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: DIMA_OPENROUTER_API_KEY
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_ENGINE_URL: http://127.0.0.1:3312
      DIMA_ENGINE_IMAGE: dima-metabase-engine:e2e
      BETTER_AUTH_URL: http://127.0.0.1:3002
      DIMA_E2E_USER_EMAIL: ayse@boyahane.demo
      NATIVE_UI_E2E_RECEIPT: apps/metabase-poc/e2e/native-engine/artifacts/native-ui-e2e.json

    steps:
      - name: Checkout official UI branch
        uses: actions/checkout@v5

      - name: Checkout frozen Boyahane fixture
        uses: actions/checkout@v5
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: f0c4a6b053ead52ca2eac80002c448323dc34a35
          path: boyahane

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          set -euo pipefail
          owner="$(openssl rand -hex 24)"
          readonly="$(openssl rand -hex 24)"
          engine_db="$(openssl rand -hex 24)"
          auth_db="$(openssl rand -hex 24)"
          engine_admin="$(openssl rand -hex 24)"
          auth_secret="$(openssl rand -hex 24)"
          user_password="$(openssl rand -hex 24)"
          for value in "$owner" "$readonly" "$engine_db" "$auth_db" "$engine_admin" "$auth_secret" "$user_password"; do
            echo "::add-mask::$value"
          done
          {
            echo "BOYAHANE_OWNER_PASSWORD=$owner"
            echo "BOYAHANE_READONLY_PASSWORD=$readonly"
            echo "ENGINE_APP_DB_PASSWORD=$engine_db"
            echo "DIMA_AUTH_DB_PASSWORD=$auth_db"
            echo "FT005N_ENGINE_ADMIN_PASSWORD=$engine_admin"
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "DIMA_E2E_USER_PASSWORD=$user_password"
            echo "FT005N_ENGINE_ADMIN_EMAIL=admin@dima-native-e2e.local"
            echo "DATABASE_URL=postgresql://dima:$auth_db@127.0.0.1:55443/dima_auth"
            echo "SEED_PASSWORD=$user_password"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          pip install "duckdb==1.4.3" "psycopg[binary]==3.3.3" "httpx>=0.27,<1"

      - name: Require engine-owned model credential
        run: test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start exact canonical engine and databases
        working-directory: apps/metabase-poc/e2e/native-engine
        run: |
          docker compose up -d analytics-db engine-app-db auth-db engine
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3312/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3312/api/health

      - name: Verify exact engine image
        working-directory: apps/metabase-poc/e2e/native-engine
        run: |
          cid="$(docker compose ps -q engine)"
          test -n "$cid"
          image="$(docker inspect "$cid" --format '{{.Config.Image}}')"
          echo "engine_image=$image"
          test "$image" = "ghcr.io/upcytech/dima-metabase-engine@sha256:0e6819e36c3bd347238159ae483bbaa8db3f0f36bf23cc5d2d8a23012fe111d9"

      - name: Import exact Boyahane snapshot
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55442"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: ${{ env.BOYAHANE_OWNER_PASSWORD }}
          BOYAHANE_READONLY_PASSWORD: ${{ env.BOYAHANE_READONLY_PASSWORD }}
        run: python boyahane/importer/import_boyahane.py

      - name: Bootstrap canonical engine tenant and native Metabot
        run: python apps/metabase-poc/scripts/native-engine-bootstrap.py

      - name: Prepare Dima auth database
        working-directory: apps/metabase-poc
        shell: bash
        run: |
          cat > .env.local <<EOF
          DIMA_ENGINE_URL='$DIMA_ENGINE_URL'
          DIMA_ENGINE_ADMIN_API_KEY='$DIMA_ENGINE_ADMIN_API_KEY'
          DIMA_ENGINE_TENANTS='$DIMA_ENGINE_TENANTS'
          DATABASE_URL='$DATABASE_URL'
          BETTER_AUTH_SECRET='$BETTER_AUTH_SECRET'
          BETTER_AUTH_URL='$BETTER_AUTH_URL'
          SEED_PASSWORD='$SEED_PASSWORD'
          EOF
          bun run auth:migrate
          bun run seed:users

      - name: Build official UI
        run: bun run turbo run build --filter @dima/metabase-poc

      - name: Start official UI
        working-directory: apps/metabase-poc
        run: |
          nohup bun run start > /tmp/dima-native-ui.log 2>&1 &
          echo $! > /tmp/dima-native-ui.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3002/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dima-native-ui.log
          exit 1

      - name: Certify login, product surfaces and Q1-Q2-Q3 native chat
        run: python apps/metabase-poc/scripts/native-ui-e2e.py

      - name: Static no-fallback assertions
        shell: bash
        run: |
          ! grep -q 'server/chat/agent' apps/metabase-poc/src/app/api/chat/route.ts
          ! grep -q 'server/chat/openrouter' apps/metabase-poc/src/app/api/chat/route.ts
          ! grep -R 'OPENROUTER_API_KEY\|OPENROUTER_MODEL' apps/metabase-poc/src --exclude-dir=node_modules
          grep -q '/api/metabot/agent-streaming' apps/metabase-poc/src/server/engine/native-chat.ts
          grep -q 'DIMA_ENGINE_URL' apps/metabase-poc/.env.local.example

      - name: Upload native refactor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-official-ui-${{ github.sha }}
          path: |
            apps/metabase-poc/e2e/native-engine/artifacts/native-ui-e2e.json
            /tmp/dima-native-ui.log
          if-no-files-found: warn
          retention-days: 14

      - name: Dump engine logs on failure
        if: failure()
        working-directory: apps/metabase-poc/e2e/native-engine
        run: docker compose logs --no-color --tail=600 engine analytics-db || true

      - name: Teardown
        if: always()
        working-directory: apps/metabase-poc/e2e/native-engine
        run: docker compose down -v --remove-orphans || true
