name: v2-day6-5-j1t-terra-conditional-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-j1t-terra-conditional-once.yml"

jobs:
  terra-j1t:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run approved Terra J1T conditional'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 60
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_J1_ALLOW_CONDITIONAL_TERRA: "1"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Corrected frozen contract gate
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_j1_benchmark.py

      - name: Terra J1T frozen conditional
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python lab/v2_day6_5_j1_benchmark.py \
            --track J1T --mode choice --model openai/gpt-5.6-terra
          python lab/v2_day6_5_j1_benchmark.py \
            --track J1T --mode contract-fidelity --model openai/gpt-5.6-terra

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-j1t-terra-conditional
          path: backend/lab/reports/v2_day6_5_j1t*.json
          retention-days: 90
