name: dima-metabase-p9

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/resource_provisioning.py"
      - "backend/tests/test_v3_p9_resource_provisioning.py"
      - "backend/belgeler/metabase/predev/P9_PREDEVELOPMENT_REVIEW.md"
      - "backend/belgeler/metabase/tickets/P9_RESOURCE_PROVISIONER.md"
      - ".github/workflows/dima-metabase-p9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p9-resource-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require sealed P9 predevelopment review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P9_PREDEVELOPMENT_REVIEW.md"
          test -f "$REVIEW"
          grep -q "Status: \*\*SEALED / P9A RESOURCE PLAN IMPLEMENTATION AUTHORIZED\*\*" "$REVIEW"

      - name: Enforce P9A provider-free isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="d0bbb77c846713f50f856146dd3377bd5d025a9d"
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(backend/app/v2/|backend/app/v3/(authority|analytics_contract|semantic_spec|semantic_import|semantic_equivalence|execution_identity)\.py$|backend/app/v3/substrate/|backend/control_plane/|backend/app/routers/|backend/app/main\.py$|backend/app/config\.py$|backend/demo/|WrenAI-main/)'; then
            echo "P9A touched a forbidden file"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile P9A provisioner
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/resource_provisioning.py \
            tests/test_v3_p9_resource_provisioning.py

      - name: Focused P9A desired-state proof
        working-directory: backend
        run: pytest -q tests/test_v3_p9_resource_provisioning.py

      - name: P8 P7 regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p8_semantic_equivalence.py \
            tests/test_v3_p7_semantic_import.py
