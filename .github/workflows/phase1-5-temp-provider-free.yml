name: phase1-5-temp-provider-free

on:
  push:
    branches:
      - phase1-5-convergence-20260930
    paths:
      - ".github/workflows/phase1-5-temp-provider-free.yml"
      - "backend/app/v3/research_contracts.py"
      - "backend/app/v3/research_intake.py"
      - "backend/app/v3/product/composition.py"
      - "backend/app/v3/hypothesis_root_cause.py"
      - "backend/app/v3/hypothesis_root_cause_provider.py"
      - "backend/app/v3/business_relationship_v1.py"
      - "backend/lab/metabase/core_b/phase1_pinpoint_live.py"
      - "backend/tests/test_v3_phase1_5_architecture_xray.py"
      - "backend/tests/test_v3_research_intake.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile changed authority surfaces
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/research_contracts.py \
            app/v3/research_intake.py \
            app/v3/product/composition.py \
            app/v3/hypothesis_root_cause.py \
            app/v3/hypothesis_root_cause_provider.py \
            app/v3/business_relationship_v1.py \
            lab/metabase/core_b/phase1_pinpoint_live.py

      - name: Ruff new Phase 1.5 regression surface
        working-directory: backend
        run: |
          ruff check --select F tests/test_v3_phase1_5_architecture_xray.py

      - name: Phase 1.5 X-ray and intake closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_phase1_5_architecture_xray.py \
            tests/test_v3_research_intake.py

      - name: Completion and composition closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_completion_ledger.py \
            tests/test_v3_owner_scoped_must_accounting.py \
            tests/test_v3_product_composition.py \
            tests/test_v3_v1_rca_mode_matrix.py

      - name: P18 and P19 affected closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p18_business_relationship_policy.py \
            tests/test_v3_p19_provider.py \
            tests/test_v3_p19_hypothesis_root_cause.py

      - name: R1 and P14 retained authority closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_scope_contract.py \
            tests/test_v3_v1_scope_integration.py \
            tests/test_v3_p14_product.py \
            tests/test_v3_p14_native_direct.py

      - name: Frozen engine identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"
