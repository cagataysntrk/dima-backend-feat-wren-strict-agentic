name: dima-metabase-p15-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/research_exploration.py"
      - "backend/app/v3/research_store.py"
      - "backend/app/v3/research_native_gateway.py"
      - "backend/app/v3/substrate/metabase/native_engine.py"
      - "backend/app/v3/substrate/metabase/native_models.py"
      - "backend/control_plane/models.py"
      - "backend/app/main.py"
      - "backend/migrations/versions/c7e5a9d2b610_p15_native_exploration.py"
      - "backend/tests/test_v3_p15_native_exploration.py"
      - "backend/tests/test_v3_p14_native_gateway.py"
      - "backend/belgeler/metabase/predev/P15_NATIVE_EXPLORATION_SOURCE_REVIEW.md"
      - ".github/workflows/dima-metabase-p15-provider-free.yml"
      - ".github/workflows/dima-metabase-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-exploration-provider-free:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p15-seal]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce P15 native ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P15_NATIVE_EXPLORATION_SOURCE_REVIEW.md"
          grep -q "SEALED / PROVIDER-FREE P15 NATIVE EXPLORATION IMPLEMENTATION AUTHORIZED" "$REVIEW"
          HOT="backend/app/v3/research_exploration.py"
          ! grep -nE 'NativeStandardTrustOrchestrator|ResolvedAnalyticsIntent|TemporalBindingEngine|MetabaseProjectionCompiler|MetabaseCanonicalizer|attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(|app\.wren|wren_service|MetabaseAgentClient' "$HOT"
          ! grep -nE '^(from|import)[[:space:]]+(numpy|pandas|scipy|statistics)([[:space:].]|$)' "$HOT"
          grep -q "RESEARCH_MATERIAL" "$HOT"
          grep -q "explore_adhoc" "$HOT"
          grep -q "automagic-dashboards/adhoc" backend/app/v3/substrate/metabase/native_engine.py

      - name: Compile P15 native Exploration slice
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/research_exploration.py \
            app/v3/research_store.py \
            app/v3/research_native_gateway.py \
            app/v3/substrate/metabase/native_engine.py \
            app/v3/substrate/metabase/native_models.py \
            control_plane/models.py \
            migrations/versions/c7e5a9d2b610_p15_native_exploration.py \
            tests/test_v3_p15_native_exploration.py

      - name: Verify single Alembic head retains sealed P15 material durability
        working-directory: backend
        run: |
          set -euo pipefail
          heads="$(python -m alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -Ec '^[0-9a-f]+')" -eq 1
          python -m alembic history | grep -q 'c7e5a9d2b610'

      - name: P15 focused provider-free native Exploration proof
        working-directory: backend
        run: pytest -q tests/test_v3_p15_native_exploration.py

      - name: Sealed P14 native-direct regressions remain GREEN
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p14_native_gateway.py \
            tests/test_v3_p12x_c2_native_engine_bridge.py::test_native_direct_metabot_query_reaches_dataset_unchanged \
            tests/test_v3_p12x_c2_native_engine_bridge.py::test_native_direct_dataset_permission_failure_stays_native_http_failure
