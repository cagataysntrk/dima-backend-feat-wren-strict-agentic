name: v2-day7-live-temporal-family-a245

"on":
  push:
    branches:
      - ops/day7-temporal-family-live-a245
    paths:
      - ".github/workflows/v2-day7-live-temporal-family-a245.yml"

jobs:
  temporal-family-live:
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 30
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_DAY7_LIVE_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_DAY7_LIVE_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_DAY7_LIVE_TEMPORAL_MODEL: "openai/gpt-5.6-sol"
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: a245f16eb3f3a122b0c77776ab5ec1d5c7eef4be
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend live-eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run temporal affected family
        working-directory: backend
        run: |
          python lab/v2_day7_manager_live_sol.py \
            --case-id comparison-period \
            --case-id multi-obligation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day7-live-temporal-family-a245-${{ github.run_id }}
          path: backend/lab/reports/v2_day7_live_sol.json
          retention-days: 90
