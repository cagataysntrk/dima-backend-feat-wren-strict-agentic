name: dima-fast-ft004-live

on:
  push:
    branches:
      - feat/dima-metabase-product-fast-track
    paths:
      - ".github/workflows/dima-fast-ft004-live.yml"
      - "backend/app/fast/run_*.py"
      - "backend/app/fast/application.py"
      - "backend/app/fast/ask_*.py"
      - "backend/app/fast/resource_registry.py"
      - "backend/app/fast/temporal.py"
      - "backend/app/fast/query_builder.py"
      - "backend/app/fast/evidence.py"
      - "backend/app/fast/metabase_gateway.py"
      - "backend/tests/test_fast_run_live.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ft004-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start pinned Metabase OSS lab
        working-directory: backend/lab/metabase
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose --env-file .env up -d
          ./scripts/health.sh
          set -a
          source .env
          set +a
          python3 scripts/bootstrap.py

      - name: Compute independent DB count oracle
        working-directory: backend/lab/metabase
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          count="$(
            docker compose --env-file .env exec -T analytics-db               psql -U "$ANALYTICS_DB_USER" -d "$ANALYTICS_DB_NAME" -At               -c "SELECT COUNT(*) FROM orders WHERE order_date >= DATE '2026-08-09' AND order_date < DATE '2026-09-08';"
          )"
          echo "FT004_EXPECTED_COUNT=$count" >> "$GITHUB_ENV"
          printf 'FT-004 oracle count=%s\n' "$count"

      - name: Run real Fast lifecycle sentinel
        working-directory: backend
        env:
          DIMA_FAST_RUN_LIVE: "1"
          DIMA_FAST_RUN_LIVE_RECEIPT: "lab/metabase/artifacts/ft004-live-receipt.json"
          METABASE_PORT: "3300"
          MB_ADMIN_EMAIL: "admin@dima-lab.local"
          MB_ADMIN_PASSWORD: "DimaMetabaseLabAdmin!2026"
        run: |
          mkdir -p lab/metabase/artifacts
          pytest -q tests/test_fast_run_live.py

      - name: Upload FT-004 live receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dima-fast-ft004-live-${{ github.sha }}
          path: backend/lab/metabase/artifacts/ft004-live-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show FT-004 live receipt
        if: always()
        working-directory: backend
        run: |
          test ! -f lab/metabase/artifacts/ft004-live-receipt.json || cat lab/metabase/artifacts/ft004-live-receipt.json

      - name: Teardown
        if: always()
        working-directory: backend/lab/metabase
        run: |
          test -f .env || cp .env.example .env
          docker compose --env-file .env down -v --remove-orphans || true
