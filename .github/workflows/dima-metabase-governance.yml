name: dima-metabase-governance
# 90+ convergence provider-free freeze: Product behavior dc4be27491d7fb41443491a93a812899e2645bb8

on:
  push:
    branches:
      - feat/dima-metabase-platform
      - recovery/core-b-root-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Canonical repository hygiene
        working-directory: backend
        run: pytest -q tests/test_repository_hygiene.py

      - name: Canonical import smoke
        working-directory: backend
        run: |
          python - <<'PY'
          import app.main
          import control_plane.models
          import app.v3.research
          import app.v3.research_store
          import app.v3.research_product
          import app.v3.claim_lineage
          import app.v3.hypothesis_root_cause
          import app.v3.report_document
          import app.v3.decision_intelligence
          import app.v3.decision_adoption
          import app.v3.action_authorization
          import app.v3.product_routing_store
          import app.v3.core_a.action_work
          import app.v3.core_a.outcome_observation
          import app.v3.core_a.institutional_memory
          import app.v3.core_a.watch_signal
          PY

      - name: Alembic single head
        working-directory: backend
        run: |
          python -m alembic heads > /tmp/heads.txt
          test "$(grep -Ec '^[0-9a-f]+' /tmp/heads.txt)" -eq 1
          grep -q '^fd2a7c9e4b61' /tmp/heads.txt

      - name: Frozen architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"
          grep -q '^DEFAULT_ACTION_CAPABILITY_REGISTRY = ActionCapabilityRegistry()$' backend/app/v3/action_authorization.py
          ! grep -q '"action:execute"' backend/control_plane/authorize.py
          test ! -f backend/app/v3/action_execution.py
          test ! -d WrenAI-main
          test ! -d dima-frontend-demo-master
          test ! -d backend/demo
          test ! -d backend/admin_app
          test ! -d backend/admin-dev
          test ! -d belgeler
          test ! -d lab/curl
          test ! -d frontend
          test ! -d web
          test ! -d ui


      - name: Guard Core B as projection orchestration only
        shell: bash
        run: |
          set -euo pipefail
          if [ -d backend/app/v3/product ]; then
            python - <<'PY'
          import ast
          from pathlib import Path
          root=Path("backend/app/v3/product")
          forbidden=("sqlmodel","sqlalchemy","numpy","pandas","scipy","statistics","app.v3.substrate.metabase")
          for path in root.glob("*.py"):
              src=path.read_text(encoding="utf-8")
              tree=ast.parse(src)
              imports=set()
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      imports.update(a.name for a in node.names)
                  elif isinstance(node,ast.ImportFrom):
                      imports.add(node.module or "")
              assert not any(name.startswith(forbidden) for name in imports),(path,imports)
              assert "action:execute" not in src
              forbidden_calls={
                  node.func.id
                  for node in ast.walk(tree)
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Name)
              }
              assert "Session" not in forbidden_calls,(path,forbidden_calls)
              assert "select" not in forbidden_calls,(path,forbidden_calls)
          PY
            test ! -d frontend
            test ! -d ui
            test ! -d web
          fi


      - name: Guard owner-scoped USER_MUST accounting amendment
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n 'PRODUCT_COMPOSITION_NO_PUBLISHABLE_FACT_ASSERTED' backend/app/v3/product
          ! grep -n 'for obligation_id in brief.must_requirement_ids' backend/app/v3/product/composition.py
          grep -q 'analytical_ids = tuple(item.goal_id for item in brief.questions)' backend/app/v3/research.py
          grep -q '_analytical_requirement_ids(session.accepted_brief)' backend/app/v3/report_document.py
          grep -q 'ProductRequirementState.FULFILLED' backend/app/v3/product/composition.py
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"


      - name: Guard Core B adaptive dependency ownership
        shell: bash
        run: |
          set -euo pipefail
          # P17 is lifecycle-mutable during the authorized root-recovery closure.
          # Guard the typed invariant and rely on deterministic P17 regressions,
          # rather than freezing a historical implementation blob.
          grep -q 'InvestigationBranchBehavior.GLOBAL_CONTROL' backend/app/v3/research_manager.py
          grep -q 'P17_BRANCH_TERMINAL' backend/app/v3/research_manager.py
          ! grep -n 'verified_exists' backend/app/v3/product/composition.py
          grep -q 'FOLLOW_VERIFIED_MATERIAL' backend/app/v3/research_intake.py
          grep -q 'ProductInvestigationRequirementRecord' backend/control_plane/models.py
          grep -q 'target_parent_obligation=target_parent_obligation' backend/app/v3/research_manager_provider.py
          ! grep -R -nE 'adaptive_tr|askv2_case_id|acceptance_contract|source_obligation'             backend/app/v3/product             backend/app/v3/research_intake.py             backend/app/v3/product_routing_store.py
