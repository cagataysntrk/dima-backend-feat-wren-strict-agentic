name: dima-metabase-governance

on:
  push:
    branches:
      - feat/dima-metabase-platform
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch identity and certified base ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE="3774484167f1056d89da0e0609246fb4a05057ec"
          test "$GITHUB_REF_NAME" = "feat/dima-metabase-platform"
          git merge-base --is-ancestor "$BASE" HEAD

      - name: Verify sealed normative document blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/belgeler/metabase/DIMA_METABASE_NIHAI_FIZIBILITE_VE_MIMARI_RAPORU.md)" = "a29fcabfeba22a7bd684287dafe4d4fc6f74ab82"
          test "$(git rev-parse HEAD:backend/belgeler/metabase/DIMA_METABASE_NIHAI_UYGULAMA_YOL_HARITASI.md)" = "32ec18ce5ec0f62df30263e567364d7efb8ce2f2"

      - name: Verify permanent product-first CI economy rules
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '- "!backend/lab/metabase/p13c/**"' .github/workflows/dima-metabase-m2.yml
          grep -Fq -- '- "!backend/lab/metabase/p13d/**"' .github/workflows/dima-metabase-m2.yml
          grep -Fq -- '- "!backend/lab/metabase/p14/**"' .github/workflows/dima-metabase-m2.yml
          grep -Fq -- '- "!backend/lab/metabase/p17/**"' .github/workflows/dima-metabase-m2.yml
          grep -Fq -- '- "!backend/app/v3/research.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/research_store.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/research_product.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/research_native_gateway.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/research_exploration.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/claim_lineage.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/research_manager.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/research_followup.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/research_manager_provider.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/business_relationship_policy.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/hypothesis_root_cause.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/hypothesis_root_cause_provider.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/substrate/metabase/native_engine.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/substrate/metabase/native_models.py"' .github/workflows/dima-metabase-m1.yml
          grep -Fq -- '- "!backend/app/v3/substrate/metabase/native_engine.py"' .github/workflows/dima-metabase-p3.yml
          grep -Fq -- '- "!backend/app/v3/substrate/metabase/native_models.py"' .github/workflows/dima-metabase-p3.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/dima-metabase-p13c-provider-free.yml
          ! grep -Eq '^[[:space:]]+push:' .github/workflows/dima-metabase-p13c-provider-free.yml

      - name: Verify mandatory governance files
        shell: bash
        run: |
          set -euo pipefail
          test -f DIMA-METABASE-OPERASYON.md
          test -f DIMA-METABASE-DENETIM.md
          test -f DIMA-METABASE-DURUM.md
          test -f backend/belgeler/metabase/DIMA_METABASE_SOURCE_LOCK.md
          test -f backend/belgeler/metabase/DIMA_METABASE_FAILURE_RECEIPTS.md
          test -f backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md

      - name: Require sealed M1 pre-development review before v3 code exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -d backend/app/v3 ]; then
            REVIEW="backend/belgeler/metabase/predev/M1_P1_PREDEVELOPMENT_REVIEW.md"
            test -f "$REVIEW"
            grep -q "Status: SEALED / IMPLEMENTATION AUTHORIZED" "$REVIEW"
          fi

      - name: Require sealed P3 review before Metabase substrate code exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -d backend/app/v3/substrate/metabase ]; then
            REVIEW="backend/belgeler/metabase/predev/P3_P3A_PREDEVELOPMENT_REVIEW.md"
            test -f "$REVIEW"
            grep -q "Status: SEALED / P3 TRANSPORT IMPLEMENTATION AUTHORIZED" "$REVIEW"
          fi

      - name: Require sealed P4 review before production Metabase compiler exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/substrate/metabase/compiler.py ] || [ -f backend/app/v3/substrate/metabase/execution_binding.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P4_PREDEVELOPMENT_REVIEW.md"
            test -f "$REVIEW"
            grep -q "Status: SEALED / P4 IMPLEMENTATION AUTHORIZED" "$REVIEW"
          fi


      - name: Require sealed P5 review before P5 execution identity code exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/execution_identity.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P5_PREDEVELOPMENT_REVIEW.md"
            test -f "$REVIEW"
            grep -q "Status: SEALED / P5 CONTRACT IMPLEMENTATION AUTHORIZED" "$REVIEW"
          fi

      - name: Require sealed P6 review before parity code exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -d backend/app/v3/parity ] || [ -f backend/app/v3/substrate/metabase/execution_adapter.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P6_PREDEVELOPMENT_REVIEW.md"
            test -f "$REVIEW"
            grep -q "Status: \*\*SEALED / CORPUS FREEZE + PARITY HARNESS AUTHORIZED" "$REVIEW"
          fi

      - name: Verify Dima Metabase Engine submodule contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .gitmodules
          test "$(git config -f .gitmodules --get submodule.engine/metabase.path)" = "engine/metabase"
          test "$(git config -f .gitmodules --get submodule.engine/metabase.url)" = "https://github.com/UpcyTech/dima-metabase-engine.git"
          entry="$(git ls-tree HEAD engine/metabase)"
          mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          sha="$(printf '%s\n' "$entry" | awk '{print $3}')"
          test "$mode" = "160000"
          test "$type" = "commit"
          test "${#sha}" -eq 40
          case "$sha" in
            *[!0-9a-f]*) echo "invalid gitlink sha: $sha" >&2; exit 1 ;;
          esac
          test ! -f engine/metabase/src/metabase/metabot/api.clj

      - name: Require sealed P13 native trust review before native execution authority exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/native_execution.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P13_NATIVE_ENGINE_TRUST_BOUNDARY_REVIEW.md"
            test -f "$REVIEW"
            grep -q "Status: \*\*SEALED / P13A PROVIDER-FREE IMPLEMENTATION AUTHORIZED AFTER GOVERNANCE REPIN\*\*" "$REVIEW"
            grep -q "DMP-DEC-0036" backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md
          fi

      - name: Guard v3 against legacy semantic resolver authority
        shell: bash
        run: |
          set -euo pipefail
          if [ -d backend/app/v3 ]; then
            if grep -R --include='*.py' -nE 'from[[:space:]]+app\.v2\.resolver|import[[:space:]]+app\.v2\.resolver|SemanticResolver' backend/app/v3; then
              echo "Legacy SemanticResolver authority import detected in app/v3"
              exit 1
            fi
          fi


      - name: Guard future P13B native Standard hot path from legacy analytical seams
        shell: bash
        run: |
          set -euo pipefail
          HOT="backend/app/v3/native_standard"
          if [ -d "$HOT" ]; then
            REVIEW="backend/belgeler/metabase/predev/P13B_NATIVE_CANDIDATE_ATTESTATION_AND_LIVE_STANDARD_REVIEW.md"
            test -f "$REVIEW"
            grep -q "\*\*Status:\*\* \*\*SEALED / P13B NATIVE ATTESTATION DESIGN / IMPLEMENTATION PENDING SUPERVISOR AUTHORIZATION\*\*" "$REVIEW"
            grep -q "DMP-DEC-0037" backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md
            grep -q "DMP-DEC-0038" backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md
            grep -q "SEALED / P13B-1 GREEN / P13B-2 PROVIDER-FREE IMPLEMENTATION AUTHORIZED" backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md

            if grep -R --include='*.py' -nE               'app\.v3\.substrate\.metabase\.(compiler|canonical|execution_adapter)|MetabaseAgentClient'               "$HOT"; then
              echo "Legacy Agent-API analytical dependency detected in future P13 native Standard hot path"
              exit 1
            fi
          fi

      - name: Guard P14 Research hot path as native-direct only
        shell: bash
        run: |
          set -euo pipefail
          grep -q "DMP-DEC-0048" backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md
          HOT=(
            "backend/app/v3/research.py"
            "backend/app/v3/research_product.py"
            "backend/app/v3/research_native_gateway.py"
          )
          FORBIDDEN='NativeStandardTrustOrchestrator|ResolvedAnalyticsIntent|TemporalBindingEngine|MetabaseProjectionCompiler|MetabaseCanonicalizer|NativeExecutionManifest|AuthorizedExecutionArtifact|ExecutionAccessSnapshotIssuer|VerifiedExecutionSecurityFacts|NativeResourceBindingProvider|attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(|app\.wren|wren_service'
          for file in "${HOT[@]}"; do
            if grep -nE "$FORBIDDEN" "$file"; then
              echo "P14 Research hot path reintroduced certification/shadow analytics authority: $file" >&2
              exit 1
            fi
          done
          grep -q "capture_produced_query" backend/app/v3/research_product.py
          grep -q "execute_dataset" backend/app/v3/research_native_gateway.py

      - name: Require sealed P15 native Exploration source review
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/research_exploration.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P15_NATIVE_EXPLORATION_SOURCE_REVIEW.md"
            test -f "$REVIEW"
            grep -q "SEALED / PROVIDER-FREE P15 NATIVE EXPLORATION IMPLEMENTATION AUTHORIZED" "$REVIEW"
            grep -q "DMP-DEC-0048" "$REVIEW"
          fi

      - name: Guard P15 Exploration as native Research material only
        shell: bash
        run: |
          set -euo pipefail
          HOT="backend/app/v3/research_exploration.py"
          if [ -f "$HOT" ]; then
            FORBIDDEN='NativeStandardTrustOrchestrator|ResolvedAnalyticsIntent|TemporalBindingEngine|MetabaseProjectionCompiler|MetabaseCanonicalizer|attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(|app\.wren|wren_service|MetabaseAgentClient'
            if grep -nE "$FORBIDDEN" "$HOT"; then
              echo "P15 reintroduced certification/shadow analytics authority" >&2
              exit 1
            fi
            if grep -nE '^(from|import)[[:space:]]+(numpy|pandas|scipy|statistics)([[:space:].]|$)' "$HOT"; then
              echo "P15 introduced a Python analytical primitive library" >&2
              exit 1
            fi
            grep -q "RESEARCH_MATERIAL" "$HOT"
            grep -q "explore_adhoc" "$HOT"
            grep -q "automagic-dashboards/adhoc" backend/app/v3/substrate/metabase/native_engine.py
          fi

      - name: Require sealed P16 claim-lineage review
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/claim_lineage.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P16_CLAIM_LINEAGE_PREDEVELOPMENT_REVIEW.md"
            test -f "$REVIEW"
            grep -q "SEALED / P16 CLAIM-LINEAGE IMPLEMENTATION AUTHORIZED" "$REVIEW"
            grep -q "DMP-DEC-0048" "$REVIEW"
          fi

      - name: Guard P16 claim lineage from becoming an analytics authority
        shell: bash
        run: |
          set -euo pipefail
          HOT="backend/app/v3/claim_lineage.py"
          if [ -f "$HOT" ]; then
            FORBIDDEN='NativeStandardTrustOrchestrator|ResolvedAnalyticsIntent|TemporalBindingEngine|MetabaseProjectionCompiler|MetabaseCanonicalizer|execute_dataset[[:space:]]*\(|explore_adhoc[[:space:]]*\(|attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(|app\.wren|wren_service|MetabaseAgentClient'
            if grep -nE "$FORBIDDEN" "$HOT"; then
              echo "P16 claim lineage reintroduced analytical execution/authority" >&2
              exit 1
            fi
            if grep -nE '^(from|import)[[:space:]]+(numpy|pandas|scipy|statistics)([[:space:].]|$)' "$HOT"; then
              echo "P16 introduced a Python analytical primitive library" >&2
              exit 1
            fi
            grep -q 'SUPPORTS' "$HOT"
            grep -q 'CHALLENGES' "$HOT"
            grep -q 'CONTEXTUALIZES' "$HOT"
            grep -q 'INSUFFICIENT' "$HOT"
            ! grep -nE 'confidence(_score)?[[:space:]]*[:=]' "$HOT"
          fi

      - name: Require sealed P17 Research Manager review
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/research_manager.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P17_RESEARCH_MANAGER_MATURATION_PREDEVELOPMENT_REVIEW.md"
            DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
            test -f "$REVIEW"
            test -f "$DECISIONS"
            grep -q "SEALED / P17 RESEARCH MANAGER MATURATION IMPLEMENTATION AUTHORIZED" "$REVIEW"
            grep -q "DMP-DEC-0048" "$REVIEW"
            grep -q "DMP-DEC-0049 — RECURSIVE INVESTIGATION" "$DECISIONS"
            grep -q "DMP-DEC-0050 — AUTONOMOUS RESEARCH MANAGER CERTIFICATION" "$DECISIONS"
            grep -q "DMP-DEC-0051 — BOUNDED RED RECOVERY" "$DECISIONS"
            grep -q "DMP-DEC-0052 — FAILURE-FAMILY-SCOPED RECOVERY BUDGET" "$DECISIONS"
            grep -q "DMP-DEC-0053 — THIN INVESTIGATION LANGUAGE" "$DECISIONS"
            grep -q "P17 INVESTIGATION GRAPH != P19 CAUSAL GRAPH" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
            grep -q "MODEL CHOOSES AMONG LEGAL MOVES" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
            grep -q "DO NOT TUNE PRODUCT BEHAVIOR TO ONE PROBABILISTIC TEST TRAJECTORY" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
          fi

      - name: Guard P17 from becoming a second analytics planner
        shell: bash
        run: |
          set -euo pipefail
          HOT=(
            "backend/app/v3/research_manager.py"
            "backend/app/v3/research_manager_provider.py"
            "backend/app/v3/research_followup.py"
          )
          FORBIDDEN='NativeStandardTrustOrchestrator|ResolvedAnalyticsIntent|TemporalBindingEngine|MetabaseProjectionCompiler|MetabaseCanonicalizer|attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(|app\.wren|wren_service|MetabaseAgentClient'
          for file in "${HOT[@]}"; do
            if [ -f "$file" ]; then
              if grep -nE "$FORBIDDEN" "$file"; then
                echo "P17 reintroduced a forbidden analytical/security authority: $file" >&2
                exit 1
              fi
              if grep -nE '^(from|import)[[:space:]]+(numpy|pandas|scipy|statistics)([[:space:].]|$)' "$file"; then
                echo "P17 introduced a Python analytical primitive library: $file" >&2
                exit 1
              fi
              if grep -nE '(breakdown|trend|rank|compare)[[:space:]]*\(' "$file"; then
                echo "P17 introduced deterministic analytical strategy operators: $file" >&2
                exit 1
              fi
            fi
          done
          grep -q "SEEK_COUNTER_EVIDENCE" backend/app/v3/research_manager.py
          grep -q "ResearchReasoningStepRecord" backend/app/v3/research_manager.py
          grep -q "class InvestigationActionProfile" backend/app/v3/research_manager.py
          grep -q "def resolve_investigation_topology" backend/app/v3/research_manager.py
          grep -q "class MaterialCognitionView" backend/app/v3/research_manager.py
          ! grep -q "def topology_for" backend/app/v3/research_manager.py
          grep -q "NativeResearchOccurrenceRunner" backend/app/v3/research_followup.py

      - name: Guard DMP-DEC-0050 through 0053 autonomous certification and legality
        shell: bash
        run: |
          set -euo pipefail
          DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
          AUTO="backend/lab/metabase/p17/autonomous_manager_canary.py"
          EVAL="backend/lab/metabase/p17/autonomous_eval.py"
          ENTRY="backend/lab/metabase/p17/recursive_manager_canary.py"
          AUTH="backend/lab/metabase/p17/authorization_transport.py"
          SCENARIO="backend/lab/metabase/p17/recursive_manager_scenario_lab.py"
          test -f "$AUTO"
          test -f "$EVAL"
          test -f "$ENTRY"
          test -f "$AUTH"
          test -f "$SCENARIO"
          test -f backend/tests/test_v3_p17_autonomous_manager_eval.py
          test -f backend/tests/test_v3_p17_authorization_transport.py
          test -f backend/tests/test_v3_p17_autonomous_provider_schema.py
          grep -q "DMP-DEC-0050 — AUTONOMOUS RESEARCH MANAGER CERTIFICATION" "$DECISIONS"
          grep -q "DMP-DEC-0051 — BOUNDED RED RECOVERY" "$DECISIONS"
          grep -q "DMP-DEC-0052 — FAILURE-FAMILY-SCOPED RECOVERY BUDGET" "$DECISIONS"
          grep -q "DMP-DEC-0053 — THIN INVESTIGATION LANGUAGE" "$DECISIONS"
          grep -q "A TEST ORACLE MUST NOT BE" "$DECISIONS"
          grep -q "GIT OBJECT TRUTH BEATS CI EVENT PROJECTIONS" "$DECISIONS"
          grep -q "Historical deterministic P17 scenario / contract lab" "$SCENARIO"
          grep -q "propose_with_constraints" "$AUTO"
          grep -q "allowed_intents=LEGAL_AUTONOMOUS_INTENTS" "$AUTO"
          ! grep -nE 'propose_with_guidance|GuidedTurn' "$AUTO"
          grep -q "evaluate_autonomous_canary" "$AUTO"
          grep -q "verify_dispatch_authorization" "$ENTRY"
          ! grep -nE 'GITHUB_EVENT_PATH|head_commit' "$ENTRY"
          grep -q "diff-tree" "$AUTH"
          grep -q "cat-file" "$AUTH"
          grep -q "authorizations/" "$AUTH"
          grep -q 'CURRENT_FAILURE_FAMILY_ID = "p17-investigation-language-legality"' "$AUTH"
          grep -q 'CURRENT_ATTEMPT_IN_FAMILY = 2' "$AUTH"
          grep -q 'EXPECTED_DECISION = "DMP-DEC-0053"' "$AUTH"
          grep -q 'failure_family_id' "$AUTH"
          grep -q 'attempt_in_family' "$AUTH"
          ! grep -nE 'recovery_cycle' "$AUTH"
          ! grep -nE 'GITHUB_EVENT_PATH|head_commit' "$AUTH"
          for file in "$AUTO" "$EVAL"; do
            ! grep -nE '^(from|import)[[:space:]]+(numpy|pandas|scipy|statistics)([[:space:].]|$)' "$file"
            ! grep -nE 'app\.wren|wren_service|MetabaseAgentClient|NativeStandardTrustOrchestrator' "$file"
          done
          ! grep -nE 'execute_dataset[[:space:]]*\(|bridge\.invoke[[:space:]]*\(' "$AUTO"
          if [ -f backend/lab/metabase/p17/AUTONOMOUS_LUNA_AUTHORIZATION.json ]; then
            grep -q '"decision": "DMP-DEC-0050"' backend/lab/metabase/p17/AUTONOMOUS_LUNA_AUTHORIZATION.json
            grep -q '"max_paid_runs_after_dmp_0050": 1' backend/lab/metabase/p17/AUTONOMOUS_LUNA_AUTHORIZATION.json
          fi
          if [ -d backend/lab/metabase/p17/authorizations ]; then
            test -z "$(find backend/lab/metabase/p17/authorizations -type f ! -name '*.json' -print -quit)"
          fi

      - name: Require sealed P18 minimal relationship policy review
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/business_relationship_policy.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P18_MATERIAL_BUSINESS_RELATIONSHIP_POLICY_PREDEVELOPMENT_REVIEW.md"
            DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
            test -f "$REVIEW"
            grep -q "SEALED / DMP-DEC-0054 / P18 MINIMAL IMPLEMENTATION AUTHORIZED" "$REVIEW"
            grep -q "DMP-DEC-0054 — MINIMAL BUSINESS RELATIONSHIP POLICY AUTHORITY" "$DECISIONS"
            grep -q "P18 BUSINESS RELATIONSHIP POLICY" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
            grep -q "NO TABLE/FIELD JOIN GRAPH IN DIMA" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
            grep -q "NO RELATIONSHIP SCORING" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
            grep -q "NO FUZZY RELATIONSHIP INFERENCE" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
            grep -q "NO CAUSALITY IN P18" DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md
          fi

      - name: Guard P18 as policy eligibility only
        shell: bash
        run: |
          set -euo pipefail
          HOT="backend/app/v3/business_relationship_policy.py"
          if [ -f "$HOT" ]; then
            python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/v3/business_relationship_policy.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module or "")
          forbidden = (
              "app.v3.substrate.metabase",
              "app.v3.research_native_gateway",
              "app.v3.research_followup",
              "app.v3.native_execution",
              "app.wren",
              "numpy",
              "pandas",
              "scipy",
              "statistics",
          )
          bad = sorted(x for x in imports if x.startswith(forbidden))
          assert not bad, bad

          source = path.read_text(encoding="utf-8")
          for symbol in (
              "NativeEngineBridge",
              "MetabaseAgentClient",
              "execute_dataset",
              "explore_adhoc",
              "attest_native_query",
              "execute_native_query",
              "wren_service",
              "NativeResourceBinding",
              "relationships.yml",
          ):
              assert symbol not in source, symbol

          models = Path("backend/control_plane/models.py")
          model_tree = ast.parse(models.read_text(encoding="utf-8"))
          p18_tables = set()
          for node in model_tree.body:
              if not isinstance(node, ast.ClassDef):
                  continue
              for item in node.body:
                  if (
                      isinstance(item, ast.Assign)
                      and any(
                          isinstance(target, ast.Name)
                          and target.id == "__tablename__"
                          for target in item.targets
                      )
                      and isinstance(item.value, ast.Constant)
                      and isinstance(item.value.value, str)
                      and item.value.value.startswith(
                          "business_relationship_policy"
                      )
                  ):
                      p18_tables.add(item.value.value)
          assert p18_tables == {
              "business_relationship_policy",
              "business_relationship_policy_use",
          }, p18_tables
          PY
          fi

      - name: Require sealed P19 hypothesis/root-cause review
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/app/v3/hypothesis_root_cause.py ]; then
            REVIEW="backend/belgeler/metabase/predev/P19_HYPOTHESIS_ROOT_CAUSE_PREDEVELOPMENT_REVIEW.md"
            DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
            test -f "$REVIEW"
            grep -q "DMP-DEC-0055" "$REVIEW"
            grep -q "P19 MINIMAL IMPLEMENTATION AUTHORIZED" "$REVIEW"
            grep -q "DMP-DEC-0055 — MINIMAL HYPOTHESIS / ROOT-CAUSE EPISTEMIC AUTHORITY" "$DECISIONS"
            grep -q "P17 InvestigationGraph != P19 causal" "$REVIEW"
            grep -q "P18 business-policy direction != causal direction" "$REVIEW"
            grep -q "NO_DEFENSIBLE_ROOT_CAUSE_ESTABLISHED" "$REVIEW"
          fi

      - name: Guard P19 as epistemic-only authority
        shell: bash
        run: |
          set -euo pipefail
          HOT="backend/app/v3/hypothesis_root_cause.py"
          if [ -f "$HOT" ]; then
            python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/v3/hypothesis_root_cause.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module or "")
          forbidden = (
              "app.v3.substrate.metabase",
              "app.v3.research_native_gateway",
              "app.v3.research_followup",
              "app.v3.native_execution",
              "app.wren",
              "numpy",
              "pandas",
              "scipy",
              "statistics",
          )
          bad = sorted(x for x in imports if x.startswith(forbidden))
          assert not bad, bad

          for symbol in (
              "NativeEngineBridge",
              "MetabaseAgentClient",
              "execute_dataset",
              "explore_adhoc",
              "attest_native_query",
              "execute_native_query",
              "wren_service",
              "InvestigationGraph",
              "ResearchManager.add_hypothesis",
              "HypothesisState",
              "DimaQueryReceipt(",
              "EvidenceArtifact(",
              "causal_probability",
              "confidence_percent",
          ):
              assert symbol not in source, symbol

          models = Path("backend/control_plane/models.py")
          model_tree = ast.parse(models.read_text(encoding="utf-8"))
          tables = set()
          for node in model_tree.body:
              if not isinstance(node, ast.ClassDef):
                  continue
              for item in node.body:
                  if (
                      isinstance(item, ast.Assign)
                      and any(
                          isinstance(target, ast.Name)
                          and target.id == "__tablename__"
                          for target in item.targets
                      )
                      and isinstance(item.value, ast.Constant)
                      and isinstance(item.value.value, str)
                      and item.value.value.startswith("p19_")
                  ):
                      tables.add(item.value.value)
          assert tables == {
              "p19_hypothesis",
              "p19_hypothesis_grounding",
              "p19_root_cause_assessment",
          }, tables
          PY
          fi

      - name: Guard active engine consumers against source-build fallback
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=(
            ".github/workflows/dima-metabase-p13b-semantic-availability.yml"
            ".github/workflows/dima-metabase-p13c-integration.yml"
            ".github/workflows/dima-metabase-p13c-live.yml"
            ".github/workflows/dima-metabase-p14-native-direct-live.yml"
          )
          for workflow in "${ACTIVE[@]}"; do
            test -f "$workflow"
            if grep -nE 'docker[[:space:]]+(build|buildx[[:space:]]+build)' "$workflow"; then
              echo "active Platform engine consumer source-builds the engine: $workflow" >&2
              exit 1
            fi
            grep -q 'engine_runtime_lock.json' "$workflow"
            grep -q 'IMMUTABLE_IMAGE_REF' "$workflow"
            grep -q 'docker pull "\$IMMUTABLE_IMAGE_REF"' "$workflow"
            if grep -nE 'dima-metabase-engine:(latest|main|dima\.)' "$workflow"; then
              echo "moving/human tag consumed as runtime authority: $workflow" >&2
              exit 1
            fi
          done

      - name: Validate Dima engine runtime lock when pinned
        shell: bash
        run: |
          set -euo pipefail
          LOCK="backend/lab/metabase/engine_runtime_lock.json"
          if [ -f "$LOCK" ]; then
            test -f backend/lab/metabase/scripts/engine_runtime_lock.py
            GITLINK_SHA="$(git ls-tree HEAD engine/metabase | awk '{print $3}')"
            python backend/lab/metabase/scripts/engine_runtime_lock.py \
              --lock "$LOCK" \
              --gitlink-sha "$GITLINK_SHA" \
              --print-json
          fi
