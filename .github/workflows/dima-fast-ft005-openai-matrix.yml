name: dima-fast-ft005-model-matrix

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ft005-model-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DIMA_OPENROUTER_API_KEY
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: luna
            model: openai/gpt-5.6-luna
            role: LUNA_BASELINE
            canonical_model: gpt-5.6-luna
            measurement_mode: MODEL_COMPARABLE
            reasoning_effort: disabled
          - label: sol-comparable
            model: openai/gpt-5.6-sol
            role: SOL_CEILING
            canonical_model: gpt-5.6-sol
            measurement_mode: MODEL_COMPARABLE
            reasoning_effort: disabled
          - label: sol-ceiling
            model: openai/gpt-5.6-sol
            role: SOL_CEILING
            canonical_model: gpt-5.6-sol
            measurement_mode: MODEL_CEILING
            reasoning_effort: ceiling_enabled

    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_FAST_FT005_PROVIDER: "openrouter"
      DIMA_FAST_FT005_TRANSPORT: "openrouter_strict_benchmark"
      DIMA_FAST_FT005_MODEL: ${{ matrix.model }}
      DIMA_FAST_FT005_CANONICAL_MODEL: ${{ matrix.canonical_model }}
      DIMA_FAST_FT005_MODEL_ROLE: ${{ matrix.role }}
      DIMA_FAST_FT005_MEASUREMENT_MODE: ${{ matrix.measurement_mode }}
      DIMA_FAST_FT005_REASONING_EFFORT: ${{ matrix.reasoning_effort }}
      DIMA_FAST_FT005_MODEL_RECEIPT: lab/metabase/artifacts/ft005-model-${{ matrix.label }}.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lock provider-free benchmark transport contract
        working-directory: backend
        run: pytest -q tests/test_fast_model_eval.py

      - name: Check OpenRouter benchmark credential
        id: credential
        shell: bash
        run: |
          if [[ -n "$DIMA_OPENROUTER_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            mkdir -p backend/lab/metabase/artifacts
            cat > "backend/$DIMA_FAST_FT005_MODEL_RECEIPT" <<JSON
          {
            "status": "BLOCKED_NO_CREDENTIAL",
            "provider": "openrouter",
            "model_role": "${{ matrix.role }}",
            "request_model_id": "${{ matrix.model }}",
            "canonical_model": "${{ matrix.canonical_model }}",
            "measurement_mode": "${{ matrix.measurement_mode }}",
            "reasoning_effort": "${{ matrix.reasoning_effort }}"
          }
          JSON
          fi

      - name: Run frozen FT-005 focused corpus
        if: steps.credential.outputs.available == 'true'
        working-directory: backend
        run: |
          mkdir -p lab/metabase/artifacts
          python lab/fast_ft005_model_sentinel.py

      - name: Upload FT-005 model matrix receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dima-fast-ft005-model-${{ matrix.label }}-${{ github.sha }}
          path: backend/lab/metabase/artifacts/ft005-model-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show FT-005 model matrix receipt
        if: always()
        working-directory: backend
        run: |
          test ! -f "lab/metabase/artifacts/ft005-model-${{ matrix.label }}.json" ||             cat "lab/metabase/artifacts/ft005-model-${{ matrix.label }}.json"


      - name: Fail closed when benchmark credential is unavailable
        if: steps.credential.outputs.available != 'true'
        run: |
          echo "BLOCKED_NO_CREDENTIAL: DIMA_OPENROUTER_API_KEY / OPENROUTER_API_KEY"
          exit 1
