name: v2-day7-frozen13-once

"on":
  workflow_dispatch:
    inputs:
      confirm_expensive_run:
        description: "Type FROZEN13 to authorize this broad paid run"
        required: true
        default: ""
        type: string
      max_model_calls:
        description: "Explicit hard paid-call ceiling; 0 is rejected before provider use"
        required: true
        default: 0
        type: number

jobs:
  frozen13:
    if: "${{ inputs.confirm_expensive_run == 'FROZEN13' }}"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 45
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_DAY7_LIVE_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_DAY7_LIVE_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_DAY7_LIVE_TEMPORAL_MODEL: "openai/gpt-5.6-sol"
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Provider-free contract preflight
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day7_live_sol_contract.py \
            tests/test_v2_day7_research_manager_loop.py \
            tests/test_v2_day7_seed_set.py
      - name: Frozen13 LIVE Sol exactly once
        working-directory: backend
        run: |
          python lab/v2_day7_manager_live_sol.py \
            --max-model-calls "${{ inputs.max_model_calls }}" \
            --output lab/reports/v2_day7_frozen13_once.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day7-frozen13-once-${{ github.run_id }}
          path: backend/lab/reports/v2_day7_frozen13_once.json
          retention-days: 90
