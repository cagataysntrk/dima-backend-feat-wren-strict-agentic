name: v2-day6-research-language

"on":
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Optional comma-separated case ids; empty runs the full Day 6 gate"
        required: false
        default: ""
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-research-language.yml"

concurrency:
  group: v2-day6-research-language-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  research-language:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'test(v2-day6): rerun full Gemini research gate'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 12
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_OPENROUTER_MODEL: "google/gemini-2.5-flash-lite"
      DIMA_OPENROUTER_SELECT_MODEL: "google/gemini-2.5-flash-lite"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DAY6_CASE_IDS: ${{ inputs.case_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        run: pip install -e ".[dev]"
      - name: Day 6 manual ResearchBrief gate
        shell: bash
        run: |
          mkdir -p lab/reports
          args=(--require-live)
          if [[ -n "${DAY6_CASE_IDS}" ]]; then
            IFS=',' read -ra ids <<< "${DAY6_CASE_IDS}"
            for id in "${ids[@]}"; do
              id="${id//[[:space:]]/}"
              [[ -n "${id}" ]] && args+=(--case-id "${id}")
            done
          fi
          python lab/v2_day6_research_eval.py "${args[@]}"
      - name: Upload Day 6 language measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-day6-research-language
          path: backend/lab/reports/v2_day6_research_eval.json
          retention-days: 30
          if-no-files-found: warn
