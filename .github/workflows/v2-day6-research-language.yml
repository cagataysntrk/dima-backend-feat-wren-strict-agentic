name: v2-day6-research-language

"on":
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Optional comma-separated case ids; empty runs the frozen Day 6 gate"
        required: false
        default: ""
      model_role:
        description: "V2 language role to certify/measure"
        required: true
        type: choice
        default: REFERENCE_LANGUAGE
        options:
          - REFERENCE_LANGUAGE
          - FAST_LANGUAGE
      model_candidate:
        description: "Optional explicit candidate override for this manual run"
        required: false
        default: ""

concurrency:
  group: v2-day6-research-language-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  research-language:
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 12
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DAY6_CASE_IDS: ${{ inputs.case_ids }}
      DAY6_MODEL_ROLE: ${{ inputs.model_role }}
      DAY6_MODEL_CANDIDATE: ${{ inputs.model_candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        run: pip install -e ".[dev]"
      - name: Day 6 manual ResearchBrief gate
        shell: bash
        run: |
          mkdir -p lab/reports
          args=(--require-live --model-role "${DAY6_MODEL_ROLE}")
          if [[ -n "${DAY6_MODEL_CANDIDATE}" ]]; then
            args+=(--model "${DAY6_MODEL_CANDIDATE}")
          fi
          if [[ -n "${DAY6_CASE_IDS}" ]]; then
            IFS=',' read -ra ids <<< "${DAY6_CASE_IDS}"
            for id in "${ids[@]}"; do
              id="${id//[[:space:]]/}"
              [[ -n "${id}" ]] && args+=(--case-id "${id}")
            done
          fi
          python lab/v2_day6_research_eval.py "${args[@]}"
      - name: Upload Day 6 language measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-day6-research-language
          path: backend/lab/reports/v2_day6_research_eval.json
          retention-days: 30
          if-no-files-found: warn
