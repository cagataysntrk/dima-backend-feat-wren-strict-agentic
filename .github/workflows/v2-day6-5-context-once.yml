name: v2-day6-5-context-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-context-once.yml"

jobs:
  day65-context:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run repair and context closure'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Day 6.5 repair/context closure
        working-directory: backend
        run: |
          python -m py_compile app/v2/acceptance.py app/v2/manager_executor.py app/v2/manager_loop.py app/v2/manager_lab.py
          pytest -q             tests/test_v2_day6_5_manager_authority.py             tests/test_v2_day6_5_correctness_closure.py             tests/test_v2_day6_5_adaptive_branch.py
