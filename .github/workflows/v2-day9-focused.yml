name: v2-day9-focused

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - "backend/app/v2/report_builder.py"
      - "backend/tests/test_v2_day9_report_builder.py"
      - ".github/workflows/v2-day9-focused.yml"
  workflow_dispatch:

jobs:
  day9-report-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIMA_LLM_PROVIDER: rule
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: rule
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile Day9 report authority
        working-directory: backend
        run: python -m compileall -q app/v2/report_builder.py

      - name: Day9 deterministic ReportDocument attacks
        working-directory: backend
        run: pytest -q tests/test_v2_day9_report_builder.py
