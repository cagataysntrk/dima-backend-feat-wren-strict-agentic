name: dima-metabase-core-a-focused

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/core_a/**"
      - "backend/tests/test_v3_action_work.py"
      - "backend/tests/test_v3_outcome_observation.py"
      - "backend/tests/test_v3_institutional_memory.py"
      - "backend/tests/test_v3_watch_signal.py"
      - "backend/tests/test_v3_ux_foundations.py"
      - "backend/product_contracts/ux_foundations.json"
      - "backend/control_plane/models.py"
      - "backend/control_plane/authorize.py"
      - "backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
      - ".github/workflows/dima-metabase-core-a-focused.yml"
      - ".github/workflows/dima-metabase-m1.yml"
      - ".github/workflows/dima-metabase-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-a-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce Core Closure A authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q "DMP-DEC-0060 — CORE CLOSURE A CLOSED-LOOP BRAIN AUTHORITY" backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md
          grep -q '"work:manage": 1' backend/control_plane/authorize.py
          ! grep -q '"action:execute"' backend/control_plane/authorize.py
          grep -Fq -- '- "!backend/app/v3/core_a/**"' .github/workflows/dima-metabase-m1.yml

      - name: Compile available Core A owners
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/v3/core_a/__init__.py
          for f in app/v3/core_a/*.py; do
            python -m py_compile "$f"
          done
          for f in tests/test_v3_action_work.py tests/test_v3_outcome_observation.py tests/test_v3_institutional_memory.py tests/test_v3_watch_signal.py tests/test_v3_ux_foundations.py; do
            test ! -f "$f" || python -m py_compile "$f"
          done

      - name: Guard Core A against shadow analytics and side effects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          root=Path("backend/app/v3/core_a")
          forbidden=(
              "httpx","requests","urllib","app.v3.action_connectors",
              "app.v3.substrate.metabase","app.wren",
              "numpy","pandas","scipy","statistics",
          )
          for p in root.glob("*.py"):
              tree=ast.parse(p.read_text(encoding="utf-8"))
              imports=set()
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      imports.update(a.name for a in node.names)
                  elif isinstance(node,ast.ImportFrom):
                      imports.add(node.module or "")
              assert not any(name.startswith(forbidden) for name in imports), (p,imports)
              src=p.read_text(encoding="utf-8")
              for token in ("action:execute","send_email","webhook","requests.post","httpx.","numpy.","pandas."):
                  assert token not in src, (p,token)
          PY

      - name: ActionWork focused proof
        working-directory: backend
        run: pytest -q tests/test_v3_action_work.py

      - name: Outcome focused proof when present
        if: hashFiles('backend/tests/test_v3_outcome_observation.py') != ''
        working-directory: backend
        run: pytest -q tests/test_v3_outcome_observation.py

      - name: Memory focused proof when present
        if: hashFiles('backend/tests/test_v3_institutional_memory.py') != ''
        working-directory: backend
        run: pytest -q tests/test_v3_institutional_memory.py

      - name: Watch Signal focused proof when present
        if: hashFiles('backend/tests/test_v3_watch_signal.py') != ''
        working-directory: backend
        run: pytest -q tests/test_v3_watch_signal.py

      - name: Wave-1 UX foundation contract proof
        if: hashFiles('backend/tests/test_v3_ux_foundations.py') != ''
        working-directory: backend
        run: pytest -q tests/test_v3_ux_foundations.py

      - name: Verify engine and no external execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"
          ! grep -q '"action:execute"' backend/control_plane/authorize.py
          test ! -f backend/app/v3/action_execution.py
