name: dima-fast-ft005-core

on:
  push:
    branches:
      - feat/dima-metabase-product-fast-track
    paths:
      - ".github/workflows/dima-fast-ft005-core.yml"
      - "backend/app/fast/conversation_*.py"
      - "backend/app/fast/followup_cognition.py"
      - "backend/app/fast/run_manager.py"
      - "backend/app/fast/application.py"
      - "backend/tests/test_fast_conversation_*.py"
      - "backend/tests/test_fast_run_lifecycle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ft005-core:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile FT-005 core
        working-directory: backend
        run: |
          python -m py_compile             app/fast/conversation_models.py             app/fast/conversation_store.py             app/fast/followup_cognition.py             app/fast/conversation_service.py             app/fast/conversation_router.py             app/fast/run_manager.py

      - name: Fast boundary static gate
        working-directory: backend
        run: pytest -q tests/test_fast_boundary_static.py

      - name: FT-005 conversation semantics
        working-directory: backend
        run: pytest -q tests/test_fast_conversation_core.py

      - name: FT-004 lifecycle regression
        working-directory: backend
        run: |
          pytest -q tests/test_fast_run_lifecycle.py
          pytest -q tests/test_fast_run_api.py

      - name: FT-003 regression
        working-directory: backend
        run: |
          pytest -q tests/test_fast_ask_core.py
          pytest -q tests/test_fast_ask_service.py
