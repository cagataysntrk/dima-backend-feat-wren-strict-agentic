# R8 dima.8 provider-free closure trigger
# FINAL STRICT-SCHEMA RECOVERY SEAL: c2a0cfda12ab6b1329ef56171b6a5d8e58eda005
# 90+ convergence final provider-free freeze v2: Product behavior c2a0cfda12ab6b1329ef56171b6a5d8e58eda005
name: dima-v1-phase1-p12-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - ".github/workflows/dima-v1-phase1-p12-provider-free.yml"
      - ".github/workflows/dima-v1-phase1-p12-live.yml"
      - ".github/workflows/dima-v1-phase1-p12-pinpoint-live.yml"
      - "backend/app/v3/research_contracts.py"
      - "backend/app/v3/research.py"
      - "backend/tests/test_v3_r7_native_contract_delivery.py"
      - "backend/app/v3/research_intake.py"
      - "backend/app/v3/analytical_request_contract.py"
      - "backend/app/v3/research_analytical_scope.py"
      - "backend/eval/dima_neutral_feature_benchmark_round2.json"
      - "backend/eval/round2_neutral_machine_fixture.json"
      - "backend/eval/v1/**"
      - "backend/lab/metabase/core_b/round2_feature_benchmark.py"
      - "backend/lab/metabase/core_b/phase1_pinpoint_live.py"
      - "backend/lab/metabase/core_b/runtime/seed_phase1_pinpoint_metrics.py"
      - "backend/lab/metabase/core_b/runtime/openrouter_counting_proxy.py"
      - "backend/lab/metabase/core_b/runtime/seed_round2_fixture.py"
      - "backend/tests/test_v3_v1_phase1_eval_contract.py"
      - "backend/tests/test_v3_phase1_pinpoint_live_contract.py"
      - "backend/tests/test_v3_openrouter_counting_proxy.py"
      - "backend/tests/test_v3_v1_phase1_metamorphic.py"
      - "backend/tests/test_v3_v1_capability_metamorphic.py"
      - "backend/belgeler/metabase/DIMA_V1_PHASE1_EXECUTION_STATUS.md"
      - "backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_BEHAVIOR_SHA: "c2a0cfda12ab6b1329ef56171b6a5d8e58eda005"

jobs:
  p12-provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Frozen Round-2 corpus identity and eval-only preflight
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD:backend/eval/dima_neutral_feature_benchmark_round2.json)" = "b08fbf6601b8c47a6f336c4efcc0cdab95a6c2da"
          test "$(git -C .. rev-parse HEAD:backend/eval/round2_neutral_machine_fixture.json)" = "44c02edee3333ddd048e8f7d9aeb94dcd399ad7c"
          python -m py_compile lab/metabase/core_b/round2_feature_benchmark.py
          python -m py_compile lab/metabase/core_b/runtime/seed_round2_fixture.py
          python -m py_compile lab/metabase/core_b/runtime/openrouter_counting_proxy.py
          python -m py_compile eval/v1/write_phase1_p0_receipt.py
          pytest -q tests/test_v3_v1_phase1_eval_contract.py

      - name: Phase-1 structural metamorphic contract
        working-directory: backend
        run: |
          pytest -q tests/test_v3_v1_phase1_metamorphic.py
          pytest -q tests/test_v3_v1_rca_mode_matrix.py
          pytest -q tests/test_v3_v1_capability_metamorphic.py

      - name: R7 native analytical contract delivery
        working-directory: backend
        run: pytest -q tests/test_v3_r7_native_contract_delivery.py

      - name: Final pinpoint provider-free contract
        working-directory: backend
        run: |
          pytest -q tests/test_v3_phase1_pinpoint_live_contract.py
          pytest -q tests/test_v3_openrouter_counting_proxy.py

      - name: Provider contract exception boundary
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p17_autonomous_provider_schema.py             tests/test_v3_p17_request_differential.py

      - name: P19 callability and closure routing
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_product_process_manager.py             tests/test_v3_core_b_closure_v2.py             tests/test_v3_v1_wave_b_b1.py

      - name: Scope replacement restart and USER_MUST
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_v1_scope_contract.py             tests/test_v3_v1_scope_integration.py             tests/test_v3_owner_scoped_must_accounting.py

      - name: Epistemic and publication P0 boundaries
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p19_hypothesis_root_cause.py             tests/test_v3_v1_wave_b_b2.py             tests/test_v3_p20_report_document.py

      - name: Cross-tenant security boundary
        working-directory: backend
        run: pytest -q tests/test_v3_control_plane_security.py

      - name: Architecture prohibitions
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .. ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"
          test ! -d ../frontend
          test ! -d ../ui
          test ! -d ../web
          test ! -d ../WrenAI-main
          ! grep -R -nE 'F0[1-9]_[SMH]|F10_[SMH]|round2.*special.?case|benchmark.*special.?case' app
          ! grep -R -nE 'action:execute|wren-core-py|"wrenai' app ../backend/pyproject.toml
          python - <<'PY'
          from pathlib import Path
          for path in (
              Path("app/v3/product/process_manager.py"),
              Path("app/v3/product/execution_mode.py"),
              Path("app/v3/business_relationship_v1.py"),
              Path("app/v3/hypothesis_root_cause_v1.py"),
          ):
              source=path.read_text(encoding="utf-8").lower()
              for token in (
                  "sqlparse",
                  "parse_mbql",
                  "query_optimizer",
                  "levenshtein(",
                  "fuzz.ratio(",
                  "embedding_threshold",
              ):
                  assert token not in source,(path,token)
          PY

      - name: Write machine-readable Phase-1 P0 receipt
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eval/v1/artifacts
          python eval/v1/write_phase1_p0_receipt.py             --output eval/v1/artifacts/phase1_p0_provider_free.json             --candidate-sha "$GITHUB_SHA"             --engine-sha "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"             --migration-head "fd2a7c9e4b61"             --round2-manifest-blob "$(git -C .. rev-parse HEAD:backend/eval/dima_neutral_feature_benchmark_round2.json)"             --round2-fixture-blob "$(git -C .. rev-parse HEAD:backend/eval/round2_neutral_machine_fixture.json)"             --metamorphic-blob "$(git -C .. rev-parse HEAD:backend/eval/v1/phase1_metamorphic_manifest.json)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dima-v1-phase1-p0-provider-free-${{ github.run_id }}
          path: backend/eval/v1/artifacts/phase1_p0_provider_free.json
          if-no-files-found: warn
          retention-days: 90
