name: dima-metabase-core-a-final-closure

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - ".github/workflows/dima-metabase-core-a-final-closure.yml"
      - "backend/app/v3/core_a/**"
      - "backend/product_contracts/ux_foundations.json"
      - "backend/tests/test_v3_action_work.py"
      - "backend/tests/test_v3_outcome_observation.py"
      - "backend/tests/test_v3_institutional_memory.py"
      - "backend/tests/test_v3_watch_signal.py"
      - "backend/tests/test_v3_ux_foundations.py"
      - "backend/control_plane/models.py"
      - "backend/control_plane/authorize.py"
      - "backend/migrations/versions/fb4e6d2a1074_core_a_closed_loop.py"
      - "backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-a-final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify Core A authority and single migration head
        shell: bash
        run: |
          set -euo pipefail
          grep -q "DMP-DEC-0060 — CORE CLOSURE A CLOSED-LOOP BRAIN AUTHORITY" backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md
          cd backend
          python -m alembic heads > /tmp/core-a-final-heads.txt
          test "$(grep -Ec '^[0-9a-f]+' /tmp/core-a-final-heads.txt)" -eq 1
          grep -q '^fb4e6d2a1074' /tmp/core-a-final-heads.txt
          python -m alembic history --verbose > /tmp/core-a-final-history.txt
          grep -q 'Rev: fa07d50b2163' /tmp/core-a-final-history.txt
          grep -q 'Rev: f9e6c4fa1052' /tmp/core-a-final-history.txt

      - name: Verify exactly five Core A durable families
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path("backend/control_plane/models.py").read_text(encoding="utf-8"))
          tables=set()
          for node in tree.body:
              if not isinstance(node,ast.ClassDef):
                  continue
              for item in node.body:
                  if (
                      isinstance(item,ast.Assign)
                      and any(isinstance(t,ast.Name) and t.id=="__tablename__" for t in item.targets)
                      and isinstance(item.value,ast.Constant)
                      and isinstance(item.value.value,str)
                  ):
                      tables.add(item.value.value)
          expected={"action_work","outcome_observation","institutional_memory_entry","watch","signal"}
          assert expected <= tables, (expected-tables)
          forbidden={"action_execution_receipt","action_attempt","execution_queue","memory_graph","causal_graph"}
          assert not (forbidden & tables), forbidden & tables
          PY

      - name: Verify sealed owner production code remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=d02474645578ff27ec9871c4738ac7556fb3f82a
          test -z "$(git diff --name-only "$BASE"...HEAD --             backend/app/v3/decision_adoption.py             backend/app/v3/action_authorization.py             backend/app/v3/decision_intelligence.py             backend/app/v3/report_document.py             backend/app/v3/hypothesis_root_cause.py             backend/app/v3/business_relationship_policy.py             backend/app/v3/claim_lineage.py             backend/app/v3/research.py             backend/app/v3/research_store.py             backend/app/v3/research_product.py             backend/app/v3/research_native_gateway.py)"
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"

      - name: Verify no shadow analytics external execution or UI
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '"action:execute"' backend/control_plane/authorize.py
          grep -q '^DEFAULT_ACTION_CAPABILITY_REGISTRY = ActionCapabilityRegistry()$' backend/app/v3/action_authorization.py
          test ! -f backend/app/v3/action_execution.py
          test -z "$(git diff --name-only d02474645578ff27ec9871c4738ac7556fb3f82a...HEAD -- frontend web ui)"
          python - <<'PY'
          import ast
          from pathlib import Path
          forbidden=("httpx","requests","urllib","app.v3.action_connectors","app.v3.substrate.metabase","app.wren","numpy","pandas","scipy","statistics")
          for p in Path("backend/app/v3/core_a").glob("*.py"):
              tree=ast.parse(p.read_text(encoding="utf-8"))
              imports=set()
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      imports.update(a.name for a in node.names)
                  elif isinstance(node,ast.ImportFrom):
                      imports.add(node.module or "")
              assert not any(name.startswith(forbidden) for name in imports), (p,imports)
          PY

      - name: Core A closed-loop owners
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_action_work.py             tests/test_v3_outcome_observation.py             tests/test_v3_institutional_memory.py             tests/test_v3_watch_signal.py             tests/test_v3_ux_foundations.py

      - name: ActionAuthorization regression
        working-directory: backend
        run: pytest -q tests/test_v3_action_authorization.py

      - name: Human Adoption regression
        working-directory: backend
        run: pytest -q tests/test_v3_decision_adoption.py

      - name: P21 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p21_decision_intelligence.py

      - name: P20 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p20_report_document.py

      - name: P19 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p19_hypothesis_root_cause.py tests/test_v3_p19_provider.py tests/test_v3_p19_autonomous_eval.py

      - name: P18 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p18_business_relationship_policy.py

      - name: P17 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p17_authorization_transport.py tests/test_v3_p17_autonomous_provider_schema.py tests/test_v3_p17_autonomous_manager_eval.py tests/test_v3_p17_research_manager.py

      - name: P16 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p16_claim_lineage.py

      - name: P15 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p15_native_exploration.py

      - name: P14 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p14_product.py tests/test_v3_p14_native_gateway.py

      - name: Final Core A invariant budget
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"
          ! grep -q '"action:execute"' backend/control_plane/authorize.py
          ! grep -R -nE 'openrouter|openai/gpt|Luna|Sol|C1' backend/app/v3/core_a
