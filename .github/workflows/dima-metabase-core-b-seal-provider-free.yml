# R8 dima.8 provider-free closure trigger
# 90+ convergence final provider-free freeze v2: Product behavior dc4be27491d7fb41443491a93a812899e2645bb8
name: dima-metabase-core-b-seal-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/eval/core_b/**"
      - "backend/lab/metabase/core_b/**"
      - "backend/tests/test_v3_core_b_campaign_contract.py"
      - "backend/tests/test_v3_core_b_neutral_fixture.py"
      - "backend/app/v3/product/**"
      - "backend/app/v3/product_routing_store.py"
      - "backend/app/v3/analytical_request_contract.py"
      - "backend/app/v3/native_standard/**"
      - "backend/app/main.py"
      - "backend/migrations/versions/fc8a1d0e3b42_product_investigation_routing.py"
      - "backend/migrations/versions/fd2a7c9e4b61_p17_child_analytical_scope.py"
      - "backend/app/v3/research.py"
      - "backend/app/v3/research_analytical_scope.py"
      - "backend/app/v3/research_followup.py"
      - "backend/app/v3/research_native_gateway.py"
      - "backend/app/v3/research_manager.py"
      - "backend/app/v3/research_product.py"
      - "backend/app/v3/report_document.py"
      - "backend/app/v3/business_relationship_v1.py"
      - "backend/app/v3/hypothesis_root_cause.py"
      - "backend/app/v3/hypothesis_root_cause_v1.py"
      - "backend/app/v3/research_intake.py"
      - "backend/app/v3/structured_trace.py"
      - "backend/app/v3/research_manager_provider.py"
      - "backend/app/v3/structured_transport.py"
      - "backend/app/config.py"
      - "backend/control_plane/models.py"
      - "backend/tests/test_v3_control_plane_security.py"
      - "backend/tests/test_v3_product_contracts.py"
      - "backend/tests/test_v3_product_composition.py"
      - "backend/tests/test_v3_product_routing_store.py"
      - "backend/tests/test_v3_owner_scoped_must_accounting.py"
      - "backend/tests/test_v3_research_intake.py"
      - "backend/tests/test_v3_p14_native_gateway.py"
      - "backend/tests/test_v3_structured_transport.py"
      - "backend/tests/test_v3_p17_autonomous_provider_schema.py"
      - "backend/tests/test_v3_p17_request_differential.py"
      - "backend/tests/test_v3_p17_research_manager.py"
      - "backend/tests/test_v3_p19_hypothesis_root_cause.py"
      - "backend/tests/test_v3_v1_wave_b_b1.py"
      - "backend/tests/test_v3_v1_wave_b_b2.py"
      - "backend/tests/test_v3_v1_scope_integration.py"
      - "backend/tests/test_v3_product_process_manager.py"
      - "backend/tests/test_v3_v1_analytical_request_contract.py"
      - "backend/tests/test_v3_p13d_native_standard.py"
      - "backend/belgeler/metabase/DIMA_V1_PHASE1_EXECUTION_STATUS.md"
      - ".github/workflows/dima-metabase-core-b-seal-provider-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-seal-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile canonical composition and owner-scoped lifecycle
        working-directory: backend
        run: |
          python -m py_compile             app/v3/analytical_request_contract.py             app/v3/native_standard/trust.py             app/v3/research.py             app/v3/research_manager.py             app/v3/hypothesis_root_cause.py             app/v3/hypothesis_root_cause_v1.py             app/v3/business_relationship_v1.py             app/v3/product/execution_mode.py             app/v3/research_product.py             app/v3/report_document.py             app/v3/research_intake.py             app/v3/research_manager_provider.py             app/v3/product/contracts.py             app/v3/product/composition.py             app/v3/product_routing_store.py             migrations/versions/fc8a1d0e3b42_product_investigation_routing.py             migrations/versions/fd2a7c9e4b61_p17_child_analytical_scope.py             tests/test_v3_product_routing_store.py             tests/test_v3_owner_scoped_must_accounting.py             lab/metabase/core_b/live_sentinel.py

      - name: Verify single Alembic head
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic heads > /tmp/core-b-heads.txt
          test "$(grep -Ec '^[0-9a-f]+' /tmp/core-b-heads.txt)" -eq 1
          grep -q '^fd2a7c9e4b61' /tmp/core-b-heads.txt
          python -m alembic history --verbose > /tmp/core-b-history.txt
          grep -q 'Rev: fb4e6d2a1074' /tmp/core-b-history.txt

      - name: Wave-A P3 forward request trust proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_analytical_request_contract.py \
            tests/test_v3_p13d_native_standard.py

      - name: Wave-B B1 P6-P8 focused proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_product_process_manager.py \
            tests/test_v3_v1_wave_b_b1.py

      - name: Wave-B B2 P9-P11 focused proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_wave_b_b2.py \
            tests/test_v3_v1_scope_integration.py \
            tests/test_v3_product_composition.py

      - name: Adaptive source-scope regression first
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_product_routing_store.py             tests/test_v3_product_composition.py             -k 'product_routing or adaptive_requirement or verified_evidence_does_not_auto_route'

      - name: Campaign and neutral fixture contract proof
        working-directory: backend
        run: pytest -q tests/test_v3_core_b_campaign_contract.py tests/test_v3_core_b_neutral_fixture.py

      - name: Core B raw-language intake owner proof
        working-directory: backend
        run: pytest -q tests/test_v3_research_intake.py

      - name: Scoped P17 provider representation proof
        working-directory: backend
        run: pytest -q tests/test_v3_p17_autonomous_provider_schema.py -k obligation_scoped_provider_view

      - name: Structured cognition observability proof
        working-directory: backend
        run: pytest -q tests/test_v3_structured_transport.py tests/test_v3_p17_request_differential.py

      - name: Owner-scoped USER_MUST lifecycle matrix
        working-directory: backend
        run: pytest -q tests/test_v3_owner_scoped_must_accounting.py

      - name: Core B composition provider-free proof
        working-directory: backend
        run: pytest -q tests/test_v3_product_contracts.py tests/test_v3_product_composition.py

      - name: Sealed P14 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p14_product.py tests/test_v3_p14_native_gateway.py

      - name: Sealed P17 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p17_authorization_transport.py tests/test_v3_p17_autonomous_provider_schema.py tests/test_v3_p17_autonomous_manager_eval.py tests/test_v3_p17_research_manager.py

      - name: Sealed P18 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p18_business_relationship_policy.py

      - name: Sealed P19 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p19_hypothesis_root_cause.py tests/test_v3_p19_provider.py tests/test_v3_p19_autonomous_eval.py

      - name: P20 lifecycle and publication regression
        working-directory: backend
        run: pytest -q tests/test_v3_p20_report_document.py

      - name: Sealed P21 regression
        working-directory: backend
        run: pytest -q tests/test_v3_p21_decision_intelligence.py

      - name: Control-plane persistence invariant proof
        working-directory: backend
        run: pytest -q tests/test_v3_control_plane_security.py

      - name: Run frozen provider-free canary
        working-directory: backend
        run: |
          python eval/core_b/run_provider_free_canary.py \
            --manifest eval/core_b/canary_manifest.json \
            --output eval/core_b/artifacts/provider_free_canary.json \
            --candidate-sha "$GITHUB_SHA"

      # Wave-A P2 scope authority was formally reopened and re-sealed by
      # DMP-DEC-0064; Core-A final closure 36339715760 = SUCCESS.
      # Keep exact blob pins for the re-authorized owners.
      - name: Guard sealed P14-P21 owner blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/app/v3/research_product.py)" = "0370635ec046c88532c8ae70e49efc5126404489"
          test "$(git rev-parse HEAD:backend/app/v3/research.py)" = "fff345ee965ccbe3676f49e02d44dbcd8217379e"
          # P17 is intentionally mutable under the certified active root-recovery fix.
          # Its current semantics are certified by the Sealed P17 regression above;
          # keep exact blob pins only for owners that remained sealed/unchanged.
          grep -q 'InvestigationBranchBehavior.GLOBAL_CONTROL' backend/app/v3/research_manager.py
          grep -q 'P17_BRANCH_TERMINAL' backend/app/v3/research_manager.py
          test "$(git rev-parse HEAD:backend/app/v3/business_relationship_policy.py)" = "1c533667bd080331f4f2231b9d37ee0c5e532fa8"
          test "$(git rev-parse HEAD:backend/app/v3/hypothesis_root_cause.py)" = "fb6c4bfe17cd4193b9584b79fa32b63dc6c85563"
          test "$(git rev-parse HEAD:backend/app/v3/report_document.py)" = "c2d1e266c4a7335bf7c62349b3229d7a55a38bee"
          test "$(git rev-parse HEAD:backend/app/v3/decision_intelligence.py)" = "1a40508048d668829344ca30aa7aadf881cebb82"
          test "$(git rev-parse HEAD:backend/app/v3/claim_lineage.py)" = "76589172d19d4d9ffa1db9f94f4ee9ee9f277e5a"

      - name: Hard prohibitions
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test ! -e eval/DEV80
          test ! -e eval/Validation50
          test ! -e eval/Hidden50
          ! grep -R -nE 'askv2_case_id|canonical_full special case|adaptive_tr special case|PRODUCT_COMPOSITION_NO_PUBLISHABLE_FACT_ASSERTED' app/v3/product
          ! grep -n 'for obligation_id in brief.must_requirement_ids' app/v3/product/composition.py
          ! grep -n 'verified_exists' app/v3/product/composition.py
          ! grep -R -nE 'source_obligation|acceptance_contract' app/v3/product app/v3/research_intake.py
          test "$(git -C .. ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-b-provider-free-canary-${{ github.run_id }}
          path: backend/eval/core_b/artifacts/provider_free_canary.json
          if-no-files-found: warn
          retention-days: 90
