name: v2-day5-live-attack

"on":
  workflow_dispatch:


concurrency:
  group: v2-day5-live-attack-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  live-core-attack:
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 12
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_ASK_V2_ENABLED: "true"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_OPENROUTER_MODEL: ${{ vars.DIMA_OPENROUTER_MODEL || 'google/gemini-2.5-flash-lite' }}
      DIMA_OPENROUTER_SELECT_MODEL: ${{ vars.DIMA_OPENROUTER_SELECT_MODEL || vars.DIMA_OPENROUTER_MODEL || 'google/gemini-2.5-flash-lite' }}
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_CRED_KEK: "dGVzdC1rZWstMzItYnl0ZS0wMTIzNDU2Nzg5YWJjZCE="
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend dependencies
        run: pip install -e ".[dev]"

      - name: Day 5 real-provider HTTP attack table
        run: |
          mkdir -p lab/reports
          python lab/v2_day5_live_attack.py

      - name: Upload Day 5 live attack measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-day5-live-attack
          path: backend/lab/reports/v2_day5_live_attack.json
          retention-days: 30
          if-no-files-found: warn
