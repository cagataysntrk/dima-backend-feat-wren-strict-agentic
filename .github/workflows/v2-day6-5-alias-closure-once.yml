name: v2-day6-5-alias-closure-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-alias-closure-once.yml"

jobs:
  alias-closure:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run alias closure'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install focused test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Day 6.5 alias / ambiguity closure
        working-directory: backend
        run: |
          python -m py_compile app/v2/manager_loop.py app/v2/resolver.py app/v2/acceptance.py app/v2/standard_projection.py
          pytest -q             tests/test_v2_day6_5_manager_authority.py             tests/test_v2_day6_5_correctness_closure.py             tests/test_v2_day6_5_adaptive_branch.py             tests/test_v2_day6_5_dev_corpus.py             tests/test_v2_day2.py::test_exact_verified_match_dominates_fuzzy_material_lookalike             tests/test_v2_day2.py::test_multiple_exact_verified_matches_still_clarify
