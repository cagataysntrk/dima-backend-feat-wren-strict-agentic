name: dima-metabase-p12x-c1

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/lab/metabase/p12x/c1_cases.json"
      - "backend/lab/metabase/p12x/c1_score_parity.py"
      - ".github/workflows/dima-metabase-p12x-c1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-stock-vs-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: DIMA_OPENROUTER_API_KEY
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      P12X_METABOT_PROVIDER: openrouter/openai/gpt-5.6-luna
      STOCK_IMAGE: metabase/metabase@sha256:1160b570cb11c107bce00e71293552df8a8363e01a32c2c7a048cee002dc8a73
      FORK_IMAGE: ghcr.io/upcytech/dima-metabase-engine@sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b
      ENGINE_SHA: 9fb21da0177935aff5882472577c8e14a67ebd65
      P12X_WAREHOUSE_OWNER_PASSWORD: boyahane-owner-c1
      BOYAHANE_READONLY_PASSWORD: boyahane-readonly-c1
      MB_APP_PASSWORD: metabase-app-c1
      MB_ADMIN_EMAIL: admin@p12x-c1.local
      MB_ADMIN_PASSWORD: DimaP12xC1Admin2026!
      MB_RESTRICTED_EMAIL: restricted@p12x-c1.local
      MB_RESTRICTED_PASSWORD: DimaP12xC1Restricted2026!
      MB_RESTRICTED_GROUP: Dima P12X C1 Restricted
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v4
        with:
          path: platform

      - name: Checkout exact Boyahane fixture
        uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: f0c4a6b053ead52ca2eac80002c448323dc34a35
          path: boyahane

      - name: Checkout exact engine source fallback
        uses: actions/checkout@v4
        with:
          repository: UpcyTech/dima-metabase-engine
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab dependencies
        run: pip install "duckdb==1.4.3" "psycopg[binary]==3.3.3" "httpx>=0.27,<1"

      - name: Freeze current corpus oracle
        working-directory: platform/backend
        env:
          BOYAHANE_DUCKDB: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          P12X_OUT: lab/metabase/p12x/c1-artifacts
        run: python lab/metabase/p12x/build_oracle.py

      - name: Resolve stock and fork images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$STOCK_IMAGE"
          if docker pull "$FORK_IMAGE"; then
            echo "fork_image_source=ghcr" >> "$GITHUB_ENV"
          else
            echo "GHCR pull unavailable; building exact C0 engine source."
            docker build \
              -f engine/.dima/docker/Dockerfile.c0 \
              --build-arg MB_EDITION=oss \
              --build-arg VERSION="0.63.18-dima.0" \
              -t dima-engine-c1:local \
              engine
            echo "FORK_IMAGE=dima-engine-c1:local" >> "$GITHUB_ENV"
            echo "fork_image_source=source_build_fallback" >> "$GITHUB_ENV"
          fi

      - name: Record immutable runtime images
        working-directory: platform/backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lab/metabase/p12x/c1-artifacts
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def inspect(ref):
              x=json.loads(subprocess.check_output(["docker","image","inspect",ref],text=True))[0]
              return {"ref":ref,"id":x.get("Id"),"repo_digests":x.get("RepoDigests") or []}
          out={
            "stock":inspect(os.environ["STOCK_IMAGE"]),
            "fork":inspect(os.environ["FORK_IMAGE"]),
            "fork_image_source":os.environ.get("fork_image_source"),
            "engine_sha":os.environ["ENGINE_SHA"],
          }
          Path("lab/metabase/p12x/c1-artifacts/runtime_images.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - name: Start shared Boyahane and isolated application databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-c1
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-c1 --network-alias analytics-db \
            -p 127.0.0.1:55442:5432 \
            -e POSTGRES_DB=boyahane -e POSTGRES_USER=boyahane_owner -e POSTGRES_PASSWORD="$P12X_WAREHOUSE_OWNER_PASSWORD" "$PG"
          docker run -d --name app-stock --network dima-c1 --network-alias app-stock \
            -e POSTGRES_DB=metabase_stock -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD="$MB_APP_PASSWORD" "$PG"
          docker run -d --name app-fork --network dima-c1 --network-alias app-fork \
            -e POSTGRES_DB=metabase_fork -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD="$MB_APP_PASSWORD" "$PG"
          for name in analytics-db app-stock app-fork; do
            for i in $(seq 1 90); do
              if docker exec "$name" pg_isready >/dev/null 2>&1; then break; fi
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Import exact Boyahane snapshot
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55442"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: boyahane-owner-c1
          BOYAHANE_READONLY_PASSWORD: boyahane-readonly-c1
        run: python boyahane/importer/import_boyahane.py

      - name: Start stock and fork Metabase under identical policy
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --network dima-c1
            -e MB_DB_TYPE=postgres
            -e MB_DB_PORT=5432
            -e MB_DB_USER=metabase_app
            -e MB_DB_PASS="$MB_APP_PASSWORD"
            -e MB_AI_FEATURES_ENABLED=true
            -e MB_METABOT_ENABLED=true
            -e MB_AGENT_API_ENABLED=true
            -e MB_LOAD_SAMPLE_CONTENT=false
            -e MB_MCP_EXECUTE_SQL_ENABLED=false
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY"
            -e MB_LLM_METABOT_PROVIDER="$P12X_METABOT_PROVIDER"
          )
          docker run -d --name mb-stock --network-alias mb-stock -p 127.0.0.1:3311:3000 \
            "${common[@]}" -e MB_DB_HOST=app-stock -e MB_DB_DBNAME=metabase_stock "$STOCK_IMAGE"
          docker run -d --name mb-fork --network-alias mb-fork -p 127.0.0.1:3312:3000 \
            "${common[@]}" -e MB_DB_HOST=app-fork -e MB_DB_DBNAME=metabase_fork "$FORK_IMAGE"

      - name: Bootstrap identical restricted principals
        working-directory: platform/backend
        shell: bash
        run: |
          set -euo pipefail
          for spec in "3311:Stock" "3312:Fork"; do
            port="${spec%%:*}"; label="${spec#*:}"
            METABASE_URL="http://127.0.0.1:$port" \
            MB_SITE_NAME="Dima C1 $label" \
            ANALYTICS_DB_NAME=boyahane \
            ANALYTICS_DB_USER=metabase_boyahane \
            ANALYTICS_DB_PASSWORD="$BOYAHANE_READONLY_PASSWORD" \
            python lab/metabase/scripts/bootstrap.py
          done

      - name: Run frozen six-case native parity
        working-directory: platform/backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lab/metabase/p12x/c1-artifacts/stock lab/metabase/p12x/c1-artifacts/fork
          for case_id in PX-01 PX-03 PX-06 PX-07 PX-13 PX-16; do
            question="$(python - "$case_id" <<'PY'
          import json,sys
          corpus=json.load(open("lab/metabase/p12x/corpus_v1.json"))
          cid=sys.argv[1]
          print(next(x["question"] for x in corpus["cases"] if x["id"]==cid))
          PY
            )"
            echo "=== $case_id / stock ==="
            python lab/metabase/p12x/native_probe.py \
              --base-url http://127.0.0.1:3311 \
              --email "$MB_RESTRICTED_EMAIL" --password "$MB_RESTRICTED_PASSWORD" \
              --question "$question" --output "lab/metabase/p12x/c1-artifacts/stock/$case_id.json"
            echo "=== $case_id / fork ==="
            python lab/metabase/p12x/native_probe.py \
              --base-url http://127.0.0.1:3312 \
              --email "$MB_RESTRICTED_EMAIL" --password "$MB_RESTRICTED_PASSWORD" \
              --question "$question" --output "lab/metabase/p12x/c1-artifacts/fork/$case_id.json"
          done

      - name: Enforce C1 capability retention
        working-directory: platform/backend
        run: |
          python lab/metabase/p12x/c1_score_parity.py \
            --cases lab/metabase/p12x/c1_cases.json \
            --oracle lab/metabase/p12x/c1-artifacts/oracle_v1.json \
            --stock-dir lab/metabase/p12x/c1-artifacts/stock \
            --fork-dir lab/metabase/p12x/c1-artifacts/fork \
            --output lab/metabase/p12x/c1-artifacts/C1_PARITY_REPORT.json

      - name: Upload C1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12x-c1-parity-${{ github.sha }}
          path: platform/backend/lab/metabase/p12x/c1-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Dump runtime logs on failure
        if: failure()
        run: |
          docker logs --tail=500 mb-stock || true
          docker logs --tail=500 mb-fork || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f mb-stock mb-fork analytics-db app-stock app-fork 2>/dev/null || true
          docker network rm dima-c1 2>/dev/null || true
