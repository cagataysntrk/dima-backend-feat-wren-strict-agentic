name: v2-day6-5-workers1-focused-live-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-workers1-focused-live-once.yml"

jobs:
  workers1-focused-live:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run workers1 focused live gate'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 15
    env:
      TARGET_SHA: "dea7ba673ba64280c3e58037705c31db99c733aa"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: "openrouter"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - name: Capture workflow identity
        shell: bash
        run: |
          echo "workflow_source_sha=$GITHUB_SHA" | tee /tmp/day65_workers1_live_receipt.txt
          echo "requested_code_sha=$TARGET_SHA" | tee -a /tmp/day65_workers1_live_receipt.txt

      - name: Checkout exact runtime-kernel green SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify exact tested SHA
        shell: bash
        run: |
          tested_sha="$(git rev-parse HEAD)"
          echo "tested_code_sha=$tested_sha" | tee -a /tmp/day65_workers1_live_receipt.txt
          test "$tested_sha" = "$TARGET_SHA"

      - name: Workers=1 focused live architecture gate
        working-directory: backend
        shell: bash
        run: |
          python lab/v2_day6_5_manager_eval.py \
            --require-live \
            --workers 1 \
            --model "openai/gpt-5.6-sol" \
            --case-id d65-dev-001 \
            --case-id d65-dev-005 \
            --case-id d65-dev-025 \
            --case-id d65-dev-026 \
            --case-id d65-dev-047 \
            --case-id d65-dev-063 \
            --case-id d65-dev-067 \
            --case-id d65-dev-075

      - name: Upload live measurement and receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-workers1-focused-live
          path: |
            backend/lab/reports/v2_day6_5_manager_eval.json
            /tmp/day65_workers1_live_receipt.txt
          retention-days: 30
