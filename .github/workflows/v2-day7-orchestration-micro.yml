name: v2-day7-orchestration-micro

"on":
  workflow_dispatch:
    inputs:
      confirm_micro_ablation:
        description: "Type MICRO2 to authorize the 2-case x 2-arm paid ablation"
        required: true
        default: ""
        type: string
      max_model_calls:
        description: "Hard paid-call ceiling for the whole ablation; Day7 final max is 16"
        required: true
        default: 0
        type: number
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day7-orchestration-micro.yml"

jobs:
  micro-ablation:
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_micro_ablation == 'MICRO2') || (github.event_name == 'push' && github.event.head_commit.message == 'test(v2-day7): run final micro ablation once') }}"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 30
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_DAY7_LIVE_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate declared paid-call budget
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            budget=16
          else
            budget="${{ env.ABLATION_BUDGET }}"
          fi
          if (( budget < 1 || budget > 16 )); then
            echo "ERROR: Day7 final micro ablation requires max_model_calls in 1..16." >&2
            exit 64
          fi
          echo "ABLATION_BUDGET=${budget}" >> "${GITHUB_ENV}"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Provider-free ablation contract
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day7_orchestration_ablation.py \
            tests/test_v2_day7_total_manager_budget.py

      - name: Cost/scope dry-run
        working-directory: backend
        run: |
          python lab/v2_day7_orchestration_ablation.py \
            --case-id adaptive-material \
            --case-id stable-no-extra-branch \
            --max-model-calls "${{ env.ABLATION_BUDGET }}" \
            --dry-run

      - name: Paid micro ablation
        working-directory: backend
        run: |
          python lab/v2_day7_orchestration_ablation.py \
            --case-id adaptive-material \
            --case-id stable-no-extra-branch \
            --max-model-calls "${{ env.ABLATION_BUDGET }}" \
            --output lab/reports/v2_day7_orchestration_micro.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day7-orchestration-micro-${{ github.run_id }}
          path: backend/lab/reports/v2_day7_orchestration_micro.json
          retention-days: 90
