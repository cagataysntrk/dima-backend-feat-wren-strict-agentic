name: dima-fast-ft005-model

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ft005-model:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: DIMA_OPENROUTER_API_KEY
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_OPENROUTER_MODEL: "google/gemini-2.5-flash-lite"
      DIMA_FAST_FT005_MODEL_RECEIPT: "lab/metabase/artifacts/ft005-model-followup.json"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run focused real-model follow-up sentinel
        working-directory: backend
        run: |
          test -n "$DIMA_OPENROUTER_API_KEY"
          mkdir -p lab/metabase/artifacts
          python lab/fast_ft005_model_sentinel.py

      - name: Upload FT-005 model receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dima-fast-ft005-model-${{ github.sha }}
          path: backend/lab/metabase/artifacts/ft005-model-followup.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show FT-005 model receipt
        if: always()
        working-directory: backend
        run: |
          test ! -f lab/metabase/artifacts/ft005-model-followup.json || cat lab/metabase/artifacts/ft005-model-followup.json
