name: v2-day6-5-sol-reference-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-sol-reference-once.yml"

jobs:
  sol-reference:
    if: "github.event.head_commit.message == 'eval(v2-day6.5): run Sol reference A-B'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 45
    env:
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bc89b5ea556e345452d611cbd8d95b288739f65
      - name: Verify exact tested code SHA
        run: |
          test "$(git rev-parse HEAD)" = "8bc89b5ea556e345452d611cbd8d95b288739f65"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Provider-free finite protocol sentinel
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_preacceptance_protocol.py tests/test_v2_day6_5_capability_algebra.py
      - name: Sol workers=1 repeated A-B
        working-directory: backend
        shell: bash
        run: |
          mkdir -p lab/reports/day65-sol-ab
          failures=0
          for case_id in d65-dev-063 d65-dev-067 d65-dev-075; do
            for i in 1 2 3 4 5; do
              echo "=== $case_id Sol run $i ==="
              python lab/v2_day6_5_manager_eval.py \
                --require-live \
                --workers 1 \
                --model openai/gpt-5.6-sol \
                --case-id "$case_id" \
                --output "lab/reports/day65-sol-ab/${case_id}-${i}.json" \
                || failures=$((failures+1))
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in sorted(Path("lab/reports/day65-sol-ab").glob("*.json")):
              data=json.loads(path.read_text())
              record=(data.get("records") or [{}])[0]
              rows.append({
                  "file": path.name,
                  "status": data.get("status"),
                  "actual_terminal": record.get("actual_terminal"),
                  "actual_required": record.get("actual_required"),
                  "actual_excluded": record.get("actual_excluded"),
                  "actual_representability": record.get("actual_representability"),
                  "manager_turns": record.get("manager_turns"),
                  "model_calls": record.get("model_calls"),
              })
          print(json.dumps({"tested_git_sha":"8bc89b5ea556e345452d611cbd8d95b288739f65","runs":rows}, ensure_ascii=False))
          PY
          if [[ "$failures" -ne 0 ]]; then
            echo "Sol A-B failures: $failures/15"
            exit 1
          fi
          echo "Sol A-B: 15/15 PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-sol-reference-ab
          path: backend/lab/reports/day65-sol-ab/*.json
          retention-days: 14
