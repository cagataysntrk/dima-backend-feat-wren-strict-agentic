name: v2-day6-5-si-semantic-diagnostic-001-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-si-semantic-diagnostic-001-once.yml"

jobs:
  diagnostic:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run semantic diagnostic 001'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 40
    env:
      DIMA_D65_SI_DIAGNOSTIC: "1"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_V2_REFERENCE_LANGUAGE_PROVIDER: "openrouter"
      DIMA_V2_REFERENCE_LANGUAGE_MODEL: "openai/gpt-5.6-sol"
      DIMA_V2_REFERENCE_LANGUAGE_REASONING: "true"
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: "openrouter"
      DIMA_V2_SEMANTIC_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_V2_SEMANTIC_LINKER_REASONING: "false"
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: "openrouter"
      DIMA_V2_TEMPORAL_NORMALIZER_MODEL: "openai/gpt-5.6-sol"
      DIMA_V2_TEMPORAL_NORMALIZER_REASONING: "true"
      DIMA_V2_STRUCTURED_MAX_TOKENS: "4096"
      DIMA_RULE_FALLBACK: "false"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Prove product semantics unchanged since failed live SHA
        run: |
          git diff --exit-code             4ad8238c4fe8ada02a8a1a79e0682606a6fbfe1a             HEAD             -- backend/app

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run frozen case 001 diagnostic only
        working-directory: backend
        run: pytest -q -s tests/test_v2_day6_5_si_semantic_diagnostic.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-si-semantic-diagnostic-001
          path: backend/lab/reports/v2_day6_5_si_semantic_diagnostic_001.json
          retention-days: 90
          if-no-files-found: error
