name: v2-day6-5-structural-probe10-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-structural-probe10-once.yml"

jobs:
  probe10:
    if: "github.event.head_commit.message == 'eval(v2-day6.5): run Sol structural probe10'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 35
    env:
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f6b629139adccfa3ac5ee5df70750c3c23c64300
      - name: Verify exact frozen SHA
        run: test "$(git rev-parse HEAD)" = "f6b629139adccfa3ac5ee5df70750c3c23c64300"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Provider-free authority sentinel
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_preacceptance_protocol.py \
            tests/test_v2_day6_5_capability_algebra.py
      - name: Sol structural probe10 workers=1
        working-directory: backend
        run: |
          python lab/v2_day6_5_manager_eval.py \
            --cases eval/v2_day6_5_structural_probe10.yaml \
            --require-live \
            --workers 1 \
            --model openai/gpt-5.6-sol \
            --output lab/reports/v2_day6_5_structural_probe10.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-structural-probe10
          path: backend/lab/reports/v2_day6_5_structural_probe10.json
          retention-days: 14
