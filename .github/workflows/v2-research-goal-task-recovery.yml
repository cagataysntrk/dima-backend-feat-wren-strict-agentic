name: v2-research-goal-task-recovery

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - "backend/app/v2/capability_bindings.py"
      - "backend/app/v2/acceptance.py"
      - "backend/app/v2/manager_preacceptance.py"
      - "backend/app/v2/manager_loop.py"
      - "backend/app/v2/research_tasks.py"
      - "backend/tests/test_v2_research_goal_task_quarantine.py"
      - ".github/workflows/v2-research-goal-task-recovery.yml"
  workflow_dispatch:

jobs:
  provider-free-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Goal task quarantine matrix
        working-directory: backend
        run: pytest -q tests/test_v2_research_goal_task_quarantine.py
      - name: Assert recovery stays provider-free
        run: |
          test ! -e backend/lab/reports/v2_day6_5_dev80.json
          test ! -e backend/lab/reports/v2_day6_5_validation50.json
          test ! -e backend/lab/reports/v2_day6_5_hidden50.json
