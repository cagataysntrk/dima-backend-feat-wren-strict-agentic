name: native-engine-official-ui

on:
  push:
    branches:
      - feat/native-engine-official-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-engine-official-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint · typecheck · test · build
        run: bun run turbo run lint typecheck test build
