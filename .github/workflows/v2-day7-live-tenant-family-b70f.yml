name: v2-day7-live-tenant-family-b70f

"on":
  push:
    branches:
      - ops/day7-tenant-family-live-b70f
    paths:
      - ".github/workflows/v2-day7-live-tenant-family-b70f.yml"

jobs:
  tenant-family-live:
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 30
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_DAY7_LIVE_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_DAY7_LIVE_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_DAY7_LIVE_TEMPORAL_MODEL: "openai/gpt-5.6-sol"
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - name: Checkout exact product checkpoint
        uses: actions/checkout@v4
        with:
          ref: b70f0aab209b2353b854463ace582c40bcc2bd98

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend live-eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run provider preflight plus tenant affected-family probe
        working-directory: backend
        run: |
          python lab/v2_day7_manager_live_sol.py \
            --case-id simple-performance \
            --case-id comparison-period \
            --case-id adaptive-material

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day7-live-tenant-family-b70f-${{ github.run_id }}
          path: backend/lab/reports/v2_day7_live_sol.json
          retention-days: 90
