name: dima-metabase-p13c-fixture-probe

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/lab/metabase/p13c/freeze_probe.py"
      - ".github/workflows/dima-metabase-p13c-fixture-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BOYAHANE_SHA: f0c4a6b053ead52ca2eac80002c448323dc34a35

jobs:
  frozen-fixture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p13c-fixture]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: ${{ env.BOYAHANE_SHA }}
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen-fixture reader
        run: python -m pip install "duckdb==1.4.3"

      - name: Inspect actual same-table textual values
        run: |
          set -euo pipefail
          python platform/backend/lab/metabase/p13c/freeze_probe.py \
            --duckdb boyahane/data/boyahane.duckdb \
            --output platform/backend/lab/metabase/p13c/artifacts/P13C_FIXTURE_PROBE.json

      - uses: actions/upload-artifact@v4
        with:
          name: p13c-fixture-probe-${{ github.sha }}
          path: platform/backend/lab/metabase/p13c/artifacts/P13C_FIXTURE_PROBE.json
          if-no-files-found: error
          retention-days: 30
