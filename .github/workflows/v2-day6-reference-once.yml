name: v2-day6-reference-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-reference-once.yml"

jobs:
  frozen16-reference:
    if: "github.event.head_commit.message == 'test(v2-day6): rerun frozen16 reference gate'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 15
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Frozen16 REFERENCE_LANGUAGE gate
        working-directory: backend
        run: |
          mkdir -p lab/reports
          python lab/v2_day6_research_eval.py \
            --require-live \
            --frozen16 \
            --model-role REFERENCE_LANGUAGE \
            --model google/gemini-3.1-pro-preview
      - name: Upload reference measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-day6-reference-frozen16
          path: backend/lab/reports/v2_day6_research_eval.json
          retention-days: 30
          if-no-files-found: warn
