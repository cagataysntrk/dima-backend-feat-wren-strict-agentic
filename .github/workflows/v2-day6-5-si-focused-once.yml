name: v2-day6-5-si-focused-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-si-focused-once.yml"

jobs:
  si-focused:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run SI focused provider-free gate'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile SI boundary
        working-directory: backend
        run: |
          python -m py_compile             app/v2/model_policy.py             app/v2/semantic_retriever.py             app/v2/semantic_linker.py             app/v2/model_policy.py             app/v2/standard_lane.py             app/v2/standard_execution.py             app/v2/standard_builder.py             app/v2/standard_authority.py             app/v2/standard_coverage.py
      - name: Focused provider-free SI gate
        working-directory: backend
        run: |
          pytest -q             tests/test_v2_day6_5_semantic_linker.py             tests/test_v2_day6_5_model_roles.py             tests/test_v2_day6_5_standard_lane.py             tests/test_v2_day6_5_standard_execution.py             tests/test_v2_day6_5_standard_builder.py             tests/test_v2_day6_5_standard_authority.py             tests/test_v2_day6_5_standard_coverage.py

# retry: eval-oracle-fixed

# retry: semantic-surface-completeness-p0

# retry: shared-cross-family-authority

# retry: research-temporal-role-split

# retry: standard-live-assembly-provider-free

      - name: Collect live SI eval modules without paid providers
        working-directory: backend
        run: |
          pytest -q             tests/test_v2_day6_5_si_full_live_standard.py             tests/test_v2_day6_5_si_semantic_diagnostic.py

