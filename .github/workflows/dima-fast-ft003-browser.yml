name: dima-fast-ft003-browser

on:
  push:
    branches:
      - feat/dima-metabase-product-fast-track
    paths:
      - ".github/workflows/dima-fast-ft003-browser.yml"
      - "backend/lab/fast_ft003_browser_server.py"
      - "dima-frontend-demo-master/src/app/fast-poc/**"
      - "dima-frontend-demo-master/src/features/fast-poc/**"
      - "dima-frontend-demo-master/e2e/fast-poc-e2e.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ft003-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_JWT_SECRET: "ft003-browser-access-secret-2026"
      DIMA_JWT_REFRESH_SECRET: "ft003-browser-refresh-secret-2026"
      DIMA_DATABASE_URL: "sqlite:////tmp/ft003-browser-control-plane.db"
      BACKEND_ORIGIN: "http://127.0.0.1:8000"
      NEXT_PUBLIC_FAST_POC_AS_OF_DATE: "2026-09-07"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start pinned Metabase OSS lab
        working-directory: backend/lab/metabase
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose --env-file .env up -d
          ./scripts/health.sh
          set -a
          source .env
          set +a
          python3 scripts/bootstrap.py

      - name: Start Fast-only Ask backend
        working-directory: backend
        env:
          METABASE_PORT: "3300"
          MB_ADMIN_EMAIL: "admin@dima-lab.local"
          MB_ADMIN_PASSWORD: "DimaMetabaseLabAdmin!2026"
        shell: bash
        run: |
          python lab/fast_ft003_browser_server.py >/tmp/dima-fast-backend.log 2>&1 &
          echo $! >/tmp/dima-fast-backend.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/fast/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dima-fast-backend.log
          exit 1

      - name: Mint Dima browser access token
        working-directory: backend
        shell: bash
        run: |
          token="$(python - <<'PY'
          from control_plane.security import create_access_token
          print(create_access_token(
              sub="fast-browser-user",
              tenant_id=None,
              is_superadmin=True,
              roles=["superadmin"],
          ))
          PY
          )"
          echo "DIMA_FAST_E2E_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install frontend
        working-directory: dima-frontend-demo-master
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: dima-frontend-demo-master
        run: pnpm build

      - name: Start isolated frontend
        working-directory: dima-frontend-demo-master
        shell: bash
        run: |
          pnpm exec next start -H 0.0.0.0 -p 3000 >/tmp/dima-fast-frontend.log 2>&1 &
          echo $! >/tmp/dima-fast-frontend.pid
          for i in $(seq 1 40); do
            if curl -fsS -H 'Cookie: dima_refresh=route-probe' http://127.0.0.1:3000/fast-poc >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dima-fast-frontend.log
          exit 1

      - name: Browser proof over real Fast Ask + Metabase
        working-directory: dima-frontend-demo-master
        env:
          FRONTEND_URL: "http://127.0.0.1:3000/fast-poc"
        run: node e2e/fast-poc-e2e.mjs

      - name: Diagnostics
        if: always()
        run: |
          test ! -f /tmp/dima-fast-backend.log || tail -200 /tmp/dima-fast-backend.log
          test ! -f /tmp/dima-fast-frontend.log || tail -200 /tmp/dima-fast-frontend.log

      - name: Teardown
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/dima-fast-frontend.pid || kill "$(cat /tmp/dima-fast-frontend.pid)" || true
          test ! -f /tmp/dima-fast-backend.pid || kill "$(cat /tmp/dima-fast-backend.pid)" || true
          cd backend/lab/metabase
          test -f .env || cp .env.example .env
          docker compose --env-file .env down -v --remove-orphans || true
