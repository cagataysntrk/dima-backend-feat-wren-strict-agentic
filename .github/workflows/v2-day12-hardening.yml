name: v2-day12-hardening

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - "backend/app/v2/execution_receipts.py"
      - "backend/app/v2/models.py"
      - "backend/app/v2/manager_core_adapter.py"
      - "backend/app/v2/manager_executor.py"
      - "backend/app/v2/relationship_adapter.py"
      - "backend/app/v2/standard_execution.py"
      - "backend/app/v2/derived_evidence.py"
      - "backend/tests/test_v2_day12_contract_evidence_telemetry.py"
      - ".github/workflows/v2-day12-hardening.yml"
  workflow_dispatch:

jobs:
  day12-provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Day12 focused contract evidence telemetry
        working-directory: backend
        run: |
          python -m compileall -q app/v2
          pytest -q \
            tests/test_v2_day12_contract_evidence_telemetry.py \
            tests/test_v2_day6_5_standard_execution.py \
            tests/test_v2_day7_research_tool_contract.py \
            tests/test_v2_day7_derived_evidence.py \
            tests/test_v2_day10_product_events.py
      - name: Day12 affected authority regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day10_s_action_availability.py \
            tests/test_v2_day10_directive_lifecycle.py \
            tests/test_v2_day9_report_builder.py
