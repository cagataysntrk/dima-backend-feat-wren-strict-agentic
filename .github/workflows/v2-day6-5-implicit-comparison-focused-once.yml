name: v2-day6-5-implicit-comparison-focused-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-implicit-comparison-focused-once.yml"

jobs:
  implicit-comparison-focused:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run implicit-comparison focused gate'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile temporal/preacceptance boundary
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/temporal_intent.py \
            app/v2/manager_semantics.py \
            app/v2/manager_preacceptance.py \
            tests/test_v2_day6_5_typed_temporal.py
      - name: Focused provider-free gate
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_typed_temporal.py \
            tests/test_v2_day6_5_preacceptance_protocol.py \
            tests/test_v2_day6_5_capability_algebra.py \
            tests/test_v2_day6_5_manager_authority.py
