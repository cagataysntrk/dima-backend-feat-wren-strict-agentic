name: v2-day6-5-luna-same-frozen-control-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-luna-same-frozen-control-once.yml"

jobs:
  luna-control:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run Luna same-frozen provider control'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 45
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile Luna control boundary
        working-directory: backend
        run: |
          python -m py_compile             lab/v2_day6_5_luna_same_frozen_control.py             app/v2/manager_semantics.py             app/v2/semantic_linker.py             app/v2/temporal_intent.py

      - name: Provider-free Luna control gate
        working-directory: backend
        run: |
          pytest -q             tests/test_v2_day6_5_luna_same_frozen_control.py             tests/test_v2_day6_5_j1b_real_flow_harness.py             tests/test_v2_day6_5_j1b_providers.py             tests/test_v2_day6_5_semantic_linker.py             tests/test_v2_day6_5_typed_temporal.py             tests/test_v2_day6_5_no_legacy_semantic_fallback.py

      - name: Workers-1 Luna same-frozen real-flow control
        working-directory: backend
        run: python lab/v2_day6_5_luna_same_frozen_control.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-luna-same-frozen-control
          path: backend/lab/reports/v2_day6_5_luna_same_frozen_control.json
          retention-days: 90
