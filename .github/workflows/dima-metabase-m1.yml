name: dima-metabase-m1

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/**"
      - "!backend/app/v3/research.py"
      - "!backend/app/v3/research_store.py"
      - "!backend/app/v3/research_product.py"
      - "!backend/app/v3/research_native_gateway.py"
      - "!backend/app/v3/research_exploration.py"
      - "!backend/app/v3/claim_lineage.py"
      - "!backend/app/v3/research_manager.py"
      - "!backend/app/v3/substrate/metabase/native_engine.py"
      - "!backend/app/v3/substrate/metabase/native_models.py"
      - "backend/tests/test_v3_m1_*.py"
      - ".github/workflows/dima-metabase-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-contract-and-wren-parity:
    # P14 has its own provider-free seal. This one-off guard prevents the workflow-file
    # correction commit itself from replaying the historical M1 source-isolation gate.
    if: github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[p14-ci]') && !contains(github.event.head_commit.message, '[product-ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce M1 forbidden-file isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="3774484167f1056d89da0e0609246fb4a05057ec"
          changed="$(git diff --name-only "$BASE"...HEAD)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(backend/app/v2/|backend/app/routers/ask_v2\.py$|backend/app/main\.py$|backend/app/config\.py$|WrenAI-main/)'; then
            echo "M1 touched a forbidden source/v2 file"
            exit 1
          fi

      - name: Compile v3 M1 boundary
        working-directory: backend
        run: |
          python -m py_compile             app/v3/semantic_spec.py             app/v3/authority.py             app/v3/analytics_contract.py             app/v3/evidence.py             app/v3/legacy_contract.py             app/v3/substrate/base.py             app/v3/substrate/wren.py

      - name: Provider-free v3 M1 contract gate
        working-directory: backend
        run: pytest -q tests/test_v3_m1_contracts.py tests/test_v3_m1_parity_families.py

      - name: Real Wren v3 parity plus retained v2 sentinels
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_m1_wren_adapter.py             tests/test_v2_day6_5_real_standard_trust_plane.py             tests/test_v2_day6_5_real_trust_plane.py
