name: dima-metabase-m1

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/**"
      - "backend/tests/test_v3_m1_*.py"
      - ".github/workflows/dima-metabase-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-contract-and-wren-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile v3 M1 boundary
        working-directory: backend
        run: |
          python -m py_compile             app/v3/semantic_spec.py             app/v3/authority.py             app/v3/analytics_contract.py             app/v3/evidence.py             app/v3/substrate/base.py             app/v3/substrate/wren.py

      - name: Provider-free v3 M1 contract gate
        working-directory: backend
        run: pytest -q tests/test_v3_m1_contracts.py

      - name: Real Wren v3 parity plus retained v2 sentinels
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_m1_wren_adapter.py             tests/test_v2_day6_5_real_standard_trust_plane.py             tests/test_v2_day6_5_real_trust_plane.py
