name: v2-day6-5-provider-free-seal-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-provider-free-seal-once.yml"

jobs:
  provider-free-seal:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run provider-free seal gate'"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Day 6.5 provider-free seal gate
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/manager_preacceptance.py \
            app/v2/manager_progress.py \
            app/v2/manager_loop.py \
            app/v2/manager_models.py \
            app/v2/manager_lab.py \
            app/v2/manager_core_adapter.py \
            lab/v2_day6_5_manager_eval.py
          pytest -q \
            tests/test_v2_day6_5_preflight.py \
            tests/test_v2_day6_5_holdout_freeze.py \
            tests/test_v2_day6_5_preacceptance_protocol.py \
            tests/test_v2_day6_5_capability_algebra.py \
            tests/test_v2_day6_5_manager_authority.py \
            tests/test_v2_day6_5_correctness_closure.py \
            tests/test_v2_day6_5_adaptive_branch.py \
            tests/test_v2_day6_5_real_trust_plane.py \
            tests/test_v2_day6_5_dev_corpus.py
