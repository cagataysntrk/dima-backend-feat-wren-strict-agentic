name: dima-metabase-p7

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/semantic_import.py"
      - "backend/app/v3/semantic_spec.py"
      - "backend/tests/test_v3_p7_semantic_import.py"
      - "backend/belgeler/metabase/predev/P7_PREDEVELOPMENT_REVIEW.md"
      - "backend/belgeler/metabase/tickets/P7_DIMA_SEMANTIC_SPEC_IMPORTER.md"
      - ".github/workflows/dima-metabase-p7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p7-semantic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require sealed P7 predevelopment review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P7_PREDEVELOPMENT_REVIEW.md"
          test -f "$REVIEW"
          grep -q "Status: \*\*SEALED / P7 IMPORTER IMPLEMENTATION AUTHORIZED\*\*" "$REVIEW"

      - name: Enforce P7 initial-slice isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="213965e3d9bc0e0ad98ecca3f85525e80dfa7db0"
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(backend/app/v2/|backend/app/v3/(authority|analytics_contract|semantic_spec|execution_identity)\.py$|backend/app/v3/substrate/|backend/control_plane/|backend/app/routers/|backend/app/main\.py$|backend/app/config\.py$|backend/demo/|WrenAI-main/)'; then
            echo "P7 initial slice touched a forbidden file"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile P7 importer
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/semantic_import.py \
            tests/test_v3_p7_semantic_import.py

      - name: Focused P7 structured import proof
        working-directory: backend
        run: |
          pytest -q tests/test_v3_p7_semantic_import.py

      - name: Critical inherited provider-free regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_m1_contracts.py \
            tests/test_v3_p6_metabase_execution_adapter.py \
            tests/test_v3_p6_same_snapshot_canary.py
