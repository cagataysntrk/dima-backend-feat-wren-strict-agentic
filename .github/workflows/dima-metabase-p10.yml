name: dima-metabase-p10

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/security_identity.py"
      - "backend/tests/test_v3_p10_security_identity.py"
      - "backend/tests/test_v3_p10b_basic_security_live.py"
      - "backend/belgeler/metabase/predev/P10B1_PREDEVELOPMENT_REVIEW.md"
      - "backend/belgeler/metabase/predev/P10_PREDEVELOPMENT_REVIEW.md"
      - "backend/belgeler/metabase/tickets/P10_TENANT_PRINCIPAL_SECURITY_MAPPING.md"
      - ".github/workflows/dima-metabase-p10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p10a-security-issuer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require sealed P10 predevelopment review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P10_PREDEVELOPMENT_REVIEW.md"
          grep -q "Status: \*\*SEALED / P10A PROVIDER-FREE SECURITY ISSUER CONTRACT AUTHORIZED / PRODUCTION ISSUANCE NOT AUTHORIZED\*\*" "$REVIEW"

      - name: Enforce P10A provider-free isolation
        shell: bash
        run: |
          set -euo pipefail
          P13C_REVIEW="backend/belgeler/metabase/predev/P13C_NATIVE_TEXTUAL_FILTER_AND_CI_ECONOMY_REVIEW.md"
          P13_REVIEW="backend/belgeler/metabase/predev/P13_NATIVE_ENGINE_TRUST_BOUNDARY_REVIEW.md"

          if [ -f "$P13C_REVIEW" ] && grep -q "SEALED / ENGINE ATTESTATION EXTENSION REQUIRED / BOUNDED IMPLEMENTATION AUTHORIZED" "$P13C_REVIEW"; then
            # Supervisor-sealed pre-P13C code baseline. This keeps the cross-owner guard
            # milestone-local instead of re-linting already-certified historical work.
            BASE="b7b28df6adf1acfc552ae2890647bb96ebc24e09"
            changed="$(git diff --name-only "$BASE"...HEAD)"
            printf '%s\n' "$changed"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                backend/app/v3/native_execution.py) ;;
                backend/app/v3/security_identity.py) ;;
                backend/app/v3/native_standard/contracts.py) ;;
                backend/app/v3/native_standard/trust.py) ;;
                backend/tests/test_v3_p13c_native_standard.py) ;;
                .github/workflows/dima-metabase-p13c-provider-free.yml) ;;
                .github/workflows/dima-metabase-p10.yml) ;;
                *)
                  echo "P13C cross-owner regression contains unapproved file: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed"
          elif [ -f backend/app/v3/native_execution.py ] && [ -f "$P13_REVIEW" ] && grep -q "Status: \*\*SEALED / P13A PROVIDER-FREE IMPLEMENTATION AUTHORIZED AFTER GOVERNANCE REPIN\*\*" "$P13_REVIEW"; then
            BASE="a6e272dda1218e449332da358c986a22ea534cbf"
            changed="$(git diff --name-only "$BASE"...HEAD)"
            printf '%s\n' "$changed"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                backend/app/v3/native_execution.py) ;;
                backend/app/v3/security_identity.py) ;;
                backend/app/v3/execution_identity.py) ;;
                backend/tests/test_v3_p13_native_trust.py) ;;
                .github/workflows/dima-metabase-p13a.yml) ;;
                .github/workflows/dima-metabase-p10.yml) ;;
                .github/workflows/dima-metabase-p5.yml) ;;
                .github/workflows/dima-metabase-governance.yml) ;;
                backend/belgeler/metabase/DIMA_METABASE_FAILURE_RECEIPTS.md) ;;
                DIMA-METABASE-DURUM.md) ;;
                *)
                  echo "P13A cross-owner regression contains unapproved file: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed"
          else
            BASE="50a4a6dea5b0d24840e7d3772973350619460cab"
            changed="$(git diff --name-only "$BASE"...HEAD)"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -E '^(backend/app/v2/|backend/app/v3/(authority|analytics_contract|semantic_spec|semantic_import|semantic_equivalence|resource_provisioning|resource_transport|execution_identity)\.py$|backend/app/v3/substrate/|backend/control_plane/|backend/app/routers/|backend/app/main\.py$|backend/app/config\.py$|backend/demo/|WrenAI-main/)'; then
              echo "P10A touched a forbidden file"
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile P10A
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/security_identity.py \
            tests/test_v3_p10_security_identity.py

      - name: Focused P10A security identity proof
        working-directory: backend
        run: pytest -q tests/test_v3_p10_security_identity.py

      - name: P5 identity plus P9B transport regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p5_execution_identity.py \
            tests/test_v3_p5_receipt.py \
            tests/test_v3_p9b_resource_transport.py


  p10b1-basic-security-live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p10b1-live]')
    needs: p10a-security-issuer-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Require sealed P10B1 predevelopment review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P10B1_PREDEVELOPMENT_REVIEW.md"
          grep -q "Status: \*\*SEALED / ONE ISOLATED P10B1 BASIC SECURITY CANARY AUTHORIZED / P10B2 NOT AUTHORIZED\*\*" "$REVIEW"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start pinned isolated Metabase lab
        working-directory: backend/lab/metabase
        run: |
          cp .env.example .env
          docker compose --env-file .env up -d
          ./scripts/health.sh
          set -a
          source .env
          set +a
          python3 scripts/bootstrap.py

      - name: Run exactly one P10B1 permission-revocation canary
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source lab/metabase/.env
          set +a
          export DIMA_METABASE_P10B1_LIVE=1
          pytest -q -s tests/test_v3_p10b_basic_security_live.py

      - name: Teardown isolated lab
        if: always()
        working-directory: backend/lab/metabase
        run: |
          test -f .env || cp .env.example .env
          docker compose --env-file .env down -v --remove-orphans || true
