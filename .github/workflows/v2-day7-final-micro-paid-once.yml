name: v2-day7-final-micro-paid-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day7-final-micro-paid-once.yml"

jobs:
  final-micro:
    if: "github.event.head_commit.message == 'test(v2-day7): run authorized final micro once'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 30
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_DAY7_LIVE_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Provider-free micro contract
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day7_orchestration_ablation.py \
            tests/test_v2_day7_total_manager_budget.py

      - name: Exact zero-cost scope receipt
        working-directory: backend
        run: |
          python lab/v2_day7_orchestration_ablation.py \
            --case-id adaptive-material \
            --case-id stable-no-extra-branch \
            --max-model-calls 16 \
            --dry-run

      - name: Authorized final paid micro
        working-directory: backend
        run: |
          python lab/v2_day7_orchestration_ablation.py \
            --case-id adaptive-material \
            --case-id stable-no-extra-branch \
            --max-model-calls 16 \
            --output lab/reports/v2_day7_orchestration_micro_final.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day7-final-micro-${{ github.run_id }}
          path: backend/lab/reports/v2_day7_orchestration_micro_final.json
          retention-days: 90
