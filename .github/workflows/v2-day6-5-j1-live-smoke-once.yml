name: v2-day6-5-j1-live-smoke-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-j1-live-smoke-once.yml"

jobs:
  j1-live-smoke:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run J1 all-model transport smoke'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 20
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Recheck frozen contract
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_j1_benchmark.py
      - name: Six-cell transport smoke
        working-directory: backend
        shell: bash
        run: |
          set +e
          failed=0
          for track in J1S J1T; do
            for model in               "google/gemini-2.5-flash-lite"               "typesafe/jev-1.13"               "openai/gpt-5.6-sol"
            do
              echo "::group::$track | $model"
              python lab/v2_day6_5_j1_benchmark.py                 --track "$track"                 --model "$model"                 --smoke
              rc=$?
              echo "::endgroup::"
              if [[ $rc -ne 0 ]]; then
                failed=1
              fi
            done
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-j1-live-smoke
          path: backend/lab/reports/v2_day6_5_j1*.json
          retention-days: 90
