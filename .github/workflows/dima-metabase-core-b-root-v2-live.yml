name: dima-metabase-core-b-root-v2-live

on:
  push:
    branches:
      - recovery/core-b-root-v2
    paths:
      - ".github/workflows/dima-metabase-core-b-root-v2-live.yml"
      - "backend/lab/metabase/core_b/intake_live_v2.py"
      - "backend/lab/metabase/core_b/authorizations/core-b-root-v2-*.json"
      - "backend/app/v3/research_intake.py"
      - "backend/app/v3/structured_transport.py"

permissions:
  contents: read

env:
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  DIMA_COGNITION_MODEL: openai/gpt-5.6-luna

jobs:
  intake-only:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[core-b-intake-live-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DIMA_OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify bounded intake-only authorization
        shell: bash
        run: |
          set -euo pipefail
          AUTH="backend/lab/metabase/core_b/authorizations/core-b-root-v2-intake-001.json"
          test -f "$AUTH"
          python - "$AUTH" "$(git rev-parse HEAD^)" <<'PY'
          import json,sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["mode"]=="intake_only_live_v2"
          assert value["candidate_product_sha"]==sys.argv[2]
          assert value["case_id"]=="relationship_explicit_tr"
          assert value["max_model_calls"]==1
          assert value["p17_calls"]==0
          assert value["p18_calls"]==0
          assert value["p19_calls"]==0
          assert value["provider_free_run_id"]==36296604703
          assert value["provider_free_status"]=="GREEN"
          assert value["governance_run_id"]==36296604742
          assert value["governance_status"]=="GREEN"
          PY
          test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Install canonical environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run one relationship intake turn only
        working-directory: backend
        run: |
          mkdir -p eval/core_b/artifacts
          python lab/metabase/core_b/intake_live_v2.py \
            --manifest eval/core_b/askv2_matched_20_cases.json \
            --output eval/core_b/artifacts/intake_live_v2.json \
            --platform-sha "$GITHUB_SHA"

      - name: Verify intake-only closure
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("eval/core_b/artifacts/intake_live_v2.json").read_text())
          assert v["schema_version"]=="core_b_intake_live_v2"
          assert v["status"]=="GREEN"
          assert v["case_id"]=="relationship_explicit_tr"
          assert v["terminal"]=="READY"
          assert v["selected_relationship_id"] in v["catalog_relationship_ids"]
          assert v["compiler_expanded_refs"]
          assert v["model_calls"]==1
          assert v["p17_calls"]==0
          assert v["p18_calls"]==0
          assert v["p19_calls"]==0
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-b-intake-live-v2-${{ github.run_id }}
          path: backend/eval/core_b/artifacts/intake_live_v2.json
          if-no-files-found: warn
          retention-days: 90
