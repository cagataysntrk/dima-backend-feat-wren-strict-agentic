name: v2-day6-5-j1b-provider-free-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-j1b-provider-free-once.yml"

jobs:
  j1b-provider-free:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run J1B provider-free contract gate'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile J1B cognition boundary
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/semantic_linker.py \
            app/v2/temporal_intent.py \
            app/v2/jev_decision_provider.py \
            app/v2/manager_semantics.py \
            app/v2/manager_lab.py
      - name: Focused J1B provider-free gate
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_j1b_providers.py \
            tests/test_v2_day6_5_semantic_linker.py \
            tests/test_v2_day6_5_typed_temporal.py \
            tests/test_v2_day6_5_no_legacy_semantic_fallback.py \
            tests/test_v2_day6_5_correctness_closure.py \
            tests/test_v2_day6_5_adaptive_branch.py \
            tests/test_v2_day6_5_preacceptance_protocol.py
