name: backend-ci

# Faz 0-f: backend/eval/ (golden-set + Wilson-CI precision/coverage regresyon kapısı,
# bkz. backend/tests/test_eval_gate.py) ve ~300 pytest testi (backend/tests/) ÖNCEDEN
# hiçbir CI'a bağlı değildi — yalnız bir geliştirici elle `pytest` çalıştırırsa işliyordu.
# Bu, yol haritasındaki tüm sonraki fazların (Intent-first yönlendirme, Discovery→Promote)
# güvenilir bir regresyon ağına dayanabilmesi için ön koşuldu.
#
# Kurulum sırası backend/Dockerfile'ı BİREBİR izler (wren-core-py'yi wrenai'den ÖNCE
# sabitlemek, pip'in onu sessizce yeni bir sürüme yükseltmesini engeller — Dockerfile'daki
# yorum aynı gerekçeyi anlatır). control-plane DB testte SQLite (control_plane/db.py),
# Wren tarafı repo'daki demo DuckDB projesi — harici servis/Docker gerekmez.

"on":
  # V2 development has its own phase-scoped focused workflows. Running the entire
  # legacy suite on every V2 commit defeats the active rapid-development contract.
  push:
    branches-ignore:
      - "feat/ask-v2-*"
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    # PR branch filtering only sees the BASE branch at trigger level, so skip V2 heads
    # here. Full regression remains explicitly runnable at milestone via workflow_dispatch.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feat/ask-v2-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Dockerfile ile AYNI sıra: Rust motor binding'i ÖNCE sabitlenir, yoksa `wrenai`nin
      # gevşek `wren-core-py` bağımlılığı pip'i daha yeni (test edilmemiş) bir sürüme
      # yükseltebilir. Bu, Faz 0-e'nin (vendoring/pin sağlamlaştırma) düzelteceği kırılgan
      # bir zemin üzerine kuruludur — CI şimdilik PROD'un fiilen kurduğu paketle eşleşir.
      - name: Wren Rust engine binding'i sabitle
        run: pip install "wren-core-py==0.7.2"

      - name: Backend paketini + test bağımlılıklarını kur
        run: pip install -e ".[dev]"

      # tests/test_ask_golden.py Faz 1.5 UZLAŞTIRMASIYLA GERİ EKLENDİ (31 Temmuz 2026):
      # 31 Temmuz'da bu dosya gerçek demo projesine karşı ilk kez koşturulduğunda 66
      # testten 43-48'i ÖNCEDEN (Faz 1 öncesi kodda da AYNEN, git-stash ile doğrulandı)
      # başarısız çıkmıştı — "strict agentic" göçünün strip ettiği konuşmasal-daraltma
      # mekanizmalarının (cube_router.py'de zaten var, hiç bağlanmamış) hiç bağlanmamasına
      # bağlıydı. Faz 1.5 bunları /ask'e bağladı (deterministic_refine/cross_cube_*/route()
      # yeniden-eşleştirme/yetenek-chip'leri/VQR-CubeQuery replay); geri kalan üç test
      # (typo/bulanık-eşleştirme toleransı — henüz inşa edilmemiş, ayrı kapsam) xfail
      # işaretli. Bkz. backend/eval/BASELINE_RECONCILIATION_2026-07-31.md — 129 vakalık
      # golden-set precision'ı %68.2 (keşfedilen gerçek zemin) → %99.1'e, dosya 48 başarısız
      # → 0 başarısız (3 bilinçli xfail) hale geldi.
      - name: Testler (golden-set eval kapısı + regresyon kilitleri + konuşmasal-akış testleri)
        run: pytest -q
