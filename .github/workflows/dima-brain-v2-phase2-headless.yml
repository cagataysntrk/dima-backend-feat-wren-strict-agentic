name: dima-brain-v2-phase2-headless

on:
  push:
    branches:
      - feat/dima-brain-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-headless:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[brain-v2-phase2-provider-free]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dima
          POSTGRES_PASSWORD: dima
          POSTGRES_DB: dima_brain_v2_phase2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dima -d dima_brain_v2_phase2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PHASE2_BASE_SHA: d6a8eddf46a6ec83f0339cf3368df4dbc87350cb
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_BRAIN_V2_TEST_POSTGRES_DSN: "postgresql://dima:dima@127.0.0.1:5432/dima_brain_v2_phase2"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
          submodules: false

      - name: Prove Phase-1 owners and engine remain frozen
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PHASE2_BASE_SHA^{commit}" 2>/dev/null ||             git fetch --no-tags origin "$PHASE2_BASE_SHA"
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" =             "d5c60dc9f37a9ec9c5b0117f178146bbcb8dca88"
          git diff --quiet "$PHASE2_BASE_SHA"..HEAD --             engine/metabase             backend/app/v3/brain_v2             backend/app/v3/research.py             backend/app/v3/research_intake.py             backend/app/v3/research_product.py             backend/app/v3/research_native_gateway.py             backend/app/v3/research_material_coverage.py             backend/app/v3/research_analytical_scope.py             backend/app/v3/substrate/metabase             backend/app/v3/hypothesis_root_cause.py             backend/app/v3/hypothesis_root_cause_v1.py             backend/app/v3/hypothesis_root_cause_provider.py             backend/app/v3/business_relationship_policy.py             backend/app/v3/business_relationship_v1.py             backend/app/v3/report_document.py
          git diff --quiet "$PHASE2_BASE_SHA"..HEAD --             backend/app/v3/brain_v2/owner_adapter.py
          CHANGED="$(git diff --name-only "$PHASE2_BASE_SHA"..HEAD)"
          if printf '%s\n' "$CHANGED" | grep -Eq             '(^|/)(frontend|web|ui)/|(^|/)package\.json$|next\.config|30[_-]?case'; then
            printf '%s\n' "$CHANGED"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: T1-T7 headless Product contracts and composition
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_product_contracts.py             tests/test_v3_product_composition.py             tests/test_v3_product_process_manager.py             tests/test_v3_brain_v2_phase2_headless.py

      - name: Carry-forward T1-T4 owner proofs on unchanged owner seam
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_brain_v2_owner_integration.py::test_real_owner_scope_repair_creates_new_scope_without_stale_evidence_reuse             tests/test_v3_brain_v2_owner_integration.py::test_real_owner_one_pass_uses_one_native_and_zero_p17             tests/test_v3_brain_v2_owner_integration.py::test_real_owner_adaptive_runs_one_typed_followup_without_duplicate_native             tests/test_v3_brain_v2_owner_integration.py::test_real_owner_discovery_forms_governed_candidates_without_extra_native

      - name: T5 observational relationship owner proofs
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p18_business_relationship_policy.py             tests/test_v3_core_b_relationship_root_regression.py

      - name: T6 contextual ReportDocument owner proofs
        working-directory: backend
        run: pytest -q tests/test_v3_p20_report_document.py

      - name: T1-T7 independent metamorphic confidence
        working-directory: backend
        run: pytest -q tests/test_v3_v1_capability_metamorphic.py

      - name: Security and repository hygiene
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_control_plane_security.py             tests/test_repository_hygiene.py

      - name: Phase-2 forbidden-surface audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE             'regex semantic authority|fuzzy semantic matching|benchmark_case_id|retry-until-lucky'             backend/app/v3/product
          ! grep -R -nE             'sqlalchemy|sqlmodel|numpy|pandas|scipy|app\.v3\.substrate\.metabase'             backend/app/v3/product
