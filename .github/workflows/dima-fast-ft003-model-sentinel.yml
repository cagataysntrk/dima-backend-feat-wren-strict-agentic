name: dima-fast-ft003-model-sentinel

on:
  push:
    branches:
      - feat/dima-metabase-product-fast-track
    paths:
      - ".github/workflows/dima-fast-ft003-model-sentinel.yml"
      - "backend/lab/fast_ft003_model_sentinel.py"
      - "backend/app/fast/ask_cognition.py"
      - "backend/app/fast/ask_models.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ft003-model-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DIMA_OPENROUTER_API_KEY
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_LLM_PROVIDER: "openrouter"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_OPENROUTER_MODEL: "google/gemini-2.5-flash-lite"
      DIMA_FAST_ASK_MODEL_RECEIPT: "lab/metabase/artifacts/ft003-model-sentinel.json"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start pinned Metabase OSS lab
        working-directory: backend/lab/metabase
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose --env-file .env up -d
          ./scripts/health.sh
          set -a
          source .env
          set +a
          python3 scripts/bootstrap.py

      - name: Run sequential real-model cognition sentinel
        working-directory: backend
        env:
          METABASE_PORT: "3300"
          MB_ADMIN_EMAIL: "admin@dima-lab.local"
          MB_ADMIN_PASSWORD: "DimaMetabaseLabAdmin!2026"
        run: |
          test -n "$DIMA_OPENROUTER_API_KEY"
          python lab/fast_ft003_model_sentinel.py

      - name: Upload model sentinel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dima-fast-ft003-model-${{ github.sha }}
          path: backend/lab/metabase/artifacts/ft003-model-sentinel.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show model sentinel receipt
        if: always()
        working-directory: backend
        run: |
          test ! -f lab/metabase/artifacts/ft003-model-sentinel.json || cat lab/metabase/artifacts/ft003-model-sentinel.json

      - name: Teardown
        if: always()
        working-directory: backend/lab/metabase
        run: |
          test -f .env || cp .env.example .env
          docker compose --env-file .env down -v --remove-orphans || true
