name: dima-metabase-p13b

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/native_standard/**"
      - "backend/app/v3/native_execution.py"
      - "backend/app/v3/execution_identity.py"
      - "backend/app/v3/evidence.py"
      - "backend/app/v3/substrate/metabase/native_models.py"
      - "backend/app/v3/substrate/metabase/native_engine.py"
      - "backend/app/v3/substrate/metabase/execution_binding.py"
      - "backend/lab/metabase/p13b/px01_live_standard.py"
      - "backend/tests/test_v3_p13b_native_standard.py"
      - "backend/tests/test_v3_p13_native_trust.py"
      - ".github/workflows/dima-metabase-p13b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile P13B trust plane
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/native_standard/contracts.py \
            app/v3/native_standard/trust.py \
            app/v3/native_execution.py \
            app/v3/execution_identity.py \
            app/v3/evidence.py \
            app/v3/substrate/metabase/native_models.py \
            app/v3/substrate/metabase/native_engine.py \
            app/v3/substrate/metabase/execution_binding.py \
            lab/metabase/p13b/px01_live_standard.py \
            tests/test_v3_p13b_native_standard.py \
            tests/test_v3_p12x_c2_native_engine_bridge.py

      - name: PX-01 provider-free observed-vs-expected proof
        working-directory: backend
        run: pytest -q tests/test_v3_p13b_native_standard.py

      - name: Existing P13A and P5/P10 regression
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p13_native_trust.py \
            tests/test_v3_p5_execution_identity.py \
            tests/test_v3_p5_receipt.py \
            tests/test_v3_p10_security_identity.py

      - name: P12X C2 provider-free native bridge regression
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest --noconftest -q tests/test_v3_p12x_c2_native_engine_bridge.py
