name: dima-brain-v2-1-frozen-family-closure

on:
  push:
    branches:
      - feat/dima-brain-v2-1-specification-closure
    paths:
      - ".github/workflows/dima-brain-v2-1-frozen-family-closure.yml"
      - "backend/tests/semantic_spec/frozen_family_closure.py"
      - "backend/tests/semantic_spec/**"
      - "backend/tests/test_v3_analytical_boundary.py"
      - "backend/tests/test_v3_selection_binding.py"
      - "backend/tests/test_v3_v1_analytical_grammar.py"
      - "backend/tests/test_v3_v1_completion_ledger.py"
      - "backend/tests/test_v3_product_composition.py"
      - "backend/tests/test_v3_brain_v2_semantic_conformance.py"
      - "backend/tests/test_v3_brain_v2_semantic_saturation_wave_b.py"
      - "backend/tests/test_v3_brain_v2_adaptive_material_delta.py"
      - "backend/tests/test_v3_brain_v2_completion_policy.py"
      - "backend/tests/test_v3_brain_v2_completion_stateful.py"
      - "backend/tests/test_v3_brain_v2_temporal_roles.py"
      - "backend/tests/test_v3_research_scope_patch.py"
      - "backend/tests/test_v3_research_scope_patch_stateful.py"
      - "backend/tests/test_v3_p18_business_relationship_policy.py"
      - "backend/tests/test_v3_p19_hypothesis_root_cause.py"
      - "backend/tests/test_v3_p20_report_document.py"
      - "backend/tests/test_v3_brain_v2_owner_integration.py"
      - "backend/app/v3/**"
      - "engine/metabase"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-family-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Exact certified engine gitlink
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "a54a13be978985b58aa53b3ca70a6a51ecb3de3b"

      - name: Frozen seeds are test-only
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'F02_H|F03_H|F04_M|F06_M|F06_H|F07_M|F10_S|F10_M|F10_H' backend/app/v3; then
            echo "Frozen benchmark seed identity leaked into production runtime."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install provider-free test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Emit frozen-family adjudication artifact
        working-directory: backend
        run: |
          mkdir -p artifacts
          python -m tests.semantic_spec.frozen_family_closure > artifacts/frozen-family-closure.json

      - name: Ranking completion dependency and adaptive closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_analytical_boundary.py \
            tests/test_v3_selection_binding.py \
            tests/test_v3_v1_analytical_grammar.py \
            tests/test_v3_v1_completion_ledger.py \
            tests/test_v3_product_composition.py \
            tests/test_v3_brain_v2_semantic_conformance.py \
            tests/test_v3_brain_v2_semantic_saturation_wave_b.py \
            tests/test_v3_brain_v2_adaptive_material_delta.py \
            tests/test_v3_brain_v2_completion_policy.py \
            tests/test_v3_brain_v2_completion_stateful.py \
            tests/test_v3_brain_v2_owner_integration.py::test_real_owner_adaptive_runs_one_typed_followup_without_duplicate_native

      - name: Temporal and multi-turn scope closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_brain_v2_temporal_roles.py \
            tests/test_v3_research_scope_patch.py \
            tests/test_v3_research_scope_patch_stateful.py

      - name: P18 P19 P20 synthesis ceilings
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p18_business_relationship_policy.py \
            tests/test_v3_p19_hypothesis_root_cause.py \
            tests/test_v3_p20_report_document.py

      - name: Upload frozen-family receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-family-closure
          path: backend/artifacts/frozen-family-closure.json
          if-no-files-found: error
