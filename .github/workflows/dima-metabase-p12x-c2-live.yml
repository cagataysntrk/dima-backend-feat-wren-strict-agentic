name: dima-metabase-p12x-c2-live

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/lab/metabase/p13b/px01_live_standard.py"
      - ".github/workflows/dima-metabase-p12x-c2-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  ENGINE_SHA: 05fccf3595623a41886cb2a7a89192636580324e
  RUNTIME_SOURCE_SHA: 9fb21da0177935aff5882472577c8e14a67ebd65
  UPSTREAM_BASE_SHA: 2ba2485c78d7e00a9a25f82c00fc201da71590c4
  BOYAHANE_SHA: f0c4a6b053ead52ca2eac80002c448323dc34a35
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  MB_ADMIN_EMAIL: admin@c2.local
  MB_ADMIN_PASSWORD: DimaC2Admin2026!
  MB_RESTRICTED_EMAIL: restricted@c2.local
  MB_RESTRICTED_PASSWORD: DimaC2Restricted2026!
  MB_RESTRICTED_GROUP: Dima C2 Restricted

jobs:
  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: DIMA_OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: UpcyTech/dima-metabase-engine
          ref: ${{ env.ENGINE_SHA }}
          path: engine

      - uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: ${{ env.BOYAHANE_SHA }}
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live proof dependencies
        run: pip install "httpx>=0.27" "pydantic>=2" "duckdb==1.4.3" "psycopg[binary]==3.3.3"

      - name: Require model credential
        run: test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Freeze independent oracle
        working-directory: platform/backend
        env:
          BOYAHANE_DUCKDB: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          P12X_OUT: lab/metabase/p12x/c2-artifacts
        run: python lab/metabase/p12x/build_oracle.py

      - name: Resolve exact fork runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/upcytech/dima-metabase-engine@sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b"
          if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1 && docker pull "$image"; then
            echo "FORK_IMAGE=$image" >> "$GITHUB_ENV"
            echo "runtime_source=$RUNTIME_SOURCE_SHA" >> "$GITHUB_ENV"
          else
            docker build -f engine/.dima/docker/Dockerfile.c0 \
              --build-arg MB_EDITION=oss --build-arg VERSION=0.63.18-dima.0 \
              -t dima-engine-c2:local engine
            echo "FORK_IMAGE=dima-engine-c2:local" >> "$GITHUB_ENV"
            echo "runtime_source=$ENGINE_SHA" >> "$GITHUB_ENV"
          fi

      - name: Start databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-c2
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-c2 --network-alias analytics-db -p 127.0.0.1:55442:5432 \
            -e POSTGRES_DB=boyahane -e POSTGRES_USER=boyahane_owner -e POSTGRES_PASSWORD=boyahane-owner-c2 "$PG"
          docker run -d --name app-db --network dima-c2 --network-alias app-db \
            -e POSTGRES_DB=metabase_c2 -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD=metabase-app-c2 "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Import Boyahane
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55442"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: boyahane-owner-c2
          BOYAHANE_READONLY_PASSWORD: boyahane-readonly-c2
        run: python boyahane/importer/import_boyahane.py

      - name: Start fork runtime
        shell: bash
        run: |
          docker run -d --name mb-c2 --network dima-c2 -p 127.0.0.1:3312:3000 \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_c2 -e MB_DB_USER=metabase_app -e MB_DB_PASS=metabase-app-c2 \
            -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true -e MB_AGENT_API_ENABLED=true \
            -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY" \
            -e MB_LLM_METABOT_PROVIDER=openrouter/openai/gpt-5.6-luna "$FORK_IMAGE"

      - name: Bootstrap restricted principal
        working-directory: platform/backend
        env:
          METABASE_URL: http://127.0.0.1:3312
          MB_SITE_NAME: Dima C2
          ANALYTICS_DB_NAME: boyahane
          ANALYTICS_DB_USER: metabase_boyahane
          ANALYTICS_DB_PASSWORD: boyahane-readonly-c2
          PGPASSWORD: boyahane-owner-c2
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/scripts/bootstrap.py

      - name: Run live bridge canary
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p12x/c2_live_canary.py \
            --base-url http://127.0.0.1:3312 \
            --email "$MB_RESTRICTED_EMAIL" --password "$MB_RESTRICTED_PASSWORD" \
            --oracle lab/metabase/p12x/c2-artifacts/oracle_v1.json \
            --engine-sha "$runtime_source" --workspace-gitlink-sha "$ENGINE_SHA" \
            --runtime-image-ref "$FORK_IMAGE" --upstream-base-sha "$UPSTREAM_BASE_SHA" \
            --output lab/metabase/p12x/c2-artifacts/C2_LIVE_REPORT.json

      - name: Run bounded direct-native vs bridge parity
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p12x/c2_run_parity.py \
            --base-url http://127.0.0.1:3312 \
            --email "$MB_RESTRICTED_EMAIL" --password "$MB_RESTRICTED_PASSWORD" \
            --oracle lab/metabase/p12x/c2-artifacts/oracle_v1.json \
            --engine-sha "$runtime_source" --upstream-base-sha "$UPSTREAM_BASE_SHA" \
            --output-root lab/metabase/p12x/c2-artifacts/parity

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12x-c2-live-${{ github.sha }}
          path: platform/backend/lab/metabase/p12x/c2-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Logs
        if: failure()
        run: docker logs --tail=600 mb-c2 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f mb-c2 analytics-db app-db 2>/dev/null || true
          docker network rm dima-c2 2>/dev/null || true

  p13b-px01-live:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[p13b-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DIMA_OPENROUTER_API_KEY
    env:
      ENGINE_SHA: 05fccf3595623a41886cb2a7a89192636580324e
      UPSTREAM_BASE_SHA: 2ba2485c78d7e00a9a25f82c00fc201da71590c4
      RUNTIME_TAG: v0.63.18-dima.2
      MODEL_IDENTIFIER: openrouter/openai/gpt-5.6-luna
      LIVE_ATTEMPT_ID: p13b-px01-corrected-dima2-1
      MB_ADMIN_EMAIL: admin@p13b.local
      MB_ADMIN_PASSWORD: DimaP13BAdmin2026!
      MB_RESTRICTED_EMAIL: restricted@p13b.local
      MB_RESTRICTED_PASSWORD: DimaP13BRestricted2026!
      MB_RESTRICTED_GROUP: Dima P13B Restricted
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: UpcyTech/dima-metabase-engine
          ref: ${{ env.ENGINE_SHA }}
          path: engine

      - uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: ${{ env.BOYAHANE_SHA }}
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install P13B live dependencies
        working-directory: platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install "duckdb==1.4.3" "psycopg[binary]==3.3.3"

      - name: Require Luna credential
        run: test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Freeze independent PX-01 oracle
        working-directory: platform/backend
        env:
          BOYAHANE_DUCKDB: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          P12X_OUT: lab/metabase/p13b/artifacts
        run: python lab/metabase/p12x/build_oracle.py

      - name: Build exact certified engine
        shell: bash
        run: |
          set -euo pipefail
          BUILD_IDENTITY="github-actions:$GITHUB_RUN_ID:$ENGINE_SHA"
          docker build \
            -f engine/.dima/docker/Dockerfile.c0 \
            --build-arg MB_EDITION=oss \
            --build-arg VERSION="$RUNTIME_TAG" \
            --build-arg DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine \
            --build-arg DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA" \
            --build-arg DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA" \
            --build-arg DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG" \
            --build-arg DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY" \
            -t dima-engine-p13b-live:"$ENGINE_SHA" engine
          RUNTIME_IMAGE_DIGEST="$(docker image inspect -f '{{.Id}}' dima-engine-p13b-live:"$ENGINE_SHA")"
          case "$RUNTIME_IMAGE_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          echo "BUILD_IDENTITY=$BUILD_IDENTITY" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Start databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-p13b
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-p13b --network-alias analytics-db -p 127.0.0.1:55443:5432 \
            -e POSTGRES_DB=boyahane -e POSTGRES_USER=boyahane_owner -e POSTGRES_PASSWORD=boyahane-owner-p13b "$PG"
          docker run -d --name app-db --network dima-p13b --network-alias app-db \
            -e POSTGRES_DB=metabase_p13b -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD=metabase-app-p13b "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Import frozen Boyahane fixture
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55443"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: boyahane-owner-p13b
          BOYAHANE_READONLY_PASSWORD: boyahane-readonly-p13b
        run: python boyahane/importer/import_boyahane.py

      - name: Start exact single-instance native engine
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-p13b --network dima-p13b -p 127.0.0.1:3314:3000 \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_p13b -e MB_DB_USER=metabase_app -e MB_DB_PASS=metabase-app-p13b \
            -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true \
            -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY" \
            -e MB_LLM_METABOT_PROVIDER="$MODEL_IDENTIFIER" \
            -e DIMA_ENGINE_IMAGE_IDENTITY="$RUNTIME_IMAGE_DIGEST" \
            dima-engine-p13b-live:"$ENGINE_SHA"

      - name: Bootstrap restricted analytical principal
        working-directory: platform/backend
        env:
          METABASE_URL: http://127.0.0.1:3314
          MB_SITE_NAME: Dima P13B
          ANALYTICS_DB_NAME: boyahane
          ANALYTICS_DB_USER: metabase_boyahane
          ANALYTICS_DB_PASSWORD: boyahane-readonly-p13b
          PGPASSWORD: boyahane-owner-p13b
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/scripts/bootstrap.py

      - name: Run one Luna P13B-3 PX-01 turn
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13b/px01_live_standard.py \
            --base-url http://127.0.0.1:3314 \
            --email "$MB_RESTRICTED_EMAIL" \
            --password "$MB_RESTRICTED_PASSWORD" \
            --oracle lab/metabase/p13b/artifacts/oracle_v1.json \
            --output lab/metabase/p13b/artifacts/P13B_PX01_LIVE_STANDARD.json \
            --engine-sha "$ENGINE_SHA" \
            --upstream-sha "$UPSTREAM_BASE_SHA" \
            --runtime-tag "$RUNTIME_TAG" \
            --runtime-image-digest "$RUNTIME_IMAGE_DIGEST" \
            --build-identity "$BUILD_IDENTITY" \
            --image-identity "$RUNTIME_IMAGE_DIGEST" \
            --model-identifier "$MODEL_IDENTIFIER" \
            --platform-sha "$GITHUB_SHA" \
            --live-attempt-id "$LIVE_ATTEMPT_ID"

      - name: Upload P13B-3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13b-px01-live-${{ github.sha }}
          path: platform/backend/lab/metabase/p13b/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=800 mb-p13b || true

      - name: Teardown P13B
        if: always()
        run: |
          docker rm -f mb-p13b analytics-db app-db 2>/dev/null || true
          docker network rm dima-p13b 2>/dev/null || true

