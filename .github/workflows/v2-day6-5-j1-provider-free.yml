name: v2-day6-5-j1-provider-free

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - backend/eval/v2_day6_5_j1s_frozen.json
      - backend/eval/v2_day6_5_j1t_frozen.json
      - backend/eval/v2_day6_5_j1_freeze_manifest.json
      - backend/lab/v2_day6_5_j1_benchmark.py
      - backend/tests/test_v2_day6_5_j1_benchmark.py
      - .github/workflows/v2-day6-5-j1-provider-free.yml
  workflow_dispatch:

jobs:
  provider-free-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install focused backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile isolated J1 harness
        working-directory: backend
        run: python -m py_compile lab/v2_day6_5_j1_benchmark.py
      - name: Frozen corpus and transport contract
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_j1_benchmark.py
