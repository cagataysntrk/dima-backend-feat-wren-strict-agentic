name: v2-day6-5-wren-research-sentinels-once

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - ".github/workflows/v2-day6-5-wren-research-sentinels-once.yml"

jobs:
  sentinels:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run Wren and Research sentinels'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: "8dfde62d46d1418f05cce3ed44c26a8025b3b20e"
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - name: Capture identity
        shell: bash
        run: |
          echo "workflow_source_sha=$GITHUB_SHA" | tee /tmp/day65_wren_research_receipt.txt
          echo "requested_code_sha=$TARGET_SHA" | tee -a /tmp/day65_wren_research_receipt.txt

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify exact tested SHA
        shell: bash
        run: |
          tested="$(git rev-parse HEAD)"
          echo "tested_code_sha=$tested" | tee -a /tmp/day65_wren_research_receipt.txt
          test "$tested" = "$TARGET_SHA"

      - name: Compile sentinel boundary
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/manager_core_adapter.py \
            app/v2/manager_executor.py \
            app/v2/manager_runtime.py \
            tests/test_v2_day6_5_real_trust_plane.py \
            tests/test_v2_day6_5_adaptive_branch.py

      - name: Real Wren Standard vertical + Research sentinel
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_real_trust_plane.py \
            tests/test_v2_day6_5_adaptive_branch.py

      - name: Upload sentinel receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-wren-research-sentinels
          path: /tmp/day65_wren_research_receipt.txt
          retention-days: 30
