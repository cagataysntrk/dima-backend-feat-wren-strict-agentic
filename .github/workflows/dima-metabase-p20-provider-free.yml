# DMP-DEC-0056 minimal provider-free ReportDocument authority
name: dima-metabase-p20-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/report_document.py"
      - "backend/control_plane/models.py"
      - "backend/migrations/versions/f7c4a2d8b930_p20_report_document.py"
      - "backend/tests/test_v3_p20_report_document.py"
      - "backend/belgeler/metabase/predev/P20_REPORTDOCUMENT_PREDEVELOPMENT_REVIEW.md"
      - "backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
      - "DIMA-METABASE-DURUM.md"
      - "DIMA-METABASE-NEW-DEVELOPER-HANDOFF.md"
      - "backend/belgeler/metabase/DIMA_METABASE_CURRENT_PRODUCT_PLAN.md"
      - ".github/workflows/dima-metabase-p20-provider-free.yml"
      - ".github/workflows/dima-metabase-governance.yml"
      - ".github/workflows/dima-metabase-m1.yml"
      - ".github/workflows/dima-metabase-p19-provider-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p20-provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Enforce DMP-DEC-0056 minimal P20 authority
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="backend/belgeler/metabase/predev/P20_REPORTDOCUMENT_PREDEVELOPMENT_REVIEW.md"
          DECISIONS="backend/belgeler/metabase/DIMA_METABASE_DECISION_RECEIPTS.md"
          grep -q "DMP-DEC-0056" "$REVIEW"
          grep -q "## 21. DMP-DEC-0056 implementation authorization" "$REVIEW"
          grep -Eq "MINIMAL IMPLEMENTATION AUTHORIZED|SEALED / DMP-DEC-0056 / PROVIDER-FREE GREEN" "$REVIEW"
          grep -q "DMP-DEC-0056 — MINIMAL REPORTDOCUMENT / PUBLICATION LEGALITY AUTHORITY" "$DECISIONS"
          grep -q "USER_MUST accounting" "$DECISIONS"
          grep -q "P20 != analytics" "$DECISIONS"
      - name: Compile P20 authority slice
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile app/v3/report_document.py control_plane/models.py migrations/versions/f7c4a2d8b930_p20_report_document.py tests/test_v3_p20_report_document.py
      - name: Verify single Alembic head
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic heads > /tmp/p20-heads.txt
          test "$(grep -Ec '^[0-9a-f]+' /tmp/p20-heads.txt)" -eq 1
          grep -q '^f7c4a2d8b930' /tmp/p20-heads.txt
      - name: Guard P20 as publication legality only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path("backend/app/v3/report_document.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module or "")
          forbidden = (
              "app.v3.substrate.metabase",
              "app.v3.research_native_gateway",
              "app.v3.research_followup",
              "app.v3.native_execution",
              "app.wren",
              "numpy",
              "pandas",
              "scipy",
              "statistics",
          )
          bad = sorted(name for name in imports if name.startswith(forbidden))
          assert not bad, bad
          for symbol in (
              "NativeEngineBridge",
              "MetabaseAgentClient",
              "execute_dataset",
              "explore_adhoc",
              "attest_native_query",
              "execute_native_query",
              "wren_service",
              "DimaQueryReceipt(",
              "EvidenceArtifact(",
              "ResearchClaimRecord(",
              "RootCauseAssessmentRecord(",
              ".assess(",
          ):
              assert symbol not in source, symbol
          models = Path("backend/control_plane/models.py")
          model_tree = ast.parse(models.read_text(encoding="utf-8"))
          tables = set()
          for node in model_tree.body:
              if not isinstance(node, ast.ClassDef):
                  continue
              for item in node.body:
                  if (
                      isinstance(item, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == "__tablename__" for target in item.targets)
                      and isinstance(item.value, ast.Constant)
                      and isinstance(item.value.value, str)
                      and item.value.value.startswith("p20_")
                  ):
                      tables.add(item.value.value)
          assert tables == {"p20_report_document"}, tables
          PY
      - name: P20 focused provider-free proof
        working-directory: backend
        run: pytest -q tests/test_v3_p20_report_document.py
      - name: P19 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p19_hypothesis_root_cause.py tests/test_v3_p19_provider.py tests/test_v3_p19_autonomous_eval.py
      - name: P18 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p18_business_relationship_policy.py
      - name: P17 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p17_authorization_transport.py tests/test_v3_p17_autonomous_provider_schema.py tests/test_v3_p17_autonomous_manager_eval.py tests/test_v3_p17_research_manager.py
      - name: P16 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p16_claim_lineage.py
      - name: P15 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p15_native_exploration.py
      - name: P14 remains GREEN
        working-directory: backend
        run: pytest -q tests/test_v3_p14_product.py tests/test_v3_p14_native_gateway.py
      - name: Verify frozen engine identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"
      - name: Verify P20 is provider-free
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'openrouter|openai/gpt|Luna|Sol|C1' backend/app/v3/report_document.py
          ! grep -nE 'docker[[:space:]]+(build|buildx[[:space:]]+build)' .github/workflows/dima-metabase-p20-provider-free.yml
