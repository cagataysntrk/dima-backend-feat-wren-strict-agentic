name: v2-day2-semantic-resolver

"on":
  workflow_dispatch:

concurrency:
  group: v2-day2-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  day2-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend + dev dependencies
        run: pip install -e ".[dev]"

      - name: Focused Day 2 contracts only
        run: pytest -q tests/test_v2_day2.py
