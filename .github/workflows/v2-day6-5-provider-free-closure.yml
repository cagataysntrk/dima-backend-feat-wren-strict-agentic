name: v2-day6-5-provider-free-closure

"on":
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact semantic-code SHA to certify"
        required: true
        default: "c9629d9029db360e86a8592e12da646a2afc0621"
jobs:
  provider-free-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - name: Capture workflow-source identity
        shell: bash
        run: |
          echo "workflow_source_sha=$GITHUB_SHA" | tee /tmp/day65_recert_receipt.txt
          echo "requested_code_sha=$TARGET_SHA" | tee -a /tmp/day65_recert_receipt.txt
          echo "event_name=$GITHUB_EVENT_NAME" | tee -a /tmp/day65_recert_receipt.txt
          echo "workflow_ref=$GITHUB_WORKFLOW_REF" | tee -a /tmp/day65_recert_receipt.txt

      - name: Checkout exact semantic-code SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile cognition-authority boundary
        working-directory: backend
        run: |
          python -m py_compile \
            app/v2/semantic_linker.py \
            app/v2/temporal_intent.py \
            app/v2/manager_semantics.py \
            app/v2/manager_preacceptance.py \
            app/v2/acceptance.py \
            app/v2/manager_loop.py \
            app/v2/manager_lab.py \
            lab/v2_day6_5_manager_eval.py

      - name: Focused provider-free closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day6_5_semantic_linker.py \
            tests/test_v2_day6_5_typed_temporal.py \
            tests/test_v2_day6_5_preacceptance_protocol.py \
            tests/test_v2_day6_5_capability_algebra.py \
            tests/test_v2_day6_5_manager_authority.py \
            tests/test_v2_day6_5_correctness_closure.py \
            tests/test_v2_day6_5_adaptive_branch.py \
            tests/test_v2_day6_5_real_trust_plane.py \
            tests/test_v2_day6_5_transport_budget.py \
            tests/test_v2_day6_5_dev_corpus.py

      - name: Certification identity
        shell: bash
        run: |
          tested_sha="$(git rev-parse HEAD)"
          echo "tested_code_sha=$tested_sha" | tee -a /tmp/day65_recert_receipt.txt
          echo "requested_code_sha=$TARGET_SHA"
          echo "tested_code_sha=$tested_sha"
          test "$tested_sha" = "$TARGET_SHA"

      - name: Upload recertification receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-provider-free-recert-receipt
          path: /tmp/day65_recert_receipt.txt
          retention-days: 90
