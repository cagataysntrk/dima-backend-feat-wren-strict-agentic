name: dima-metabase-p13b-semantic-availability

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/lab/metabase/p13b/px01_live_standard.py"
      - "backend/lab/metabase/p13b/px01_semantic_availability.py"
      - "backend/tests/test_v3_p13b_semantic_availability.py"
      - ".github/workflows/dima-metabase-p13b-semantic-availability.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ENGINE_SHA: 10960f7c36bb84425b1794b557b78211c14d7f5f
  UPSTREAM_BASE_SHA: 2ba2485c78d7e00a9a25f82c00fc201da71590c4
  BOYAHANE_SHA: f0c4a6b053ead52ca2eac80002c448323dc34a35
  RUNTIME_TAG: v0.63.18-dima.3
  MB_ADMIN_EMAIL: admin@p13b-semantic.local
  MB_ADMIN_PASSWORD: DimaP13BSemanticAdmin2026!
  MB_RESTRICTED_EMAIL: restricted@p13b-semantic.local
  MB_RESTRICTED_PASSWORD: DimaP13BSemanticRestricted2026!
  MB_RESTRICTED_GROUP: Dima P13B Semantic Restricted

jobs:
  provider-free-native-semantic:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[p13b-semantic]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: UpcyTech/dima-metabase-engine
          ref: ${{ env.ENGINE_SHA }}
          path: engine

      - uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: ${{ env.BOYAHANE_SHA }}
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provider-free proof dependencies
        working-directory: platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install "duckdb==1.4.3" "psycopg[binary]==3.3.3"

      - name: Build exact certified engine
        shell: bash
        run: |
          set -euo pipefail
          BUILD_IDENTITY="github-actions:$GITHUB_RUN_ID:$ENGINE_SHA"
          docker build \
            -f engine/.dima/docker/Dockerfile.c0 \
            --build-arg MB_EDITION=oss \
            --build-arg VERSION="$RUNTIME_TAG" \
            --build-arg DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine \
            --build-arg DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA" \
            --build-arg DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA" \
            --build-arg DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG" \
            --build-arg DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY" \
            -t dima-engine-p13b-semantic:"$ENGINE_SHA" engine
          RUNTIME_IMAGE_DIGEST="$(docker image inspect -f '{{.Id}}' dima-engine-p13b-semantic:"$ENGINE_SHA")"
          case "$RUNTIME_IMAGE_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          echo "BUILD_IDENTITY=$BUILD_IDENTITY" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Start databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-p13b-semantic
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-p13b-semantic --network-alias analytics-db -p 127.0.0.1:55444:5432 \
            -e POSTGRES_DB=boyahane -e POSTGRES_USER=boyahane_owner -e POSTGRES_PASSWORD=boyahane-owner-semantic "$PG"
          docker run -d --name app-db --network dima-p13b-semantic --network-alias app-db \
            -e POSTGRES_DB=metabase_semantic -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD=metabase-app-semantic "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Import frozen Boyahane fixture
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55444"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: boyahane-owner-semantic
          BOYAHANE_READONLY_PASSWORD: boyahane-readonly-semantic
        run: python boyahane/importer/import_boyahane.py

      - name: Start exact single-instance native engine without model credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-p13b-semantic --network dima-p13b-semantic -p 127.0.0.1:3315:3000 \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_semantic -e MB_DB_USER=metabase_app -e MB_DB_PASS=metabase-app-semantic \
            -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true -e MB_AGENT_API_ENABLED=true \
            -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e DIMA_ENGINE_IMAGE_IDENTITY="$RUNTIME_IMAGE_DIGEST" \
            dima-engine-p13b-semantic:"$ENGINE_SHA"

      - name: Bootstrap restricted analytical principal
        working-directory: platform/backend
        env:
          METABASE_URL: http://127.0.0.1:3315
          MB_SITE_NAME: Dima P13B Semantic
          ANALYTICS_DB_NAME: boyahane
          ANALYTICS_DB_USER: metabase_boyahane
          ANALYTICS_DB_PASSWORD: boyahane-readonly-semantic
          PGPASSWORD: boyahane-owner-semantic
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/scripts/bootstrap.py

      - name: Prove P9/P9B native semantic availability under restricted principal
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13b/px01_semantic_availability.py \
            --base-url http://127.0.0.1:3315 \
            --admin-email "$MB_ADMIN_EMAIL" \
            --admin-password "$MB_ADMIN_PASSWORD" \
            --restricted-email "$MB_RESTRICTED_EMAIL" \
            --restricted-password "$MB_RESTRICTED_PASSWORD" \
            --runtime-tag "$RUNTIME_TAG" \
            --runtime-image-digest "$RUNTIME_IMAGE_DIGEST" \
            --engine-sha "$ENGINE_SHA" \
            --platform-sha "$GITHUB_SHA" \
            --output lab/metabase/p13b/artifacts/P13B_PX01_SEMANTIC_AVAILABILITY.json

      - name: Upload provider-free semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13b-semantic-availability-${{ github.sha }}
          path: platform/backend/lab/metabase/p13b/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=600 mb-p13b-semantic || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f mb-p13b-semantic analytics-db app-db 2>/dev/null || true
          docker network rm dima-p13b-semantic 2>/dev/null || true
