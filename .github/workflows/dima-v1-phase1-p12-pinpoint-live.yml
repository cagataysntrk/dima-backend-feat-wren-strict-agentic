name: dima-v1-phase1-p12-pinpoint-live

# DMP-DEC-0073B: exactly two user-authorized paid probes.
# Manual dispatch only. No push/repository/authorization-file trigger.
on:
  workflow_dispatch:
    inputs:
      confirm_exact_two_pinpoint_probes:
        description: "Type YES to run exactly F02_M + F07_M under the fixed 20-unit ceiling"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  contents: read
  packages: read

env:
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  METABOT_MODEL_IDENTIFIER: openrouter/openai/gpt-5.6-luna
  DIMA_COGNITION_MODEL: openai/gpt-5.6-luna
  MB_ADMIN_EMAIL: admin@round2.local
  MB_RESTRICTED_EMAIL: restricted@round2.local
  MB_RESTRICTED_GROUP: Dima Round2 Restricted

concurrency:
  group: dima-v1-phase1-p12-pinpoint-live
  cancel-in-progress: false

jobs:
  pinpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DIMA_OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Resolve exact pinpoint authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ inputs.confirm_exact_two_pinpoint_probes }}" = "YES"
          echo "candidate_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "max_units=20" >> "$GITHUB_OUTPUT"
          echo "r1_case=F02_M" >> "$GITHUB_OUTPUT"
          echo "r3_case=F07_M" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provider-free pinpoint preflight
        working-directory: backend
        run: |
          python -m py_compile lab/metabase/core_b/round2_feature_benchmark.py
          python -m py_compile lab/metabase/core_b/runtime/seed_round2_fixture.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("eval/dima_neutral_feature_benchmark_round2.json").read_text())
          f=json.loads(Path("eval/round2_neutral_machine_fixture.json").read_text())
          assert m["case_count"] == 30
          assert len(m["cases"]) == 30
          by_id={x["id"]:x for x in m["cases"]}
          assert by_id["F02_M"]["max_model_calls"] == 8
          assert by_id["F07_M"]["max_model_calls"] == 12
          assert set(("F02_M","F07_M")).issubset(by_id)
          assert f["schema_version"] == "round2_neutral_machine_fixture_v1"
          assert len(f["rows"]) == 40
          PY

      - name: Derive ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          S="${GITHUB_SHA:0:12}"
          {
            echo "MB_ADMIN_PASSWORD=Adm-${S}-Aa1!"
            echo "MB_RESTRICTED_PASSWORD=Res-${S}-Aa1!"
            echo "PG_OWNER_PASSWORD=PgO-${S}-Aa1!"
            echo "CORE_B_READONLY_PASSWORD=PgR-${S}-Aa1!"
            echo "MB_APP_PASSWORD=MbA-${S}-Aa1!"
          } >> "$GITHUB_ENV"

      - name: Load exact certified engine runtime lock
        shell: bash
        run: |
          set -euo pipefail
          GITLINK_SHA="$(git ls-tree HEAD engine/metabase | awk '{print $3}')"
          python backend/lab/metabase/core_b/runtime/engine_runtime_lock.py \
            --lock backend/lab/metabase/core_b/runtime/engine_runtime_lock.json \
            --gitlink-sha "$GITLINK_SHA" \
            --github-env "$GITHUB_ENV"

      - name: Pull exact certified dima.6 digest
        shell: bash
        run: |
          set -euo pipefail
          test "$ENGINE_SHA" = "cbe313af9ac2d5960f662068e433d328d896fb06"
          test "$CERTIFICATION_RUN_ID" = "36042062775"
          test "$RUNTIME_TAG" = "v0.63.18-dima.6"
          docker pull "$IMMUTABLE_IMAGE_REF"
          docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$IMMUTABLE_IMAGE_REF" | grep -Fx "$IMMUTABLE_IMAGE_REF"

      - name: Install benchmark environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "psycopg[binary]==3.3.3"

      - name: Import-check benchmark harness
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -c "import lab.metabase.core_b.round2_feature_benchmark"

      - name: Guard cognition provider secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Start neutral databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-round2
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-round2 --network-alias analytics-db -p 127.0.0.1:55461:5432 \
            -e POSTGRES_DB=round2_neutral -e POSTGRES_USER=round2_owner -e POSTGRES_PASSWORD="$PG_OWNER_PASSWORD" "$PG"
          docker run -d --name app-db --network dima-round2 --network-alias app-db \
            -e POSTGRES_DB=metabase_round2 -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD="$MB_APP_PASSWORD" "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Seed exact round2 neutral fixture
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55461"
          PGDATABASE: round2_neutral
          PGUSER: round2_owner
          PGPASSWORD: ${{ env.PG_OWNER_PASSWORD }}
          CORE_B_READONLY_USER: round2_readonly
          CORE_B_READONLY_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
        run: |
          python lab/metabase/core_b/runtime/seed_round2_fixture.py --fixture eval/round2_neutral_machine_fixture.json

      - name: Start exact sealed dima.6 engine
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-round2 --network dima-round2 -p 127.0.0.1:3361:3000 \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_round2 -e MB_DB_USER=metabase_app -e MB_DB_PASS="$MB_APP_PASSWORD" \
            -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true -e MB_AGENT_API_ENABLED=true \
            -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY" \
            -e MB_LLM_METABOT_PROVIDER="$METABOT_MODEL_IDENTIFIER" \
            -e DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine \
            -e DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA" \
            -e DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA" \
            -e DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG" \
            -e DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY" \
            -e DIMA_ENGINE_IMAGE_IDENTITY="$REGISTRY_DIGEST" \
            "$IMMUTABLE_IMAGE_REF"

      - name: Bootstrap restricted analytical principal
        working-directory: backend
        env:
          METABASE_URL: http://127.0.0.1:3361
          MB_SITE_NAME: Dima Round2 Neutral
          ANALYTICS_DB_NAME: round2_neutral
          ANALYTICS_DB_USER: round2_readonly
          ANALYTICS_DB_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/core_b/runtime/bootstrap.py

      - name: Run exact two pinpoint probes
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          mkdir -p eval/round2
          python lab/metabase/core_b/round2_feature_benchmark.py \
            --base-url http://127.0.0.1:3361 \
            --email "$MB_RESTRICTED_EMAIL" \
            --password "$MB_RESTRICTED_PASSWORD" \
            --manifest eval/dima_neutral_feature_benchmark_round2.json \
            --output eval/round2/metabase_pinpoint.json \
            --control-db eval/round2/metabase_pinpoint.db \
            --engine-sha "$ENGINE_SHA" \
            --upstream-sha "$UPSTREAM_BASE_SHA" \
            --runtime-tag "$RUNTIME_TAG" \
            --runtime-image-digest "$REGISTRY_DIGEST" \
            --build-identity "$BUILD_IDENTITY" \
            --image-identity "$REGISTRY_DIGEST" \
            --platform-sha "${{ steps.auth.outputs.candidate_sha }}" \
            --max-total-model-units "20" \
            --case-id "F02_M" \
            --case-id "F07_M"

      - name: Validate pinpoint mechanical envelope
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("eval/round2/metabase_pinpoint.json").read_text())
          assert report["source_case_count"] == 30
          assert report["selected_case_ids"] == ["F02_M","F07_M"]
          assert report["case_count"] == 2
          assert report["observable_model_boundary_units"] <= 20
          cases=report["cases"]
          assert [x["id"] for x in cases] == ["F02_M","F07_M"]
          for item in cases:
              assert item["budget_ok"] is True
              assert item["lineage_valid"] is True
              assert item["all_turns_executed"] is True
              assert item["terminal_state"] not in {"EXCEPTION","BUDGET_EXHAUSTED"}
          print("PINPOINT_ARTIFACT_READY_FOR_HUMAN_INSPECTION")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dima-v1-phase1-p12-pinpoint-live-${{ github.run_id }}
          path: |
            backend/eval/round2/metabase_pinpoint.json
          if-no-files-found: warn
          retention-days: 90

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=1500 mb-round2 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f mb-round2 analytics-db app-db 2>/dev/null || true
          docker network rm dima-round2 2>/dev/null || true
