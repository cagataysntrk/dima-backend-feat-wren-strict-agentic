name: dima-v1-phase1-pinpoint-live

# DMP-DEC-0074A TEMPORARY EXECUTION BRIDGE.
# Fresh supervisor/user authority permits a push ONLY on the exact authorization
# file below so ChatGPT can run Probe A/B autonomously. Remove this push trigger
# immediately after the two-probe sequence stops or completes.
on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/eval/v1/authorizations/phase1-final-pinpoint-live-001.json"
  workflow_dispatch:
    inputs:
      probe_id:
        description: "Run exactly one final Phase-1 live probe"
        required: true
        type: choice
        options:
          - SCOPE_CURRENTNESS_HARD
          - RCA_P19_HARD
      confirm_pinpoint_paid:
        description: "Type YES; no automatic retry is permitted"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  contents: read
  packages: read

env:
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  METABOT_MODEL_IDENTIFIER: openrouter/openai/gpt-5.6-luna
  DIMA_COGNITION_MODEL: openai/gpt-5.6-luna
  MB_ADMIN_EMAIL: admin@phase1-pinpoint.local
  MB_RESTRICTED_EMAIL: restricted@phase1-pinpoint.local
  MB_RESTRICTED_GROUP: Dima Phase1 Pinpoint Restricted

concurrency:
  group: dima-v1-phase1-pinpoint-live
  cancel-in-progress: false

jobs:
  pinpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DIMA_OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          submodules: false

      - name: Resolve exact sequential authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          path=Path("backend/eval/v1/authorizations/phase1-final-pinpoint-live-001.json")
          item=json.loads(path.read_text(encoding="utf-8"))
          assert item["schema_version"]=="dima_v1_phase1_final_pinpoint_authorization_v1"
          assert item["decision"]=="PINPOINT_PAID_ONLY"
          assert item["confirm"]=="YES"
          assert item["probe_id"] in {"SCOPE_CURRENTNESS_HARD","RCA_P19_HARD"}
          assert item["max_model_units"]==12
          assert item["engine_sha"]=="cbe313af9ac2d5960f662068e433d328d896fb06"
          assert item["engine_digest"]=="sha256:40e9a44be49904de3ddf12d4683c768e70955851c10a928a9c8f7d8f60780353"
          assert item["migration_head"]=="fd2a7c9e4b61"
          candidate=item["candidate_product_sha"]
          subprocess.run(
              ["git","merge-base","--is-ancestor",candidate,"HEAD"],
              check=True,
          )
          # Freeze is semantic: authorization/docs/workflow commits may follow,
          # but Product, migrations and engine must remain byte-identical.
          subprocess.run(
              [
                  "git","diff","--exit-code",candidate,"HEAD","--",
                  "backend/app","backend/migrations","engine/metabase",
              ],
              check=True,
          )
          commits=subprocess.check_output(
              ["git","log","--format=%H","--",str(path)],
              text=True,
          ).split()
          if item["probe_id"]=="SCOPE_CURRENTNESS_HARD":
              assert len(commits)==1,commits
              assert item.get("probe_a_run_id") is None
          else:
              assert len(commits)==2,commits
              previous=subprocess.check_output(
                  ["git","show",f"HEAD^:{path}"],
                  text=True,
              )
              prior=json.loads(previous)
              assert prior["probe_id"]=="SCOPE_CURRENTNESS_HARD"
              assert prior["candidate_product_sha"]==candidate
              assert item["probe_a_run_id"]==prior.get("run_id")
              assert item["probe_a_adjudication"]=="GREEN"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"candidate_sha={candidate}\n")
              out.write(f"probe_id={item['probe_id']}\n")
              out.write("max_units=12\n")
          PY
          else
            test "${{ github.event_name }}" = "workflow_dispatch"
            test "${{ inputs.confirm_pinpoint_paid }}" = "YES"
            echo "candidate_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "probe_id=${{ inputs.probe_id }}" >> "$GITHUB_OUTPUT"
            echo "max_units=12" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provider-free pinpoint preflight
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile             lab/metabase/core_b/phase1_pinpoint_live.py             lab/metabase/core_b/runtime/seed_phase1_pinpoint_metrics.py             lab/metabase/core_b/runtime/seed_round2_fixture.py
          pip install -e ".[dev]"
          pytest -q             tests/test_v3_phase1_pinpoint_live_contract.py             tests/test_v3_v1_phase1_eval_contract.py

      - name: Derive ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          S="${GITHUB_SHA:0:12}"
          {
            echo "MB_ADMIN_PASSWORD=Adm-${S}-Aa1!"
            echo "MB_RESTRICTED_PASSWORD=Res-${S}-Aa1!"
            echo "PG_OWNER_PASSWORD=PgO-${S}-Aa1!"
            echo "CORE_B_READONLY_PASSWORD=PgR-${S}-Aa1!"
            echo "MB_APP_PASSWORD=MbA-${S}-Aa1!"
          } >> "$GITHUB_ENV"

      - name: Load exact certified engine runtime lock
        shell: bash
        run: |
          set -euo pipefail
          GITLINK_SHA="$(git ls-tree HEAD engine/metabase | awk '{print $3}')"
          python backend/lab/metabase/core_b/runtime/engine_runtime_lock.py             --lock backend/lab/metabase/core_b/runtime/engine_runtime_lock.json             --gitlink-sha "$GITLINK_SHA"             --github-env "$GITHUB_ENV"

      - name: Pull exact certified dima.6 digest
        shell: bash
        run: |
          set -euo pipefail
          test "$ENGINE_SHA" = "cbe313af9ac2d5960f662068e433d328d896fb06"
          test "$CERTIFICATION_RUN_ID" = "36042062775"
          test "$RUNTIME_TAG" = "v0.63.18-dima.6"
          docker pull "$IMMUTABLE_IMAGE_REF"
          docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$IMMUTABLE_IMAGE_REF" | grep -Fx "$IMMUTABLE_IMAGE_REF"

      - name: Install live environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "psycopg[binary]==3.3.3"

      - name: Guard cognition provider secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Start neutral databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-phase1-pinpoint
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-phase1-pinpoint --network-alias analytics-db -p 127.0.0.1:55461:5432             -e POSTGRES_DB=phase1_pinpoint -e POSTGRES_USER=phase1_owner -e POSTGRES_PASSWORD="$PG_OWNER_PASSWORD" "$PG"
          docker run -d --name app-db --network dima-phase1-pinpoint --network-alias app-db             -e POSTGRES_DB=metabase_phase1 -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD="$MB_APP_PASSWORD" "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Seed frozen neutral fixture
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55461"
          PGDATABASE: phase1_pinpoint
          PGUSER: phase1_owner
          PGPASSWORD: ${{ env.PG_OWNER_PASSWORD }}
          CORE_B_READONLY_USER: phase1_readonly
          CORE_B_READONLY_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
        run: |
          python lab/metabase/core_b/runtime/seed_round2_fixture.py             --fixture eval/round2_neutral_machine_fixture.json

      - name: Start exact sealed dima.6 engine
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-phase1 --network dima-phase1-pinpoint -p 127.0.0.1:3361:3000             -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432             -e MB_DB_DBNAME=metabase_phase1 -e MB_DB_USER=metabase_app -e MB_DB_PASS="$MB_APP_PASSWORD"             -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true -e MB_AGENT_API_ENABLED=true             -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false             -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY"             -e MB_LLM_METABOT_PROVIDER="$METABOT_MODEL_IDENTIFIER"             -e DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine             -e DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA"             -e DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA"             -e DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG"             -e DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY"             -e DIMA_ENGINE_IMAGE_IDENTITY="$REGISTRY_DIGEST"             "$IMMUTABLE_IMAGE_REF"

      - name: Bootstrap restricted analytical principal
        working-directory: backend
        env:
          METABASE_URL: http://127.0.0.1:3361
          MB_SITE_NAME: Dima Phase1 Pinpoint
          ANALYTICS_DB_NAME: phase1_pinpoint
          ANALYTICS_DB_USER: phase1_readonly
          ANALYTICS_DB_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/core_b/runtime/bootstrap.py

      - name: Create governed native metric resources
        working-directory: backend
        env:
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
        run: |
          mkdir -p eval/phase1_pinpoint
          python lab/metabase/core_b/runtime/seed_phase1_pinpoint_metrics.py             --base-url http://127.0.0.1:3361             --output eval/phase1_pinpoint/native_bindings.json

      - name: Run exactly one final Phase-1 pinpoint probe
        working-directory: backend
        env:
          PYTHONPATH: .
          PROBE_ID: ${{ steps.auth.outputs.probe_id }}
        run: |
          set -euo pipefail
          mkdir -p eval/phase1_pinpoint
          python lab/metabase/core_b/phase1_pinpoint_live.py             --probe-id "$PROBE_ID"             --base-url http://127.0.0.1:3361             --email "$MB_RESTRICTED_EMAIL"             --password "$MB_RESTRICTED_PASSWORD"             --binding-manifest eval/phase1_pinpoint/native_bindings.json             --output "eval/phase1_pinpoint/${PROBE_ID}.json"             --control-db "eval/phase1_pinpoint/${PROBE_ID}.db"             --engine-sha "$ENGINE_SHA"             --upstream-sha "$UPSTREAM_BASE_SHA"             --runtime-tag "$RUNTIME_TAG"             --runtime-image-digest "$REGISTRY_DIGEST"             --build-identity "$BUILD_IDENTITY"             --image-identity "$REGISTRY_DIGEST"             --candidate-product-sha "${{ steps.auth.outputs.candidate_sha }}"             --max-model-units "12"

      - name: Validate hard mechanical envelope only
        working-directory: backend
        env:
          PROBE_ID: ${{ steps.auth.outputs.probe_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          probe=os.environ["PROBE_ID"]
          report=json.loads(
              Path(f"eval/phase1_pinpoint/{probe}.json").read_text(encoding="utf-8")
          )
          assert report["probe_id"]==probe
          assert report["max_observable_model_boundary_units"]==12
          assert report["observable_model_boundary_units"]<=12
          assert report["within_budget"] is True
          assert report.get("exception") is None
          assert report["turn_count_executed"]==report["turn_count_expected"]
          assert all(item.get("ready") is True for item in report["turns"])
          if probe=="SCOPE_CURRENTNESS_HARD":
              observed=report["mechanical_observations"]
              for key in (
                  "two_turns_executed",
                  "both_turns_ready",
                  "scope_lineage_continuity",
                  "scope_version_advanced",
                  "old_research_superseded",
                  "new_research_current",
                  "old_primary_evidence_historical",
                  "new_primary_evidence_current",
              ):
                  assert observed[key] is True,(key,observed)
          else:
              observed=report["mechanical_observations"]
              assert observed["max_reasoning_depth"]<=3,observed
              assert observed["p19_called_when_required"] is True,observed
          assert report["quality_score"] is None
          assert report["manual_adjudication_required"] is True
          print("PINPOINT_ARTIFACT_READY_FOR_HUMAN_INSPECTION")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dima-v1-phase1-pinpoint-${{ steps.auth.outputs.probe_id }}-${{ github.run_id }}
          path: |
            backend/eval/phase1_pinpoint/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=1500 mb-phase1 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f mb-phase1 analytics-db app-db 2>/dev/null || true
          docker network rm dima-phase1-pinpoint 2>/dev/null || true
