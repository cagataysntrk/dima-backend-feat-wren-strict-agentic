name: dima-v1-phase1-focused

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - ".github/workflows/dima-v1-phase1-focused.yml"
      - "backend/app/v3/research_contracts.py"
      - "backend/app/v3/research_manager.py"
      - "backend/app/v3/research_manager_provider.py"
      - "backend/app/v3/analytics_contract.py"
      - "backend/app/v3/native_standard/**"
      - "backend/app/v3/product/**"
      - "backend/app/v3/hypothesis_root_cause.py"
      - "backend/app/v3/hypothesis_root_cause_provider.py"
      - "backend/app/v3/business_relationship_policy.py"
      - "backend/app/v3/report_document.py"
      - "backend/tests/test_v3_v1_*.py"
      - "backend/tests/test_v3_p17_*.py"
      - "backend/tests/test_v3_product_*.py"
      - "backend/tests/test_v3_p19_*.py"
      - "backend/tests/test_v3_p18_*.py"
      - "backend/tests/test_v3_p20_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile Phase-1 owners
        working-directory: backend
        run: |
          python -m py_compile             app/v3/research_contracts.py             app/v3/research_manager.py             app/v3/research_manager_provider.py

      - name: P1 provider-contract reliability
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p17_autonomous_provider_schema.py             tests/test_v3_p17_research_manager.py             tests/test_v3_p17_request_differential.py

      - name: P2 turn-scope and restart isolation
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_v1_scope_contract.py             tests/test_v3_p14_product.py             tests/test_v3_owner_scoped_must_accounting.py

      - name: Frozen engine and no UI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"
          test ! -d frontend
          test ! -d web
          test ! -d ui
