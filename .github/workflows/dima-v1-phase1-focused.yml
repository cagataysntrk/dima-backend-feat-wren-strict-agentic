# R8 dima.8 provider-free closure trigger
# 90+ convergence final provider-free freeze v2: Product behavior c2a0cfda12ab6b1329ef56171b6a5d8e58eda005
name: dima-v1-phase1-focused

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - ".github/workflows/dima-v1-phase1-focused.yml"
      - "backend/app/main.py"
      - "backend/app/v3/research_contracts.py"
      - "backend/app/v3/research.py"
      - "backend/app/v3/research_intake.py"
      - "backend/app/v3/research_product.py"
      - "backend/app/v3/research_store.py"
      - "backend/app/v3/research_manager.py"
      - "backend/app/v3/research_manager_provider.py"
      - "backend/app/v3/analytical_request_contract.py"
      - "backend/app/v3/research_analytical_scope.py"
      - "backend/app/v3/research_followup.py"
      - "backend/app/v3/research_native_gateway.py"
      - "backend/tests/test_v3_p14_native_gateway.py"
      - "backend/tests/test_v3_r7_native_contract_delivery.py"
      - "backend/app/v3/analytics_contract.py"
      - "backend/app/v3/native_standard/**"
      - "backend/app/v3/product/**"
      - "backend/app/v3/hypothesis_root_cause.py"
      - "backend/app/v3/hypothesis_root_cause_v1.py"
      - "backend/app/v3/business_relationship_v1.py"
      - "backend/app/v3/hypothesis_root_cause_provider.py"
      - "backend/app/v3/business_relationship_policy.py"
      - "backend/app/v3/report_document.py"
      - "backend/tests/test_repository_hygiene.py"
      - "backend/tests/test_v3_v1_*.py"
      - "backend/tests/test_v3_research_intake.py"
      - "backend/tests/test_v3_p17_*.py"
      - "backend/tests/test_v3_product_*.py"
      - "backend/tests/test_v3_p19_*.py"
      - "backend/tests/test_v3_p18_*.py"
      - "backend/tests/test_v3_p20_*.py"
      - "backend/belgeler/STORY_LIFECYCLE.json"
      - "backend/belgeler/metabase/DIMA_V1_PHASE1_*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile Wave-A owners
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/research_contracts.py \
            app/v3/research.py \
            app/v3/research_intake.py \
            app/v3/research_product.py \
            app/v3/research_store.py \
            app/v3/research_manager.py \
            app/v3/research_manager_provider.py \
            app/v3/hypothesis_root_cause_v1.py \
            app/v3/business_relationship_v1.py \
            app/v3/product/process_manager.py \
            app/v3/product/execution_mode.py \
            app/v3/report_document.py \
            app/v3/analytical_request_contract.py \
            app/v3/native_standard/trust.py \
            app/v3/product/composition.py \
            app/main.py

      - name: Governance story lifecycle focused proof
        working-directory: backend
        run: pytest -q tests/test_repository_hygiene.py

      - name: P1 provider versus internal failure boundary
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p17_autonomous_provider_schema.py \
            tests/test_v3_p17_request_differential.py

      - name: P2 production scope integration and negative isolation
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_scope_contract.py \
            tests/test_v3_v1_scope_integration.py \
            tests/test_v3_research_intake.py \
            tests/test_v3_p14_product.py

      - name: P3 AnalyticalRequestContract boundary
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_analytical_request_contract.py \
            tests/test_v3_p13d_native_standard.py \
            tests/test_v3_p14_native_gateway.py \
            tests/test_v3_r7_native_contract_delivery.py

      - name: P4 USER_MUST Completion Ledger
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_completion_ledger.py \
            tests/test_v3_owner_scoped_must_accounting.py

      - name: P5 bounded P17 depth and gain contract
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_p17_depth.py \
            tests/test_v3_p17_research_manager.py \
            tests/test_v3_p17_autonomous_manager_eval.py

      - name: Wave-B B1 P6-P8 focused proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_product_process_manager.py \
            tests/test_v3_v1_wave_b_b1.py \
            tests/test_v3_p19_hypothesis_root_cause.py \
            tests/test_v3_p17_research_manager.py

      - name: Wave-B B2 P9-P11 focused proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_wave_b_b2.py \
            tests/test_v3_v1_scope_integration.py \
            tests/test_v3_product_composition.py \
            tests/test_v3_p18_business_relationship_policy.py \
            tests/test_v3_p20_report_document.py

      - name: Wave-A affected provider-free closure
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_product_contracts.py \
            tests/test_v3_product_composition.py \
            tests/test_v3_product_process_manager.py \
            tests/test_v3_core_b_closure_v2.py

      - name: Frozen engine no UI no Wren runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"
          test ! -d WrenAI-main
          test ! -d frontend
          test ! -d web
          test ! -d ui
          ! grep -q '"wrenai' backend/pyproject.toml
          ! grep -q '"wren-core-py' backend/pyproject.toml
