name: v2-day6-5-dev-probe-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-dev-probe-once.yml"

jobs:
  dev-probe:
    if: "github.event.head_commit.message == 'eval(v2-day6.5): run stratified DEV probe'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: openai/gpt-5.6-luna
      DIMA_OPENROUTER_MODEL: openai/gpt-5.6-luna
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Stratified Day 6.5 DEV probe
        working-directory: backend
        run: |
          python lab/v2_day6_5_manager_eval.py \
            --require-live \
            --workers 4 \
            --model openai/gpt-5.6-luna \
            --case-id "d65-dev-001" \\
            --case-id "d65-dev-007" \\
            --case-id "d65-dev-013" \\
            --case-id "d65-dev-019" \\
            --case-id "d65-dev-025" \\
            --case-id "d65-dev-037" \\
            --case-id "d65-dev-047" \\
            --case-id "d65-dev-055" \\
            --case-id "d65-dev-005" \\
            --case-id "d65-dev-067" \\
            --case-id "d65-dev-063" \\
            --case-id "d65-dev-075"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-dev-probe
          path: backend/lab/reports/v2_day6_5_manager_eval.json
          retention-days: 14
