name: dima-metabase-p14-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/research.py"
      - "backend/app/v3/research_store.py"
      - "backend/app/v3/research_product.py"
      - "backend/app/v3/research_native_gateway.py"
      - "backend/app/v3/security_identity.py"
      - "backend/app/v3/execution_identity.py"
      - "backend/app/v3/evidence.py"
      - "backend/app/v3/substrate/metabase/native_engine.py"
      - "backend/app/v3/substrate/metabase/native_models.py"
      - "backend/app/v2/models.py"
      - "backend/app/routers/ask_v2.py"
      - "backend/app/main.py"
      - "backend/control_plane/models.py"
      - "backend/migrations/versions/c4d9e2a7f160_p14_research_persistence.py"
      - "backend/migrations/versions/c6f1a2d9e870_p14_native_gateway.py"
      - "backend/tests/test_v3_p14_research.py"
      - "backend/tests/test_v3_p14_product.py"
      - "backend/tests/test_v3_p14_native_gateway.py"
      - "backend/tests/test_v3_p12x_c2_native_engine_bridge.py"
      - ".github/workflows/dima-metabase-p14-provider-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-provider-free:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p14-seal]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce P14 native-reuse boundary
        shell: bash
        run: |
          set -euo pipefail
          HOT=(
            "backend/app/v3/research.py"
            "backend/app/v3/research_product.py"
            "backend/app/v3/research_native_gateway.py"
          )
          for file in "${HOT[@]}"; do
            if grep -nE 'app\.v3\.substrate\.metabase\.(compiler|canonical|execution_adapter)|app\.v3\.native_standard\.trust|app\.v3\.analytics_contract|app\.v2\.temporal(_intent)?|app\.wren|wren_service|MetabaseAgentClient|ResolvedAnalyticsIntent|TemporalBindingEngine|MetabaseProjectionCompiler|MetabaseCanonicalizer|NativeStandardTrustOrchestrator|NativeExecutionManifest|AuthorizedExecutionArtifact|ExecutionAccessSnapshotIssuer|VerifiedExecutionSecurityFacts|NativeResourceBindingProvider|attest_native_query[[:space:]]*\(|execute_native_query[[:space:]]*\(' "$file"; then
              echo "P14 Research product introduced a legacy/duplicate analytical dependency" >&2
              exit 1
            fi
            ! grep -nE '(^|[^A-Za-z])(SELECT|INSERT|UPDATE|DELETE)[[:space:]]' "$file"
          done

      - name: Compile P14 Research product slice
        working-directory: backend
        run: |
          python -m py_compile             app/v3/research.py             app/v3/research_store.py             app/v3/research_product.py             app/v3/research_native_gateway.py             app/v3/security_identity.py             app/v3/execution_identity.py             app/v3/evidence.py             app/v3/substrate/metabase/native_engine.py             app/v3/substrate/metabase/native_models.py             app/v2/models.py             app/routers/ask_v2.py             control_plane/models.py             migrations/versions/c4d9e2a7f160_p14_research_persistence.py             migrations/versions/c6f1a2d9e870_p14_native_gateway.py             tests/test_v3_p14_research.py             tests/test_v3_p14_product.py             tests/test_v3_p14_native_gateway.py             tests/test_v3_p12x_c2_native_engine_bridge.py

      - name: Verify single Alembic head includes P14 durability
        working-directory: backend
        run: |
          set -euo pipefail
          python -m alembic heads | grep -q '^c6f1a2d9e870'

      - name: P14 focused provider-free Research proof
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p14_research.py             tests/test_v3_p14_product.py             tests/test_v3_p14_native_gateway.py             tests/test_v3_p12x_c2_native_engine_bridge.py::test_native_direct_metabot_query_reaches_dataset_unchanged             tests/test_v3_p12x_c2_native_engine_bridge.py::test_native_direct_dataset_permission_failure_stays_native_http_failure

      - name: Existing P5 receipt regressions remain authoritative
        working-directory: backend
        run: |
          pytest -q tests/test_v3_p5_receipt.py
