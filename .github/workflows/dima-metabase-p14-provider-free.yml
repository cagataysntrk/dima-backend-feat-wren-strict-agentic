name: dima-metabase-p14-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/research.py"
      - "backend/tests/test_v3_p14_research.py"
      - ".github/workflows/dima-metabase-p14-provider-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-provider-free:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p14-seal]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Enforce P14 native-reuse boundary
        shell: bash
        run: |
          set -euo pipefail
          HOT="backend/app/v3/research.py"
          if grep -nE 'app\.v3\.substrate\.metabase\.(compiler|canonical|execution_adapter)|app\.wren|wren_service|MetabaseAgentClient' "$HOT"; then
            echo "P14 Research owner introduced a legacy/duplicate analytical execution dependency" >&2
            exit 1
          fi
          ! grep -nE '(^|[^A-Za-z])(SELECT|INSERT|UPDATE|DELETE)[[:space:]]' "$HOT"

      - name: Compile P14 Research slice
        working-directory: backend
        run: |
          python -m py_compile \
            app/v3/research.py \
            tests/test_v3_p14_research.py

      - name: P14 focused provider-free Research proof
        working-directory: backend
        run: pytest -q tests/test_v3_p14_research.py

      - name: Existing trust/receipt regressions remain authoritative
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p13d_native_standard.py \
            tests/test_v3_p10_security_identity.py \
            tests/test_v3_p5_receipt.py
