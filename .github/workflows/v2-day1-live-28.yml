name: v2-day1-live-28

"on":
  pull_request:
    branches:
      - wren-bağımsız
    types:
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: v2-day1-live-28
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  live-28:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_LLM_PROVIDER: "ollama"
      DIMA_OLLAMA_BASE_URL: "http://127.0.0.1:11434/v1"
      DIMA_OLLAMA_MODEL: "qwen2.5:3b"
      DIMA_OLLAMA_SELECT_MODEL: "qwen2.5:3b"
      DIMA_RULE_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend runtime deps only
        run: |
          pip install "wren-core-py==0.7.2"
          pip install -e ".[dev]"

      - name: Install local Ollama
        working-directory: .
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && exit 0
            sleep 1
          done
          echo "Ollama did not become ready"
          tail -n 100 /tmp/ollama.log || true
          exit 1

      - name: Pull small local classification model
        working-directory: .
        run: ollama pull qwen2.5:3b

      - name: Run ONLY the 28-case P4 evaluator
        run: |
          mkdir -p lab/reports
          python lab/v2_day1_eval.py --require-live --output lab/reports/v2_day1_live_28.json

      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-day1-live-28
          path: backend/lab/reports/v2_day1_live_28.json
          retention-days: 30
          if-no-files-found: warn

      - name: Ollama diagnostics on failure
        if: failure()
        working-directory: .
        run: tail -n 200 /tmp/ollama.log || true
