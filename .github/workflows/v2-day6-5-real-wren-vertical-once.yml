name: v2-day6-5-real-wren-vertical-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-real-wren-vertical-once.yml"

jobs:
  real-wren-vertical:
    if: "github.event.head_commit.message == 'test(v2-day6.5): run real Wren vertical proof'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIMA_LLM_PROVIDER: "rule"
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Real Wren Day 6.5 trust-plane vertical
        working-directory: backend
        run: |
          python -m py_compile tests/test_v2_day6_5_real_trust_plane.py
          pytest -q tests/test_v2_day6_5_real_trust_plane.py -vv
