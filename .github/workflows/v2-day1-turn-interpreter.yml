name: v2-day1-turn-interpreter

"on":
  pull_request:
    branches:
      - wren-bağımsız
    types:
      - ready_for_review
    paths:
      - "backend/app/v2/**"
      - "backend/app/routers/ask_v2.py"
      - "backend/app/llm.py"
      - "backend/eval/v2_day1_cases.yaml"
      - "backend/lab/v2_day1_eval.py"
      - "backend/tests/test_v2_day*.py"
      - ".github/workflows/v2-day1-turn-interpreter.yml"
  workflow_dispatch:

concurrency:
  group: v2-day1-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  day1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_LLM_PROVIDER: "auto"
      DIMA_ANTHROPIC_API_KEY: ${{ secrets.DIMA_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
      DIMA_GEMINI_API_KEY: ${{ secrets.DIMA_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      DIMA_GROQ_API_KEY: ${{ secrets.DIMA_GROQ_API_KEY || secrets.GROQ_API_KEY }}
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_XAI_API_KEY: ${{ secrets.DIMA_XAI_API_KEY || secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Wren Rust engine binding
        run: pip install "wren-core-py==0.7.2"

      - name: Backend + dev dependencies
        run: pip install -e ".[dev]"

      - name: Focused Day 0 + Day 1 contracts
        run: pytest -q tests/test_v2_day0.py tests/test_v2_day1.py

      - name: P4 real-provider acceptance if a provider secret exists
        shell: bash
        run: |
          mkdir -p lab/reports
          if [[ -n "$DIMA_ANTHROPIC_API_KEY$DIMA_GEMINI_API_KEY$DIMA_GROQ_API_KEY$DIMA_OPENROUTER_API_KEY$DIMA_XAI_API_KEY" ]]; then
            python lab/v2_day1_eval.py --require-live --output lab/reports/v2_day1_eval.json
          else
            printf '%s\n' '{"kind":"dima_v2_day1_eval","status":"live_provider_unavailable","reason":"No configured GitHub Actions LLM secret; P4 live KPI remains unmeasured."}' > lab/reports/v2_day1_eval.json
            echo "No live provider secret configured; structural gate is valid but P4 accuracy exit remains pending."
          fi

      - name: Upload Day 1 measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-day1-measurement
          path: backend/lab/reports/v2_day1_eval.json
          retention-days: 30
          if-no-files-found: error
