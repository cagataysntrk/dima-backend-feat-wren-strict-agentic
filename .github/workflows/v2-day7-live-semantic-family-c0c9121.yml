name: v2-day7-live-semantic-family-c0c9121

"on":
  push:
    branches:
      - ops/day7-semantic-family-live-c0c9121
    paths:
      - ".github/workflows/v2-day7-live-semantic-family-c0c9121.yml"

jobs:
  semantic-family-live:
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 35
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_DAY7_LIVE_MANAGER_MODEL: "openai/gpt-5.6-sol"
      DIMA_DAY7_LIVE_LINKER_MODEL: "openai/gpt-5.6-luna"
      DIMA_DAY7_LIVE_TEMPORAL_MODEL: "openai/gpt-5.6-sol"
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_SEMANTIC_LINKER_PROVIDER: openrouter
      DIMA_V2_TEMPORAL_NORMALIZER_PROVIDER: openrouter
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"

    steps:
      - name: Checkout exact semantic recovery proof checkpoint
        uses: actions/checkout@v4
        with:
          ref: c0c9121da04fd21412009d2e6ccfecfe82b74068

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend live-eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run provider preflight plus retrieval-discovery affected family
        working-directory: backend
        run: |
          python lab/v2_day7_manager_live_sol.py \
            --case-id breakdown-region \
            --case-id rank-region-top2 \
            --case-id stable-no-extra-branch \
            --case-id high-cardinality-bounded \
            --case-id budget-pressure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day7-live-semantic-family-c0c9121-${{ github.run_id }}
          path: backend/lab/reports/v2_day7_live_sol.json
          retention-days: 90
