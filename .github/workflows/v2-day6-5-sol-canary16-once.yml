name: v2-day6-5-sol-canary16-once

"on":
  push:
    branches: [feat/ask-v2-mvp]
    paths:
      - ".github/workflows/v2-day6-5-sol-canary16-once.yml"

jobs:
  sol-canary16:
    if: "github.event.head_commit.message == 'eval(v2-day6.5): run Sol stratified canary16'"
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 35
    env:
      DIMA_LLM_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_PROVIDER: openrouter
      DIMA_V2_RESEARCH_MANAGER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_MODEL: openai/gpt-5.6-sol
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bc89b5ea556e345452d611cbd8d95b288739f65
      - name: Verify exact tested code SHA
        run: test "$(git rev-parse HEAD)" = "8bc89b5ea556e345452d611cbd8d95b288739f65"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend eval dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Provider-free authority guard
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_preacceptance_protocol.py tests/test_v2_day6_5_capability_algebra.py
      - name: Sol stratified canary 16 workers=1
        working-directory: backend
        run: |
          python lab/v2_day6_5_manager_eval.py \
            --require-live \
            --workers 1 \
            --model openai/gpt-5.6-sol \
            --case-id d65-dev-001 \\
            --case-id d65-dev-009 \\
            --case-id d65-dev-013 \\
            --case-id d65-dev-019 \\
            --case-id d65-dev-025 \\
            --case-id d65-dev-028 \\
            --case-id d65-dev-033 \\
            --case-id d65-dev-034 \\
            --case-id d65-dev-047 \\
            --case-id d65-dev-055 \\
            --case-id d65-dev-056 \\
            --case-id d65-dev-063 \\
            --case-id d65-dev-067 \\
            --case-id d65-dev-072 \\
            --case-id d65-dev-075 \\
            --case-id d65-dev-080 
            --output lab/reports/v2_day6_5_sol_canary16.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-day6-5-sol-canary16
          path: backend/lab/reports/v2_day6_5_sol_canary16.json
          retention-days: 14
