name: dima-fast-ft005-model-transport-smoke

on:
  push:
    branches:
      - feat/dima-metabase-product-fast-track
    paths:
      - ".github/workflows/dima-fast-ft005-model-transport-smoke.yml"
      - "backend/lab/fast_model_eval.py"
      - "backend/lab/fast_ft005_model_sentinel.py"
      - "backend/tests/test_fast_model_eval.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lock benchmark transport contract
        working-directory: backend
        run: pytest -q tests/test_fast_model_eval.py

  live-smoke:
    runs-on: ubuntu-latest
    needs: provider-free
    timeout-minutes: 20
    environment: DIMA_OPENROUTER_API_KEY
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: luna
            request_model: openai/gpt-5.6-luna
            canonical_model: gpt-5.6-luna
            role: LUNA_BASELINE
          - label: sol
            request_model: openai/gpt-5.6-sol
            canonical_model: gpt-5.6-sol
            role: SOL_CEILING

    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      DIMA_FAST_FT005_PROVIDER: "openrouter"
      DIMA_FAST_FT005_TRANSPORT: "openrouter_strict_benchmark"
      DIMA_FAST_FT005_MODEL: ${{ matrix.request_model }}
      DIMA_FAST_FT005_CANONICAL_MODEL: ${{ matrix.canonical_model }}
      DIMA_FAST_FT005_MODEL_ROLE: ${{ matrix.role }}
      DIMA_FAST_FT005_MEASUREMENT_MODE: "TRANSPORT_SMOKE"
      DIMA_FAST_FT005_REASONING_EFFORT: "disabled"
      DIMA_FAST_FT005_CASES: "q1_self_contained,missing_safe_context"
      DIMA_FAST_FT005_MODEL_RECEIPT: lab/metabase/artifacts/ft005-transport-smoke-${{ matrix.label }}.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Require canonical OpenRouter credential
        run: |
          test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Run two-case strict structured transport smoke
        working-directory: backend
        run: |
          mkdir -p lab/metabase/artifacts
          python lab/fast_ft005_model_sentinel.py

      - name: Verify exact benchmark transport identity
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ["DIMA_FAST_FT005_MODEL_RECEIPT"])
          data = json.loads(path.read_text())
          assert data["status"] == "GREEN", data
          assert len(data["cases"]) == 2, data
          assert all(case["passed"] for case in data["cases"]), data
          calls = data["structured_calls"]
          assert len(calls) == 2, calls
          for call in calls:
              assert call["transport_success"] is True, call
              assert call["parse_success"] is True, call
              assert call["structured_valid"] is True, call
              assert call["transport_provider"] == "OPENROUTER", call
              assert call["request_model_id"] == os.environ["DIMA_FAST_FT005_MODEL"], call
              assert call["canonical_model"] == os.environ["DIMA_FAST_FT005_CANONICAL_MODEL"], call
              assert call["provider_fallbacks"] is False, call
              assert call["http_status"] == 200, call
              assert call["response_model_id"], call
          PY

      - name: Upload transport smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dima-fast-ft005-transport-smoke-${{ matrix.label }}-${{ github.sha }}
          path: backend/lab/metabase/artifacts/ft005-transport-smoke-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show transport smoke receipt
        if: always()
        working-directory: backend
        run: |
          test ! -f "lab/metabase/artifacts/ft005-transport-smoke-${{ matrix.label }}.json" || cat "lab/metabase/artifacts/ft005-transport-smoke-${{ matrix.label }}.json"
