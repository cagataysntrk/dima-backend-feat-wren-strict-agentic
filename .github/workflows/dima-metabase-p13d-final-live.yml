name: dima-metabase-p13d-final-live
# preflight-revision: 3

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - ".github/workflows/dima-metabase-p13d-final-live.yml"

permissions:
  contents: read
  packages: read

env:
  BOYAHANE_SHA: f0c4a6b053ead52ca2eac80002c448323dc34a35
  MODEL_IDENTIFIER: openrouter/openai/gpt-5.6-luna
  LIVE_ATTEMPT_ID: p13d-final-dima6-exact-occurrence-001
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  MB_ADMIN_EMAIL: admin@p13d-final-live.local
  MB_RESTRICTED_EMAIL: restricted@p13d-final-live.local
  MB_RESTRICTED_GROUP: Dima P13D Final Live Restricted

jobs:
  final-cohesive-live:
    if: contains(github.event.head_commit.message, '[p13d-live-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: DIMA_OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: ${{ env.BOYAHANE_SHA }}
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive ephemeral test credentials
        shell: bash
        run: |
          set -euo pipefail
          S="${GITHUB_SHA:0:12}"
          {
            echo "MB_ADMIN_PASSWORD=Adm-${S}-Aa1!"
            echo "MB_RESTRICTED_PASSWORD=Res-${S}-Aa1!"
            echo "PG_OWNER_PASSWORD=PgO-${S}-Aa1!"
            echo "BOYAHANE_READONLY_PASSWORD=PgR-${S}-Aa1!"
            echo "MB_APP_PASSWORD=MbA-${S}-Aa1!"
          } >> "$GITHUB_ENV"

      - name: Load exact certified dima.6 runtime lock
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          GITLINK_SHA="$(git ls-tree HEAD engine/metabase | awk '{print $3}')"
          test -n "$GITLINK_SHA"
          python backend/lab/metabase/scripts/engine_runtime_lock.py \
            --lock backend/lab/metabase/engine_runtime_lock.json \
            --gitlink-sha "$GITLINK_SHA" \
            --github-env "$GITHUB_ENV" \
            --print-json

      - name: Verify exact dima.6 lock after env export
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNTIME_TAG" = "v0.63.18-dima.6"
          test "$ENGINE_SHA" = "cbe313af9ac2d5960f662068e433d328d896fb06"
          test "$CERTIFICATION_RUN_ID" = "36042062775"
          test "$REGISTRY_DIGEST" = "sha256:40e9a44be49904de3ddf12d4683c768e70955851c10a928a9c8f7d8f60780353"

      - name: Pull exact certified dima.6 digest anonymously
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMMUTABLE_IMAGE_REF"
          docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$IMMUTABLE_IMAGE_REF" \
            | grep -Fx "$IMMUTABLE_IMAGE_REF"

      - name: Install focused final test environment
        working-directory: platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "duckdb==1.4.3" "psycopg[binary]==3.3.3"

      - name: Deterministic exact-occurrence preflight before model
        working-directory: platform/backend
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            app/v3/substrate/metabase/native_engine.py \
            app/v3/substrate/metabase/native_models.py \
            app/v3/native_standard/contracts.py \
            app/v3/native_standard/trust.py \
            lab/metabase/p13b/px01_live_standard.py \
            lab/metabase/p13c/live_standard.py \
            lab/metabase/p13d/live_standard.py
          pytest --noconftest -q \
            tests/test_v3_p12x_c2_native_engine_bridge.py \
            tests/test_v3_p13b_native_standard.py \
            tests/test_v3_p13c_native_standard.py \
            tests/test_v3_p13d_native_standard.py

      - name: Require exactly one Luna credential
        shell: bash
        run: test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Start final live databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-p13d-final-live
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db --network dima-p13d-final-live --network-alias analytics-db -p 127.0.0.1:55449:5432 \
            -e POSTGRES_DB=boyahane -e POSTGRES_USER=boyahane_owner -e POSTGRES_PASSWORD="$PG_OWNER_PASSWORD" "$PG"
          docker run -d --name app-db --network dima-p13d-final-live --network-alias app-db \
            -e POSTGRES_DB=metabase_p13d_final -e POSTGRES_USER=metabase_app -e POSTGRES_PASSWORD="$MB_APP_PASSWORD" "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Import frozen Boyahane fixture
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55449"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: ${{ env.PG_OWNER_PASSWORD }}
          BOYAHANE_READONLY_PASSWORD: ${{ env.BOYAHANE_READONLY_PASSWORD }}
        run: python boyahane/importer/import_boyahane.py

      - name: Start exact pulled dima.6 engine with Luna
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-p13d-final --network dima-p13d-final-live -p 127.0.0.1:3320:3000 \
            -e MB_DB_TYPE=postgres -e MB_DB_HOST=app-db -e MB_DB_PORT=5432 \
            -e MB_DB_DBNAME=metabase_p13d_final -e MB_DB_USER=metabase_app -e MB_DB_PASS="$MB_APP_PASSWORD" \
            -e MB_AI_FEATURES_ENABLED=true -e MB_METABOT_ENABLED=true -e MB_AGENT_API_ENABLED=true \
            -e MB_LOAD_SAMPLE_CONTENT=false -e MB_MCP_EXECUTE_SQL_ENABLED=false \
            -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY" \
            -e MB_LLM_METABOT_PROVIDER="$MODEL_IDENTIFIER" \
            -e DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine \
            -e DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA" \
            -e DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA" \
            -e DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG" \
            -e DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY" \
            -e DIMA_ENGINE_IMAGE_IDENTITY="$REGISTRY_DIGEST" \
            "$IMMUTABLE_IMAGE_REF"

      - name: Bootstrap restricted analytical principal
        working-directory: platform/backend
        env:
          METABASE_URL: http://127.0.0.1:3320
          MB_SITE_NAME: Dima P13D Final Live
          ANALYTICS_DB_NAME: boyahane
          ANALYTICS_DB_USER: metabase_boyahane
          ANALYTICS_DB_PASSWORD: ${{ env.BOYAHANE_READONLY_PASSWORD }}
          PGPASSWORD: ${{ env.PG_OWNER_PASSWORD }}
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/scripts/bootstrap.py

      - name: Provision exact Dima-managed metric
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13c/semantic_availability.py \
            --base-url http://127.0.0.1:3320 \
            --admin-email "$MB_ADMIN_EMAIL" --admin-password "$MB_ADMIN_PASSWORD" \
            --restricted-email "$MB_RESTRICTED_EMAIL" --restricted-password "$MB_RESTRICTED_PASSWORD" \
            --runtime-tag "$RUNTIME_TAG" --runtime-image-digest "$REGISTRY_DIGEST" \
            --engine-sha "$ENGINE_SHA" --platform-sha "$GITHUB_SHA" \
            --output lab/metabase/p13d/artifacts/P13D_SEMANTIC_AVAILABILITY_FINAL.json

      - name: Re-prove deterministic boundary immediately before Luna
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13d/provider_free_integration.py \
            --base-url http://127.0.0.1:3320 \
            --restricted-email "$MB_RESTRICTED_EMAIL" --restricted-password "$MB_RESTRICTED_PASSWORD" \
            --duckdb "${{ github.workspace }}/boyahane/data/boyahane.duckdb" \
            --semantic-availability-report lab/metabase/p13d/artifacts/P13D_SEMANTIC_AVAILABILITY_FINAL.json \
            --engine-sha "$ENGINE_SHA" --upstream-sha "$UPSTREAM_BASE_SHA" \
            --runtime-tag "$RUNTIME_TAG" --build-identity "$BUILD_IDENTITY" \
            --image-identity "$REGISTRY_DIGEST" --platform-sha "$GITHUB_SHA" \
            --output lab/metabase/p13d/artifacts/P13D_PROVIDER_FREE_FINAL_PRELIVE.json

      - name: Run the one final compact Luna P13D cohesive evaluation
        working-directory: platform/backend
        env:
          PYTHONPATH: .
        run: |
          python lab/metabase/p13d/live_standard.py \
            --base-url http://127.0.0.1:3320 \
            --email "$MB_RESTRICTED_EMAIL" --password "$MB_RESTRICTED_PASSWORD" \
            --duckdb "${{ github.workspace }}/boyahane/data/boyahane.duckdb" \
            --semantic-availability-report lab/metabase/p13d/artifacts/P13D_SEMANTIC_AVAILABILITY_FINAL.json \
            --output lab/metabase/p13d/artifacts/P13D_COHESIVE_FINAL_LIVE.json \
            --engine-sha "$ENGINE_SHA" --upstream-sha "$UPSTREAM_BASE_SHA" \
            --runtime-tag "$RUNTIME_TAG" --runtime-image-digest "$REGISTRY_DIGEST" \
            --build-identity "$BUILD_IDENTITY" --image-identity "$REGISTRY_DIGEST" \
            --model-identifier "$MODEL_IDENTIFIER" --platform-sha "$GITHUB_SHA" \
            --live-attempt-id "$LIVE_ATTEMPT_ID"

      - name: Upload final P13D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13d-final-live-${{ github.sha }}
          path: platform/backend/lab/metabase/p13d/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=1200 mb-p13d-final || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f mb-p13d-final analytics-db app-db 2>/dev/null || true
          docker network rm dima-p13d-final-live 2>/dev/null || true
