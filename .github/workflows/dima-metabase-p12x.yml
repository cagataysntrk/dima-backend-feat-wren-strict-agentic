name: dima-metabase-p12x

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/lab/metabase/p12x/**"
      - "backend/belgeler/metabase/predev/P12X_*"
      - "backend/belgeler/metabase/tickets/P12X_*"
      - "backend/belgeler/metabase/UPSTREAM_ENGINE_HARVEST_MAP.md"
      - ".github/workflows/dima-metabase-p12x.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x0-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v4
        with:
          path: platform

      - name: Checkout exact Boyahane fixture
        uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: f0c4a6b053ead52ca2eac80002c448323dc34a35
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X0 fixture dependency
        run: pip install "duckdb==1.4.1"

      - name: Freeze Boyahane dataset and schema identity
        working-directory: platform/backend
        env:
          BOYAHANE_DUCKDB: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          BOYAHANE_REPO_SHA: f0c4a6b053ead52ca2eac80002c448323dc34a35
          BOYAHANE_GIT_BLOB_SHA: a802d67ef7bf8a1233aaf7fa628c8868190f1d4b
          P12X_OUT: lab/metabase/p12x/artifacts
        run: python lab/metabase/p12x/freeze_dataset.py

      - name: Freeze 16-case corpus and independent oracle
        working-directory: platform/backend
        env:
          BOYAHANE_DUCKDB: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          P12X_OUT: lab/metabase/p12x/artifacts
        run: python lab/metabase/p12x/build_oracle.py

      - name: Freeze Docker image identities
        working-directory: platform/backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lab/metabase/p12x/artifacts
          docker pull metabase/metabase:latest
          docker pull metabase/metabase@sha256:1160b570cb11c107bce00e71293552df8a8363e01a32c2c7a048cee002dc8a73
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def inspect(ref):
              raw = subprocess.check_output(["docker", "image", "inspect", ref], text=True)
              item = json.loads(raw)[0]
              return {
                  "requested_ref": ref,
                  "image_id": item.get("Id"),
                  "repo_digests": sorted(item.get("RepoDigests") or []),
                  "created": item.get("Created"),
                  "labels": (item.get("Config") or {}).get("Labels") or {},
              }

          payload = {
              "vanilla_latest": inspect("metabase/metabase:latest"),
              "pinned_v0_63_18": inspect(
                  "metabase/metabase@sha256:1160b570cb11c107bce00e71293552df8a8363e01a32c2c7a048cee002dc8a73"
              ),
              "pinned_logical_version": "v0.63.18",
              "pinned_source_sha": "2ba2485c78d7e00a9a25f82c00fc201da71590c4",
          }
          Path("lab/metabase/p12x/artifacts/runtime_pull_identity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload X0 freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12x-x0-freeze-${{ github.sha }}
          path: platform/backend/lab/metabase/p12x/artifacts/
          if-no-files-found: error
          retention-days: 30

  x1-native-canary:
    if: contains(github.event.head_commit.message, '[p12x-native-canary]') || github.event_name == 'workflow_dispatch'
    needs: x0-freeze
    runs-on: ubuntu-latest
    environment: DIMA_OPENROUTER_API_KEY
    timeout-minutes: 55
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      P12X_METABOT_PROVIDER: openrouter/openai/gpt-5.6-luna
      P12X_WAREHOUSE_OWNER_PASSWORD: boyahane-owner-lab
      BOYAHANE_READONLY_PASSWORD: boyahane-readonly-lab
      P12X_MB_APP_PASSWORD: metabase-app-lab
      MB_ADMIN_EMAIL: admin@p12x.local
      MB_ADMIN_PASSWORD: DimaP12xAdmin2026!
      MB_RESTRICTED_EMAIL: restricted@p12x.local
      MB_RESTRICTED_PASSWORD: DimaP12xRestricted2026!
      MB_RESTRICTED_GROUP: Dima P12X Restricted
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v4
        with:
          path: platform

      - name: Checkout exact Boyahane fixture
        uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: f0c4a6b053ead52ca2eac80002c448323dc34a35
          path: boyahane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab dependencies
        run: pip install "duckdb==1.4.3" "psycopg[binary]==3.3.3" "httpx>=0.27,<1"

      - name: Start pinned lab databases
        working-directory: platform/backend/lab/metabase/p12x
        run: |
          docker compose -f docker-compose.x1.yml up -d analytics-db metabase-app-db-pinned
          for i in $(seq 1 90); do
            if pg_isready -h 127.0.0.1 -p 55442 -U boyahane_owner -d boyahane >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Import exact Boyahane snapshot into PostgreSQL
        env:
          SOURCE_DATABASE: ${{ github.workspace }}/boyahane/data/boyahane.duckdb
          PGHOST: 127.0.0.1
          PGPORT: "55442"
          PGDATABASE: boyahane
          PGUSER: boyahane_owner
          PGPASSWORD: boyahane-owner-lab
          BOYAHANE_READONLY_PASSWORD: boyahane-readonly-lab
        run: python boyahane/importer/import_boyahane.py

      - name: Start pinned native Metabase
        working-directory: platform/backend/lab/metabase/p12x
        run: docker compose -f docker-compose.x1.yml up -d metabase-pinned

      - name: Bootstrap pinned Metabase with same restricted user
        working-directory: platform/backend
        env:
          METABASE_URL: http://127.0.0.1:3311
          MB_SITE_NAME: Dima P12X Pinned
          ANALYTICS_DB_NAME: boyahane
          ANALYTICS_DB_USER: metabase_boyahane
          ANALYTICS_DB_PASSWORD: boyahane-readonly-lab
        run: python lab/metabase/scripts/bootstrap.py

      - name: Run one native Metabot canary
        working-directory: platform/backend
        run: |
          mkdir -p lab/metabase/p12x/artifacts
          python lab/metabase/p12x/native_probe.py \
            --base-url http://127.0.0.1:3311 \
            --email "$MB_RESTRICTED_EMAIL" \
            --password "$MB_RESTRICTED_PASSWORD" \
            --question "Haziran 2026'da kaç satış siparişi açıldı?" \
            --output lab/metabase/p12x/artifacts/native_canary_pinned.json

      - name: Upload native canary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12x-native-canary-${{ github.sha }}
          path: platform/backend/lab/metabase/p12x/artifacts/native_canary_pinned.json
          if-no-files-found: warn
          retention-days: 30

      - name: Dump runtime logs on failure
        if: failure()
        working-directory: platform/backend/lab/metabase/p12x
        run: docker compose -f docker-compose.x1.yml logs --no-color --tail=500 metabase-pinned analytics-db metabase-app-db-pinned || true

      - name: Teardown
        if: always()
        working-directory: platform/backend/lab/metabase/p12x
        run: docker compose -f docker-compose.x1.yml down -v --remove-orphans || true

