name: dima-metabase-p13d-provider-free

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/native_standard/**"
      - "backend/app/v3/native_execution.py"
      - "backend/tests/test_v3_p13d_native_standard.py"
      - ".github/workflows/dima-metabase-p13d-provider-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohesive-provider-free:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p13d-seal]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile cohesive P13D trust slice
        working-directory: backend
        run: |
          python -m py_compile             app/v3/native_standard/contracts.py             app/v3/native_standard/trust.py             app/v3/native_execution.py             tests/test_v3_p13d_native_standard.py

      - name: P13D cohesive attack matrix
        working-directory: backend
        run: pytest -q tests/test_v3_p13d_native_standard.py

      - name: Focused sealed-boundary regressions
        working-directory: backend
        run: |
          pytest -q             tests/test_v3_p13c_native_standard.py             tests/test_v3_p13b_native_standard.py             tests/test_v3_p13_native_trust.py             tests/test_v3_p10_security_identity.py
