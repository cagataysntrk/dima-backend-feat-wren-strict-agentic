name: dima-v1-phase1-p12-live

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/eval/v1/authorizations/phase1-p12-live-001.json"
  workflow_dispatch:
    inputs:
      confirm_current_phase1_benchmark:
        description: "Type YES to authorize the current 30-case Phase-1 benchmark"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
      max_total_model_units:
        description: "Hard observable model-boundary ceiling"
        required: true
        default: "180"
        type: string

permissions:
  contents: read

concurrency:
  group: dima-v1-phase1-p12-live
  cancel-in-progress: false

jobs:
  p12-live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Resolve exact live authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path("backend/eval/v1/authorizations/phase1-p12-live-001.json")
          item=json.loads(path.read_text(encoding="utf-8"))
          assert item["schema_version"]=="dima_v1_phase1_live_authorization_v1"
          assert item["mode"]=="ROUND2_ALL"
          assert item["case_count"]==30
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          assert item["candidate_product_sha"]==parent,(item["candidate_product_sha"],parent)
          assert item["engine_sha"]=="cbe313af9ac2d5960f662068e433d328d896fb06"
          assert item["round2_manifest_blob"]=="b08fbf6601b8c47a6f336c4efcc0cdab95a6c2da"
          assert item["round2_fixture_blob"]=="44c02edee3333ddd048e8f7d9aeb94dcd399ad7c"
          ceiling=int(item["max_total_model_units"])
          assert 1 <= ceiling <= 180
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"candidate_sha={parent}\n")
              out.write(f"max_units={ceiling}\n")
          PY
          else
            test "${{ inputs.confirm_current_phase1_benchmark }}" = "YES"
            test "${{ inputs.max_total_model_units }}" -ge 1
            test "${{ inputs.max_total_model_units }}" -le 180
            echo "candidate_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "max_units=${{ inputs.max_total_model_units }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Guard frozen corpus and current candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/eval/dima_neutral_feature_benchmark_round2.json)" = "b08fbf6601b8c47a6f336c4efcc0cdab95a6c2da"
          test "$(git rev-parse HEAD:backend/eval/round2_neutral_machine_fixture.json)" = "44c02edee3333ddd048e8f7d9aeb94dcd399ad7c"
          test "$(git ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"

      - name: Prepare pinned engine
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init engine/metabase
          test "$(git -C engine/metabase rev-parse HEAD)" = "cbe313af9ac2d5960f662068e433d328d896fb06"

      - name: Start isolated engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .round2-runtime
          docker run -d --rm --name dima-v1-phase1-p12-engine             -p 3000:3000             -e MB_DB_TYPE=h2             -e MB_DB_FILE=/metabase-data/metabase.db             -v "$PWD/.round2-runtime:/metabase-data"             ghcr.io/cagataysntrk/metabase-dima@sha256:40e9a44b711266b18d38dd4fdddf2494232c4748003891d9fe4dde80e755e462
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs dima-v1-phase1-p12-engine
          exit 1

      - name: Seed neutral fixture
        working-directory: backend
        env:
          DIMA_ROUND2_BASE_URL: http://127.0.0.1:3000
        run: python lab/metabase/core_b/runtime/seed_round2_fixture.py

      - name: Run current Phase-1 30-case benchmark
        working-directory: backend
        shell: bash
        env:
          DIMA_ROUND2_BASE_URL: http://127.0.0.1:3000
          DIMA_ROUND2_EMAIL: dima-round2@example.com
          DIMA_ROUND2_PASSWORD: DimaRound2-Only-2026!
        run: |
          set -euo pipefail
          mkdir -p eval/v1/artifacts
          python lab/metabase/core_b/round2_feature_benchmark.py             --base-url "$DIMA_ROUND2_BASE_URL"             --email "$DIMA_ROUND2_EMAIL"             --password "$DIMA_ROUND2_PASSWORD"             --manifest eval/dima_neutral_feature_benchmark_round2.json             --output eval/v1/artifacts/phase1_round2_current.json             --control-db eval/v1/artifacts/phase1_round2_control.sqlite             --engine-sha cbe313af9ac2d5960f662068e433d328d896fb06             --upstream-sha 0a476b1b5914fcf83195bc00935a65a7e40f2e48             --runtime-tag 0.63.18-dima.6             --runtime-image-digest sha256:40e9a44b711266b18d38dd4fdddf2494232c4748003891d9fe4dde80e755e462             --build-identity github-actions:36042062775:cbe313af9ac2d5960f662068e433d328d896fb06             --image-identity ghcr.io/cagataysntrk/metabase-dima@sha256:40e9a44b711266b18d38dd4fdddf2494232c4748003891d9fe4dde80e755e462             --platform-sha "${{ steps.auth.outputs.candidate_sha }}"             --max-total-model-units "${{ steps.auth.outputs.max_units }}"

      - name: Enforce Phase-1 benchmark acceptance
        working-directory: backend
        run: |
          python eval/v1/validate_phase1_round2.py             --report eval/v1/artifacts/phase1_round2_current.json             --min-pass-percent 90             --max-total-model-units "${{ steps.auth.outputs.max_units }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dima-v1-phase1-p12-live-${{ github.run_id }}
          path: |
            backend/eval/v1/artifacts/phase1_round2_current.json
            backend/eval/v1/artifacts/phase1_round2_control.sqlite
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup
        if: always()
        shell: bash
        run: docker rm -f dima-v1-phase1-p12-engine >/dev/null 2>&1 || true
