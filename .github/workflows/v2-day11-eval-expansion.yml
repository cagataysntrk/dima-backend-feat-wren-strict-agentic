name: v2-day11-eval-expansion

"on":
  push:
    branches:
      - feat/ask-v2-mvp
    paths:
      - "backend/eval/v2_day11_eval_expansion_manifest.json"
      - "backend/tests/test_v2_day11_eval_expansion.py"
      - ".github/workflows/v2-day11-eval-expansion.yml"
  workflow_dispatch:

jobs:
  provider-free-day11-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Day11 coverage manifest and holdout separation
        working-directory: backend
        run: pytest -q tests/test_v2_day11_eval_expansion.py

      - name: Day11 metamorphic invariant gate
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day7_obligation_local_semantic_recovery.py::test_source_truth_owner_order_permutation_does_not_change_canonical_truth \
            tests/test_v2_day7_obligation_local_semantic_recovery.py::test_source_truth_candidate_order_permutation_keeps_selected_identity \
            tests/test_v2_day7_obligation_local_semantic_recovery.py::test_source_truth_same_source_different_kind_does_not_share_decision \
            tests/test_v2_day6_5_preacceptance_protocol.py::test_d10_q_scope_group_generation_is_permutation_stable_and_excludes_excluded \
            tests/test_v2_day6_5_preacceptance_protocol.py::test_d10_q_unique_full_cover_classifier_is_permutation_invariant \
            tests/test_v2_day10_s_action_availability.py::test_candidate_order_permutation_does_not_change_action_set_identity \
            tests/test_v2_day10_continuation.py::test_versioned_report_supersedes_without_mutating_prior_report

      - name: Day11 negative owner-boundary attacks
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v2_day7_obligation_local_semantic_recovery.py::test_prior_turn_governed_handle_is_not_current_turn_candidate_context \
            tests/test_v2_day10_s_action_availability.py::test_multi_root_never_produces_cross_parent_handle_or_evidence_combinations \
            tests/test_v2_day10_continuation.py::test_registry_revalidates_current_principal_and_exact_section_identity \
            tests/test_v2_day10_continuation.py::test_tampered_and_foreign_context_tokens_fail_closed \
            tests/test_v2_day10_s_action_availability.py::test_action_ref_is_state_bound_and_stale_choice_fails_closed \
            tests/test_v2_day10_s_action_availability.py::test_invented_action_ref_fails_closed \
            tests/test_v2_day7_research_tool_contract.py::test_task_tool_mismatch_is_rejected_before_execution \
            tests/test_v2_day10_s_action_availability.py::test_resolve_semantics_parent_cannot_select_sibling_evidence \
            tests/test_v2_day8_hypothesis_ledger.py::test_unrelated_obligation_evidence_is_rejected \
            tests/test_v2_day10_directive_lifecycle.py::test_action_availability_projects_only_parent_lineage_evidence_for_open_directive \
            tests/test_v2_day10_continuation.py::test_report_presentation_obligation_cannot_become_analytical_directive_parent \
            tests/test_v2_day9_report_builder.py::test_finding_with_missing_derived_parent_lineage_never_becomes_cached_truth \
            tests/test_v2_day10_continuation.py::test_evicted_or_missing_registry_context_requires_rebind

      - name: Existing external holdout attestation contract
        working-directory: backend
        run: pytest -q tests/test_v2_day6_5_holdout_freeze.py

      - name: Assert no certification corpus was executed
        run: |
          test ! -e backend/lab/reports/v2_day6_5_dev80.json
          test ! -e backend/lab/reports/v2_day6_5_validation50.json
          test ! -e backend/lab/reports/v2_day6_5_hidden50.json
