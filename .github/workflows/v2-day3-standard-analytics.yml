name: v2-day3-standard-analytics

"on":
  workflow_dispatch:

concurrency:
  group: v2-day3-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  day3-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_LLM_PROVIDER: "rule"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend + dev dependencies
        run: pip install -e ".[dev]"

      - name: Focused Day 3 contracts and real-Wren smoke only
        run: pytest -q tests/test_v2_day3.py
