# R8 dima.8 provider-free closure trigger
name: dima-metabase-core-b-focused

on:
  push:
    branches:
      - feat/dima-metabase-platform
      - recovery/core-b-root-v2
    paths:
      - "backend/app/v3/product/**"
      - "backend/app/v3/research.py"
      - "backend/app/v3/research_analytical_scope.py"
      - "backend/app/v3/research_manager.py"
      - "backend/app/v3/research_product.py"
      - "backend/app/v3/research_followup.py"
      - "backend/app/v3/research_native_gateway.py"
      - "backend/app/v3/report_document.py"
      - "backend/app/v3/business_relationship_v1.py"
      - "backend/app/v3/research_intake.py"
      - "backend/app/v3/research_manager_provider.py"
      - "backend/app/v3/hypothesis_root_cause.py"
      - "backend/app/v3/hypothesis_root_cause_v1.py"
      - "backend/app/v3/hypothesis_root_cause_provider.py"
      - "backend/tests/test_v3_research_intake.py"
      - "backend/tests/test_v3_p14_native_gateway.py"
      - "backend/tests/test_v3_p17_autonomous_provider_schema.py"
      - "backend/tests/test_v3_p17_research_manager.py"
      - "backend/tests/test_v3_p19_provider.py"
      - "backend/tests/test_v3_v1_wave_b_b1.py"
      - "backend/tests/test_v3_v1_wave_b_b2.py"
      - "backend/tests/test_v3_v1_scope_integration.py"
      - "backend/tests/test_v3_product_*.py"
      - "backend/tests/test_v3_core_b_closure_v2.py"
      - "backend/tests/test_v3_owner_scoped_must_accounting.py"
      - "backend/lab/metabase/core_b/live_sentinel_v2.py"
      - "backend/eval/core_b/**"
      - "backend/product_contracts/**"
      - "backend/belgeler/metabase/DIMA_METABASE_CORE_B_CLOSURE_RECEIPT.md"
      - ".github/workflows/dima-metabase-core-b-focused.yml"
      - ".github/workflows/dima-metabase-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-b-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile Core B product package
        working-directory: backend
        run: |
          python -m py_compile app/v3/product/*.py
          python -m py_compile app/v3/research_manager.py
          python -m py_compile app/v3/hypothesis_root_cause.py
          python -m py_compile app/v3/hypothesis_root_cause_v1.py
          python -m py_compile app/v3/business_relationship_v1.py
          python -m py_compile app/v3/product/execution_mode.py
          python -m py_compile app/v3/report_document.py
          python -m py_compile tests/test_v3_product_contracts.py
          python -m py_compile tests/test_v3_product_composition.py
          python -m py_compile tests/test_v3_product_process_manager.py
          python -m py_compile tests/test_v3_core_b_closure_v2.py
          python -m py_compile tests/test_v3_owner_scoped_must_accounting.py
          python -m py_compile tests/test_v3_research_intake.py
          python -m py_compile tests/test_v3_p19_provider.py

      - name: Core B product focused proof
        working-directory: backend
        run: pytest -q tests/test_v3_product_contracts.py tests/test_v3_product_composition.py tests/test_v3_product_process_manager.py tests/test_v3_core_b_closure_v2.py tests/test_v3_owner_scoped_must_accounting.py tests/test_v3_research_intake.py tests/test_v3_p19_provider.py

      - name: Wave-B B1 P6-P8 focused proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_product_process_manager.py \
            tests/test_v3_v1_wave_b_b1.py

      - name: Wave-B B2 P9-P11 focused proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_v1_wave_b_b2.py \
            tests/test_v3_v1_scope_integration.py \
            tests/test_v3_product_composition.py

      - name: Sealed P14-P20 affected regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_v3_p14_research.py \
            tests/test_v3_p16_claim_lineage.py \
            tests/test_v3_p17_research_manager.py \
            tests/test_v3_p17_autonomous_provider_schema.py \
            tests/test_v3_p18_business_relationship_policy.py \
            tests/test_v3_p19_hypothesis_root_cause.py \
            tests/test_v3_p19_provider.py \
            tests/test_v3_p20_report_document.py \
            tests/test_v3_v1_scope_integration.py

      - name: Guard projection-only architecture
        working-directory: backend
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root=Path("app/v3/product")
          forbidden=("sqlmodel","sqlalchemy","numpy","pandas","scipy","statistics","app.v3.substrate.metabase")
          for path in root.glob("*.py"):
              src=path.read_text(encoding="utf-8")
              tree=ast.parse(src)
              imports=set()
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      imports.update(a.name for a in node.names)
                  elif isinstance(node,ast.ImportFrom):
                      imports.add(node.module or "")
              assert not any(name.startswith(forbidden) for name in imports),(path,imports)
              assert "action:execute" not in src
              forbidden_calls={
                  node.func.id
                  for node in ast.walk(tree)
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Name)
              }
              assert "Session" not in forbidden_calls,(path,forbidden_calls)
              assert "select" not in forbidden_calls,(path,forbidden_calls)
          PY
          test ! -d frontend
          test ! -d ui
          test ! -d web
          test "$(git -C .. ls-tree HEAD engine/metabase | awk '{print $3}')" = "0f16f2b5a1ec774ac7afee6214c726e82f9ceb3c"


      # Wave-A P2 scope authority was formally reopened and re-sealed by
      # DMP-DEC-0064. Core-A final closure 36339715760 = SUCCESS; keep the
      # exact re-authorized owner blobs aligned with that sealed authority.
      - name: Guard sealed P14-P21 owner blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/app/v3/research_product.py)" = "0370635ec046c88532c8ae70e49efc5126404489"
          # P17 root-recovery semantics remain sealed by DMP-DEC-0061.
          # Wave-B B1 typed downstream re-entry and the P19 identity extension
          # were re-proved under DMP-DEC-0066 before this exact P19 re-pin.
          grep -q 'InvestigationBranchBehavior.GLOBAL_CONTROL' backend/app/v3/research_manager.py
          grep -q 'P17_BRANCH_TERMINAL' backend/app/v3/research_manager.py
          test "$(git rev-parse HEAD:backend/app/v3/business_relationship_policy.py)" = "1c533667bd080331f4f2231b9d37ee0c5e532fa8"
          test "$(git rev-parse HEAD:backend/app/v3/hypothesis_root_cause.py)" = "fb6c4bfe17cd4193b9584b79fa32b63dc6c85563"
          test "$(git rev-parse HEAD:backend/app/v3/report_document.py)" = "c2d1e266c4a7335bf7c62349b3229d7a55a38bee"
          test "$(git rev-parse HEAD:backend/app/v3/decision_intelligence.py)" = "1a40508048d668829344ca30aa7aadf881cebb82"
          test "$(git rev-parse HEAD:backend/app/v3/claim_lineage.py)" = "76589172d19d4d9ffa1db9f94f4ee9ee9f277e5a"
          test "$(git rev-parse HEAD:backend/app/v3/research.py)" = "fff345ee965ccbe3676f49e02d44dbcd8217379e"
          test "$(git rev-parse HEAD:backend/app/v3/research_store.py)" = "659664fa6c8c98e724adb45025ec5e69b9fd7cea"
