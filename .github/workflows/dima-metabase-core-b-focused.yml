name: dima-metabase-core-b-focused

on:
  push:
    branches:
      - feat/dima-metabase-platform
    paths:
      - "backend/app/v3/product/**"
      - "backend/tests/test_v3_product_*.py"
      - "backend/eval/core_b/**"
      - "backend/product_contracts/**"
      - "backend/belgeler/metabase/DIMA_METABASE_CORE_B_CLOSURE_RECEIPT.md"
      - ".github/workflows/dima-metabase-core-b-focused.yml"
      - ".github/workflows/dima-metabase-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-b-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMA_VQR_EMBEDDER: "off"
      DIMA_SCHEDULER_ENABLED: "false"
      DIMA_INTERACTION_LOG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install canonical test environment
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile Core B product package
        working-directory: backend
        run: |
          python -m py_compile app/v3/product/*.py
          python -m py_compile tests/test_v3_product_contracts.py
          python -m py_compile tests/test_v3_product_composition.py

      - name: Core B product focused proof
        working-directory: backend
        run: pytest -q tests/test_v3_product_contracts.py tests/test_v3_product_composition.py

      - name: Guard projection-only architecture
        working-directory: backend
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root=Path("app/v3/product")
          forbidden=("sqlmodel","sqlalchemy","numpy","pandas","scipy","statistics","app.v3.substrate.metabase")
          for path in root.glob("*.py"):
              src=path.read_text(encoding="utf-8")
              tree=ast.parse(src)
              imports=set()
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      imports.update(a.name for a in node.names)
                  elif isinstance(node,ast.ImportFrom):
                      imports.add(node.module or "")
              assert not any(name.startswith(forbidden) for name in imports),(path,imports)
              assert "action:execute" not in src
              forbidden_calls={
                  node.func.id
                  for node in ast.walk(tree)
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Name)
              }
              assert "Session" not in forbidden_calls,(path,forbidden_calls)
              assert "select" not in forbidden_calls,(path,forbidden_calls)
          PY
          test ! -d frontend
          test ! -d ui
          test ! -d web
          test "$(git -C .. ls-tree HEAD engine/metabase | awk '{print $3}')" = "cbe313af9ac2d5960f662068e433d328d896fb06"


      - name: Guard sealed P14-P21 owner blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/app/v3/research_product.py)" = "5e42d2a095b00fb21229971bde4c424cdb22e33c"
          test "$(git rev-parse HEAD:backend/app/v3/research_manager.py)" = "d9a2a83e3f5e678870a2ecbaf330ccb81edb73d7"
          test "$(git rev-parse HEAD:backend/app/v3/business_relationship_policy.py)" = "1c533667bd080331f4f2231b9d37ee0c5e532fa8"
          test "$(git rev-parse HEAD:backend/app/v3/hypothesis_root_cause.py)" = "19e4f8a2403c7e133137c106c58fa61959c4ceff"
          test "$(git rev-parse HEAD:backend/app/v3/report_document.py)" = "5c7f199c16763a95d255b1b7f083bc61310b453e"
          test "$(git rev-parse HEAD:backend/app/v3/decision_intelligence.py)" = "1a40508048d668829344ca30aa7aadf881cebb82"
          test "$(git rev-parse HEAD:backend/app/v3/claim_lineage.py)" = "76589172d19d4d9ffa1db9f94f4ee9ee9f277e5a"
          test "$(git rev-parse HEAD:backend/app/v3/research.py)" = "44286dee6b6bf5eb2cb8f88866f46007f266b6ab"
          test "$(git rev-parse HEAD:backend/app/v3/research_store.py)" = "dc08a38920ea0e330de124ad93a5b467e48968cd"
