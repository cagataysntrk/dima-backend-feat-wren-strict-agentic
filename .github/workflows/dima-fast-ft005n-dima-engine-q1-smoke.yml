name: dima-fast-ft005n-dima-engine-q1-smoke

on:
  push:
    branches:
      - feat/dima-metabase-product-fast-track
    paths:
      - ".github/workflows/dima-fast-ft005n-dima-engine-q1-smoke.yml"
      - "backend/lab/ft005n/compose.dima-engine-06318-dima0.yaml"
      - "backend/lab/ft005n/bootstrap_boyahane.py"
      - "backend/lab/ft005n/native_stream.py"
      - "backend/lab/ft005n/native_q1_smoke.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  canonical-engine-native-q1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: DIMA_OPENROUTER_API_KEY
    env:
      DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      METABASE_URL: http://localhost:3301
      METABASE_BIND_PORT: "3301"
      POSTGRES_BIND_PORT: "55436"
      BOYAHANE_OWNER_PASSWORD: "ft005n-owner-password"
      BOYAHANE_READONLY_PASSWORD: "ft005n-readonly-password"
      METABASE_DB_PASSWORD: "ft005n-metabase-app-password"
      FT005N_ADMIN_EMAIL: "admin@dima-native.local"
      FT005N_ADMIN_PASSWORD: "DimaNativeControl!2026"
      FT005N_NATIVE_MODEL: "openai/gpt-5.6-luna"
      FT005N_RUNTIME_VERSION: "0.63.18-dima.0"
      FT005N_RUNTIME_IMAGE_DIGEST: "sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b"
      FT005N_RUNTIME_ARM: "DIMA_CANONICAL_ENGINE_NATIVE_METABOT"
      FT005N_NATIVE_SMOKE_RECEIPT: "backend/lab/ft005n/artifacts/dima-engine-native-q1-smoke.json"

    steps:
      - name: Checkout Fast certification runner
        uses: actions/checkout@v4

      - name: Checkout frozen Boyahane control
        uses: actions/checkout@v4
        with:
          repository: cagataysntrk/metabase-boyahane
          ref: f0c4a6b053ead52ca2eac80002c448323dc34a35
          path: boyahane-control

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install certification dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Require engine-owned OpenRouter credential
        run: test -n "$DIMA_OPENROUTER_API_KEY"

      - name: Prepare isolated Boyahane environment
        shell: bash
        run: |
          cat > boyahane-control/.env <<EOF
          BOYAHANE_OWNER_PASSWORD=$BOYAHANE_OWNER_PASSWORD
          BOYAHANE_READONLY_PASSWORD=$BOYAHANE_READONLY_PASSWORD
          METABASE_DB_PASSWORD=$METABASE_DB_PASSWORD
          POSTGRES_BIND_PORT=$POSTGRES_BIND_PORT
          METABASE_BIND_PORT=$METABASE_BIND_PORT
          EOF

      - name: Verify canonical engine compose pin
        shell: bash
        run: |
          set -euo pipefail
          docker compose             --project-directory boyahane-control             --env-file boyahane-control/.env             -f boyahane-control/compose.yaml             -f "$GITHUB_WORKSPACE/backend/lab/ft005n/compose.dima-engine-06318-dima0.yaml"             config > /tmp/dima-engine-compose.yml
          grep -F "ghcr.io/upcytech/dima-metabase-engine@sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b" /tmp/dima-engine-compose.yml

      - name: Pull exact canonical engine
        run: docker pull ghcr.io/upcytech/dima-metabase-engine@sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b

      - name: Start canonical Dima engine over frozen Boyahane
        shell: bash
        run: |
          set -euo pipefail
          docker compose             --project-directory boyahane-control             --env-file boyahane-control/.env             -f boyahane-control/compose.yaml             -f "$GITHUB_WORKSPACE/backend/lab/ft005n/compose.dima-engine-06318-dima0.yaml"             up -d --build

          for i in $(seq 1 150); do
            if curl -fsS http://localhost:3301/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Canonical Dima engine health timeout"
          exit 1

      - name: Verify running canonical engine identity
        shell: bash
        run: |
          set -euo pipefail
          cid="$(
            docker compose               --project-directory boyahane-control               --env-file boyahane-control/.env               -f boyahane-control/compose.yaml               -f "$GITHUB_WORKSPACE/backend/lab/ft005n/compose.dima-engine-06318-dima0.yaml"               ps -q metabase
          )"
          test -n "$cid"
          configured="$(docker inspect "$cid" --format '{{.Config.Image}}')"
          echo "configured_image=$configured"
          test "$configured" = "ghcr.io/upcytech/dima-metabase-engine@sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b"

      - name: Configure stock-supported native Metabot surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/lab/ft005n/artifacts
          python backend/lab/ft005n/bootstrap_boyahane.py             | tee backend/lab/ft005n/artifacts/dima-engine-native-bootstrap.jsonl

      - name: Run canonical engine native Q1
        run: python backend/lab/ft005n/native_q1_smoke.py

      - name: Assert canonical receipt identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("backend/lab/ft005n/artifacts/dima-engine-native-q1-smoke.json")
          data = json.loads(path.read_text())
          assert data["status"] == "GREEN", data
          assert data["outcome"] == "ENDPOINT_AVAILABLE", data
          assert data["arm"] == "DIMA_CANONICAL_ENGINE_NATIVE_METABOT", data
          assert data["metabase_runtime"] == "0.63.18-dima.0", data
          assert data["image_digest"] == "sha256:674d1ac4a929b95ab476bcdf37baa43099b398c444bc3f53fef404318892554b", data
          assert data["requested_model"] == "openai/gpt-5.6-luna", data
          assert data["license_bypass"] is False, data
          assert data["feature_gate_patch"] is False, data
          assert data["metabase_source_patch"] is False, data
          PY

      - name: Upload canonical engine native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dima-canonical-engine-native-q1-${{ github.sha }}
          path: |
            backend/lab/ft005n/artifacts/dima-engine-native-bootstrap.jsonl
            backend/lab/ft005n/artifacts/dima-engine-native-q1-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show safe receipt
        if: always()
        run: |
          test ! -f backend/lab/ft005n/artifacts/dima-engine-native-q1-smoke.json || cat backend/lab/ft005n/artifacts/dima-engine-native-q1-smoke.json

      - name: Teardown isolated certification runtime
        if: always()
        shell: bash
        run: |
          docker compose             --project-directory boyahane-control             --env-file boyahane-control/.env             -f boyahane-control/compose.yaml             -f "$GITHUB_WORKSPACE/backend/lab/ft005n/compose.dima-engine-06318-dima0.yaml"             down -v --remove-orphans || true
