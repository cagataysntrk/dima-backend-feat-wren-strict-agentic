name: dima-brain-v2-1-root-recovery-panel

on:
  push:
    branches:
      - feat/dima-brain-v2-1-specification-closure
    paths:
      - ".github/BRAIN_V21_ROOT_RECOVERY_PANEL_TRIGGER"

permissions:
  contents: read
  packages: read

env:
  DIMA_OPENROUTER_API_KEY: ${{ secrets.DIMA_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  METABOT_MODEL_IDENTIFIER: openrouter/openai/gpt-5.6-luna
  DIMA_COGNITION_MODEL: openai/gpt-5.6-luna
  MB_ADMIN_EMAIL: admin@brain-v2-recovery.local
  MB_RESTRICTED_EMAIL: restricted@brain-v2-recovery.local
  MB_RESTRICTED_GROUP: Dima Brain V2 Recovery Restricted
  PROVIDER_PROXY_PORT: "8799"
  HARD_PROVIDER_REQUEST_CEILING: "30"
  PROMPT_TOKEN_CEILING: "450000"
  COMPLETION_TOKEN_CEILING: "50000"
  REASONING_TOKEN_CEILING: "35000"
  PROVIDER_COST_CEILING: "0.40"

concurrency:
  group: dima-brain-v2-1-root-recovery-panel
  cancel-in-progress: true

jobs:
  recovery-case:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot_id:
          - R11_CONTINUATION_DEEPENING

    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DIMA_OPENROUTER_API_KEY

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 128
          submodules: false

      - name: Verify single-wave root recovery authorization
        id: auth
        shell: bash
        env:
          SLOT_ID: ${{ matrix.slot_id }}
        run: |
          set -euo pipefail
          AUTH="backend/lab/metabase/brain_v2/root_recovery_panel_authorization.json"
          mkdir -p backend/eval/root_recovery_config
          python - "$AUTH" "$SLOT_ID" "$GITHUB_OUTPUT" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          auth = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          slot_id = sys.argv[2]
          out = Path(sys.argv[3])
          assert auth["schema_version"] == "dima_brain_v2_1_root_recovery_panel_v1"
          assert auth["enabled"] is True
          assert auth["provider_free_status"] == "GREEN"
          assert int(auth["generated_metamorphic_scenarios"]) >= 100
          assert len(auth["slots"]) == 12
          assert auth["panel_policy"]["case_count"] == 12
          assert auth["panel_policy"]["minimum_score_each"] == 3
          assert auth["panel_policy"]["minimum_full_4_of_4"] == 8
          assert auth["broad_paid_allowed"] is False
          assert auth["thirty_case_allowed"] is False
          assert auth["frontend_allowed"] is False
          assert auth["engine_sha"] == "686671fa7e55f715e4fb5ac155f9e66019fd12d8"
          assert auth["engine_release"] == "0.63.18-dima.11.2"
          assert auth["engine_runtime_tag"] == "v0.63.18-dima.11.2.1"
          assert auth["engine_digest"] == "sha256:fe1b6fb67be6dbadea1af5d415f3ba2e033d46f91289f5c3c9844bee20c379bd"
          for key in (
              "provider_free_focused_run_id",
              "provider_free_semantic_run_id",
              "provider_free_frozen_run_id",
          ):
              assert int(auth[key]) > 0
          slots = {item["slot_id"]: item for item in auth["slots"]}
          assert len(slots) == 12
          assert slot_id in slots
          slot = slots[slot_id]
          candidate = auth["candidate_product_sha"]
          assert isinstance(candidate, str) and len(candidate) == 40
          assert all(ch in "0123456789abcdef" for ch in candidate)

          subprocess.run(["git", "cat-file", "-e", candidate + "^{commit}"], check=True)
          subprocess.run(
              [
                  "git", "diff", "--exit-code", candidate + "..HEAD", "--",
                  "backend/app", "backend/pyproject.toml", "engine/metabase",
              ],
              check=True,
          )

          override_type = slot.get("override_type", "none")
          override_path = ""
          if override_type == "question":
              override_path = f"backend/eval/root_recovery_config/{slot_id}.txt"
              Path(override_path).write_text(
                  str(slot["override"]).strip() + "\n",
                  encoding="utf-8",
              )
          elif override_type == "turns":
              override_path = f"backend/eval/root_recovery_config/{slot_id}.json"
              Path(override_path).write_text(
                  json.dumps(slot["override"], ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          else:
              assert override_type == "none"

          with out.open("a", encoding="utf-8") as handle:
              handle.write(f"slot_id={slot_id}\n")
              handle.write(f"case_id={slot['case_id']}\n")
              handle.write(f"family={slot['family']}\n")
              handle.write(f"shape={slot['shape']}\n")
              handle.write(f"override_type={override_type}\n")
              handle.write(f"override_path={override_path}\n")
              handle.write(f"candidate_sha={candidate}\n")
          print("authorized", slot_id, slot["case_id"], slot["family"], slot["shape"])
          PY
          test -n "$DIMA_OPENROUTER_API_KEY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Recovery harness provider-free preflight
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile lab/metabase/brain_v2/spec_closure_recovery_live.py
          pytest -q tests/test_v3_brain_v2_spec_closure_recovery_live.py

      - name: Derive ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          S="${GITHUB_SHA:0:12}"
          {
            echo "MB_ADMIN_PASSWORD=Adm-${S}-Aa1!"
            echo "MB_RESTRICTED_PASSWORD=Res-${S}-Aa1!"
            echo "PG_OWNER_PASSWORD=PgO-${S}-Aa1!"
            echo "CORE_B_READONLY_PASSWORD=PgR-${S}-Aa1!"
            echo "MB_APP_PASSWORD=MbA-${S}-Aa1!"
          } >> "$GITHUB_ENV"

      - name: Load exact certified engine runtime lock
        shell: bash
        run: |
          set -euo pipefail
          GITLINK_SHA="$(git ls-tree HEAD engine/metabase | awk '{print $3}')"
          python backend/lab/metabase/core_b/runtime/engine_runtime_lock.py             --lock backend/lab/metabase/core_b/runtime/engine_runtime_lock.json             --gitlink-sha "$GITLINK_SHA"             --github-env "$GITHUB_ENV"

      - name: Pull exact certified dima.11.2 digest
        shell: bash
        run: |
          set -euo pipefail
          test "$ENGINE_SHA" = "686671fa7e55f715e4fb5ac155f9e66019fd12d8"
          test "$CERTIFICATION_RUN_ID" = "37449462486"
          test "$RUNTIME_TAG" = "v0.63.18-dima.11.2.1"
          test "$REGISTRY_DIGEST" = "sha256:fe1b6fb67be6dbadea1af5d415f3ba2e033d46f91289f5c3c9844bee20c379bd"
          docker pull "$IMMUTABLE_IMAGE_REF"
          docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$IMMUTABLE_IMAGE_REF" | grep -Fx "$IMMUTABLE_IMAGE_REF"

      - name: Start fail-closed zero-spend setup proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/eval/brain_v2_root_recovery
          nohup python backend/lab/metabase/core_b/runtime/openrouter_counting_proxy.py             --listen-host 0.0.0.0             --listen-port "$PROVIDER_PROXY_PORT"             --ceiling 0             --receipt backend/eval/brain_v2_root_recovery/provider_setup.json             >backend/eval/brain_v2_root_recovery/provider_setup_proxy.log 2>&1 &
          echo "PROVIDER_PROXY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PROVIDER_PROXY_PORT}/__dima__/health" >/dev/null && break
            sleep 1
            test "$i" -lt 30
          done

      - name: Start neutral databases
        shell: bash
        run: |
          set -euo pipefail
          docker network create dima-brain-v2-recovery
          PG="postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
          docker run -d --name analytics-db             --network dima-brain-v2-recovery --network-alias analytics-db             -p 127.0.0.1:55461:5432             -e POSTGRES_DB=brain_v2_live             -e POSTGRES_USER=brain_v2_owner             -e POSTGRES_PASSWORD="$PG_OWNER_PASSWORD" "$PG"
          docker run -d --name app-db             --network dima-brain-v2-recovery --network-alias app-db             -p 127.0.0.1:55462:5432             -e POSTGRES_DB=metabase_brain_v2             -e POSTGRES_USER=metabase_app             -e POSTGRES_PASSWORD="$MB_APP_PASSWORD" "$PG"
          for n in analytics-db app-db; do
            for i in $(seq 1 90); do
              docker exec "$n" pg_isready >/dev/null 2>&1 && break
              sleep 2
              test "$i" -lt 90
            done
          done

      - name: Seed frozen neutral fixture
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55461"
          PGDATABASE: brain_v2_live
          PGUSER: brain_v2_owner
          PGPASSWORD: ${{ env.PG_OWNER_PASSWORD }}
          CORE_B_READONLY_USER: brain_v2_readonly
          CORE_B_READONLY_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
        run: |
          set -euo pipefail
          python lab/metabase/core_b/runtime/seed_round2_fixture.py             --fixture eval/round2_neutral_machine_fixture.json

      - name: Start exact certified dima.11.2 engine
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mb-brain-v2             --network dima-brain-v2-recovery             --add-host=host.docker.internal:host-gateway             -p 127.0.0.1:3361:3000             -e MB_DB_TYPE=postgres             -e MB_DB_HOST=app-db             -e MB_DB_PORT=5432             -e MB_DB_DBNAME=metabase_brain_v2             -e MB_DB_USER=metabase_app             -e MB_DB_PASS="$MB_APP_PASSWORD"             -e MB_AI_FEATURES_ENABLED=true             -e MB_METABOT_ENABLED=true             -e MB_AGENT_API_ENABLED=false             -e MB_LOAD_SAMPLE_CONTENT=false             -e MB_MCP_EXECUTE_SQL_ENABLED=false             -e MB_LLM_OPENROUTER_API_KEY="$DIMA_OPENROUTER_API_KEY"             -e MB_LLM_OPENROUTER_API_BASE_URL="http://host.docker.internal:${PROVIDER_PROXY_PORT}"             -e MB_LLM_METABOT_PROVIDER="$METABOT_MODEL_IDENTIFIER"             -e DIMA_ENGINE_REPOSITORY=UpcyTech/dima-metabase-engine             -e DIMA_ENGINE_REVISION_SHA="$ENGINE_SHA"             -e DIMA_ENGINE_UPSTREAM_BASE_SHA="$UPSTREAM_BASE_SHA"             -e DIMA_ENGINE_RUNTIME_TAG="$RUNTIME_TAG"             -e DIMA_ENGINE_BUILD_IDENTITY="$BUILD_IDENTITY"             -e DIMA_ENGINE_IMAGE_IDENTITY="$REGISTRY_DIGEST"             "$IMMUTABLE_IMAGE_REF"

      - name: Bootstrap restricted analytical principal
        working-directory: backend
        env:
          METABASE_URL: http://127.0.0.1:3361
          MB_SITE_NAME: Dima Brain V2 Recovery
          ANALYTICS_DB_NAME: brain_v2_live
          ANALYTICS_DB_USER: brain_v2_readonly
          ANALYTICS_DB_PASSWORD: ${{ env.CORE_B_READONLY_PASSWORD }}
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
          MB_RESTRICTED_GROUP: ${{ env.MB_RESTRICTED_GROUP }}
        run: python lab/metabase/core_b/runtime/bootstrap.py

      - name: Exhaust startup provider window at zero spend
        shell: bash
        run: |
          set -euo pipefail
          sleep 16
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("backend/eval/brain_v2_root_recovery/provider_setup.json").read_text())
          assert r["hard_provider_request_ceiling"] == 0
          assert r["actual_provider_request_count"] == 0
          assert r["blocked_request_count"] == 0
          PY

      - name: Create governed native metric resources
        working-directory: backend
        env:
          MB_ADMIN_EMAIL: ${{ env.MB_ADMIN_EMAIL }}
          MB_ADMIN_PASSWORD: ${{ env.MB_ADMIN_PASSWORD }}
          MB_RESTRICTED_EMAIL: ${{ env.MB_RESTRICTED_EMAIL }}
          MB_RESTRICTED_PASSWORD: ${{ env.MB_RESTRICTED_PASSWORD }}
        run: |
          python lab/metabase/core_b/runtime/seed_phase1_pinpoint_metrics.py             --base-url http://127.0.0.1:3361             --fixture eval/round2_neutral_machine_fixture.json             --output eval/brain_v2_root_recovery/native_bindings.json

      - name: Arm bounded per-case provider window
        shell: bash
        env:
          SLOT_ID: ${{ steps.auth.outputs.slot_id }}
        run: |
          set -euo pipefail
          kill "$PROVIDER_PROXY_PID"
          wait "$PROVIDER_PROXY_PID" 2>/dev/null || true
          nohup python backend/lab/metabase/core_b/runtime/openrouter_counting_proxy.py             --listen-host 0.0.0.0             --listen-port "$PROVIDER_PROXY_PORT"             --ceiling "$HARD_PROVIDER_REQUEST_CEILING"             --source-ceiling research_intake=6             --source-ceiling metabase=14             --source-ceiling p17_manager=3             --source-ceiling p18_manager=2             --source-ceiling p19_manager=6             --source-ceiling p20_synthesis=3             --prompt-token-ceiling "$PROMPT_TOKEN_CEILING"             --completion-token-ceiling "$COMPLETION_TOKEN_CEILING"             --reasoning-token-ceiling "$REASONING_TOKEN_CEILING"             --provider-cost-ceiling "$PROVIDER_COST_CEILING"             --receipt "backend/eval/brain_v2_root_recovery/provider_${SLOT_ID}.json"             >"backend/eval/brain_v2_root_recovery/provider_${SLOT_ID}.log" 2>&1 &
          echo "PROVIDER_PROXY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:$PROVIDER_PROXY_PORT/__dima__/health" >/dev/null && break
            sleep 1
            test "$i" -lt 30
          done

      - name: Run exactly one independent recovery shape
        working-directory: backend
        env:
          PYTHONPATH: .
          SLOT_ID: ${{ steps.auth.outputs.slot_id }}
          CASE_ID: ${{ steps.auth.outputs.case_id }}
          OVERRIDE_TYPE: ${{ steps.auth.outputs.override_type }}
          OVERRIDE_PATH: ${{ steps.auth.outputs.override_path }}
          CANDIDATE_SHA: ${{ steps.auth.outputs.candidate_sha }}
          CHECKPOINT_DSN: postgresql://metabase_app:${{ env.MB_APP_PASSWORD }}@127.0.0.1:55462/metabase_brain_v2
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$OVERRIDE_TYPE" = "question" ]; then
            EXTRA+=(--question-override-file "../$OVERRIDE_PATH")
          elif [ "$OVERRIDE_TYPE" = "turns" ]; then
            EXTRA+=(--turns-override-file "../$OVERRIDE_PATH")
          fi
          python lab/metabase/brain_v2/spec_closure_recovery_live.py             --base-url http://127.0.0.1:3361             --email "$MB_RESTRICTED_EMAIL"             --password "$MB_RESTRICTED_PASSWORD"             --binding-manifest eval/brain_v2_root_recovery/native_bindings.json             --manifest eval/dima_neutral_feature_benchmark_round2.json             --output "eval/brain_v2_root_recovery/${SLOT_ID}.json"             --control-db "eval/brain_v2_root_recovery/${SLOT_ID}.db"             --checkpoint-dsn "$CHECKPOINT_DSN"             --provider-proxy-base-url "http://127.0.0.1:${PROVIDER_PROXY_PORT}"             --provider-receipt "eval/brain_v2_root_recovery/provider_${SLOT_ID}.json"             --engine-sha "$ENGINE_SHA"             --upstream-sha "$UPSTREAM_BASE_SHA"             --runtime-tag "$RUNTIME_TAG"             --runtime-image-digest "$REGISTRY_DIGEST"             --build-identity "$BUILD_IDENTITY"             --image-identity "$REGISTRY_DIGEST"             --candidate-product-sha "$CANDIDATE_SHA"             --checkout-sha "$GITHUB_SHA"             --case-id "$CASE_ID"             "${EXTRA[@]}"

      - name: Enforce root-recovery mechanical acceptance
        working-directory: backend
        env:
          SLOT_ID: ${{ steps.auth.outputs.slot_id }}
          CASE_ID: ${{ steps.auth.outputs.case_id }}
          CANDIDATE_SHA: ${{ steps.auth.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          slot=os.environ["SLOT_ID"]
          case_id=os.environ["CASE_ID"]
          candidate=os.environ["CANDIDATE_SHA"]
          r=json.loads(Path(f"eval/brain_v2_root_recovery/{slot}.json").read_text())
          assert r["schema_version"]=="dima_brain_v2_1_recovery_live_v1"
          assert r["candidate_product_sha"]==candidate
          assert r["engine_sha"]=="686671fa7e55f715e4fb5ac155f9e66019fd12d8"
          assert r["selected_case_ids"]==[case_id]
          assert r["case_count"]==1
          assert r["raw_harness_passed"]==1, r
          assert r["raw_harness_failed"]==0, r
          assert r["case_exceptions"]==0, r
          assert r["duplicate_native"]==0, r
          assert r["stale_evidence"]==0, r
          assert r["agent_api_request_count"]==0, r
          provider=r["provider_total"]
          assert provider["actual_provider_request_count"] <= 30, provider
          assert provider["blocked_request_count"] == 0, provider
          assert provider["provider_requests_by_source"].get("p20_synthesis",0) <= case["turn_count_expected"], provider
          case=r["cases"][0]
          assert case["all_turns_executed"] is True, case
          assert case["accepted_terminal"] is True, case
          assert case["mechanical_safety"] is True, case
          assert case["exception"] is None, case

          if slot=="R12_CONTINUATION_REPORT_ONLY":
              turns=case["turns"]
              assert len(turns)==2, turns
              assert turns[0]["scope_version_id"]==turns[1]["scope_version_id"], turns
              assert turns[1]["native_acquisitions"]==turns[0]["native_acquisitions"], turns
              assert turns[1]["report_ref"], turns
          print("ROOT_RECOVERY_CASE_GREEN",slot,case_id,case["terminal_state"])
          PY

      - name: Emit sanitized adjudication projection
        if: always()
        working-directory: backend
        env:
          SLOT_ID: ${{ steps.auth.outputs.slot_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          slot=os.environ["SLOT_ID"]
          p=Path(f"eval/brain_v2_root_recovery/{slot}.json")
          if not p.exists():
              print("DIMA_ROOT_RECOVERY_ADJUDICATION="+json.dumps({"slot_id":slot,"artifact_missing":True}))
              raise SystemExit(0)
          r=json.loads(p.read_text())
          case=(r.get("cases") or [None])[0]
          projection={
              "slot_id":slot,
              "candidate_product_sha":r.get("candidate_product_sha"),
              "engine_sha":r.get("engine_sha"),
              "case":case,
              "provider_total":r.get("provider_total"),
              "duplicate_native":r.get("duplicate_native"),
              "stale_evidence":r.get("stale_evidence"),
              "case_exceptions":r.get("case_exceptions"),
          }
          print("DIMA_ROOT_RECOVERY_ADJUDICATION="+json.dumps(projection,ensure_ascii=False,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dima-brain-v2-1-root-recovery-${{ steps.auth.outputs.slot_id }}-${{ github.run_id }}
          path: |
            backend/eval/brain_v2_root_recovery/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Runtime logs
        if: failure()
        run: docker logs --tail=1500 mb-brain-v2 || true

      - name: Teardown
        if: always()
        run: |
          if [ -n "${PROVIDER_PROXY_PID:-}" ]; then
            kill "$PROVIDER_PROXY_PID" 2>/dev/null || true
          fi
          docker rm -f mb-brain-v2 analytics-db app-db 2>/dev/null || true
          docker network rm dima-brain-v2-recovery 2>/dev/null || true
