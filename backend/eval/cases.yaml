# dima eval vakaları — her vaka beklenen DAVRANIŞLA etiketli (answer/chip/refuse).
# Kaynak: gerçek kullanım logları (logs/chat-*.jsonl) + golden testler + Türkçe varyantlar.
# slice: det = deterministik katman (LLM'siz, CI'da koşar) · llm = canlı model dilimi.
# shape: yalnız verilen anahtarlar denetlenir (cube/measures/dims/gran/filter_ops/...).
# expect_source: cevabın HANGİ KATMANDAN geldiğini denetler (2 Ağustos 2026). Ham ad
#   ("cube", "cube+llm", "vqr") ya da yol sınıfı ("intent", "cache", "discovery",
#   "deterministic", "any") kabul edilir. Neden gerekli: `classify()` source dolu olan
#   HER şeyi "answer" sayar, yani bir soru cube yolundan Discovery'ye kayarsa precision
#   ve coverage AYNI kalır ve regresyon SESSİZ geçer — oysa Discovery cevabında chip,
#   kırılım, drill ve always_filter YOKTUR. Toplam pay ayrıca `deterministic_share`
#   metriğiyle ve tests/test_eval_gate.py'deki kapıyla korunur.

# ── OEE: deterministik cevaplar ─────────────────────────────────────────────
- id: oee-makine
  q: makine bazında ortalama oee bu yıl
  tags: [oee, kirilim]
  expect: answer
  expect_source: cube
  shape: {cube: oee, measures: [ort_oee], dims: [makine], filter_ops: [gte]}
- id: oee-randiman-cihaz
  q: cihaz bazında randıman bu yıl
  tags: [oee, sinonim]
  expect: answer
  shape: {cube: oee, measures: [ort_oee], dims: [makine]}
- id: oee-durus-tezgah
  q: tezgah bazında duruş bu yıl
  tags: [oee, sinonim]
  expect: answer
  shape: {cube: oee, measures: [toplam_durus_dakika], dims: [makine]}
- id: oee-vardiya-gun
  q: vardiya ve haftanın günü bazında verimlilik son 3 ay
  tags: [oee, kirilim, tarih-goreli]
  expect: answer
  shape: {cube: oee, dims_has: [vardiya, hafta_gunu], filter_ops: [gte]}
# Kişi-verimliliği + demografi parti cube'unda (operatör→personel köprüsü); OEE makine
# metriğidir, kişi taşımaz (47-tablo şema, 2026-07-29).
