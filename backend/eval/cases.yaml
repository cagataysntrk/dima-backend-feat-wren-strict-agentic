# ── Chip'ler (şüphe → netleştirme) ──────────────────────────────────────────
- id: chip-donem
  q: toplam üretim
  tags: [chip-donem]
  # ⟳ POLİTİKA DEVRİ (`D3` → `§TZ`, 2026-08-10): dönemsiz soru artık NETLEŞTİRME
  # değil, BEYANLI CEVAP üretir — ve `§TZ` ile dönem chip'leri cevabın YANINDA gelir.
  # `classify()` zaten doğru davranıyor: *«bir cevabın yanına seçenek koymak, cevabı
  # geri almak değildir»*. Ölçüt `chip`ten `answer`a çevrildi; `note_contains: dönem`
  # AYNEN duruyor — korunan şey değişmedi: dönemin eksikliği kullanıcıya SÖYLENMELİ.
  expect: answer
  note_contains: dönem
- id: chip-donem-kirilimli
  q: makine bazında ortalama oee
  tags: [chip-donem]
  # ⟳ POLİTİKA DEVRİ (`D3` → `§TZ`, 2026-08-10): dönemsiz soru artık NETLEŞTİRME
  # değil, BEYANLI CEVAP üretir — ve `§TZ` ile dönem chip'leri cevabın YANINDA gelir.
  # `classify()` zaten doğru davranıyor: *«bir cevabın yanına seçenek koymak, cevabı
  # geri almak değildir»*. Ölçüt `chip`ten `answer`a çevrildi; `note_contains: dönem`
  # AYNEN duruyor — korunan şey değişmedi: dönemin eksikliği kullanıcıya SÖYLENMELİ.
  expect: answer
  note_contains: dönem
- id: chip-olcu-surd
  q: sürdürülebilirlik
  tags: [chip-olcu]
  expect: chip
  note_contains: ölçü
- id: chip-kismi-anlama
  q: kar oranı fizibilite
  tags: [chip-kismi]
  expect: chip
  note_contains: fizibilite
- id: chip-kismi-tedarikci
