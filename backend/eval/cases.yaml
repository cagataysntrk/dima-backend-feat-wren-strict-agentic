# ── Akışlar (çok mesajlı konuşma senaryoları — loglardan) ──────────────────
- id: akis-uretim-zinciri
  tags: [akis, chip-donem, gran, kirilim]
  flow:
    - {q: toplam üretim, expect: answer, note_contains: dönem}
    - {q: bu yıl, expect: answer, shape: {cube: oee, measures: [toplam_uretim_kg], filter_ops: [gte]}}
    - {q: aylara göre, expect: answer, shape: {gran: month, filter_ops: [gte]}}
    - {q: makin kırılımı ekle, expect: answer, shape: {dims_has: [makine], gran: month}}
- id: akis-olcu-duzeltme
  tags: [akis, duzeltme]
  flow:
    - {q: kumaş türlerine göre fire oranı bu yıl, expect: answer,
       shape: {cube: parti, measures: [fire_orani_yuzde], dims: [kumas_cinsi]}}
    - {q: aylara göre, expect: answer, shape: {gran: month}}
    - {q: fire oranı değil kar oranı, expect: answer,
       shape: {measures: [kar_marji_yuzde], dims: [kumas_cinsi], gran: month}}
- id: akis-varlik-topn
  tags: [akis, topn]
  flow:
    - {q: müşterilere göre aylık ciro bu yıl, expect: answer,
       shape: {cube: parti, measures: [toplam_ciro], dims: [musteri], gran: month}}
    - {q: en çok satış yapılan 3 müşterininkileri göster, expect: answer,
       shape: {in_filter_dim: musteri, gran: month}}
- id: akis-gecen-ay
  tags: [akis, tarih-onceki]
  flow:
    - {q: müşterilere göre ciro, expect: answer, note_contains: dönem}
    - {q: bu ay, expect: answer, shape: {filter_ops: [gte]}}
    - {q: geçen ay, expect: answer, shape: {filter_ops: [gte, lte]}}
- id: akis-tumu-filtre-kaldirir
  tags: [akis, tarih-tumu]
  flow:
    - {q: toplam fire, expect: answer, note_contains: dönem}
    - {q: bu yıl, expect: answer, shape: {filter_ops: [gte]}}
    - {q: tüm zamanlar, expect: answer, shape: {filter_ops: []}}
- id: akis-yetenek-chip
  tags: [akis, chip-yetenek]
  flow:
    - {q: aylık üretim trendi, expect: answer, shape: {cube: oee, gran: month}}
    - {q: "hangi kırılımlara göre bunu detaylandırabilirim?", expect: chip,
       chip_labels_has: [makine, vardiya]}
    - {q: vardiya kırılımı ekle, expect: answer, shape: {dims_has: [vardiya]}}
- id: akis-anlasilmayan-takip
  tags: [akis, dürüstlük]
  flow:
    - {q: makine bazında ortalama oee bu yıl, expect: answer, shape: {dims: [makine]}}
    - {q: asdlkj qwerty zxcvb, expect: refuse}
- id: akis-deger-filtre-degisimi
  tags: [akis, deger-filtre]
  flow:
    - {q: erkek operatörlerin haftanın günü bazında işlenen kg bu yıl, expect: answer,
       shape: {filter_eq: [[cinsiyet, Erkek]]}}
    - {q: kadın çalışanlar için, expect: answer, shape: {filter_eq: [[cinsiyet, Kadın]]}}

