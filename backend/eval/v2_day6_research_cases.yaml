cases:
  # --- Canonical / paraphrase / ordering / deliverable family ---
  - id: canonical
    q: "Son 12 ay ürünleri karşılaştır, makineler ve personellerle ilişkisini analiz et, satış performanslarını yorumla ve raporla."
    expected_act: REPORT_REQUEST
    brief_status: READY_FOR_RESEARCH
    time: ["12 ay"]
    goals:
      - {kind: comparison, subject: ["ürün"]}
      - {kind: relationship, subject: ["ürün"], related: ["makin"]}
      - {kind: relationship, subject: ["ürün"], related: ["personel"]}
      - {kind: performance, subject: ["satış"]}
      - {kind: deliverable, deliverable: report}

  - id: paraphrase_employee
    q: "Son bir yılda ürünleri kıyasla; hangi makinelerde üretildiklerini ve çalışanlarla bağlantılarını ayrı ayrı incele, satış performansını da değerlendirip rapor çıkar."
    expected_act: REPORT_REQUEST
    brief_status: READY_FOR_RESEARCH
    time: ["bir yıl"]
    goals:
      - {kind: comparison, subject: ["ürün"]}
      - {kind: relationship, subject: ["ürün"], related: ["makin"]}
      - {kind: relationship, subject: ["ürün"], related: ["çalışan"]}
      - {kind: performance, subject: ["satış"]}
      - {kind: deliverable, deliverable: report}

  - id: shift_relation
    q: "Geçen 12 ay ürünleri karşılaştır; makine ve vardiya bağlantılarını ayrı incele, satış performansını değerlendir ve rapor hazırla."
    expected_act: REPORT_REQUEST
    brief_status: READY_FOR_RESEARCH
    time: ["12 ay"]
    goals:
      - {kind: comparison, subject: ["ürün"]}
      - {kind: relationship, subject: ["ürün"], related: ["makine"]}
      - {kind: relationship, subject: ["ürün"], related: ["vardiya"]}
      - {kind: performance, subject: ["satış"]}
      - {kind: deliverable, deliverable: report}

  - id: reordered_sentences
    q: "Son 12 aylık ürünleri karşılaştır. Satış performansını da incele. Personel ilişkisini ve makine ilişkisini ayrı ayrı analiz et. Sonucu raporla."
    expected_act: REPORT_REQUEST
    brief_status: READY_FOR_RESEARCH
    time: ["12 aylık"]
    goals:
      - {kind: comparison, subject: ["ürün"]}
      - {kind: performance, subject: ["satış"]}
      - {kind: relationship, subject: ["ürün"], related: ["personel"]}
      - {kind: relationship, subject: ["ürün"], related: ["makine"]}
      - {kind: deliverable, deliverable: report}

  - id: report_first
    q: "Bir rapor hazırla: son 12 ay ürünleri karşılaştır, makinelerle ve personelle ilişkilerini ayrı ayrı araştır, satış performansını yorumla."
    expected_act: REPORT_REQUEST
    brief_status: READY_FOR_RESEARCH
    time: ["12 ay"]
    goals:
      - {kind: deliverable, deliverable: report}
      - {kind: comparison, subject: ["ürün"]}
      - {kind: relationship, subject: ["ürün"], related: ["makin"]}
      - {kind: relationship, subject: ["ürün"], related: ["personel"]}
      - {kind: performance, subject: ["satış"]}

  - id: extra_style_clause
    q: "Kısa ve yönetici dilinde olsun: son 12 ay ürünleri karşılaştır, makine bağlantısını ve vardiya bağlantısını ayrı incele, satış performansını değerlendir ve raporla."
    expected_act: REPORT_REQUEST
    brief_status: READY_FOR_RESEARCH
    time: ["12 ay"]
    forbidden_goal_fragments: ["yönetici dilinde", "kısa"]
    goals:
      - {kind: comparison, subject: ["ürün"]}
      - {kind: relationship, subject: ["ürün"], related: ["makine"]}
      - {kind: relationship, subject: ["ürün"], related: ["vardiya"]}
      - {kind: performance, subject: ["satış"]}
      - {kind: deliverable, deliverable: report}

  - id: reverse_order
    q: "Önce satış performansını değerlendir; sonra son 12 ay ürünleri karşılaştır ve ürünlerin makine ile personel bağlantılarını ayrı ayrı analiz et; sonunda raporla."
    expected_act: REPORT_REQUEST
    brief_status: READY_FOR_RESEARCH
    time: ["12 ay"]
    goals:
