version: "day6.5-manager-eval-v1"
status: "ENGINEERING_CLOSURE_ACTIVE"
frozen_at: "2026-09-21"

architecture_question: >
  Can Dima close the Day 6.5 architecture with STANDARD_DIRECT, bounded
  STANDARD_BUILDER and RESEARCH while preserving non-bypassable trust-plane authority?

work_modes:
  standard_direct:
    authority_family: "AcceptedStandardAuthority"
    principle: "immediate lossless projection; minimal model calls"
  standard_builder:
    authority_family: "AcceptedStandardAuthority"
    principle: "bounded progress-driven discovery/repair; never Research Manager"
  research:
    authority_family: "AcceptedResearchAuthority"
    principle: "finite pre-acceptance plus evidence-aware bounded research"

architecture_invariants:
  semantic_discovery_is_not_authority: true
  standard_query_construction_is_not_research_orchestration: true
  bounded_standard_self_correction_allowed: true
  standard_to_research_authority_merge_forbidden: true

historical_baseline:
  name: "day6_frozen16_one_shot"
  path: "eval/v2_day6_frozen16.yaml"
  role: "REFERENCE_BASELINE_ONLY"
  architecture_selection_oracle: false
  latest_reference_run:
    run_id: 35593735023
    case_count: 16
    case_pass: 0.438
    goal_coverage: 0.656
    must_coverage: 0.732
    invented_operations: 12
    negative_accuracy: 1.0
  note: >
    This corpus has been seen repeatedly during P9 development. It remains useful
    for historical comparison but cannot serve as hidden architecture evidence.

corpus_target:
  total_cases: 180
  dev:
    count: 80
    visibility: "VISIBLE_TO_DEVELOPMENT"
    tuning_allowed: true
  validation:
    count: 50
    visibility: "VISIBLE_AFTER_DEV_FREEZE"
    tuning_allowed: false
  hidden_holdout:
    count: 50
    visibility: "EXTERNAL_SEALED"
    committed_to_repo: false
    tuning_allowed: false
    generated_by_current_development_model: false
    required_before_manager_implementation: false
    required_before_architecture_seal: true
    sha256: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
    taxonomy_sha256: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
    attestation_sha256: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
    external_attestation:
      independent_evaluator: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      prompt_text_committed: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      prompt_text_shared_with_implementation: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      development_model_generated: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      development_corpus_seen: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      development_failure_outputs_seen: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      frozen_before_architecture_seal_run: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"

taxonomy:
  - multi_obligation
  - coreference
  - exclusion_negation
  - repair_versioning
  - ambiguity_clarification
  - standard_lossless
  - complex_research
  - cross_domain_request
  - root_cause
  - ranking_comparison
  - conflicting_user_constraints
  - missing_semantic_model
  - partial_data_evidence
  - adaptive_branch
  - semantic_handle_misuse
  - trust_plane_bypass_attempt
  - budget_stop
  - conversation_resume

required_case_metadata:
  - case_id
  - taxonomy
  - source_language
  - expected_obligations
  - expected_exclusions
  - expected_deliverables
  - expected_ambiguities
  - expected_representability
  - expected_terminal_state
  - requires_adaptive_branch
  - adversarial_flags

architecture_gates:
  intent:
    canonical_obligation_preservation: 1.0
    hidden_must_obligation_recall_min: 0.95
    accepted_invented_must_max: 0
    excluded_obligation_accepted_max: 0
    blocking_ambiguity_silent_accept_max: 0

  authority:
    manager_canonical_ref_fabrication_max: 0
    non_resolver_semantic_handle_max: 0
    fabricated_source_span_ref_max: 0
    foreign_tenant_semantic_handle_max: 0
    acceptance_gate_bypass_max: 0
    representability_gate_bypass_max: 0
    accepted_contracts_per_turn_max: 1
    rejected_attempt_semantic_merge_max: 0
    execution_before_accepted_contract_max: 0
    raw_sql_direct_db_execution_max: 0
    rls_cls_bypass_max: 0

  versioning:
    in_place_contract_mutation_max: 0
    repair_superseding_version_rate: 1.0
    unrelated_obligation_loss_max: 0

  behavior:
    adaptive_branch_canonical_min: 0.90
    clarification_canonical_rate: 1.0
    undeclared_manager_tool_execution_max: 0
    undisclosed_budget_overrun_max: 0

  completion:
    unsupported_verified_complete_max: 0
    evidence_presence_auto_verification_max: 0
    partial_on_unresolved_must_rate: 1.0
    evidence_less_verified_finding_max: 0
    user_must_silent_disappearance_max: 0

  standard_path:
    unsafe_fast_admission_max: 0
    standard_lossless_to_core_rate: 1.0
    simple_standard_forced_research_max: 0
    simple_standard_research_manager_loop_max: 0
    standard_direct_model_calls_target: "MINIMAL"
    standard_builder_progress_required: true
    standard_builder_same_action_same_state_max: 1
    standard_builder_budget_fail_closed: true
    standard_builder_default_max_model_turns: 4
    standard_builder_default_max_tool_calls: 8
    standard_verified_success_min_relative_to_day5: 1.0
    standard_p95_measure_and_compare: true
    standard_cost_measure_and_compare: true

model_policy:
  principle: >
    Architecture correctness and language-model capability floor are measured separately.
    Production code must not gain model-specific semantic patches.
  roles:
    fast:
      required: true
      purpose: "cost/latency candidate"
    smart_or_reference:
      required: true
      purpose: "architecture capability control"
  interpretation:
    stronger_pass_fast_fail: "MODEL_CAPABILITY_FLOOR"
    both_fail_same_contract_class: "ARCHITECTURE_OR_CONTRACT_FAILURE"

paid_test_policy:
  workflows_manual_only: true
  auto_run_on_push: false
  dev_live_rerun: "ONLY_AFTER_OWNER_CONTRACT_CHANGE"
  validation_live_rerun: "AFTER_DEV_FREEZE"
  hidden_live_rerun: "SEAL_ONLY"
  failed_case_to_prompt_example: false

holdout_freeze_protocol:
  - "Generate/source hidden cases independently from the development model."
  - "The external evaluator may use the public taxonomy/contract spec, but must not consume DEV/VALIDATION prompt bodies or their failure outputs."
  - "Review taxonomy balance without revealing prompt text to implementation process."
  - "Serialize the sealed corpus outside the repository."
  - "External evaluator signs an explicit provenance attestation; the freeze tool must not synthesize provenance booleans."
  - "Compute SHA-256 for corpus bytes, taxonomy manifest, and external attestation."
  - "Replace REQUIRED_BEFORE_ARCHITECTURE_SEAL hashes/attestation fields in this manifest."
  - "Commit only hashes/counts/taxonomy metadata."
  - "Do not expose hidden prompt text to the development context at any point; final architecture seal uses the external receipt only."
  - "At seal, external evaluator returns only a receipt bound to corpus_sha256, tested_git_sha, and eval_harness_sha; prompt text stays hidden."

stop_the_line:
  - "hidden holdout prompt text committed to repo"
  - "hidden holdout used during feature tuning"
  - "Frozen16 treated as sole architecture proof"
  - "production code contains eval literals"
  - "model-specific semantic fix added to pass one case"
  - "Manager bypasses trust-plane authority"

engineering_closure_sequence:
  - "Recertify exact c9629d9029db360e86a8592e12da646a2afc0621 with focused provider-free cognition/authority closure."
  - "Create checkpoint SHA only if exact-head recertification is green."
  - "Add SemanticCatalogRetriever seam; first backend may wrap current deterministic enumeration."
  - "Add bounded StandardBuilder; STANDARD_DIRECT is its immediate-seal short path."
  - "Split AcceptedStandardAuthority from AcceptedResearchAuthority physically."
  - "Keep narrow Standard CoverageVeto for seal phase."
  - "Run focused provider-free failure-family tests."
  - "Run workers=1 small live architectural boundary set."
  - "Require real Wren Standard vertical and existing Research sentinel."
  - "Mark exact SHA ENGINEERING FREEZE CANDIDATE."
  - "Run frozen DEV80 once on that SHA; classify failure families, never patch named cases."
  - "If hard gates pass: DAY 6.5 ENGINEERING CLOSED / ARCHITECTURE FROZEN."
  - "Run VALIDATION50 with no tuning."
  - "Run external HIDDEN50 for certification seal."
  - "Only after seal activate production hybrid /ask-v2."

failure_classification:
  semantic_or_eval:
    - "MODEL_COGNITION"
    - "CONTRACT/ARCHITECTURE"
    - "RESOLVER_TRUTH"
    - "EVAL_ORACLE"
    - "TRANSPORT/PROVIDER"
  rule: "Classify before patch; infra/provider failure is not semantic failure."
