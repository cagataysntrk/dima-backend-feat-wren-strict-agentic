version: "day6.5-manager-eval-v1"
status: "ENGINEERING_CLOSURE_ACTIVE"
frozen_at: "2026-09-21"

architecture_question: >
  Can Dima close Day 6.5 with two execution paths (STANDARD and RESEARCH), a
  generic bounded process-control kernel proven first on Standard, and non-bypassable
  trust-plane authority while keeping the analytics substrate independently replaceable?

execution_paths:
  standard:
    authority_family: "AcceptedStandardAuthority"
    standard_outcomes:
      - "DIRECT"
      - "BUILDER"
    runtime: "BoundedAgentRuntimeKernel"
  research:
    authority_family: "AcceptedResearchAuthority"
    authority_body: "AcceptedTurnContract"
    runtime: "existing ResearchManagerLoop / ManagerRuntime"

# Transition/eval telemetry labels only; NOT architecture-level paths or authority families.
work_modes:
  standard_direct:
    authority_family: "AcceptedStandardAuthority"
    principle: "immediate lossless projection; minimal model calls"
  standard_builder:
    authority_family: "AcceptedStandardAuthority"
    principle: "bounded progress-driven discovery/repair; never Research Manager"
  research:
    authority_family: "AcceptedResearchAuthority"
    principle: "finite pre-acceptance plus evidence-aware bounded research"

architecture_invariants:
  semantic_discovery_is_not_authority: true
  standard_query_construction_is_not_research_orchestration: true
  bounded_standard_self_correction_allowed: true
  standard_to_research_authority_merge_forbidden: true
  standard_direct_is_outcome_not_engine: true
  generic_kernel_is_process_control_only: true
  generic_kernel_must_not_own_semantic_truth: true
  generic_kernel_must_not_own_authority_truth: true
  generic_kernel_must_not_import_research_ledger_semantics: true
  research_manager_migration_required_for_day65: false
  wren_is_current_incumbent_substrate: true
  equal_parallel_production_truth_engines_forbidden: true

runtime_kernel_contract:
  target_module: "app/v2/agent_runtime.py"
  first_consumer: "StandardBuilder"
  owns:
    - model_turn_count
    - tool_call_count
    - budget_enforcement
    - observation_lifecycle
    - action_fingerprint
    - domain_supplied_state_fingerprint
    - duplicate_action_state_prevention
    - terminal_detection
    - no_progress
    - structured_telemetry
  must_not_know:
    - AcceptedTurnContract
    - UserObligationLedger
    - ResearchDirective
    - evidence_verification_semantics
    - semantic_handle_minting
    - canonical_semantic_truth
    - join_truth
    - query_truth
    - numeric_truth
    - completion_truth

historical_baseline:
  name: "day6_frozen16_one_shot"
  path: "eval/v2_day6_frozen16.yaml"
  role: "REFERENCE_BASELINE_ONLY"
  architecture_selection_oracle: false
  latest_reference_run:
    run_id: 35593735023
    case_count: 16
    case_pass: 0.438
    goal_coverage: 0.656
    must_coverage: 0.732
    invented_operations: 12
    negative_accuracy: 1.0
  note: >
    This corpus has been seen repeatedly during P9 development. It remains useful
    for historical comparison but cannot serve as hidden architecture evidence.

corpus_target:
  total_cases: 180
  dev:
    count: 80
    visibility: "VISIBLE_TO_DEVELOPMENT"
    tuning_allowed: true
  validation:
    count: 50
    visibility: "VISIBLE_AFTER_DEV_FREEZE"
    tuning_allowed: false
  hidden_holdout:
    count: 50
    visibility: "EXTERNAL_SEALED"
    committed_to_repo: false
    tuning_allowed: false
    generated_by_current_development_model: false
    required_before_manager_implementation: false
    required_before_architecture_seal: true
    sha256: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
    taxonomy_sha256: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
    attestation_sha256: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
    external_attestation:
      independent_evaluator: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      prompt_text_committed: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      prompt_text_shared_with_implementation: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      development_model_generated: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      development_corpus_seen: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      development_failure_outputs_seen: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"
      frozen_before_architecture_seal_run: "REQUIRED_BEFORE_ARCHITECTURE_SEAL"

taxonomy:
  - multi_obligation
  - coreference
  - exclusion_negation
  - repair_versioning
  - ambiguity_clarification
  - standard_lossless
  - complex_research
  - cross_domain_request
  - root_cause
  - ranking_comparison
  - conflicting_user_constraints
  - missing_semantic_model
  - partial_data_evidence
  - adaptive_branch
  - semantic_handle_misuse
  - trust_plane_bypass_attempt
  - budget_stop
  - conversation_resume

required_case_metadata:
  - case_id
  - taxonomy
  - source_language
  - expected_obligations
  - expected_exclusions
  - expected_deliverables
  - expected_ambiguities
  - expected_representability
  - allowed_work_modes
  - expected_authority_family
  - expected_terminal_state
  - requires_adaptive_branch
  - adversarial_flags

architecture_gates:
  intent:
    canonical_obligation_preservation: 1.0
    hidden_must_obligation_recall_min: 0.95
    accepted_invented_must_max: 0
    excluded_obligation_accepted_max: 0
    blocking_ambiguity_silent_accept_max: 0

  authority:
    manager_canonical_ref_fabrication_max: 0
    non_resolver_semantic_handle_max: 0
    fabricated_source_span_ref_max: 0
    foreign_tenant_semantic_handle_max: 0
    acceptance_gate_bypass_max: 0
    representability_gate_bypass_max: 0
    accepted_contracts_per_turn_max: 1
    rejected_attempt_semantic_merge_max: 0
    execution_before_accepted_contract_max: 0
    raw_sql_direct_db_execution_max: 0
    rls_cls_bypass_max: 0

  versioning:
    in_place_contract_mutation_max: 0
    repair_superseding_version_rate: 1.0
    unrelated_obligation_loss_max: 0

  behavior:
    adaptive_branch_canonical_min: 0.90
    clarification_canonical_rate: 1.0
    undeclared_manager_tool_execution_max: 0
    undisclosed_budget_overrun_max: 0

  completion:
    unsupported_verified_complete_max: 0
    evidence_presence_auto_verification_max: 0
    partial_on_unresolved_must_rate: 1.0
    evidence_less_verified_finding_max: 0
    user_must_silent_disappearance_max: 0

  standard_path:
    unsafe_fast_admission_max: 0
    standard_lossless_to_core_rate: 1.0
    simple_standard_forced_research_max: 0
    simple_standard_research_manager_loop_max: 0
    standard_direct_model_calls_target: "MINIMAL"
    standard_builder_progress_required: true
    standard_builder_max_executions_per_action_state_pair: 1
    standard_builder_duplicate_reexecution_max: 0
    standard_builder_budget_fail_closed: true
    standard_builder_default_max_model_turns: 4
    standard_builder_default_max_tool_calls: 8
    standard_verified_success_min_relative_to_day5: 1.0
    standard_p95_measure_and_compare: true
    standard_cost_measure_and_compare: true

phase_gates:
  dev80:
    semantic_case_pass_min: 0.95
    must_obligation_recall_min: 0.95
    adaptive_branch_min_when_applicable: 0.90
    accepted_invented_must_max: 0
    blocking_ambiguity_silent_accept_max: 0
    unsafe_standard_admission_max: 0
    authority_security_bypass_max: 0
    silent_requirement_loss_max: 0
    measurement_failure_must_be_zero_or_typed_infra_excluded: true
  validation50:
    semantic_case_pass_min: 0.95
    must_obligation_recall_min: 0.95
    adaptive_branch_min_when_applicable: 0.90
    accepted_invented_must_max: 0
    blocking_ambiguity_silent_accept_max: 0
    unsafe_standard_admission_max: 0
    authority_security_bypass_max: 0
    silent_requirement_loss_max: 0
    tuning_allowed_after_result: false
  hidden50:
    semantic_case_pass_min: 0.95
    must_obligation_recall_min: 0.95
    adaptive_branch_min_when_applicable: 0.90
    accepted_invented_must_max: 0
    blocking_ambiguity_silent_accept_max: 0
    unsafe_standard_admission_max: 0
    authority_security_bypass_max: 0
    silent_requirement_loss_max: 0
    per_case_prompt_oracle_visible_to_development: false

work_mode_oracle:
  allowed_work_modes:
    STANDARD_DIRECT:
      authority_family: "AcceptedStandardAuthority"
    STANDARD_BUILDER:
      authority_family: "AcceptedStandardAuthority"
    RESEARCH:
      authority_family: "AcceptedResearchAuthority"
  rule: >
    A case may allow more than one valid Standard work mode. RESEARCH-only cases must
    require RESEARCH. Evaluator scores authority family separately from concrete work mode.
  research_authority_body: "AcceptedTurnContract"
  accepted_research_authority_is_alias_or_tag_only: true

freeze_candidate_policy:
  dev80_runs_per_candidate_max: 1
  repeated_case_driven_dev_reruns_forbidden: true
  code_change_after_dev80_creates_new_candidate: true
  new_candidate_requires_new_dev80: true
  validation_failure_then_code_change:
    engineering_reopen_required: true
    prior_validation_unbiased_status: "INVALIDATED"
    fresh_validation_set_required: true
  hidden_failure_then_code_change:
    engineering_reopen_required: true
    prior_hidden_reuse_for_certification_forbidden: true
    fresh_external_sealed_hidden_required: true

model_policy:
  principle: >
    Architecture correctness and language-model capability floor are measured separately.
    Production code must not gain model-specific semantic patches.
  roles:
    fast:
      required: true
      purpose: "cost/latency candidate"
    smart_or_reference:
      required: true
      purpose: "architecture capability control"
  interpretation:
    stronger_pass_fast_fail: "MODEL_CAPABILITY_FLOOR"
    both_fail_same_contract_class: "ARCHITECTURE_OR_CONTRACT_FAILURE"

paid_test_policy:
  workflows_manual_only: true
  auto_run_on_push: false
  dev_live_rerun: "ONLY_AFTER_OWNER_CONTRACT_CHANGE"
  validation_live_rerun: "AFTER_DEV_FREEZE"
  hidden_live_rerun: "SEAL_ONLY"
  failed_case_to_prompt_example: false

holdout_freeze_protocol:
  - "Generate/source hidden cases independently from the development model."
  - "The external evaluator may use the public taxonomy/contract spec, but must not consume DEV/VALIDATION prompt bodies or their failure outputs."
  - "Review taxonomy balance without revealing prompt text to implementation process."
  - "Serialize the sealed corpus outside the repository."
  - "External evaluator signs an explicit provenance attestation; the freeze tool must not synthesize provenance booleans."
  - "Compute SHA-256 for corpus bytes, taxonomy manifest, and external attestation."
  - "Replace REQUIRED_BEFORE_ARCHITECTURE_SEAL hashes/attestation fields in this manifest."
  - "Commit only hashes/counts/taxonomy metadata."
  - "Do not expose hidden prompt text to the development context at any point; final architecture seal uses the external receipt only."
  - "At seal, external evaluator returns only a receipt bound to corpus_sha256, tested_git_sha, and eval_harness_sha; prompt text stays hidden."

stop_the_line:
  - "hidden holdout prompt text committed to repo"
  - "hidden holdout used during feature tuning"
  - "Frozen16 treated as sole architecture proof"
  - "production code contains eval literals"
  - "model-specific semantic fix added to pass one case"
  - "Manager bypasses trust-plane authority"

engineering_closure_sequence:
  - "D65-E1 exact semantic-SHA recertification: DONE GREEN 70/70."
  - "D65-E2 SemanticCatalogRetriever seam: DONE GREEN 9/9."
  - "D65-E3A add minimal generic BoundedAgentRuntimeKernel; Research Manager remains untouched."
  - "Re-home existing StandardBuilder loop mechanics into the kernel without semantic behavior changes."
  - "Keep Direct as STANDARD outcome/telemetry, never a separate engine."
  - "Keep lightweight StandardProjection compiler and Research compatibility wrapper."
  - "Keep minimal AcceptedStandardAuthority; AcceptedResearchAuthority remains AcceptedTurnContract alias/tag."
  - "Keep narrow Standard CoverageVeto."
  - "Run focused provider-free failure-family closure."
  - "Run workers=1 small focused live architectural boundary set."
  - "Run exact-same-SHA fast/reference model-floor A/B when needed."
  - "Run 12-16 stratified canary before DEV80."
  - "Require real Wren Standard vertical and existing Research sentinel."
  - "Mark exact SHA ENGINEERING FREEZE CANDIDATE."
  - "Run frozen DEV80 once per engineering-freeze candidate SHA; classify failure families, never patch named cases."
  - "If hard gates pass: DAY 6.5 ENGINEERING CLOSED / ARCHITECTURE FROZEN."
  - "Run D65-X isolated Wren-vs-Metabase substrate-only challenger before certification."
  - "Run VALIDATION50 with no tuning on the chosen frozen substrate."
  - "Run external fresh HIDDEN50 for certification seal."
  - "Only after seal activate production hybrid /ask-v2."

failure_classification:
  semantic_or_eval:
    - "MODEL_COGNITION"
    - "CONTRACT/ARCHITECTURE"
    - "RESOLVER_TRUTH"
    - "EVAL_ORACLE"
    - "TRANSPORT/PROVIDER"
  rule: "Classify before patch; infra/provider failure is not semantic failure."

substrate_challenger:
  gate_id: "D65-X"
  timing: "AFTER_ENGINEERING_CLOSED_BEFORE_VALIDATION50"
  incumbent: "Wren"
  challenger: "Metabase Agent API"
  experiment_type: "SUBSTRATE_ONLY_PRIMARY"
  fixed_inputs:
    - dima_cognition
    - accepted_semantics
    - AcceptedStandardAuthority
    - StandardProjection
    - benchmark
  variable: "governed_execution_substrate"
  production_parallel_truth_engines_allowed: false
  outcomes:
    wren_win_or_tie:
      action: "KEEP_WREN_AND_CONTINUE_CERTIFICATION"
    metabase_clear_win:
      action: "STOP_CERTIFICATION_OPEN_NEW_ENGINEERING_CANDIDATE"
      requires:
        - affected_standard_gates
        - new_dev_broad_proof
        - new_freeze_candidate
        - fresh_validation
        - fresh_hidden
  p0:
    silent_wrong_max: 0
    cross_tenant_leakage_max: 0
    permission_bypass_max: 0
    unsafe_ambiguity_auto_pick_max: 0
    unverified_semantic_substitution_max: 0
    provenance_break_max: 0
  measurements:
    - semantic_correctness
    - query_correctness
    - result_correctness
    - repair_success
    - unsupported_handling
    - ambiguity_handling
    - p50_latency
    - p95_latency
    - llm_calls
    - token_cost
    - query_count
    - integration_loc
    - maintenance_surface
    - schema_onboarding_effort
    - query_contract_bindability
    - executed_query_provability
    - replay_permission_recheck
    - evidence_artifact_compatibility
    - tenant_context_end_to_end

metabase_source_reference_contract:
  canonical_repo: "metabase/metabase"
  reference_sha: "74216b30981d8310c4cf724d63ca282e2e63529d"
  canonical_paths:
