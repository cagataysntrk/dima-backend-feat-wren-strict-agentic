[project]
name = "dima-metabase-platform"
version = "0.1.0"
description = "Headless Dima organizational-intelligence platform over Metabase / Metabot."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
  # Bounded final cognition canaries use typed provider transports. Neither package
  # is an analytical engine or a runtime dependency of deterministic authorities.
  "anthropic>=0.40",
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "pyyaml>=6.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "control_plane"]

[tool.ruff]
line-length = 100
