[project]
name = "dima-backend"
version = "0.1.0"
description = "FastAPI bridge exposing the Wren (dima-wrenai) semantic SQL engine over HTTP for the dima-frontend-demo."
requires-python = ">=3.11"
dependencies = [
  # Wren semantic SQL engine (the forked `dima-wrenai` core, published as `wrenai`).
  # For local fork development install it editable instead:
  #   pip install -e ../dima-wrenai/core/wren[postgres]
  "wrenai>=0.13,<0.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.40",
  "openai>=1.0.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  # Auth / control-plane (ADR-0014/0015; saka-standards 02/08)
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  # Postgres sürücüsü (prod); lokal/demo SQLite ile çalışır, bu opsiyoneldir.
  "psycopg[binary]>=3.2",
  # Bildirim teslimi (ADR-0011): e-posta gövdesi MJML (mrml = Rust MJML derleyici,
  # Node gerekmez) + Jinja2 (veri → MJML markup). Ürün maili backend'de yönetilir.
  "mrml>=0.2",
  "jinja2>=3.1",
  # Discovery→Promote (Faz 2d): onaylanan ölçüyü cube YAML'ına round-trip-güvenli (yorum/
  # biçim korur) eklemek için — pyyaml safe_load+dump reponun elle yazılmış, açıklayıcı
  # yorumlarla dolu cube YAML'larını sessizce siler (app/mdl_writer.py).
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Test/eval altyapısı (Faz 0-f: eval/ + pytest paketi CI'a bağlandı). Önceden hiçbir
# yerde bildirilmemişti (yalnız geliştiricinin yerel ortamında ad hoc kuruluydu) —
# artık CI + `pip install -e .[dev]` ile tekrarlanabilir.
dev = [
  "pytest>=8.0",
  # ⚡ Süiti 8 dk 30 sn'den 2 dk 15 sn'ye indiren paralel koşucu (2026-08-04). Kapı
  # `-n 8` ile koşar (`lab/kapi.py`), yani bu ARTIK İSTEĞE BAĞLI DEĞİL: eksikse
  # `pytest: error: unrecognized arguments: -n` ile kapı hiç başlamadan düşer.
  "pytest-xdist>=3.5",
  "pyyaml>=6.0",
  "httpx>=0.27",       # FastAPI TestClient (conftest.py) için gerekli
  "ruff>=0.6",
  "fastembed>=0.8",    # VQR embedding'i (requirements.txt ile aynı sürüm ailesi)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
