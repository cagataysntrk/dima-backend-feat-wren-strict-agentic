# Zamanlanmış raporlar (ADR-0011) — ŞİRKET verisi (kompozisyona kopyalanmaz).
# Dönem GÖRELİ tutulur; her koşumda tarih motoruyla çözülür.
schedules:
  - id: s-fire-esik
    label: Günlük fire eşiği kontrolü
    period: son 7 gün
    every: day
    at: "08:00"
    cube_query:
      cube: parti
      measures: [fire_orani_yuzde]
      dimensions: [asama]
    threshold: {measure: fire_orani_yuzde, op: gt, value: 1.8}
    enabled: true
