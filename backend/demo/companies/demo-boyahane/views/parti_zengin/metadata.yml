# Zenginleştirilmiş parti view'ı — üretim + OPERATÖR DEMOGRAFİSİ (cinsiyet/yaş/eğitim).
#
# ⚠️ DÜZELTME (2026-08-02, ampirik olarak kanıtlandı — bkz. backend/MIMARI.md §3.2):
#   Aşağıdaki gerekçenin İLK YARISI doğru, ÇIKARILAN SONUÇ yanlıştır. `cube_query_to_sql`
#   gerçekten JOIN üretmiyor — AMA model katmanı (WrenEngine.dry_plan) is_calculated
#   kolonlar üzerinden JOIN'i OTOMATİK enjekte ediyor (çok-sıçramalı, join-pruning'li;
#   partiler→personel→personel_ozluk zinciri çalıştırılarak doğrulandı, toplamlar bu
#   view'la birebir aynı). Yani bu view teknik bir zorunluluk DEĞİL, düzeltilmiş bir
#   varsayımın kalıntısıdır. `models_enrich.yml` gerekli calc kolonları (operator_cinsiyet,
#   operator_departman, operator_egitim, operator_dogum_tarihi) ZATEN üretiyor ama hiçbir
#   cube onları okumuyor. Planlanan göç: `parti` cube'unun base_object'i → `partiler`.
#   Bu view, göç tamamlanıp toplamlar birebir doğrulanana kadar KALIR.
#
# (özgün gerekçe) calc field'lar cube_query_to_sql'de JOIN'lenmiyor (düz base-SQL) →
# demografiyi VIEW'da denormalize ederiz (repo turev/view deseni). Zincir: partiler.operator = personel.ad_soyad
# (1-hop) + personel.personel_kodu = personel_ozluk.personel_kodu (2-hop). LEFT JOIN =
# operatörsüz/özlüksüz parti düşmez. Böylece "cinsiyet/yaş bazında verimlilik" DETERMİNİSTİK.
name: parti_zengin
statement: |
  SELECT p.parti_no, p.tarih, p.ay, p.makine, p.hat, p.vardiya, p.vardiya_ad,
         p.operator, p.musteri_kod, p.musteri_ad, p.tedarikci_ad,
         p.ham_ad, p.ham_grup, p.gramaj, p.renk_ad, p.renk_derinlik, p.asama,
         p.kg, p.metre, p.ilk_seferde_tamam, p.uretim_dE, p.lab_dE,
         p.su_lt, p.elektrik_kwh, p.dogalgaz_sm3, p.enerji_toplam_tl,
         p.kwh_kg, p.tep, p.ciro_tl, p.kimyasal_tl,
         pe.cinsiyet   AS operator_cinsiyet,
         pe.departman  AS operator_departman,
         pe.vardiya    AS operator_vardiya,
         po.dogum_tarihi AS operator_dogum_tarihi,
         po.egitim     AS operator_egitim,
         po.pozisyon   AS operator_pozisyon
  FROM partiler p
  LEFT JOIN personel pe ON p.operator = pe.ad_soyad
  LEFT JOIN personel_ozluk po ON pe.personel_kodu = po.personel_kodu
columns:
  - {name: parti_no, type: VARCHAR}
  - {name: tarih, type: DATE}
  - {name: ay, type: INTEGER}
  - {name: makine, type: VARCHAR}
  - {name: hat, type: VARCHAR}
  - {name: vardiya, type: INTEGER}
  - {name: vardiya_ad, type: VARCHAR}
  - {name: operator, type: VARCHAR}
  - {name: musteri_kod, type: VARCHAR}
  - {name: musteri_ad, type: VARCHAR}
  - {name: tedarikci_ad, type: VARCHAR}
  - {name: ham_ad, type: VARCHAR}
  - {name: ham_grup, type: VARCHAR}
  - {name: gramaj, type: INTEGER}
  - {name: renk_ad, type: VARCHAR}
  - {name: renk_derinlik, type: VARCHAR}
  - {name: asama, type: VARCHAR}
  - {name: kg, type: DOUBLE}
  - {name: metre, type: DOUBLE}
  - {name: ilk_seferde_tamam, type: INTEGER}
  - {name: uretim_dE, type: DOUBLE}
  - {name: lab_dE, type: DOUBLE}
  - {name: su_lt, type: DOUBLE}
  - {name: elektrik_kwh, type: DOUBLE}
  - {name: dogalgaz_sm3, type: DOUBLE}
  - {name: enerji_toplam_tl, type: DOUBLE}
  - {name: kwh_kg, type: DOUBLE}
  - {name: tep, type: DOUBLE}
  - {name: ciro_tl, type: DOUBLE}
  - {name: kimyasal_tl, type: DOUBLE}
  - {name: operator_cinsiyet, type: VARCHAR}
  - {name: operator_departman, type: VARCHAR}
  - {name: operator_vardiya, type: VARCHAR}
  - {name: operator_dogum_tarihi, type: DATE}
  - {name: operator_egitim, type: VARCHAR}
  - {name: operator_pozisyon, type: VARCHAR}
