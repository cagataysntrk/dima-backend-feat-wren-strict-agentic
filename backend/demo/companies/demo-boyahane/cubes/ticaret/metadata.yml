name: ticaret
label: alış / satış (fatura)
base_object: faturalar

# Boyahane ticaret cube'u (YENİ, 2026-07-29) — fatura bazlı alış/satış, matrah/KDV/toplam
# (TL kolonları — dövizli faturalar kurla TL'ye çevrilmiş). tur (satis/alis) ayrımı.
# NOT: "ciro/tutar" parti cube kimliğidir → burada TUTULMAZ (routing çakışması); ticaret'e
# fatura/alış/satış/matrah/kdv özgün kelimeleriyle ulaşılır (parti golden'ı korunur).
synonyms: [fatura, alış, alis, satış, satis, matrah, kdv, alım, satım, e-fatura, irsaliye]

measures:
  - name: toplam_matrah
    expression: SUM(matrah_tl)
    type: DOUBLE
    unit: "₺"
    synonyms: [matrah, toplam matrah, kdv hariç, net tutar]
  - name: toplam_kdv
    expression: SUM(kdv_tl)
    type: DOUBLE
    unit: "₺"
    synonyms: [kdv, toplam kdv, vergi, hesaplanan kdv]
  - name: toplam_tutar
    expression: SUM(toplam_tl)
    type: DOUBLE
    unit: "₺"
    synonyms: [fatura tutarı, genel toplam, kdv dahil tutar, fatura toplamı]
  - name: fatura_sayisi
    expression: COUNT(*)
    type: DOUBLE
    synonyms: [fatura sayısı, kaç fatura, fatura adedi, adet]

dimensions:
  - name: tur
    expression: tur
    type: VARCHAR
    label: fatura türü
    synonyms: [tür, tip, alış mı satış mı, fatura türü]
  - name: cari_tip
    expression: cari_tip
    type: VARCHAR
    label: cari tipi
    synonyms: [cari tip, müşteri, tedarikçi, alıcı, satıcı]
  - name: cari_kodu
    expression: cari_kodu
    type: VARCHAR
    label: cari kodu
    synonyms: [cari, cari kod, firma kodu]
  - name: durum
    expression: durum
    type: VARCHAR
    synonyms: [durum, statü, ödendi, açık]

  - name: hafta_gunu
    label: haftanın günü
    expression: "CASE isodow(tarih) WHEN 1 THEN 'Pzt' WHEN 2 THEN 'Sal' WHEN 3 THEN 'Çar' WHEN 4 THEN 'Per' WHEN 5 THEN 'Cum' WHEN 6 THEN 'Cmt' WHEN 7 THEN 'Paz' END"
    type: VARCHAR
    synonyms: [haftanın gün, hafta gün, hangi gün, günlere göre, güne göre]

time_dimensions:
  - name: tarih
    expression: tarih
    type: DATE
