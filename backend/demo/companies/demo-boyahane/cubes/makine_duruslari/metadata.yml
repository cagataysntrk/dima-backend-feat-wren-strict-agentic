name: makine_duruslari
label: duruş nedenleri
base_object: makine_duruslari

# Faz 2b (31 Temmuz 2026) — "duruş NEDENİ" boyutu hiçbir cube'da modellenmemişti (eval
# vakası ny-gap-durus-neden, bilinçli "gelecek" olarak işaretlenmişti). Ham tablo/model/
# ilişki ZATEN vardı (bkz. models/makine_duruslari, relationships.yml) — yalnız semantik
# cube katmanı eksikti. OEE'nin `oee_vardiya`'sı VARDİYA-grain'de tek bir toplam duruş
# sayısı taşır (plansiz_durus_dk); bu cube EVENT-grain'de (satır=bir duruş olayı) durur ve
# `neden` kırılımını taşır — ikisini AYNI cube'da birleştirmek fan-out/çift-sayım yaratırdı
# (bakım cube'unun ariza_kayitlari'nı AYRI tutma gerekçesiyle AYNI, bkz. bakim/metadata.yml).
#
# ÇAKIŞMA KORUMASI (bilinçli): bare "duruş" OEE'nin cube-kimliğidir, bare "neden" kalite
# cube'unun `sebep` boyutunun sinonimidir — bu cube'un TÜM sinonimleri (cube+ölçü+boyut)
# ÇOK-KELİMELİ tutulur ("duruş nedeni" gibi) ki yalnız "duruş" ya da yalnız "neden" geçen
# sorular yanlışlıkla bu cube'a çekilmesin; "duruş nedenlerine göre" gibi İKİSİNİ BİRDEN
# taşıyan sorularda ise `_match_cube`'un en-uzun-eşleşme kuralıyla bu cube kazanır.
synonyms: [duruş nedeni, duruş nedenleri, duruş sebebi, duruş kategorisi,
           makine duruşu nedeni, duruş kaydı, duruş olayı, stoppage reason]

measures:
  - name: toplam_sure_dk
    expression: SUM(sure_dk)
    type: DOUBLE
    # "duruş nedeni/nedenleri" DE ölçü sinonimi olarak eklendi (cube+boyut'a EK): "toplam"
    # kelimesi geçmeyen bare "duruş nedeni bu yıl" gibi sorularda bile bu cube'un varsayılan
    # ölçüsü olarak rekabet edebilsin (aksi halde OEE'nin bare "duruş" ölçü kanıtı, kanıtsız
    # kalan bu cube karşısında `_match_cube` tie-break'inde otomatik kazanırdı).
    synonyms: [toplam duruş dakikası, duruş dakikası toplamı, nedenlere göre duruş,
               duruş nedenine göre toplam, toplam duruş, duruş nedeni, duruş nedenleri]
    lower_is_better: true
  - name: duruş_sayisi
    expression: COUNT(*)
    type: DOUBLE
    synonyms: [duruş sayısı, kaç duruş, duruş olayı sayısı, duruş adedi]
    lower_is_better: true

dimensions:
  - name: makine
    expression: makine
    type: VARCHAR
    label: makine
    synonyms: [makin, cihaz, tezgah]
  - name: hat
    expression: hat
    type: VARCHAR
    synonyms: [hat, hattı, line]
  - name: vardiya
    expression: "CASE vardiya WHEN 1 THEN '1. Vardiya (08-16)' WHEN 2 THEN '2. Vardiya (16-24)' WHEN 3 THEN '3. Vardiya (00-08)' ELSE CAST(vardiya AS VARCHAR) END"
    type: VARCHAR
    synonyms: [vardiya, vardiyalar]
  - name: neden
    expression: neden
    type: VARCHAR
    label: duruş nedeni
    synonyms: [duruş nedeni, duruş sebebi, nedenine göre, neden bazında, duruş kategorisi]

time_dimensions:
  - name: tarih
    expression: tarih
    type: DATE
