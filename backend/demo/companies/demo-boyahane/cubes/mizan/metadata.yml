name: mizan
label: mizan (hesap bakiyeleri)
# FAZ 2.1 (2 Ağustos 2026): VIEW → MODEL. `mizan_kaynak` yevmiye_satirlari ⟕ hesap_plani
# ⟕ yevmiye_fisleri'ni elle düzleştiren bir view'dı; her iki ilişki de ZATEN beyan
# edilmişti ve ikisi de hedef tarafın PRIMARY KEY'i üzerinden gidiyor. Kazanç yalnız
# bakım değil PERFORMANS da: `statements.py` (gelir tablosu/bilanço) yalnız
# hesap_kodu + bakiye istiyor — ikisi de yevmiye_satirlari'nda YEREL, dolayısıyla join
# pruning sayesinde o sorgu artık 3'lü join yerine TEK TABLO taraması.
base_object: yevmiye_satirlari

# Boyahane GL cube'u (YENİ, 2026-07-29) — generic modul/turev/mizan ile AYNI contract
# (bakiye/hesap_kodu/hesap_adi). statements.py gelir tablosu + bilanço bunu sorgular.
# Ölçü adı KOLON adından FARKLI (Wren SUM(borc)'u ölçü sanmasın).
synonyms: [mizan, hesap bakiyesi, hesap bakiyeleri, muhasebe, defter, muavin,
           hesap planı, genel muhasebe, hesap hareketleri, yevmiye, gelir tablosu, bilanço]

measures:
  - name: toplam_borc
    expression: "SUM(borc)"
    type: DOUBLE
    unit: "₺"
    synonyms: [borç, toplam borç, borç tutarı, debit]
  - name: toplam_alacak
    expression: "SUM(alacak)"
    type: DOUBLE
    unit: "₺"
    synonyms: [alacak, toplam alacak, alacak tutarı, credit]
  - name: bakiye
    expression: "SUM(borc - alacak)"
    type: DOUBLE
    unit: "₺"
    additive: semi
    synonyms: [bakiye, hesap bakiyesi, net bakiye, kalan bakiye, borç bakiyesi]

dimensions:
  - name: hesap_kodu
    expression: hesap_kodu
    type: VARCHAR
    label: hesap kodu
    synonyms: [hesap, hesap kodu, kod, hesap no]
  - name: hesap_adi
    # View'daki COALESCE korunur: hesap planında ad boşsa hesap KODU gösterilir.
    # `hesap_plani_hesap_adi` üreteçten gelir (bkz. relationships.yml expose).
    expression: "COALESCE(NULLIF(hesap_plani_hesap_adi, ''), hesap_kodu)"
    type: VARCHAR
    label: hesap adı
    synonyms: [hesap adı, hesap ismi, hesap açıklaması]

time_dimensions:
  - name: tarih
    # Tarih SATIRDA YOK, fişten gelir. `yevmiye_fisleri_tarih` üreteçten gelir; üreteç
    # `time_dimensions`'a ekleme yapmadığı için bu bağ ELLE kurulur (bilinen sınır).
    expression: yevmiye_fisleri_tarih
    type: DATE
