# ÜRETİLMİŞTİR: lab/generate_models_duckdb.py ← boyahane.personel
# (elle düzenleme yeniden üretimde ezilir; cube'lar/sinonimler packs'te yaşar.)
name: personel
table_reference:
  catalog: boyahane
  schema: main
  table: personel
columns:
- name: personel_kodu
  type: VARCHAR
  is_primary_key: true
  not_null: true
- name: ad_soyad
  type: VARCHAR
  # BEYAN (Faz A1): personel kodu bir KİŞİYİ tanımlar (dolaylı kimlik).
  sensitivity: person
- name: vardiya
  type: VARCHAR
- name: departman
  type: VARCHAR
- name: cinsiyet
  type: VARCHAR
- name: personel_ozluk
  type: personel_ozluk
  relationship: personel_ozluk_personel
- name: dogum_tarihi
  type: DATE
  is_calculated: true
  expression: personel_ozluk.dogum_tarihi
- name: egitim
  type: VARCHAR
  is_calculated: true
  expression: personel_ozluk.egitim
- name: pozisyon
  type: VARCHAR
  is_calculated: true
  expression: personel_ozluk.pozisyon
- name: medeni_hal
  type: VARCHAR
  is_calculated: true
  expression: personel_ozluk.medeni_hal
primary_key: personel_kodu
