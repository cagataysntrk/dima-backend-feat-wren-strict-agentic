    condition: "ariza_kayitlari.makine = makineler.makine"
    expose:
      # `makineler.bolum` -> bu modele oturan TÜM cube'lara boyut. Bu cube'larda
      # `departman` boyutu YOK, dolayısıyla bare "bölüm" güvenlidir (bkz. partiler_makineler:
      # orada `departman` var ve sinonim çakışması olacağı için daha dar sözlük kullanıldı).
      - column: bolum
        as: bolum
        label: bölüm
        synonyms: [bölüm, bolum, kısım, ünite, hangi bölüm, bölümlere göre]
  - name: bakim_planlari_makineler
    join_type: MANY_TO_ONE
    models: [bakim_planlari, makineler]
    condition: "bakim_planlari.makine = makineler.makine"
  - name: makine_enerji_aylik_makineler
    join_type: MANY_TO_ONE
    models: [makine_enerji_aylik, makineler]
    condition: "makine_enerji_aylik.makine = makineler.makine"

  # --- kalite / lab ---
  - name: lab_olcumleri_makineler
    join_type: MANY_TO_ONE
    models: [lab_olcumleri, makineler]
    condition: "lab_olcumleri.makine = makineler.makine"
  - name: lab_olcumleri_partiler
