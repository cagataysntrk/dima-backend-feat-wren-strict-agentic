# WrenAI ilişkileri (join grafiği) — 47-tablo şeması. MANY_TO_ONE: fact → boyut (PK).
# Yalnız kolon adları KESİN eşleşen join'ler tanımlı (yanlış join = yanlış metrik;
# cari_kodu/irsaliye gibi master-tablosuz FK'ler bilinçli ATLANDI). ONE_TO_ONE = özlük.
relationships:
  # --- üretim / parti (+ operatör KİŞİ köprüsü: operator = personel.ad_soyad) ---
  - name: partiler_personel
    join_type: MANY_TO_ONE
    models: [partiler, personel]
    condition: "partiler.operator = personel.ad_soyad"
  - name: partiler_makineler
    join_type: MANY_TO_ONE
    models: [partiler, makineler]
    condition: "partiler.makine = makineler.makine"
    expose:
      # DİKKAT: `parti`/`surdurulebilirlik` cube'larında `departman` boyutu var ve onun
      # sinonimleri arasında "bölüm" GEÇİYOR (personelin departmanı). Makinenin bölümü
      # FARKLI bir kavramdır; bare "bölüm" verilirse `_match_dims` iki boyutu da eşleştirir
      # ve bu GERÇEK bir belirsizliktir (eşit eşleşme — Faz 0.5'te bilinçli çözülmedi).
      # Bu yüzden burada yalnız NİTELİKLİ ifadeler bildirilir.
      # ETİKET TEK KELİME olmalı:  (ADR-0018) etiketi kelimelerine AYIRIP
      # sinonim yapar. İlk deneme  idi → sessizce "makine" sinonimi
      # doğurdu ve mevcut  boyutuyla çakıştı (test_surdurulebilirlik_cube düştü:
      # ['makine'] yerine ['makine','makine_bolum']). Çok kelimeli ifadeler 
      # altında GÜVENLİ — onlar bölünmez. Kapı: compose.py::_etiket_carpismasi.
      - column: bolum
        as: kisim
        label: kısım
        synonyms: [makine bölümü, üretim bölümü, makine kısmı, tezgah bölümü, hangi kısım]
  - name: partiler_musteriler
    join_type: MANY_TO_ONE
    models: [partiler, musteriler]
    condition: "partiler.musteri_kod = musteriler.musteri_kodu"
  - name: partiler_tedarikciler
    join_type: MANY_TO_ONE
    models: [partiler, tedarikciler]
    condition: "partiler.tedarikci_kod = tedarikciler.tedarikci_kodu"
    # `expose:` BİLİNÇLİ OLARAK YOK (2 Ağustos 2026). `sehir` ve `tur` denendi ve
    # ÖLÇÜLDÜ: bu veri setinde TÜM partiler Çorlu'daki tedarikçilere ait, yani her iki
    # boyutun da kardinalitesi 1 — hiçbir şeyi ayırt etmiyorlar, yalnız router'ın arama
    # uzayını ve sinonim çakışma yüzeyini büyütüyorlar. Gerçek bir müşteride şehir/tür
    # dağılımı varsa buraya eklenir; kapı: tests/test_relationship_health.py.
  - name: top_stok_partiler
    join_type: MANY_TO_ONE
    models: [top_stok, partiler]
    condition: "top_stok.parti_no = partiler.parti_no"

  # --- OEE / makine olayları ---
  - name: oee_vardiya_makineler
    join_type: MANY_TO_ONE
    models: [oee_vardiya, makineler]
    condition: "oee_vardiya.makine = makineler.makine"
    expose:
      # `makineler.bolum` -> bu modele oturan TÜM cube'lara boyut. Bu cube'larda
      # `departman` boyutu YOK, dolayısıyla bare "bölüm" güvenlidir (bkz. partiler_makineler:
      # orada `departman` var ve sinonim çakışması olacağı için daha dar sözlük kullanıldı).
      - column: bolum
        as: bolum
        label: bölüm
        synonyms: [bölüm, bolum, kısım, ünite, hangi bölüm, bölümlere göre]
  - name: makine_duruslari_makineler
    join_type: MANY_TO_ONE
    models: [makine_duruslari, makineler]
    condition: "makine_duruslari.makine = makineler.makine"
    expose:
      # `makineler.bolum` -> bu modele oturan TÜM cube'lara boyut. Bu cube'larda
      # `departman` boyutu YOK, dolayısıyla bare "bölüm" güvenlidir (bkz. partiler_makineler:
      # orada `departman` var ve sinonim çakışması olacağı için daha dar sözlük kullanıldı).
      - column: bolum
        as: bolum
        label: bölüm
        synonyms: [bölüm, bolum, kısım, ünite, hangi bölüm, bölümlere göre]
  - name: ariza_kayitlari_makineler
