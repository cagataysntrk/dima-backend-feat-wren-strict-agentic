    condition: "tamir_rework.makine = makineler.makine"
    expose:
      # `makineler.bolum` -> bu modele oturan TÜM cube'lara boyut. Bu cube'larda
      # `departman` boyutu YOK, dolayısıyla bare "bölüm" güvenlidir (bkz. partiler_makineler:
      # orada `departman` var ve sinonim çakışması olacağı için daha dar sözlük kullanıldı).
      - column: bolum
        as: bolum
        label: bölüm
        synonyms: [bölüm, bolum, kısım, ünite, hangi bölüm, bölümlere göre]
  - name: tamir_rework_partiler
    join_type: MANY_TO_ONE
    models: [tamir_rework, partiler]
    condition: "tamir_rework.parti = partiler.parti_no"
    expose:
      # `kalite` cube'unda operatör boyutu YOKTU — "operatör bazında rework" sorusu
      # cevapsızdı. 1 sıçrama: tamir_rework -> partiler (parti_no, PK).
      - column: operator
        as: operator
        label: operatör
        synonyms: [operatör, çalışan baz, çalışana göre, kişi baz, kişiye göre,
                   personel baz, personele göre]

  # --- İK (personel → özlük 1:1 demografi köprüsü) ---
  - name: personel_ozluk_personel
    join_type: ONE_TO_ONE
    models: [personel_ozluk, personel]
