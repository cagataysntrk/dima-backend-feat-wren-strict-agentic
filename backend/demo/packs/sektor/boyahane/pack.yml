# Boyahane (tekstil terbiye) sektör paketi — yeniden kullanılabilir içerik:
# fire cube + boyahane kuralları/golden SQL. Varsayılan konu modülleri:
name: boyahane
# 🔴 2026-08-05 — ERP genişletmesiyle **altı yeni modül**. Bu satır olmadan yeni
# cube'lar diskte durur ama katalogda **görünmez**: hiçbir soru onlara ulaşamaz.
# *Bir cube yazmak onu bağlamak değildir* — bu deponun "yetim modül" sınıfının
# veri katmanındaki hâli, ve bir denetim ajanı tam da burada yakaladı.
moduller: [oee, bakim, ik, enerji, butce, satis, maliyet, finans, lojistik]

# Özellik bayrakları (ADR-0009): burası YALNIZ SEKTÖRE-ÖZEL bayrak taşır. Platform
# geneli bayraklar (verify_button, scheduled_reports, sql_display, cikti_yorumlama)
# global katmana taşındı → demo/packs/features.yml. Sektöre-özel bayrak çıkınca buraya.

# Başlangıç soruları (rehberli analitik K1) — sektöre-özel KÜRATÖRLÜ örnekler; "neler
# yapabilirsin"/selamlama chip'i bunları gösterir (yoksa katalog otomatiğine düşer).
# roles opsiyonel: verilirse yalnız o roldeki kullanıcıya gösterilir (rol bazlı).
# grup opsiyonel (Faz 4.8, 1 Ağustos 2026 — dış yol haritası 1.13 "Ne sorabilirim?"
# departman haritası): HelpPanel.tsx bunu sekme/bölüm başlığı olarak gösterir.
starters:
  - label: "Makine bazında OEE (son 3 ay)"
    query: "makine bazında oee son 3 ay"
    grup: "Üretim"
  - label: "Renk bazında fire oranı (bu yıl)"
    # NOT (1 Ağustos 2026, Faz 4.8 doğrulaması): dönemsiz hali ("renk bazında fire
    # oranı") period-gate'e takılıp "hangi dönem için?" netleştirmesine düşüyordu —
    # bir başlangıç sorusu TEK TIKLA anlık cevap vermeli, ikinci bir soru sormamalı.
    query: "renk bazında fire oranı bu yıl"
    grup: "Kalite"
  - label: "Bu ay toplam ciro"
    query: "bu ay toplam ciro"
    grup: "Satış/Ticaret"
  - label: "Vardiya bazında ortalama OEE (bu yıl)"
    # NOT (1 Ağustos 2026, Faz 4.8 doğrulaması): "Renk bazında fire oranı" ile AYNI
    # sınıf hata — dönemsiz hali period-gate'e takılıyordu.
    query: "vardiya bazında ortalama oee bu yıl"
    grup: "Üretim"
  - label: "Makine bazında enerji yoğunluğu"
    query: "makine bazında enerji yoğunluğu"
    roles: [surdurulebilirlik, yonetici]
    grup: "Sürdürülebilirlik"
