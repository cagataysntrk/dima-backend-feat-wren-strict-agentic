name: kalite
label: kalite / rework
base_object: tamir_rework

# Boyahane kalite/rework cube'u (YENİ, 2026-07-29) — AĞIRLIK-bazlı gerçek fire + SEBEP +
# ek süre + dE. parti cube'unun ilk-sefer proxy'sinin ötesi (logic ileri, geri değil):
# burada rework KG'ı, defect SEBEBİ, harcanan ek süre ve renk sapması gerçek kayıttan gelir.
# Renk-doğruluğu (lab dE/sapma/tolerans) için parti.ort_renk_sapmasi + lab_olcumleri.
# NOT: "fire/reddedil" parti, bare "kalite" oee (ort_kalite) kimliğidir → kalite'de
# TUTULMAZ (çakışma). Kalite'ye rework/tamir/sebep/hata özgün kelimeleriyle ulaşılır.
synonyms: [rework, tamir, yeniden işlem, ikinci banyo, hata, hatalı, ret,
           sebep, tekrar, düzeltme, reprocess, kalite hatası]

# 🔴 `M-2` — **`default_measure` BİLEREK YAZILMADI ve bu bir ÖLÇÜMÜN sonucudur.**
# İlk denememde `toplam_rework_kg` yazıldı; kapı (`test_YANLIS_CUBE_BUYUMEDI`) **yeni bir
# sinonim çakışması** doğduğunu gösterdi: `'hatali': oee → kalite`. Yani varsayılan ölçü
# bu küpü **açgözlü** yaptı ve `oee`'nin bir ölçü sinonimini kaptı.
# ⊙ Ders: varsayılan ölçü, küpün kimliği **başka bir küpün ölçü sözlüğüyle örtüşmüyorsa**
# güvenlidir. Dokuz küpten sekizi (adet/süre küpleri) temiz geçti; çakışan **yalnız bu**
# oldu — çünkü kalite terimleri `oee`'nin kalite bileşeniyle aynı alanı paylaşıyor.
# *Bir küpe varsayılan vermek, ona komşusunun sorularını da cevaplama izni verebilir.*

measures:
  - name: toplam_rework_kg
    expression: SUM(kg)
    type: DOUBLE
    unit: "kg"
    synonyms: [rework kg, tamir kg, yeniden işlenen, hatalı kg, tamir edilen]
    lower_is_better: true
  - name: rework_sayisi
    expression: COUNT(*)
    type: DOUBLE
    unit: "adet"
    synonyms: [rework sayısı, tamir sayısı, kaç rework, kaç tamir, hata sayısı, adet]
    lower_is_better: true
  - name: toplam_ek_sure_dk
    # Rework'ün yol açtığı ek makine süresi — kapasite kaybı (aksiyon önceliği).
    expression: SUM(ek_sure_dk)
    type: DOUBLE
    unit: "dk"
    synonyms: [ek süre, kayıp süre, ilave süre, rework süresi, tamir süresi]
    lower_is_better: true
  - name: ort_dE
    expression: "ROUND(AVG(dE),2)"
    type: DOUBLE
    unit: "dE"
    # "dE!" TAM-KELİME (sonu "!"): 2 harfli kısa sinonim substring-eşleşmede tehlikeli
    # (ör. "neDEnlerine" içinde "de" geçiyor → yanlış ölçü eşleşmesi — parti cube'undaki
    # ort_renk_sapmasi'nde AYNI desen gözlemlendi, bkz. BASELINE_RECONCILIATION).
    synonyms: ["dE!", delta E, renk farkı, ortalama sapma, renk sapması]
    lower_is_better: true
  - name: tolerans_asma_sayisi
    # dE toleransı aşan rework adedi — müşteri şartnamesi ihlali.
    expression: "SUM(CASE WHEN dE > tolerans THEN 1 ELSE 0 END)"
    type: DOUBLE
    unit: "adet"
    synonyms: [tolerans aşımı, tolerans dışı, şartname dışı, ret adedi]
    lower_is_better: true

dimensions:
  - name: sebep
    expression: sebep
    type: VARCHAR
    label: hata sebebi
    synonyms: [sebep, neden, hata sebebi, hata nedeni, rework sebebi, gerekçe]
  - name: makine
    expression: makine
    type: VARCHAR
    label: makine
    synonyms: [makin, cihaz, tezgah]
  - name: hat
    expression: hat
    type: VARCHAR
    synonyms: [hat, hattı, line]
  - name: renk
    expression: renk
    type: VARCHAR
    synonyms: [renk]
  - name: renk_derinlik
    expression: renk_derinlik
    type: VARCHAR
    label: renk derinliği
    synonyms: [renk derinliği, ton, açık, koyu]
  - name: kumas_cinsi
    expression: ham
    type: VARCHAR
    label: kumaş cinsi
    synonyms: [kumaş, kumaş cinsi, ham]
  - name: musteri
    expression: musteri_ad
    type: VARCHAR
    synonyms: [müşteri, firma]
  - name: vardiya
    expression: "CAST(vardiya AS VARCHAR)"
    type: VARCHAR
    synonyms: [vardiya, vardiyalar]

  - name: hafta_gunu
    label: haftanın günü
    expression: "CASE isodow(tarih) WHEN 1 THEN 'Pzt' WHEN 2 THEN 'Sal' WHEN 3 THEN 'Çar' WHEN 4 THEN 'Per' WHEN 5 THEN 'Cum' WHEN 6 THEN 'Cmt' WHEN 7 THEN 'Paz' END"
    type: VARCHAR
    synonyms: [haftanın gün, hafta gün, hangi gün, günlere göre, güne göre]

time_dimensions:
  - name: tarih
    expression: tarih
    type: DATE
