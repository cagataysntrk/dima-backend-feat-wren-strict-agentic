name: sikayet
label: Müşteri şikâyeti / kalite geri bildirimi
base_object: musteri_sikayetleri

# ŞİKÂYET CUBE'U (2026-08-05) — sektöre-özel (tekstil terbiye: renk sapması dE).
#
# ═══ 🔴 BU CUBE'UN VARLIK SEBEBİ: GROUND TRUTH ═══
#
# Şikâyetler UYDURULMADI. `partiler` her partide İKİ sayı taşıyor: `uretim_dE`
# (ölçülen renk sapması) ve `musteri_tolerans_dE` (o müşterinin kabul sınırı).
# Şikâyetler TOLERANSI AŞAN GERÇEK PARTİLERDEN türetildi.
#
# Bunun testlere kazandırdığı şey, bu deponun en önemli ölçüm kazanımı olabilir:
#
# > Bugüne kadar bir senaryo testi *"çökmedi mi"* diye sorabiliyordu. Artık
# > **"doğru sebebi buldu mu"** diye sorulabilir — çünkü doğru sebep veride
# > **SQL ile doğrulanabilir**: o ay toleransı aşan partiler hangi makinede,
# > hangi operatörde, hangi reçetede toplandı, sorgu söyler.
#
# *Rastgele üretilmiş bir şikâyet tablosu bu soruyu cevaplanamaz yapardı: sistem
# doğru cevabı üretse bile veri onu doğrulamazdı. Ground truth artık bir yorum
# değil, bir sorgu.*
#
# ⚠ `makine` · `operator` · `recete_kod` bu cube'da BOYUTTUR — kök-neden sorusu
# ("şikâyet neden arttı") ancak bu kırılımlar varsa cevaplanabilir. Yalnız müşteri
# ve tarih taşıyan bir şikâyet tablosu, şikâyeti sayar ama açıklayamaz.
synonyms: [şikayet, şikâyet, müşteri şikayeti, geri bildirim, iade, reklamasyon,
           müşteri itirazı, kalite şikayeti, memnuniyetsizlik]

# 🔴 `M-2` — VARSAYILAN ÖLÇÜ. Sistem her şeyi biliyorken (dönem·kırılım·üstünlük)
# yalnız *«hangi ölçü»* diye sorup pes ediyordu; `cube_router` R4'te bu alanı zaten
# okuyor, alan **yoktu**. Gerekçe: şikâyet **adedi** küpün kimliği; canlıda route zaten onu seçiyor.
# ⚠ Gerçekten belirsiz küplere (`ik` brüt/net · `cari` borç/alacak · `maliyet` ·
# `parti`) BİLEREK yazılmadı — orada sormak doğru davranıştır.
default_measure: sikayet_adedi

measures:
  - name: sikayet_adedi
    expression: "COUNT(DISTINCT sikayet_no)"
    type: DOUBLE
    unit: "adet"
    additive: non
    # 🔴 `GG8` sınıfı: beyan yoksa `bagla` «çok olan iyi» varsayar.
    lower_is_better: true
    synonyms: [şikayet adedi, şikayet sayısı, kaç şikayet, reklamasyon sayısı]
  # 🔴 KÖK-5c (denetim KN-6, 2026-08-05) — ÖLÇÜ ADI `iade_kg` idi ve kendi ifadesindeki
  # KOLON adıyla aynıydı. Motor bunu derlemede kabul ediyor, `mdl.json` üretiliyor,
  # cube katalogda GÖRÜNÜYOR — ama o cube'a bir sorgu dokununca:
  #   [INVALID_SQL] Cube 'sikayet': circular dependency detected in measure expressions
  # ve etki cube DÜZEYİNDE: 6 ölçü + 9 boyut birden ölüyor. Ölçüldü: 172 ölçü tarandı,
  # desenin TEK örneği buydu.
  # ⚠ Yalnız AD değişti; ifade AYNI. Sinonimler korundu → kullanıcı yüzeyi değişmiyor.
  # Kanıt: `test_member_sweep` 3 kırmızı → 5 yeşil (izole worktree'de ölçüldü).
  - name: toplam_iade_kg
    expression: SUM(iade_kg)
    type: DOUBLE
    unit: "kg"
    # 🔴 `GG8` sınıfı: beyan yoksa `bagla` «çok olan iyi» varsayar.
    lower_is_better: true
    synonyms: [iade, iade miktarı, iade kilosu, geri gelen, iade edilen]
  - name: ort_cozum_suresi
    expression: "ROUND(AVG(cozum_suresi_gun),1)"
    type: DOUBLE
    unit: "gün"
    additive: non
    synonyms: [çözüm süresi, kapanma süresi, kaç günde çözülüyor, yanıt süresi]
  - name: acik_sikayet
    expression: "SUM(CASE WHEN durum = 'AÇIK' THEN 1 ELSE 0 END)"
    type: DOUBLE
    unit: "adet"
    # 🔴 `GG8` sınıfı: beyan yoksa `bagla` «çok olan iyi» varsayar.
    lower_is_better: true
    synonyms: [açık şikayet, çözülmemiş, bekleyen şikayet, kapanmamış]
  - name: agir_sikayet_yuzde
    expression: "ROUND(100.0 * SUM(CASE WHEN siddet = 'AĞIR' THEN 1 ELSE 0 END) / NULLIF(COUNT(*),0), 1)"
    type: DOUBLE
    # 🔴 `§YB` — YÖN BEYANI. Beyan yoksa *«en kötü»* **en DÜŞÜĞÜ** seçer.
    # ⊙ Ölçüldü (canlı): *«bu yıl en kötü bakım maliyeti olan makine»* →
    # `direction: asc` → **en ucuz** makine döndü, `source=cube`, beyansız.
    # Bir maliyet için *«çok olan iyidir»* varsaymak, cevabı tersine çevirir.
    lower_is_better: true
    unit: "%"
    additive: non
    synonyms: [ağır şikayet oranı, ciddi şikayet oranı, kritik şikayet]
  - name: ort_sapma_dE
    expression: "ROUND(AVG(sapma_dE),3)"
    type: DOUBLE
    # 🔴 `§YB` — YÖN BEYANI. Beyan yoksa *«en kötü»* **en DÜŞÜĞÜ** seçer.
    # ⊙ Ölçüldü (canlı): *«bu yıl en kötü bakım maliyeti olan makine»* →
    # `direction: asc` → **en ucuz** makine döndü, `source=cube`, beyansız.
    # Bir maliyet için *«çok olan iyidir»* varsaymak, cevabı tersine çevirir.
    lower_is_better: true
    unit: "dE"
    additive: non
    # 🔴 DARALTILDI: `sapma`·`renk sapması`·`ortalama sapma`·`delta e` çıplak hâlleriyle
    # `kalite.ort_dE` ve `parti.ort_renk_sapmasi`nın. Buradaki ölçü **şikâyete konu**
    # sapmadır — terim de bunu söylemeli. *Bir eş anlamlı, sahibi olmayan bir kelimeyi
    # ödünç alamaz.*
    synonyms: [şikayet sapması, müşteri sapması, şikayet dE, itiraz sapması]

dimensions:
  - name: musteri_kod
    expression: musteri_kod
    type: VARCHAR
    label: müşteri
    synonyms: [müşteri, müşteriler, cari, şikayetçi]
  - name: konu
    expression: konu
    type: VARCHAR
    synonyms: [konu, şikayet konusu, sebep, tür, şikayet türü]
  - name: siddet
    expression: siddet
    type: VARCHAR
    label: şiddet
    synonyms: [şiddet, ciddiyet, ağırlık, seviye, kritiklik]
  - name: makine
    expression: makine
    type: VARCHAR
    synonyms: [makine, tezgah, hat, makina]
  - name: operator
    expression: operator
    type: VARCHAR
    label: operatör
    # BEYAN: kişi tanımlar → değerleri LLM prompt'una GİRMEZ (Faz A1 deseni).
    sensitivity: person
    synonyms: [operatör, çalışan, kim yaptı, sorumlu operatör]
  - name: recete_kod
    expression: recete_kod
    type: VARCHAR
    label: reçete
    synonyms: [reçete, reçete kodu, boya reçetesi]
  - name: renk
    expression: renk
    type: VARCHAR
    synonyms: [renk, renkler, renge göre]
  - name: cozum_sekli
    expression: cozum_sekli
    type: VARCHAR
    label: çözüm şekli
    synonyms: [çözüm, nasıl çözüldü, çözüm şekli, karar]
  - name: durum
    expression: durum
    type: VARCHAR
    synonyms: [durum, statü, açık kapalı]

time_dimensions:
  - name: acilis_tarihi
    expression: acilis_tarihi
    type: DATE
