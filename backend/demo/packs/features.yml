  # *Bir taşımayı değiştirmek ölçümü de değiştirir; ölçüm taşımadan bağımsız olmalıdır,
  # yoksa her hızlanma bir körleşmedir.*
  # ÖN KOŞUL: teşhis kuyruğa girmeden ÖNCE (istek thread'inde) hesaplanıp işe taşınmalı.   # 🔴 G5.10 — AÇILDI. Discovery arka-plan işi + canlı akış.
  # ⊙ Ölçülen kazanç: deterministik yol ~100–800 ms (akış gereksiz), **LLM yolu 2,8–5,5 sn**
  # ve o süre bugün SESSİZ geçiyor. `AskJob.trace` aşamaları ZATEN taşıyordu; eksik olan
