  # Yani alan bilgisi KAYBOLMAZ, yalnız DAYATILMAZ. Bayrak açık ama tenant kararı yoksa
  # davranış BİREBİR bugünkü — korpusla doğrulandı.
  metrik_kaydi: beta
  tazelik: "off"          # FAZ 1.7: "bu sayı ne kadar eski?" — dört kademe.
                          # 🔴 `hata` VE `bilinmiyor` kademelerinde SAYI GÖSTERİLMEZ.
                          # Kapalıyken alanlar `None` → davranış birebir bugünkü.
