  #
  # ⚠ Etki **sınırlı ve kasıtlı**: yalnız istemcinin `reply_to_cube_query` gönderdiği
  # turlar — yani kullanıcının **bilerek bir karta yanıt verdiği** turlar.
  capa_zinciri: beta
  # FAZ 3.1b — SAHİPLİK TURU + TENANT KAPSAMI. Karar kaydı
  # (`packs/cekirdek/sahiplik_kararlari.yml`) artık yalnız **ÖNERİR**, uygulamaz.
