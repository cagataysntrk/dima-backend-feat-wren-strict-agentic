                               # netlestirme_onceligi". Bir YAML yorumu mimari otorite
                               # DEĞİLDİR ve yol haritasının KAPI'sı birebir "nedeni
                               # MIMARI.md'ye yazılır" diyordu; buradaki sayılar orada
