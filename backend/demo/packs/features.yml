# GLOBAL PLATFORM özellik varsayılanları (ADR-0009 fabrika katmanının EN DİBİ).
#
# "fabrika ayarı" = factory-default (koda gömülü varsayılan) — üretim tesisi DEĞİL.
# Buradaki bayraklar SEKTÖR/ŞİRKETTEN BAĞIMSIZ platform yetenekleridir; tek yerde durur,
# tüm şirketlerce miras alınır ve admin panelde HER tenant için keşfedilebilir olur.
# Sektör pack.yml artık yalnız SEKTÖRE-ÖZEL bayrak taşımalı (ör. OEE).
#
# Öncelik (soldan sağa artar): global(bu dosya) < sektör < şirket < DB-override
# (global-scope < sektör < tenant < rol < kullanıcı). En spesifik kazanır.
# NOT: buradaki "global" = platform-geneli fabrika varsayılanı; DB'deki "global" = global
# SCOPE override (ayrı kavram, aynı sözcük).

# Aşamalar: off | alpha | beta | prod. `beta` = herkese KAPALI değil ama varsayılanda
# yalnız burada tanımlı; admin panelden tenant/rol/kullanıcı override'ı ile açılır.
# Metadata (etiket/açıklama/kategori) app/features.py FLAG_REGISTRY'de — tek kaynak.
features:
  # 🔴 KÖK-1 FAZ 1 — NİYET İZİ. Varsayılan **`prod`** ve bu bir karar: Faz 1'in tamamı
  # GÖRÜNÜRLÜKTÜR ve hiçbir kararı değiştirmez (`test_kok1_niyet.py::
  # test_ROUTE_DAVRANISI_DEGISMEDI` bunu kilitler). Kapalı bir gözlem, olmayan bir
  # gözlemdir; ve Faz 2'nin tüketici göçü bu izin ürettiği ölçüme dayanacak.
  # ⚠ Değer `"on"` yazılmıştı ve bayrak kaydı kapısı reddetti: geçerli aşamalar
  # `off|alpha|beta|prod`. Kapı haklıydı — *bir bayrağın aşaması bir "açık/kapalı"
  # değil, bir OLGUNLUK beyanıdır.*
  # ⚠ GERİ AL tek satır: `"off"` → tek bir iz satırı bile eklenmez.
  niyet_izi: "prod"
  # FAZ 2.3 — kapsam merceği. `off`: her kullanıcı bugünkü TAM katalogu görür.
  # 🔴 Mercek bir GÖRÜNÜRLÜK aracıdır, GÜVENLİK SINIRI DEĞİL — kapatmak yetki AÇMAZ.
  kapsam_mercegi: "off"   # ⚠ TIRNAK ŞART: YAML 1.1 çıplak `off`u BOOLEAN okur
  # FAZ 3.4 — Ossie ithali. `off`: uç 404 döner (GERİ AL).
  ossie_ithal: "off"
  # FAZ 4.4 — Ossie ihracı. `off`: uç 404 döner. İhraç OKUMA işlemidir, `packs/` etkilenmez.
  ossie_ihrac: "off"
  # FAZ 4.5 — MCP yüzeyi. `off`: /mcp/* 404 döner, HTTP yolu ETKİLENMEZ.
  mcp_yuzeyi: "off"
  # FAZ 5.1 — 6. konuşma türü ("bunu takip et"). `off`: tür tanınmaz, davranış birebir.
  tur_takip: "off"
  # FAZ 5.10 — KPI pin. `off`: pano bugünkü davranışında, pinler SİLİNMEZ görünmez olur.
  kpi_pin: "off"
  # FAZ 5.12 — içgörü paketi. `off`: `viz_paketi` None, tekil kart birebir bugünkü hâlde.
  ui_icgoru_paketi: "off"
  # FAZ 5.13 — bilgi merkezi (hayalet seri + kural motoru). `off`: /ask cevabı DEĞİŞMEZ.
  ui_knowledge_center: "off"
  # FAZ 6.0/6.1 — onay akışı + D9. `off`: bugünkü "her yazmaya istem" davranışı birebir.
  onay_akisi: "off"
  # FAZ 6.5 — dış geliştirici API'si. `off`: dış uç yok.
  public_api: "off"
  # FAZ 6.6 — kanal kimlik eşlemesi. `off`: bildirimler bugünkü adresleme ile gider.
  kanal_kimlik: "off"
  # 🔴 FAZ 6.5 — gömülü pano. **AÇILAMAZ**: `motor_cls=off` (motor-RLS hiç açık değil) ve
  # yol haritası `always_filter`ı tek başına yeterli SAYMIYOR. Ölçüm `app/embed_kapsam.py::
  # p0_engeli()`de bir KAPI olarak duruyor — belgeye yazıp koda yazmamak, ilan edip
  # uygulamamaktır.
  embed: "off"
  # FAZ 5.14 — Hızlı ↔ Derin. `off`: `mod` alanı yok sayılır, bugünkü davranış birebir.
  hizli_derin: beta   # 🔴 G0.14 — ÖLÜ KONTROL CANLANDIRILDI (2026-08-07).
  #   Ölçüldü: UI'da iki konumlu anahtar VARDI (`ChatPanel.tsx`), kullanıcı tıklıyordu,
  #   sunucu alanı YOK SAYIYORDU (`ask.py:2563`) — çalışıyormuş gibi görünen ölü kontrol.
  #   Açmak SIFIR yeni davranış getirir: `hizli` ≡ `yol_siniri="deterministik"`,
  #   yani zaten kurulu ve testli bir kapıya **ikinci bir ad**. Kod da bunu yazıyor:
  #   *"Aynı davranışa iki ad vermek meşrudur; iki UYGULAMA vermek değildir."*
  #   Alternatif (UI'dan kaldırmak) reddedildi: kontrol yanlış değil, yalnız kapalıydı.
  # 🔴 FAZ 4.3 borcu — takipte çıplak ikinci ölçü adı. **AÇILDI (beta)** — ve açış
  # ölçüme dayanıyor, iyimserliğe değil:
  #   · çok-turlu düşüş  −%18,2 → **−%4,5** (hedef −%10) · karar `kaldi` → **`gecti`**
  #   · korpus doğru-cube **%93,1 → %93,1** (birebir, A/B ölçüldü)
  # Denetimin §4/risk-1 korkusu ("boyut sanılan kelimeler ölçüye çekilir") ÖLÇÜLDÜ ve
  # gerçekleşmedi. ⚠ `beta`: fabrika varsayılanı açık ama tenant/rol override'ı hâlâ
  # mümkün — geri alma tek satır.
  olcu_ekleme_takibi: beta
  # FAZ 5.2 — 7. konuşma türü ("paylaş"). `off`: kalıplar eşleşmez, TUR_ANLAT birebir.
  tur_paylas: "off"
  # ⚠ AŞAĞIDAKİ ÜÇÜ FAZ 4.6'DA EKLENDİ — bir denetim ölçtü: `FLAG_REGISTRY`'de kayıtlı
  # ama bu dosyada YOKLARDI, yani varsayılanları hiçbir yerde YAZILI DEĞİLDİ. Yokluk ile
  # `"off"` çözümlemede aynı sonucu verir (`resolve_for` `off`u kümeden düşürür), bu
  # yüzden ekleme DAVRANIŞ DEĞİŞTİRMEZ — ama *"bu bayrak var ve kapalı"* ile *"böyle bir
  # bayrak yok"* okuyucu için aynı şey değildir. 🔴 Yazılı olmayan bir varsayılan,
  # tartışılamayan bir varsayılandır.
  ask_async_discovery: "off"   # Discovery'yi arka plana al (/ask/jobs kuyruğu)
  cekirdek_katman: "off"       # FAZ 2.1 — çekirdek katman derlemeye girer
  threaded_chat: "off"         # thread'li sohbet UI'ı
  # FAZ 2.5 — hedef kıyası. `off`: `resp.hedef` HİÇ üretilmez → yanıt bayt bayt bugünküyle
  # aynı (KURAL B). 🔴 Açıkken bile hedef UYDURULMAZ: `target:` beyanı yoksa `None`.
  hedef_kiyasi: "off"
  cikti_yorumlama: beta   # evrensel çıktı yorumu — her tablo/grafik/rapor/KPI
  sql_display: beta       # üretilen SQL'i kullanıcıya göster ('+ sql göster')
  verify_button: beta     # ✓/✗ doğrulama — VQR öğrenme (eskiden boyahane sektöründe)
  scheduled_reports: beta # 🔔 zamanla + bildirim (ADR-0011; eskiden boyahane sektöründe)
  dashboards: beta        # kullanıcı panoları — canlı izleme (§9)
  next_steps: beta        # rehberli analitik K2 — sonraki adım (kırılım/ölçek/zaman) chip'leri
  ask_intent_first: beta  # /ask: route() boşsa LLM'e Intent-JSON doldurttur (Faz 1 canary —
                          # route()'un kendisi bu bayraktan bağımsız her zaman çalışır)
  agent_plan_secimi: "off"  # FAZ 4: çapraz-alan pilotu — Planlayici.sec() planı ÖNERİR,
                          # dört kapı DENETLER, agent_run makbuzu kaydeder. Seçim ≠
                          # çalıştırma. `off` — sıcak yola LLM çağrısı ekliyor.
  prompt_enhancer: "off"  # FAZ 3b: route() BOŞ dönerse soruyu katalog terimleriyle
                          # YENİDEN YAZ ve route()'u TEKRAR dene. LLM yapı seçmez, yalnız
                          # metni iyileştirir. Planlayıcının DÖRT KAPISINDAN geçer
                          # (route denenmeden seçilemez). `off` — sıcak yola LLM çağrısı
                          # ekliyor; açılması bilinçli karar olmalı (KURAL B, testli).
  # 🔴 `G2` — DİYALOG BELLEĞİ (`DA-5`). Bayrak, katman indiğinde **hiç yaratılmamıştı**;
  #   GERİ AL sözleşmesi (*"`off` → davranış birebir bugünkü"*) uygulanamaz durumdaydı ve
  #   bunu bir denetim ajanı buldu. `MIMARI §9.11`: *bir kill-switch yalnız KODDA varsa
  #   yarımdır.*
  #   Kapalıyken `AskRequest.diyalog_durumu` sunucuya **hiç girmez** → `KURAL_DEVAM`
  #   ateşlenmez → *"sorduğunu hatırlama"* davranışı `G2` öncesine döner.
  #   ⚠ `on`: katman canlı kapıda üç koşum yeşil verdi (`3·süreklilik` 3/3, `9·onarım` 1/1)
  #   ve istemci yankısı `Z` turunda bağlandı; kapalı tutmak ölçülmüş bir kazancı
  #   saklamak olurdu.
  diyalog_bellegi: on
  t2_anlatici: alpha   # 🔴 G5 — AÇILDI (2026-08-07). Kapalılığın sebebi bir KARAR
  #   değil, ÖLÇÜLMEMİŞLİKTİ: MIMARI §6.19z'de kazanç ölçümü "⊘ ÖLÇÜLEMEDİ — kota".
  #   Üç ön koşul da sağlandı ve üçü de FAIL-CLOSED:
  #     G0b · hava boşluğu   → gerçek değer/sayı yer tutucuya çevrilir, DIŞARI ÇIKMAZ
  #     G4  · iddia kapısı   → "tedarikçi kırılımı da ekleyebilirim" DÜŞER
  #     G5.1· ön koşul kilidi→ iddia.py yoksa anlatı HİÇ üretilmez
  #   ⚠ `alpha` bilinçli: KURAL G-1 gereği iki koşum ölçülmeden `beta` olmaz.
  #   Kazanç yoksa `off`'a döner VE gerekçesi MIMARI'ye yazılır (§13.4).
                          # Türkçeye çevirir. LLM ÜSLUBU yazar, SAYIYI sistem koyar.
                          # narration_guard ZORUNLU çıkış kapısı (fail-closed: eşleşmeyen
                          # sayı taşıyan cümle YAYIMLANMAZ). `off` — sıcak yola LLM çağrısı
                          # ekliyor; açılması bilinçli bir karar olmalı (KURAL B, testli).
  llm_sema_kisitli: beta  # FAZ 3a: Intent-JSON'u sağlayıcının NATIVE tool-use'una taşı —
                          # cube/ölçü/boyut adları o anki kataloğun ENUM'u olarak şemaya
                          # gömülür (enum CUBE'A GÖRE daralır; `cube:null` reddetme dalı
                          # KORUNUR). Desteklenmezse serbest-JSON yedeğine düşer.
                          # KAPALIYKEN davranış bugünküyle BİREBİR aynı (KURAL B, testli).
  # FAZ 0.18 — METRİK KAYDI = HAKEM. Kapalıyken kayıt ŞEMAYA HİÇ YAZILMAZ ve
  # `cube_router._match_cube` onu görmez → davranış BİREBİR bugünkü (GERİ AL).
  # Açıldığında bile taslak kayıt `sahiplenilen_terimler: []` ile gelir: yani "bu terim
  # çakışıyor" der, "sahibi şudur" DEMEZ. Sahiplik kararı FAZ 3.1'in turudur.
  # FAZ 0.5 — ÇAPA ZİNCİRİ. Kapalıyken `capalar` listesi BOŞ kalır → `context.coz()`
  # bugünkü yapısal/ham/taze dallarını kullanır → davranış BİREBİR bugünkü (GERİ AL).
  # FAZ 0.13 — SOSYAL SINIF. ⚠ Bayrak bu maddede EKLENDİ: teslim borcunun asıl parçası
  # buydu (MIMARI §6.13z/9.11: "bir kill-switch yalnız KOD'da varsa YARIMDIR" — sınıf
  # kod olarak vardı, geri alma yolu YOKTU). Varsayılan `on`: sınıf ölçülmüş ve
  # kanıtlanmış bir kusuru kapatıyor (`teşekkürler` → uydurma SQL); kapatma yolu artık
  # VAR ama gerekçesiz kapatılmaz.
  sosyal_sinif: prod
  # 🔴 **AÇILDI (beta)** — denetim raporunun §6 üçlüsünün son ayağı. Kapalıyken `_capalar`
  # hep boş kalıyordu, yani `KURAL_CAPA` (*"karta yanıt"*) **üretimde hiç ateşlemiyordu**:
  # mekanizma vardı, **yolu kapalıydı**.
  #
  # Açış ölçüme dayanıyor (§4/risk-2: *"çapa zincirini açmak YOL DEĞİŞTİRİR"*):
