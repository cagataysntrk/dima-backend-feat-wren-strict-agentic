  # ⊙ A/B (aynı kod, yalnız bu bayrak): açıkken `tests/test_telemetri_yazma_yolu.py`
  # **2 kırmızı**, kapalıyken **12 yeşil**. Kayıp gerçek ve dar: LLM yoluna düşen soru
  # telemetriye **red gerekçesi OLMADAN** yazılıyor — çünkü `_teshis` şemayı arka-plan
