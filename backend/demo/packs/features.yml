  # 🔴 O kolonun tek varlık sebebi *"kapsam boşluğunun EN BÜYÜK kümesi"*ni saymaktı.
  # ⚠ Yani hız kazancı gerçek ama bedeli bir **ölçüm kanalı**: bu turda tam bu sınıftan
