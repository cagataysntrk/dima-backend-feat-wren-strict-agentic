# packs/i18n/en.yml — İngilizce YARDIMCI (teknik-kapsam) sinonimleri (§7b "ayrı sakla,
# birleşik ara"). Her dil AYRI DOSYA → yeni dil = yeni dosya, KOD DEĞİŞMEZ (proper i18n;
# "sonsuz Python dosyası" değil). Kanonik ölçü/boyut ADI anahtar (dilsiz kimlik).
#
# scope: technical → TEKNİK ALT-KÜME. Yalnız küratörlü teknik/iş terimi; GENEL SÖZLÜK YOK.
# YANLIŞ-DOST GARANTİSİ: İng. "son" (=oğul) buraya girmez → Türkçe "son" (=last) tek-anlamlı
# kalır → %100 kesinlik, gereksiz "bunu mu demek istediniz?" yok. Yerel dil (tam sözlük)
# ayrıdır: pack cube YAML + app/archetypes.py MEASURE_ARCHETYPES (tr).
