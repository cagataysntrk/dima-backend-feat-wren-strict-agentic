# FAZ 3.1 — SAHİPLİK TURU · **karar kaydı** (kalem · sahip · tarih · gerekçe)
#
# 🔴 BU BİR YAML İŞİ DEĞİL, BİR ALAN-BİLGİSİ İŞİDİR — ve çıktısı **veridir**, yorum değil.
# Her satır `metrik_kaydi.hakem`'i besler; hakem `_match_cube`'un İLK satırında sorulur.
#
# ## Ölçülen kusur
#
# Çakışan terim sayısı (2026-08-04, `metrik_kaydi.cakisan_terimler`):
# `demo-boyahane` **62** · `gitas` **48** · `gulteks` **39** · `atiksan` **25**.
# Ve dağılım rastgele değil: boyahane yanlış-cube listesinin ilk 10'unun 10'u `elektrik`,
# atiksan'ın ilk 9'unun 9'u `satış` — **aynı hastalık, iki tenant, iki terim**.
#
# ## 🔴 ÜÇ KUTU — ve her terim yalnız BİRİNE girer
#
# | kutu | ne demek | ne yapılır |
# |---|---|---|
# | **(1) tek sahip** | terim aslında **bir** cube'un | `sahip:` yazılır, hakem karar verir |
# | **(2) gerçek belirsizlik** | kullanıcı hangisini kastettiği **belli değil** | `chip` — sahip YAZILMAZ |
# | **(3) grain hatası** | iki cube **aynı grain**'de | modelleme borcu (2.4), sahiplik ÇÖZMEZ |
#
# ⚠ **KUTU (2) BİR EKSİKLİK DEĞİL, BİR KARARDIR.** `bakiye` (cari ↔ mizan) ders kitabı
# örneğidir ve **korunur**: cari bakiyesi ile mizan bakiyesi **farklı sorulardır** ve
# birini seçmek, kullanıcının sormadığı soruya cevap vermek olur. *Gerçek belirsizliği
# tahminle kapatmak, belirsizliği yok etmez — yalnız görünmez kılar.*
#
# ## GERİ AL
#
# Her karar **tek tek** geri alınabilir: satırı sil → hakem `None` döner → bugünkü yol.
# Toplu geri alma bayrağı `metrik_kaydi`'dir (FAZ 0.18).

kararlar:
  # ── KUTU (1) · TEK SAHİP ────────────────────────────────────────────────
  - terim: elektrik
    kutu: tek_sahip
    sahip: enerji_makine
    tarih: 2026-08-04
    gerekce: >-
      `enerji_makine` elektrik tüketimini MAKİNE grain'inde ölçer ve `elektrik` onun
      birincil ölçüsüdür. `surdurulebilirlik` ise elektriği bir SÜRDÜRÜLEBİLİRLİK
      göstergesi olarak taşır — yani türev bir mercek. Ölçüldü: boyahane yanlış-cube
      listesinin ilk 10'unun 10'u bu terim. ⚠ `surdurulebilirlik`'in KİMLİĞİ SİLİNMEDİ
      (FAZ 2.4); yalnız çıplak `elektrik` teriminin sahibi belirlendi.

  - terim: satis
    kutu: tek_sahip
    sahip: ticaret
    tarih: 2026-08-04
    gerekce: >-
      Satış ticari olarak FATURAYLA doğar ve `ticaret` fatura grain'indedir (FAZ 2.1(c)
      karar kalemi: kanonik `satis_tutari` grain'i = fatura). `mal` stok hareketi,
      `karlilik` ise türev bir hesabın girdisidir — ikisi de satışın KENDİSİ değil.
      Ölçüldü: atiksan yanlış-cube listesinin ilk 9'unun 9'u bu terim.

  # ── KUTU (2) · GERÇEK BELİRSİZLİK → CHIP (sahip YAZILMAZ) ───────────────
  # 🔴 Bu satırlar bilinçli olarak `sahip:` TAŞIMAZ. Varlıkları bir karardır: "bu terim
  # incelendi ve belirsizliğinin GERÇEK olduğuna karar verildi". Satırı hiç yazmamak,
  # "henüz bakılmadı" ile "bakıldı, belirsiz" arasındaki farkı yok ederdi.
  - terim: bakiye
    kutu: belirsiz
    tarih: 2026-08-04
    gerekce: >-
      🔴 DERS KİTABI ÖRNEĞİ, KORUNUR. Cari bakiyesi (müşteri/tedarikçi hesabı) ile mizan
      bakiyesi (muhasebe hesap planı) FARKLI SORULARDIR; birini seçmek kullanıcının
      sormadığı soruya cevap vermektir. Netleştirme chip'i doğru davranıştır.

  - terim: borc
    kutu: belirsiz
    tarih: 2026-08-04
    gerekce: "`bakiye` ile aynı gerekçe: cari borcu ↔ mizan borç bakiyesi."

  - terim: ariza durusu
    kutu: belirsiz
    # 🔴 `olculer:` — kararın HANGİ ölçüleri yönettiği **beyan edilir**, tahmin edilmez.
    # Kapı önce bunu okur; yoksa terim↔ad alt-dizesine düşer. `ariza durusu` ↔
    # `toplam_durus_dakika` bağı bir alt-dize ile kurulamıyordu (çekim eki) ve kalem
    # **kararsız görünüyordu** — oysa kararı vardı.
    # *Bir bağı tahmine bırakmak, onu bir gün sessizce kopmaya bırakmaktır.*
    olculer: [toplam_durus_dakika]
    tarih: 2026-08-04
    gerekce: >-
      `bakim.ariza_suresi` (bakım kaydı) ile `oee.plansiz_durus_dakika` (üretim duruşu)
      farklı ölçüm noktalarıdır: biri bakım ekibinin kaydı, öteki hattın kaybı. Aynı
      arıza ikisinde farklı süre üretebilir — hangisinin sorulduğu KULLANICIYA aittir.

  # ── KUTU (3) · GRAIN HATASI → modelleme borcu (sahiplik ÇÖZMEZ) ────────
  - terim: yogunluk
    kutu: grain_hatasi
    tarih: 2026-08-04
    gerekce: >-
      `surdurulebilirlik` ≡ `parti` (ikisi de `partiler` grain'inde — FAZ 2.4 beyanı).
      Yoğunluk ölçüleri `parti` grain'ine ait METRİKLERDİR. Bu bir sahiplik sorunu değil
      bir MODELLEME borcudur; sahip yazmak kusuru gizlerdi.

  # ══ 2026-08-10 · B-6 SAHİPLİK TURU — 9 çok sahipli ölçünün kararsız kalan 6'sı ══
  #
  # ⊙ Ölçüldü (`/stats/katalog`, canlı derlenmiş şema): 9 çok sahipli ölçü adı var,
  # **6'sının kararı yoktu**. Rapor `B-4`: *"boş bırakmak üçüncü bir seçenek değildir"* —
  # bugün olan da oydu ve maliyeti ₺11,86 milyonluk sessiz bir seçimdi.

  # ── KUTU (1) · TEK SAHİP ────────────────────────────────────────────────
  - terim: dogalgaz
    kutu: tek_sahip
    sahip: enerji_makine
    tarih: 2026-08-10
    gerekce: >-
      `elektrik` kararının birebir eşleniği ve aynı çift: `enerji_makine` doğalgazı
      MAKİNE grain'inde **ölçer**; `surdurulebilirlik` onu bir raporlama merceği olarak
      taşır. Aynı hastalığa aynı ilaç — *bir sınıf hatayı bir örnekte kapatmak sınıfı
      kapatmaz*.

  - terim: tep
    kutu: tek_sahip
    sahip: surdurulebilirlik
    tarih: 2026-08-10
    gerekce: >-
      ⚠ Ve bu, `dogalgaz`'ın **tersi** yönde karar — sebebi de tam olarak o: TEP
      (ton eşdeğer petrol) bir ölçüm değil bir **raporlama birimidir**; doğal evi
      sürdürülebilirlik raporlamasıdır, makine telemetrisi değil. *Aynı çiftteki iki
      ölçünün sahibi aynı olmak zorunda değildir; sahibi belirleyen küp değil, ölçünün
      ne olduğudur.*

  - terim: uretim
    kutu: tek_sahip
    sahip: oee
    tarih: 2026-08-10
    gerekce: >-
      🔴 Bu karar **zaten kodda yazılıydı, katalogda değildi**: `wren_service.py`
      `maliyet.toplam_uretim_kg`'yi doğal dil eşleştirmesinden bilerek çıkarmış ve
      sebebini yazmış — *"o, kg-başına maliyetin PAYDASIDIR; `toplam üretim` sinonimini
      taşıdığı için route on eval vakasını oraya yönlendiriyordu ve o cube'un yalnız
      `makine` boyutu olduğu için soruların çoğunu cevaplayamıyordu bile."*
      Karar burada **beyan ediliyor** ki bir daha kod yorumundan okunmasın.

  - terim: fire
    kutu: tek_sahip
    sahip: parti
    tarih: 2026-08-10
    gerekce: >-
      `parti` fireyi işin kendi biriminde (kg, parti grain'i) ölçer; `oee` onu bir
      **kalite kaybı bileşeni** olarak taşır. Sistem bugün zaten `parti` seçiyor ve
      ötekini beyan ediyor — bu satır o **fiili** kararı **bilinçli** hâle getirir.
      *Kurala bağlanmamış bir alışkanlık, bir gün sessizce değişir.*

  # ── KUTU (2) · GERÇEK BELİRSİZLİK → sahip YAZILMAZ, chip sorar ───────────
  - terim: alacak
    kutu: belirsiz
    tarih: 2026-08-10
    gerekce: >-
      `bakiye`nin birebir kardeşi ve aynı çift (`cari` ↔ `mizan`): cari alacağı ile
      mizan alacağı **farklı sorulardır**. Birini seçmek, kullanıcının sormadığı soruya
      cevap vermek olur. *Gerçek belirsizliği tahminle kapatmak, belirsizliği yok
      etmez — yalnız görünmez kılar.*

  - terim: ilk seferde tamam
    kutu: belirsiz
    tarih: 2026-08-10
    gerekce: >-
      `oee` bunu MAKİNE grain'inde, `parti` PARTİ grain'inde ölçer — yani iki sayı
      farklı paydalara sahiptir ve *«RFT yüzdesi kaç»* sorusunun iki meşru cevabı
      vardır. ⚠ Bir sahip seçmek burada bir tercih değil bir **payda seçimidir** ve
      kullanıcı hangisini sorduğunu söylemeden yapılamaz.
