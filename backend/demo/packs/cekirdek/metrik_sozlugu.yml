# ÇEKİRDEK METRİK SÖZLÜĞÜ — FAZ 2.1 · adım (a)
#
# 🔴 BU DOSYA İFADEYE DOKUNMAZ. Adım (a) yalnız **sözlüğü** birleştirir: sinonim ·
# birim · `additive` · **grain sözleşmesi**. İfade eşlemesi (adım b/c) ayrı bir turdur
# ve ayrı bir karar gerektirir — `cari`'nin ölçü ADLARI aynı ama İFADELERİ farklı
# (`SUM(CASE WHEN cha_tip=0…)` ↔ `SUM(BORC)`), `base_object`'leri dört ayrı tablo.
# *Aynı ada sahip iki ifadeyi "saf tekrar" sanıp birleştirmek, bu fazın üretebileceği
# en sessiz hatadır.*
#
# ## Alanların anlamı
#
# | alan | ne | kim sahibi |
# |---|---|---|
# | `grain` | ölçünün **bir satırının** ne demek olduğu | 🔴 **ÇEKİRDEK** — sözleşme |
# | `synonyms` | kullanıcının o metriği çağırdığı kelimeler | çekirdek + sektör (additive) |
# | `unit` | birim (`₺`, `kg`, `adet`, `%`) | çekirdek |
# | `additive` | `full` \| `semi` \| `none` | çekirdek |
# | `expression` | SQL | ⛔ **ERP KATMANI** — burada YOK |
# | `base_object` | fiziksel tablo | ⛔ **ERP KATMANI** — burada YOK |
#
# ## 🔴 GRAIN SÖZLEŞMESİ — fail-closed
#
# Bir metrik burada `grain: fatura` diyorsa, onu `stok_hareketi` grain'li bir cube'a
# bağlayan ERP katmanı `compose()`'u **REDDETTİRİR**. Uyarı değil **ret**: uyarı,
# derlenmiş ve dağıtılmış bir MDL bırakır ve o MDL'yi kimse geri almaz.
#
# ⚠ **İki grain de meşru olabilir** — o zaman **iki ayrı metrik** yazılır (`satis_tutari`
# @fatura ve `satis_tutari_hareket` @stok_hareketi), tek metrik iki anlama BÜKÜLMEZ.
# Hangi metriğin `satış` sinonimini taşıdığı `0.18`'in metrik kaydına yazılır: karar
# kalemi, **sahibi ve tarihi** olur.

grain_sozlesmeleri:
  # Ölçülen: mikro-v16 `ticaret` → `stok_hareketleri`; logo-3 · netsis `ticaret` →
  # `faturalar`. Aynı ad, aynı sinonim, KARŞILAŞTIRILAMAZ sayı.
  fatura:
    # ⚠ **DÜZELTİLDİ:** ilk yazımda `fatura_kalem` de bu listedeydi — yani *"fatura"* ile
    # *"fatura kalemi"* AYNI grain sayılıyordu. Değiller: bir faturanın **çok** kalemi
    # olur. İkisini aynı saymak, tam olarak bu sözleşmenin engellemek için var olduğu
    # hatadır — üstelik sözleşmenin **kendi içinde**.
    aciklama: "bir satır = bir FATURA (başlık)"
    base_object_adlari: [faturalar, fatura, invoice, INVOICE]
  fatura_kalem:
    aciklama: "bir satır = bir fatura KALEMİ (bir faturanın çok kalemi olur)"
    base_object_adlari: [fatura_satirlari, fatura_kalem, fatura_kalemleri, invoice_line]
  stok_hareketi:
    aciklama: "bir satır = bir stok hareketi (giriş/çıkış)"
    base_object_adlari: [stok_hareketleri, stok_hareket, sth, STOK_HAREKETLERI]
  cari_hareket:
    # ⚠ Adlar ÖLÇÜLDÜ, tahmin edilmedi: logo-3 · netsis → `cari_hareketleri`,
    # mikro-v16 → `cari_hesap_hareketleri`. İlk yazımda ikisi de listede YOKTU ve
    # `grain_adi()` üçünde de `None` dönüyordu — yani kapı ARMED görünüp hiç ateşlemiyordu.
    # *Tanımadığı bir tabloyu "serbest" sayan bir kapı, sessizce kapalı bir kapıdır.*
    aciklama: "bir satır = bir cari hesap hareketi (borç/alacak)"
    base_object_adlari: [cari_hareketleri, cari_hesap_hareketleri, cari_hareketler,
                         cari_hareket, cha, CLFLINE]
  parti:
    aciklama: "bir satır = bir üretim partisi"
    base_object_adlari: [partiler, parti]

metrikler:
  # ── SATIŞ — adım (c): KARAR KALEMİ ─────────────────────────────────────────
  #
  # 🔴 **ÖLÇÜLDÜ (2026-08-04) ve yol haritasının teşhisinden AĞIR çıktı.** Yol haritası
  # *"`ticaret` üç ERP'de farklı grain"* diyordu; sayım **ÜÇ grain / BEŞ cube** gösterdi:
  #
  #   logo-3/mal        fatura_satirlari    → fatura KALEMİ
  #   logo-3/ticaret    faturalar           → fatura
  #   mikro-v16/ticaret stok_hareketleri    → stok hareketi
  #   netsis/mal        stok_hareketleri    → stok hareketi
  #   netsis/ticaret    faturalar           → fatura
  #
  # ⚠ **Ve ayrışma ŞİRKET İÇİNDE:** `gitas` (netsis) tek başına `satis_tutari`'yi HEM
  # `ticaret`@fatura HEM `mal`@stok_hareketi olarak taşıyor — aynı ad, aynı sinonim
  # (`satış`, `ciro`), **iki farklı sayı**, **aynı şirkette**. Yani *"bu yıl satış"*
  # sorusunun cevabı yönlendiricinin hangi cube'u seçtiğine bağlı. Bu, şirketler arası
  # sürüklenmeden **daha kötüdür**: kullanıcı iki sayıyı yan yana bile göremez.
  #
  # ## KARAR — kalem · sahip · tarih
  #
  # | | |
  # |---|---|
  # | **Karar** | `satis_tutari` **kanonik grain'i = `fatura`** |
  # | **Gerekçe** | Satış, ticari olarak **faturayla** doğar; stok hareketi bir *sonuçtur* (ve iptal/iade faturada görünür, hareket kaydında her zaman değil) |
  # | **Karşı grain'ler** | `satis_tutari_hareket` @stok_hareketi · `satis_tutari_kalem` @fatura_kalem — **ikisi de meşru**, tek metrik iki anlama BÜKÜLMEZ |
  # | **Sahip** | FAZ 2.1(c) · ad göçü **ayrı** bir turda (NL yönlendirmesini değiştirir, kendi korpus ölçümünü ister) |
  # | **Tarih** | 2026-08-04 |
  #
  # 🔴 **Bu beyan BUGÜN kapıyı ateşliyor:** `cekirdek_katman=on` iken üç cube (mikro/ticaret,
  # netsis/mal, logo-3/mal) `compose()`'u **reddettirir** — ve bu **istenen** davranıştır.
  # Bayrak `off` kaldığı için bugünkü derleme etkilenmez; ad göçü inene kadar `on`
  # AÇILAMAZ ve bu bir **eksiklik değil, kilidin kendisidir**.
  # *Bir sözleşmeyi, ihlal edildiği için yazmamak, ihlali sözleşme yapmaktır.*
  - name: satis_tutari
    label: satış tutarı
    unit: "₺"
    additive: full
    grain: fatura
    synonyms: [satış, satis, ciro, gelir, satış tutarı, hasılat, hasilat]

  # Karşı grain'ler — henüz hiçbir cube bu adları taşımıyor (ad göçü ayrı tur).
  # ⚠ Sözlükte durmaları **ölü girdi değil**: `test_SOZLUK_GIRDILERI_OLU_DEGIL`
  # muafiyeti aşağıda gerekçesiyle yazılı — bunlar bir KARARIN kaydıdır, bir eşleşme
  # beklentisi değil.
  - name: satis_tutari_hareket
    label: satış tutarı (stok hareketi)
    unit: "₺"
    additive: full
    grain: stok_hareketi
    karar_kaydi: true
    synonyms: [satış, satis, ciro, satış tutarı]

  # ⚠ **GRAIN BİLİNÇLİ OLARAK BEYAN EDİLMEZ** — ve bu bir eksiklik değil, ölçülen
  # gerçeğin kaydıdır: türev kârlılık görünümünün `base_model`'i ERP'ye göre değişiyor
  # (mikro `stok_hareketleri` · logo-3 `fatura_satirlari` · netsis `stok_hareketleri`).
  # Sabit bir grain dayatmak, üç ERP'den ikisini derleme zamanında reddetmek olurdu;
  # kanonik `satis_tutari` adını taşımasına izin vermek ise sürüklenmeyi geri getirirdi.
  # 🔴 **ŞİRKETLER ARASI KIYASLANMAZ:** kârlılık hesabının GİRDİSİDİR (marj/SMM ile aynı
  # satırdan gelir, o yüzden kendi içinde anlamlıdır), bir satış cirosu değil.
  - name: satis_tutari_turev
    label: satış tutarı (kârlılık girdisi)
    unit: "₺"
    additive: full
    karar_kaydi: true
    kiyaslanamaz: true
    synonyms: [satış, ciro, satış tutarı]

  - name: satis_tutari_kalem
    label: satış tutarı (fatura kalemi)
    unit: "₺"
    additive: full
    grain: fatura_kalem
    karar_kaydi: true
    synonyms: [satış, satis, ciro, satış tutarı]

  - name: satis_miktari
    label: satış miktarı
    unit: adet
    additive: full
    synonyms: [satış miktarı, satılan, sevk edilen, satis miktari]

  - name: alim_tutari
    label: alım tutarı
    unit: "₺"
    additive: full
    synonyms: [alım, alim, alış, alis, alım tutarı, satın alma]

  # ── CARİ — adım (b): GRAIN SÖZLEŞMESİ BEYAN EDİLDİ ──────────────────────────
  #
  # 🔴 `cari` üç ERP'de de AYNI grain'de (cari hareket) ve ölçü adları da aynı; farklı
  # olan yalnız İFADE (`SUM(CASE WHEN cha_tip=0…)` ↔ `SUM(BORC)`). Yani burada
  # sözleşmeyi beyan etmek RİSKSİZ: üçü de uyuyor ve kapı bunu doğruluyor.
  # `ticaret` ise UYMUYOR — o yüzden onun sözleşmesi adım (c)'ye bırakıldı.
  #
  # ⚠ **AD UYUŞMAZLIĞI DÜZELTİLDİ:** ilk yazımda `borc_toplami`/`alacak_toplami`
  # yazmıştım; cube'lardaki gerçek adlar `toplam_borc`/`toplam_alacak`. Eşleşme ADLA
  # olduğu için o iki girdi HİÇBİR ŞEYE dokunmuyordu — sessizce ölü sözlük satırları.
  # *Kimseyle eşleşmeyen bir sözlük girdisi, yazılmamış bir girdiyle aynı şeydir.*
  #
  # ⚠ `additive` burada BEYANDIR, yazılmaz (bkz. `app/cekirdek.py::cube_birlestir`):
  # doğru değeri İFADEYE bağlıdır ve merkezî olarak dayatmak, bu maddenin engellemek
  # için var olduğu hatanın ta kendisi olurdu.
  - name: bakiye
    label: bakiye
    unit: "₺"
    additive: semi
    grain: cari_hareket
    synonyms: [bakiye, borç bakiyesi, hesap bakiyesi, kalan]

  - name: toplam_borc
    label: borç toplamı
    unit: "₺"
    additive: full
    grain: cari_hareket
    synonyms: [borç, borc, borç toplamı, toplam borç]

  - name: toplam_alacak
    label: alacak toplamı
    unit: "₺"
    additive: full
    grain: cari_hareket
    synonyms: [alacak, alacak toplamı, toplam alacak]

  - name: hareket_sayisi
    label: hareket sayısı
    unit: adet
    additive: full
    grain: cari_hareket
    synonyms: [hareket sayısı, kaç hareket, işlem sayısı]
