name: kur
label: Döviz kuru
base_object: doviz_kurlari

# DÖVİZ CUBE'U (2026-08-05) — ERP-bağımsız dikey.
#
# ⚠ ÖLÇÜLEN BOŞLUK: `faturalar` **zaten** `para_birimi` ve `kur` sütunları taşıyordu,
# ama bir KUR TABLOSU yoktu. Yani sistem her faturanın hangi kurla kesildiğini
# biliyordu, fakat *"bugünkü kurla ne eder"* ya da *"kur farkı zararımız ne"*
# sorusunu cevaplayamıyordu — kıyaslayacağı bir referans yoktu.
#
# > *Bir alanı taşımak, onu açıklayabilmek değildir.*
#
# 🔴 İhracatçı bir tekstilci için kur, kârlılığın tek en belirleyici dış değişkenidir;
# kursuz bir mali veri kümesi, kâr düşüşünün en sık sebebini görünmez bırakır.
synonyms: [kur, döviz, dolar, euro, döviz kuru, parite, exchange, kur farkı]

measures:
  - name: ort_kur
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "ROUND(AVG(kur),4)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [kur, ortalama kur, döviz kuru, kaç lira]
  - name: kapanis_kuru
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    # ⚠ Son gözlem — `MAX(tarih)` değil `LAST` semantiği gerekir; DuckDB'de
    # arg_max doğru olanı verir. AVG ile karıştırmak, ay sonu değerlemesini yanlış yapar.
    expression: "ROUND(arg_max(kur, tarih),4)"
    type: DOUBLE
    unit: "₺"
    synonyms: [kapanış kuru, son kur, dönem sonu kuru, güncel kur]
  - name: en_yuksek_kur
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "ROUND(MAX(kur),4)"
    type: DOUBLE
    unit: "₺"
    # 🔴🔴 FAZ 3.2 (`§K9-devam`'ın genelleştirilmesi) — çıplak `zirve`/`tepe`
    # KALDIRILDI: ölçüldü, `followup._ISARET` (grafikteki bir noktayı işaret eden
    # coğrafi kelimeler ailesi — *"şu tepe"*, *"zirve neydi"*) AYNI kelimeleri
    # taşıyor — bir takip sorusu bu ölçüye yanlış kırılım olarak eşleşirdi
    # (`_NEDEN`/İSG'de kapanan kusurun ÜÇÜNCÜ, bağımsız vukuu —
    # `test_soru_sozcugu_sinonim_degil.py::test_HICBIR_KONUSMA_KALIBI_SOZLUGU_
    # SINONIM_DEGIL` bunu yakaladı). Çok-kelimeli, spesifik ifadeler kalır.
    synonyms: [en yüksek kur, maksimum kur]
  - name: en_dusuk_kur
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "ROUND(MIN(kur),4)"
    type: DOUBLE
    unit: "₺"
    synonyms: [en düşük kur, dip, minimum kur, taban]
  - name: kur_oynakligi
    lower_is_better: true   # B-5 · yüksek = KÖTÜ
    expression: "ROUND(STDDEV_SAMP(kur),4)"
    type: DOUBLE
    unit: "₺"
    # ⚠ Çıplak `sapma` KALDIRILDI: dört cube'un ölçüsüydü (bütçe · enerji · renk · kur).
    synonyms: [oynaklık, volatilite, dalgalanma, kur oynaklığı, kur sapması]

dimensions:
  - name: para_birimi
    expression: para_birimi
    type: VARCHAR
    label: para birimi
    synonyms: [para birimi, döviz cinsi, dolar mı euro mu, hangi döviz, kur cinsi]

time_dimensions:
  - name: tarih
    expression: tarih
    type: DATE
