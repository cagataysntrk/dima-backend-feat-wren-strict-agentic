# JENERİK TÜREV METRİK (DB-BAĞIMSIZ): MİZAN (hesap bakiyeleri). Muhasebe fişi/yevmiye
# tablosundan; her ERP borç/alacak + hesap kodu row-level ifadelerini bağlar (netsis BA
# 1/2; logo/mikro farklı). Tekdüzen Hesap Planı üstündeki likidite/gelir-tablosu KPI'ları
# bu view'ın KANONİK kolonlarına (hesap_kodu/borc/alacak) dayanır → ERP-bağımsız.
name: mizan
view_name: mizan_src
requires: [base_model, hesap_kodu, tarih, borc, alacak, name_model, name_col, name_key]

# hesap_adi hesap planından JOIN'lenir (denormalize isim çoğu ERP'de boş) — isim yoksa
# koda düşer. name_* binding'i zorunlu (her ERP'nin hesap planı tablosu vardır).
view_statement: |
  SELECT ({hesap_kodu}) AS hesap_kodu,
         COALESCE(NULLIF(LTRIM(p.{name_col}), ''), ({hesap_kodu})) AS hesap_adi,
         h.{tarih} AS tarih, ({borc}) AS borc, ({alacak}) AS alacak
  FROM {base_model} h
  LEFT JOIN {name_model} p ON LTRIM(p.{name_key}) = ({hesap_kodu})
  WHERE ({row_filter})

view_columns:
  - {name: hesap_kodu, type: VARCHAR}
  - {name: hesap_adi, type: VARCHAR}
  - {name: tarih, type: TIMESTAMP}
  - {name: borc, type: DOUBLE}
  - {name: alacak, type: DOUBLE}

cube:
  name: mizan
  label: mizan (hesap bakiyeleri)
  base_object: mizan_src
  synonyms: [mizan, hesap bakiyesi, hesap bakiyeleri, muhasebe, defter, muavin,
             hesap planı, genel muhasebe, hesap hareketleri]
  measures:
    # Ölçü adı KOLON adından FARKLI olmalı (Wren aksi halde SUM(borc)'u ölçünün kendisi
    # sanıp döngü görür) — cari_finans'la aynı toplam_ öneki deseni.
    - name: toplam_borc
      expression: "SUM(borc)"
      type: DOUBLE
      unit: "₺"
      synonyms: [borç, toplam borç, borç tutarı, debit]
    - name: toplam_alacak
      expression: "SUM(alacak)"
      type: DOUBLE
      unit: "₺"
      synonyms: [alacak, toplam alacak, alacak tutarı, credit]
    # Bakiye = borç − alacak (borç bakiyeli hesap +, alacak bakiyeli −). Dönem-sonu
    # snapshot (kümülatif) → semi-additive (zaman kovasında düz SUM değil, as-of).
    - name: bakiye
      expression: "SUM(borc - alacak)"
      type: DOUBLE
      unit: "₺"
      additive: semi
      synonyms: [bakiye, hesap bakiyesi, net bakiye, kalan bakiye, borç bakiyesi]
  dimensions:
    - name: hesap_kodu
      expression: hesap_kodu
      type: VARCHAR
      label: hesap kodu
      synonyms: [hesap, hesap kodu, kod, hesap no]
    - name: hesap_adi
      expression: hesap_adi
      type: VARCHAR
      label: hesap adı
      synonyms: [hesap adı, hesap ismi, hesap açıklaması]
  time_dimensions:
    - name: tarih
      expression: tarih
      type: TIMESTAMP
