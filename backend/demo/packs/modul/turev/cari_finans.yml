# JENERİK TÜREV METRİK (DB-BAĞIMSIZ): DSO (alacak devir günü) + açık bakiye. Cari hareket
# tablosundan; her ERP borç/alacak row-level ifadelerini bağlar (netsis BORC/ALACAK ayrı;
# logo SIGN+AMOUNT; mikro cha_tip+meblağ). View pencereli running AR (ortalama alacak) taşır.
name: cari_finans
view_name: cari_finans_src
requires: [base_model, cari_key, name_model, name_col, name_key, tarih, borc, alacak]

view_statement: |
  SELECT h.{cari_key} AS cari_key, s.{name_col} AS cari_adi, h.{tarih} AS tarih,
         ({borc}) AS borc, ({alacak}) AS alacak,
         SUM((({borc}) - ({alacak})))
           OVER (PARTITION BY h.{cari_key} ORDER BY h.{tarih}
                 ROWS UNBOUNDED PRECEDING) AS running_ar
  FROM {base_model} h
  LEFT JOIN {name_model} s ON s.{name_key} = h.{cari_key}
  WHERE ({row_filter})

view_columns:
  - {name: cari_key, type: VARCHAR}
  - {name: cari_adi, type: VARCHAR}
  - {name: tarih, type: TIMESTAMP}
  - {name: borc, type: DOUBLE}
  - {name: alacak, type: DOUBLE}
  - {name: running_ar, type: DOUBLE}

cube:
  name: cari_finans
  label: cari finans (DSO / açık bakiye)
  base_object: cari_finans_src
  synonyms: [dso, dpo, alacak devir, tahsilat süresi, açık bakiye, cari finans, alacak günü,
             borç ödeme günü, ödeme süresi, tedarikçi ödeme]
  measures:
    - name: acik_bakiye
      expression: "SUM(borc - alacak)"
      type: DOUBLE
      unit: "₺"
      additive: semi
      synonyms: [açık bakiye, alacak bakiyesi, net alacak, bakiye, kalan alacak]
    - name: toplam_borc
      expression: "SUM(borc)"
      type: DOUBLE
      unit: "₺"
      synonyms: [borç, toplam borç, borçlandırma]
    - name: toplam_alacak
      expression: "SUM(alacak)"
      type: DOUBLE
      unit: "₺"
      synonyms: [alacak, tahsilat, ödeme, toplam alacak]
    # DSO = ortalama açık bakiye ÷ kredili satış × 365 (gün). Düşük = hızlı tahsilat.
    - name: dso_gun
      expression: "ROUND(AVG(running_ar) / NULLIF(SUM(borc), 0) * 365, 1)"
      type: DOUBLE
      lower_is_better: true
      synonyms: [dso, alacak devir günü, tahsilat süresi, kaç günde tahsil, ortalama tahsilat günü]
    # Açık borç (AP) = tedarikçiye borcumuz (net alacak = alacak−borç). Tedarikçi cari'lerde anlamlı.
    - name: acik_borc
      expression: "SUM(alacak - borc)"
      type: DOUBLE
      unit: "₺"
      additive: semi
      synonyms: [açık borç, borç bakiyesi, tedarikçi borcu, ödenecek]
    # DPO = ortalama borç (AP) ÷ kredili alım × 365. Yüksek = tedarikçiyi geç ödüyoruz.
    # running_ar = kümülatif (borç−alacak); AP = −running_ar. Tedarikçi cari'lerde anlamlı.
    - name: dpo_gun
      expression: "ROUND(-AVG(running_ar) / NULLIF(SUM(alacak), 0) * 365, 1)"
      type: DOUBLE
      synonyms: [dpo, borç ödeme günü, tedarikçi ödeme süresi, kaç günde ödüyoruz, ortalama ödeme günü]
  dimensions:
    - name: cari_adi
      expression: cari_adi
      type: VARCHAR
      label: cari adı
      synonyms: [cari, müşteri, firma, cari adı, müşteri adı, tedarikçi, satıcı, tedarikçiler]
  time_dimensions:
    - name: tarih
      expression: tarih
      type: TIMESTAMP
