# JENERİK TÜREV METRİK (DB-BAĞIMSIZ): kâr / marj / SMM / stok değeri BİR KEZ tanımlanır.
# compose, her ERP'nin turev.yml binding'lerinden view+cube ÜRETİR — yeni/bilinmeyen ERP
# sadece KANONİK yapı taşlarını (satış/alış tutar-miktar row-level ifadeleri + stok/tarih)
# bağlar, üstündeki kâr/marj/SMM mantığı OTOMATİK gelir. "Sistem eğitme" deseni.
name: karlilik
view_name: karlilik_src
requires: [base_model, stok_key, name_model, name_col, name_key, tarih,
           sale_amount, sale_qty, purchase_amount, purchase_qty]

# View: hareketleri per-ürün ağırlıklı ort. alış maliyetiyle zenginleştirir. Placeholder'lar
# {...} her ERP'nin turev.yml'sinden gelir; kanonik ÇIKTI kolonları (sale_amount, sale_qty,
# purchase_qty, avg_maliyet, stok_adi, tarih) DB-bağımsızdır → cube tamamen jenerik.
#
# BİRİM-UYUMSUZLUĞA DAYANIKLI MALİYET (canlı gitas 2026-07-25): avg_maliyet paydası
# MAX(alış_miktar, satış_miktar). Fabrika/üretim verisinde bazı ürünler stoğa NOMINAL
# miktar 1 + toplam değerle giriyor (ör. 1505001: 202 "alış" @miktar 1, tutar 45,3M;
# satış 25,6M birim) → düz alış_değeri/alış_miktar birim maliyeti 224.457₺ (satış fiyatı
# 5,93₺!) yapıp SMM'i 5,7 TRİLYONA şişiriyordu. MAX paydası: alış≥satış olan NORMAL üründe
# hiçbir şey değişmez; satış>>alış (birim-uyumsuz/üretim) üründe maliyeti alış-DEĞERİNE
# sabitler (değer bazlı kâr korunur). Sonuç: marj -51092% → +%6.9 (gerçekçi).
view_statement: |
  SELECT h.{stok_key} AS stok_key, s.{name_col} AS stok_adi, h.{tarih} AS tarih,
         ({sale_amount}) AS sale_amount, ({sale_qty}) AS sale_qty,
         ({purchase_qty}) AS purchase_qty, c.avg_maliyet,
         SUM(((({purchase_qty}) - ({sale_qty})) * c.avg_maliyet))
           OVER (PARTITION BY h.{stok_key} ORDER BY h.{tarih}
                 ROWS UNBOUNDED PRECEDING) AS running_stok_deger
  FROM {base_model} h
  LEFT JOIN {name_model} s ON s.{name_key} = h.{stok_key}
  LEFT JOIN (SELECT {stok_key} AS k,
                    SUM({purchase_amount})
                      / NULLIF(CASE WHEN SUM({purchase_qty}) >= SUM({sale_qty})
                                    THEN SUM({purchase_qty}) ELSE SUM({sale_qty}) END, 0) AS avg_maliyet
             FROM {base_model} WHERE ({row_filter}) GROUP BY {stok_key}) c ON c.k = h.{stok_key}
  WHERE ({row_filter})

view_columns:
  - {name: stok_key, type: VARCHAR}
  - {name: stok_adi, type: VARCHAR}
  - {name: tarih, type: TIMESTAMP}
  - {name: sale_amount, type: DOUBLE}
  - {name: sale_qty, type: DOUBLE}
  - {name: purchase_qty, type: DOUBLE}
  - {name: avg_maliyet, type: DOUBLE}
  # running_stok_deger: her harekette KÜMÜLATİF eldeki stok değeri (window). Cube bunu
  # AVG'ler → dönem-boyu ORTALAMA stok (ders-kitabı devir/DIO paydası).
  - {name: running_stok_deger, type: DOUBLE}

# Generic cube — kanonik view kolonları üzerinde; HİÇBİR ERP-özel kolon yok.
cube:
  name: karlilik
  label: kârlılık (brüt kâr / marj / SMM / stok değeri)
  base_object: karlilik_src
  synonyms: [kar, kâr, brüt kar, brüt kâr, karlilik, kârlılık, marj, kar marjı, smm,
             satılan malın maliyeti, stok değeri, envanter değeri]
  measures:
    - name: satis_tutari
      expression: "SUM(sale_amount)"
      type: DOUBLE
      unit: "₺"
      synonyms: [satış, ciro, satış tutarı]
    - name: brut_kar
      expression: "SUM(sale_amount - sale_qty * avg_maliyet)"
      type: DOUBLE
      unit: "₺"
      synonyms: [brüt kar, brüt kâr, kar, kâr, kazanç, gross profit]
    - name: brut_marj_yuzde
      expression: "ROUND(SUM(sale_amount - sale_qty * avg_maliyet) * 100.0 / NULLIF(SUM(sale_amount), 0), 2)"
      type: DOUBLE
      unit: "%"
      synonyms: [marj, kar marjı, kâr marjı, brüt marj, marj yüzdesi, kar oranı, karlılık oranı]
    - name: smm
      expression: "SUM(sale_qty * avg_maliyet)"
      type: DOUBLE
      unit: "₺"
      lower_is_better: true
      synonyms: [smm, satılan malın maliyeti, satış maliyeti, mal maliyeti, cogs]
    - name: stok_deger
      expression: "SUM((purchase_qty - sale_qty) * avg_maliyet)"
      type: DOUBLE
      unit: "₺"
      additive: semi
      synonyms: [stok değeri, envanter değeri, stok tutarı, eldeki stok değeri]
    # Stok devir hızı (ders-kitabı) = SMM ÷ ORTALAMA stok (dönem-boyu running_stok_deger
    # ortalaması). Yüksek = hızlı satış. Anlık-stok yerine ortalama → daha doğru.
    - name: stok_devir
      expression: "ROUND(SUM(sale_qty * avg_maliyet) / NULLIF(AVG(running_stok_deger), 0), 2)"
      type: DOUBLE
      synonyms: [stok devir, devir hızı, stok devir hızı, envanter devir, kaç kez döndü]
    # DIO (gün) = 365 ÷ devir = ortalama stokta kalma süresi (düşük = hızlı).
    - name: dio_gun
      expression: "ROUND(365.0 * AVG(running_stok_deger) / NULLIF(SUM(sale_qty * avg_maliyet), 0), 1)"
      type: DOUBLE
      lower_is_better: true
      synonyms: [dio, stokta kalma, ortalama stok günü, kaç günde satılıyor, stok gün]
  dimensions:
    - name: stok_adi
      expression: stok_adi
      type: VARCHAR
      label: stok adı
      synonyms: [stok, ürün, mal, stok adı, ürün adı]
  time_dimensions:
    - name: tarih
      expression: tarih
      type: TIMESTAMP
