# LİKİDİTE KPI: ASİT-TEST (Quick Ratio) = (Dönen Varlıklar − Stoklar) / KV Yabancı Kaynaklar.
# Stok satılmadan borç ödeme gücü — cari orandan katı. Tekdüzen: 1xx dönen, 15x stok, 3xx KV.
name: asit_test
label: Asit-Test Oranı (Quick Ratio)
unit: "x"
decimals: 2
requires_views: [mizan_src]
series_mode: asof  # bilanço/as-of bileşke → trend kümülatif (dönem-sonu bakiye)
synonyms: [asit test, asit-test, quick ratio, çabuk oran, hızlı oran, asit test oranı]
formula: "(donen_varlik - stoklar) / kv_yabanci_kaynak"
explain: |
  Stok hariç dönen varlıkların kısa vadeli borcu karşılama gücü. ~1 sağlıklı.
  Cari oran yüksek ama asit-test düşükse likidite stoğa kilitlenmiş demektir.
components:
  donen_varlik:
    label: Dönen Varlıklar (1xx)
    unit: "₺"
    sql: |
      SELECT SUM(borc - alacak) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 1) = '1'
  stoklar:
    label: Stoklar (15x)
    unit: "₺"
    sql: |
      SELECT SUM(borc - alacak) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 2) = '15'
  kv_yabanci_kaynak:
    label: KV Yabancı Kaynaklar (3xx)
    unit: "₺"
    sql: |
      SELECT SUM(alacak - borc) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 1) = '3'
