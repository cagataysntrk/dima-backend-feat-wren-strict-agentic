# LİKİDİTE KPI: NAKİT ORANI (Cash Ratio) = Hazır Değerler / KV Yabancı Kaynaklar.
# En katı likidite: yalnız kasa/banka (10x) ile kısa vadeli borç ödeme gücü. Tekdüzen 3xx KV.
name: nakit_orani
label: Nakit Oranı (Cash Ratio)
unit: "x"
decimals: 2
requires_views: [mizan_src]
series_mode: asof  # bilanço/as-of bileşke → trend kümülatif (dönem-sonu bakiye)
synonyms: [nakit oran, nakit oranı, cash ratio, disponibilite oranı, hazır değer oranı, nakit likidite]
formula: "hazir_deger / kv_yabanci_kaynak"
explain: |
  Kasa + banka + hazır değerlerin kısa vadeli borcu karşılama gücü. ~0.2 tipik/yeterli.
  Çok düşük nakit oranı, tahsilat/stok döngüsüne bağımlılık gösterir.
components:
  hazir_deger:
    label: Hazır Değerler (10x)
    unit: "₺"
    sql: |
      SELECT SUM(borc - alacak) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 2) = '10'
  kv_yabanci_kaynak:
    label: KV Yabancı Kaynaklar (3xx)
    unit: "₺"
    sql: |
      SELECT SUM(alacak - borc) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 1) = '3'
