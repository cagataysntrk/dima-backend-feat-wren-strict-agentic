# JENERİK KPI-KOMPOZİSYON (DB-BAĞIMSIZ, CROSS-CUBE): Nakit Dönüşüm Döngüsü.
# CCC = DSO + DIO − DPO — üç bileşen İKİ ayrı türev-cube'un view'ından (cari_finans_src:
# DSO/DPO; karlilik_src: DIO). Tek cube ölçüsü OLAMAZ → bu kompozisyon katmanı gerekir.
#
# Bileşen SQL'leri KANONİK view kolonlarına dayanır (cari_key/borc/alacak; stok_key/
# sale_qty/avg_maliyet/running_stok_deger) → tüm ERP'ler için AYNI (netsis/logo/mikro
# bedavaya). ERP-özel HİÇBİR şey yok; view'lar zaten türev-metrik binding'lerinden üretildi.
#
# Şirket-geneli DSO/DPO cari-tip ayrımını VERİDEN yapar: per-cari net bakiye işareti —
# pozitif = müşteri (AR/DSO), negatif = tedarikçi (AP/DPO). Böylece cari_hareketleri
# müşteri+tedarikçiyi karıştırsa da doğru ayrışır (cari_tip kolonu gerekmez, ERP-bağımsız).
name: ccc
label: Nakit Dönüşüm Döngüsü (CCC)
unit: gün
lower_is_better: true
# Bu KPI yalnız iki türev view birden üretildiyse derlenir (compose gate).
requires_views: [cari_finans_src, karlilik_src]
series_mode: asof  # bilanço/as-of bileşke → trend kümülatif (dönem-sonu bakiye)
synonyms: [ccc, nakit dönüşüm döngüsü, nakit döngüsü, nakit çevrim döngüsü, nakit çevrim,
           cash conversion cycle, işletme sermayesi döngüsü, çalışma sermayesi döngüsü]
# Formül bileşen adlarına atıfla (güvenli aritmetik değerlendirme).
formula: "dso + dio - dpo"
explain: |
  Bir liranın stoğa/alacağa bağlanıp nakde dönmesi kaç gün sürüyor. Düşük/negatif iyi:
  negatif CCC, tedarikçi kredisiyle işletme sermayesini finanse ettiğini gösterir.
components:
  # DSO — alacak tahsil süresi (yalnız müşteri cari'leri: net bakiye > 0).
  dso:
    label: Alacak Tahsil Süresi (DSO)
    unit: gün
    sql: |
      SELECT SUM(CASE WHEN bal > 0 THEN bal ELSE 0 END) / NULLIF(SUM(sales), 0) * 365.0 AS value
      FROM (SELECT cari_key, SUM(borc - alacak) AS bal, SUM(borc) AS sales
            FROM cari_finans_src {where} GROUP BY cari_key) t
  # DPO — tedarikçi ödeme süresi (yalnız tedarikçi cari'leri: net bakiye < 0).
  dpo:
    label: Tedarikçi Ödeme Süresi (DPO)
    unit: gün
    sql: |
      SELECT SUM(CASE WHEN bal < 0 THEN -bal ELSE 0 END) / NULLIF(SUM(purch), 0) * 365.0 AS value
      FROM (SELECT cari_key, SUM(borc - alacak) AS bal, SUM(alacak) AS purch
            FROM cari_finans_src {where} GROUP BY cari_key) t
  # DIO — stokta kalma süresi (ürün-başı dönem-boyu ortalama stok ÷ SMM × 365).
  # cube.karlilik.dio_gun ile hizalı: paydası SMM, payı AVG(running_stok_deger).
  dio:
    label: Stokta Kalma Süresi (DIO)
    unit: gün
    sql: |
      SELECT SUM(CASE WHEN avg_inv > 0 THEN avg_inv ELSE 0 END) / NULLIF(SUM(cogs), 0) * 365.0 AS value
      FROM (SELECT stok_key, AVG(running_stok_deger) AS avg_inv, SUM(sale_qty * avg_maliyet) AS cogs
            FROM karlilik_src {where} GROUP BY stok_key) t
