# LİKİDİTE KPI (cross-cube, mizan tabanlı): CARİ ORAN = Dönen Varlıklar / KV Yabancı Kaynaklar.
# Bileşenler Tekdüzen Hesap Planı sınıflarını mizan_src'ten toplar (1xx dönen varlık, 3xx KV
# yab. kaynak) → tüm TÜRK ERP'leri için AYNI (hesap-aralığı ulusal standart, ERP-özel değil).
# NOT (i18n): sınıf aralıkları Tekdüzen'e özgüdür; IFRS/farklı ülke planı için locale gerekir.
name: cari_oran
label: Cari Oran (Current Ratio)
unit: "x"
decimals: 2
requires_views: [mizan_src]
series_mode: asof  # bilanço/as-of bileşke → trend kümülatif (dönem-sonu bakiye)
synonyms: [cari oran, current ratio, likidite oranı, cari likidite, dönen oran]
formula: "donen_varlik / kv_yabanci_kaynak"
explain: |
  Kısa vadeli borçların dönen varlıklarla karşılanma gücü. >1.5 rahat, <1 riskli.
  Çok yüksek = atıl kaynak. Stok ağırlıklıysa asit-test ile birlikte okunmalı.
components:
  donen_varlik:
    label: Dönen Varlıklar (1xx)
    unit: "₺"
    sql: |
      SELECT SUM(borc - alacak) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 1) = '1'
  kv_yabanci_kaynak:
    label: KV Yabancı Kaynaklar (3xx)
    unit: "₺"
    sql: |
      SELECT SUM(alacak - borc) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 1) = '3'
