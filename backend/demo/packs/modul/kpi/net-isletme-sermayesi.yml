# LİKİDİTE KPI: NET İŞLETME SERMAYESİ (Net Working Capital) = Dönen Varlıklar − KV Yabancı
# Kaynaklar. Oran değil TUTAR (₺): pozitif = kısa vadeli borç sonrası serbest işletme sermayesi.
name: net_isletme_sermayesi
label: Net İşletme Sermayesi (NWC)
unit: "₺"
decimals: 0
requires_views: [mizan_src]
series_mode: asof  # bilanço/as-of bileşke → trend kümülatif (dönem-sonu bakiye)
synonyms: [net işletme sermayesi, işletme sermayesi, net çalışma sermayesi,
           net working capital, çalışma sermayesi, işletme sermayem]
formula: "donen_varlik - kv_yabanci_kaynak"
explain: |
  Kısa vadeli borçlar ödendikten sonra işi döndürecek serbest kaynak. Pozitif ve
  büyük iyi; negatif, kısa vadeli borçla duran varlık/faaliyet finanse edildiğini gösterir.
components:
  donen_varlik:
    label: Dönen Varlıklar (1xx)
    unit: "₺"
    sql: |
      SELECT SUM(borc - alacak) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 1) = '1'
  kv_yabanci_kaynak:
    label: KV Yabancı Kaynaklar (3xx)
    unit: "₺"
    sql: |
      SELECT SUM(alacak - borc) AS value FROM (SELECT * FROM mizan_src {where}) t
      WHERE LEFT(hesap_kodu, 1) = '3'
