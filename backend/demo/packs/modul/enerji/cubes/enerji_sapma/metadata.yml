name: enerji_sapma
label: enerji performans sapması (CUSUM/EnPG)
base_object: cusum

# Enerji performans sapması (ISO-50015 M&V + ISO-50006 EnB). Gerçekleşen vs üretime-dayalı
# beklenen tüketim; EnPG = fark, CUSUM = kümülatif fark. Grain = ay×kaynak (elektrik/doğalgaz/su).
# NOT (ISO-50006 sınırı, YGG slayt 10): mevcut beklenen yalnız ÜRETİM regresyonu — derece-gün
# (HDD/CDD) normalizasyonu YOK. Tam uyum için veri katmanında çok-değişkenli EnB gerekir.
synonyms: [cusum, enpg, enerji sapması, performans sapması, beklenen tüketim, sapma analizi,
           regresyon sapması, enerji performans göstergesi, gerçekleşen beklenen]
default_measure: toplam_enpg

measures:
  - name: toplam_enpg
    # Net EnPG (aylık farkların toplamı ≈ dönem-sonu CUSUM). Pozitif = beklenenin üstü (araştır).
    expression: "ROUND(SUM(enpg),0)"
    type: DOUBLE
    unit: "kWh"
    # 🔴 `fark` ÇIKARILDI (`GG2`, canlı): *«ortalamadan **farkını** söyle»* bu ölçüye
    # eşleşiyor ve soruyu iki-cube yetenek sınırına düşürüyordu — oysa soru tek küple
    # cevaplanabilir. `§99.1`: geniş bir sinonim cube'u **açgözlü** yapar. Nitelikli
    # hâli (`enerji farkı`) kaldı; çıplak `fark` bir ENERJİ terimi değil, bir
    # matematik kelimesidir.
    synonyms: [enpg, sapma, net sapma, enerji farkı, kümülatif fark, cusum]
    lower_is_better: true
  - name: sapma_yuzde
    expression: "ROUND(SUM(enpg)*100.0/NULLIF(SUM(beklenen),0),1)"
    type: DOUBLE
    unit: "%"
    additive: non
    synonyms: [sapma yüzdesi, sapma oranı, performans sapması yüzde]
    lower_is_better: true
  - name: toplam_gerceklesen
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: SUM(gerceklesen)
    type: DOUBLE
    unit: "kWh"
    synonyms: [gerçekleşen, gerçekleşen tüketim, fiili tüketim]
  - name: toplam_beklenen
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: SUM(beklenen)
    type: DOUBLE
    unit: "kWh"
    # 🔴🔴 FAZ 3.2 (`§K9-devam`'ın genelleştirilmesi) — çıplak `beklenen` KALDIRILDI:
    # ölçüldü, `followup._NORMAL` (*"normal mi"* takibi ailesi) aynı kelimeyi kalıp
    # olarak taşıyor — *"bu beklenen mi?"* gibi bir takip sorusu bu boyuta yanlış
    # kırılım olarak eşleşirdi (`_NEDEN`/İSG'de kapanan kusurun İKİNCİ, bağımsız
    # vukuu — `test_soru_sozcugu_sinonim_degil.py::test_HICBIR_KONUSMA_KALIBI_
    # SOZLUGU_SINONIM_DEGIL` bunu yakaladı). Çok-kelimeli, spesifik ifadeler kalır.
    synonyms: [beklenen tüketim, regresyon, referans tüketim]

dimensions:
  - name: kaynak
    expression: kaynak
    type: VARCHAR
    label: enerji kaynağı
    synonyms: [kaynak, enerji kaynağı, elektrik doğalgaz su, hangi kaynak]

time_dimensions:
  - name: donem_tarih
    expression: "make_date(yil, ay, 1)"
    type: DATE
