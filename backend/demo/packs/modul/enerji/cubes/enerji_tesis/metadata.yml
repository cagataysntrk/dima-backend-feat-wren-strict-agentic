name: enerji_tesis
label: tesis enerji (ISO-50001)
base_object: enerji_tesis

# Tesis-geneli enerji cube'u (YENİ modül, ADR-0023 gerekçe formu: docs/cube-gerekce/enerji.md).
# ISO-50001/50006: SET (EnPI oran-formu), GES payı, birim bedel, yakıt karması, su/atıksu.
# Grain = tesis-aylık. KİMLİK KELİMELERİ tesis-özel (ges/şebeke/set/birim bedel/fatura) →
# surdurulebilirlik'in parti-grain "enerji yoğunluğu"nu ÇALMAZ (ADR-0023 §5).
# ORAN ölçüleri = TOPLAM/TOPLAM (aylık satır-AVG değil).
synonyms: [tesis enerji, set, spesifik enerji tüketimi, ges, güneş enerjisi, şebeke,
           birim bedel, elektrik faturası, enerji faturası, yakıt karması, biyokütle,
           iso 50001, enerji performansı, tep ton]
default_measure: set_tep_ton

measures:
  - name: set_tep_ton
    # SET = Spesifik Enerji Tüketimi = ΣTEP / Σüretim(ton). ISO-50006 EnPI oran-formu. Düşük iyi.
    expression: "ROUND(SUM(toplam_tep)*1000.0/NULLIF(SUM(uretim_kg),0),3)"
    type: DOUBLE
    unit: "ton"
    synonyms: [set, tep/ton, tep ton, spesifik enerji, enerji yoğunluğu tesis, birim enerji]
    lower_is_better: true
  - name: ges_payi_yuzde
    expression: "ROUND(SUM(ges_kwh)*100.0/NULLIF(SUM(toplam_elektrik_kwh),0),1)"
    type: DOUBLE
    unit: "%"
    synonyms: [ges payı, güneş payı, yenilenebilir pay, ges oranı]
  - name: birim_elektrik_tl_kwh
    expression: "ROUND(SUM(fatura_tl)/NULLIF(SUM(toplam_elektrik_kwh),0),2)"
    type: DOUBLE
    unit: "₺/kWh"
    synonyms: [birim bedel, birim elektrik bedeli, kwh fiyatı, elektrik birim fiyatı, birim tarife]
    lower_is_better: true
  - name: elektrik_yogunlugu_kwh_kg
    expression: "ROUND(SUM(toplam_elektrik_kwh)/NULLIF(SUM(uretim_kg),0),3)"
    type: DOUBLE
    unit: "kWh/kg"
    synonyms: [elektrik yoğunluğu tesis, kg başına elektrik tesis]
    lower_is_better: true
  - name: kuyu_su_yogunlugu_lt_kg
    expression: "ROUND(SUM(kuyu_su_m3)*1000.0/NULLIF(SUM(uretim_kg),0),1)"
    type: DOUBLE
    unit: "lt/kg"
    synonyms: [kuyu suyu yoğunluğu, kuyu su lt kg, tesis su yoğunluğu]
    lower_is_better: true
  - name: atiksu_yogunlugu_lt_kg
    expression: "ROUND(SUM(atiksu_m3)*1000.0/NULLIF(SUM(uretim_kg),0),1)"
    type: DOUBLE
    unit: "lt/kg"
    synonyms: [atıksu yoğunluğu, atıksu lt kg, deşarj yoğunluğu]
    lower_is_better: true
  - name: biyokutle_tep_payi
    # Katı yakıt (fındık kabuğu) TEP payı — yakıt dönüşümü göstergesi (YGG slayt 6).
    expression: "ROUND(SUM(kati_yakit_tep)*100.0/NULLIF(SUM(toplam_tep),0),1)"
    type: DOUBLE
    unit: "%"
    synonyms: [biyokütle payı, katı yakıt payı, fındık kabuğu payı, yenilenebilir yakıt]
  # NOT: ölçü adı KOLON adından FARKLI olmalı (Wren aksi halde döngü/circular görür) —
  # mizan/cari deseni. View kolonları toplam_elektrik_kwh/sebeke_kwh/ges_kwh/toplam_tep.
  - name: elektrik_tuketimi_kwh
    expression: SUM(toplam_elektrik_kwh)
    type: DOUBLE
    unit: "kWh"
    synonyms: [toplam elektrik, elektrik tüketimi tesis, tesis elektrik]
  - name: sebeke_tuketimi_kwh
    expression: SUM(sebeke_kwh)
    type: DOUBLE
    unit: "kWh"
    synonyms: [şebeke, şebekeden çekilen, şebeke elektriği, çekilen aktif]
  - name: ges_uretimi_kwh
    expression: SUM(ges_kwh)
    type: DOUBLE
    unit: "kWh"
    synonyms: [ges üretimi, güneş üretimi, ges kwh, öz tüketim]
  - name: tep_toplam
    expression: SUM(toplam_tep)
    type: DOUBLE
    unit: "TEP"
    synonyms: [toplam tep, tep, ton eşdeğer petrol, enerji tep]
  - name: elektrik_faturasi_tl
    expression: SUM(fatura_tl)
    type: DOUBLE
    unit: "₺"
    synonyms: [elektrik faturası, fatura bedeli, enerji faturası, elektrik gideri]
    lower_is_better: true

time_dimensions:
  - name: donem_tarih
    expression: donem_tarih
    type: DATE
