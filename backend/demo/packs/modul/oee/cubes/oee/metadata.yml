name: oee
label: OEE
base_object: oee_vardiya

# --- NL yönlendirme (ADR-0005: içerik Wren'de, kod generic) ---------------------
# Eşleşme: varsayılan ALTDİZİ ("ciro"→"cirosu"); sonu "!" TAM KELİME.
# 47-tablo rebind (2026-07-29): base vardiya_kayitlari → oee_vardiya (makine×vardiya×gün).
# Public contract (ölçü adları) KORUNDU. Kişi/cinsiyet OEE'de DEĞİL (oee_vardiya kişi
# taşımaz — OEE makine metriğidir); kişi-bazlı verimlilik `parti` cube'unda (operatör
# köprüsü). Böylece hiçbir yetenek kaybı yok, doğru cube'a taşındı.
synonyms: [oee, verim, randıman, vardiya, kullanılabilirlik, availability,
           performans, duruş, arıza, downtime, çalışma, üretim]
default_measure: ort_oee

# ORAN ÖLÇÜLERİ = TOPLAM-üzerinden (ISO 22400; docs/research/oee-kpi-standartlari.md +
# cube-mimarisi-standartlari-2026-07.md). Satır-AVG oran-ortalaması tuzağıdır. oee_vardiya
# hazır EV/PV/KS/OEE kolonları TAŞIR ama cube bunları AVG'lemez — ham sürelerden/kg'dan
# yeniden hesaplar (A, Q); P için teorik hız yok → performans_PV planlı-süreyle AĞIRLIKLI
# ortalama (satır-AVG değil). OEE = A×P×Q (ISO 22400 6.6).
measures:
  - name: ort_oee
    expression: "(1.0*SUM(calisma_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0)) * (SUM(performans_PV*planli_uretim_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0)) * (1.0*SUM(uretim_kg - hatali_kg)/NULLIF(SUM(uretim_kg),0))"
    type: DOUBLE
    synonyms: [oee, verim, randıman, toplam ekipman etkinliği]
  - name: ort_kullanilabilirlik
    # Availability = APT/PBT (ISO 22400 6.8) = çalışma/planlı-üretim süresi
    expression: "1.0*SUM(calisma_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0)"
    type: DOUBLE
    synonyms: [kullanılabilirlik, availability]
  - name: ort_performans
    # Effectiveness (ISO 22400 6.9) — planlı-süre ağırlıklı performans (teorik hız yok)
    expression: "SUM(performans_PV*planli_uretim_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0)"
    type: DOUBLE
    synonyms: [performans]
  - name: ort_kalite
    # Quality ratio = GQ/PQ (ISO 22400 6.10) = sağlam/toplam üretim
    expression: "1.0*SUM(uretim_kg - hatali_kg)/NULLIF(SUM(uretim_kg),0)"
    type: DOUBLE
    synonyms: [kalite]
  - name: toplam_durus_dakika
    # Toplam duruş = planlı + plansız (arıza). Aksiyon plansızdadır ama "duruş" = tümü.
    expression: "SUM(planli_durus_dk + plansiz_durus_dk)"
    type: DOUBLE
    synonyms: [duruş, arıza, downtime, duruş süresi]
    lower_is_better: true
  - name: plansiz_durus_dakika
    expression: SUM(plansiz_durus_dk)
    type: DOUBLE
    synonyms: [plansız duruş, arıza duruşu, beklenmedik duruş]
    lower_is_better: true
  - name: toplam_uretim_kg
    expression: SUM(uretim_kg)
    type: DOUBLE
    synonyms: [üretim, miktar, üretilen]
  - name: toplam_fire_kg
    # Gerçek AĞIRLIK-bazlı fire (hatali_kg) — parti cube'unun ilk-sefer proxy'sinden zengin.
    expression: SUM(hatali_kg)
    type: DOUBLE
    synonyms: [fire, hatalı, hurda]
    lower_is_better: true
  - name: ilk_seferde_tamam_yuzde
    # RFT (Right First Time) — vardiya bazında ilk seferde tamamlanan parti oranı.
    expression: "ROUND(SUM(ilk_seferde_tamam)*100.0/NULLIF(SUM(parti_sayisi),0),2)"
    type: DOUBLE
    synonyms: [ilk seferde tamam, rft, ilk sefer]
  - name: toplam_parti
    expression: SUM(parti_sayisi)
    type: DOUBLE
    synonyms: [parti sayısı, kaç parti, adet]

dimensions:
  - name: makine
    expression: makine
    type: VARCHAR
    label: makine
    synonyms: [makin, cihaz, tezgah]   # "makin" kökü: makine/makina ikisini de yakalar
  - name: hat
    expression: hat
    type: VARCHAR
    synonyms: [hat, hattı, line]
  - name: vardiya
    # İSİM göster (numara değil) — kaynak: demo VARDIYALAR sözlüğü (8-16/16-24/00-08).
    # hafta_gunu deseni: kod → okunur etiket CASE ile cube katmanında (veri INTEGER kalır).
    expression: "CASE vardiya WHEN 1 THEN '1. Vardiya (08-16)' WHEN 2 THEN '2. Vardiya (16-24)' WHEN 3 THEN '3. Vardiya (00-08)' ELSE CAST(vardiya AS VARCHAR) END"
    type: VARCHAR
    synonyms: [vardiya, vardiyalar]
  # Türev zaman boyutu (base/time deseni): haftanın günü — Pzt..Paz (TR).
  - name: hafta_gunu
    label: haftanın günü
    expression: "CASE isodow(tarih) WHEN 1 THEN 'Pzt' WHEN 2 THEN 'Sal' WHEN 3 THEN 'Çar' WHEN 4 THEN 'Per' WHEN 5 THEN 'Cum' WHEN 6 THEN 'Cmt' WHEN 7 THEN 'Paz' END"
    type: VARCHAR
    synonyms: [haftanın gün, hafta gün, hangi gün, günlere göre, güne göre]

time_dimensions:
  - name: tarih
    expression: tarih
    type: DATE
