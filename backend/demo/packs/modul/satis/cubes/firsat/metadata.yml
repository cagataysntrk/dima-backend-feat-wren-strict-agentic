name: firsat
label: Satış hunisi / fırsat
base_object: firsatlar

# SATIŞ HUNİSİ CUBE'U (2026-08-05).
#
# 🔴 ÖLÇÜLEN BOŞLUK: sistem yalnız KAZANILANI tutuyordu (teklif → sipariş → fatura).
# Kaybedilen hiçbir yerde yoktu. *Yalnız kazandığını tutan bir CRM, kazanma oranını
# hesaplatamaz* — ve "neden kaybediyoruz" bir satış müdürünün en sık sorduğu sorudur.
#
# ⚠ `kayip_nedeni` bu cube'un asıl değeridir: kök-neden sorusunun cevabı bir yorum
# değil, bir KIRILIM olur. "Fiyat mı, termin mi?" sorusu SQL ile cevaplanabilir hâle
# gelir — bu, "kaybettik" demekle "neden kaybettiğimizi biliyoruz" demek arasındaki fark.
synonyms: [fırsat, fırsatlar, huni, satış hunisi, pipeline, potansiyel, teklif aşaması,
           kazanma oranı, kayıp, kaybedilen iş]

# 🔴 `M-2` — VARSAYILAN ÖLÇÜ. Sistem her şeyi biliyorken (dönem·kırılım·üstünlük)
# yalnız *«hangi ölçü»* diye sorup pes ediyordu; `cube_router` R4'te bu alanı zaten
# okuyor, alan **yoktu**. Gerekçe: fırsat **adedi** küpün kimliği; tutar bir niteliktir.
# ⚠ Gerçekten belirsiz küplere (`ik` brüt/net · `cari` borç/alacak · `maliyet` ·
# `parti`) BİLEREK yazılmadı — orada sormak doğru davranıştır.
default_measure: firsat_adedi

measures:
  - name: firsat_adedi
    expression: "COUNT(DISTINCT firsat_no)"
    type: DOUBLE
    unit: "adet"
    additive: non
    synonyms: [fırsat adedi, fırsat sayısı, kaç fırsat, huni büyüklüğü]
  - name: firsat_tutari
    expression: SUM(tahmini_tutar)
    type: DOUBLE
    unit: "₺"
    synonyms: [fırsat tutarı, potansiyel tutar, huni değeri, tahmini tutar]
  - name: agirlikli_tutar
    # Olasılıkla ağırlıklandırılmış hat — huninin "gerçekçi" hâli. ⚠ Ham toplam
    # tutarı forecast diye sunmak, %10 olasılıklı bir fırsatı kesinleşmiş saymaktır.
    expression: "ROUND(SUM(tahmini_tutar * olasilik),2)"
    type: DOUBLE
    unit: "₺"
    synonyms: [ağırlıklı tutar, olasılıklı tutar, beklenen tutar, ağırlıklı huni]
  - name: kazanma_orani_yuzde
    # Payda YALNIZ SONUÇLANMIŞ fırsatlar — açık fırsatı kayıp saymak oranı yapay
    # düşürür, hariç tutmak ise sonucu bilinmeyeni yok saymaktır. Doğrusu: karara
    # bağlananların içinde kazanılanın payı.
    expression: "ROUND(100.0 * SUM(CASE WHEN asama = 'Kazanıldı' THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN asama IN ('Kazanıldı','Kaybedildi') THEN 1 ELSE 0 END),0), 1)"
    type: DOUBLE
    unit: "%"
    additive: non
    # ⚠ `başarı oranı` KALDIRILDI → `egitim.basari_orani_yuzde`nin (sınav geçme oranı).
    synonyms: [kazanma oranı, dönüşüm oranı, kazanç oranı, win rate, fırsat başarısı]
  - name: kaybedilen_tutar
    expression: "SUM(CASE WHEN asama = 'Kaybedildi' THEN tahmini_tutar ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [kaybedilen tutar, kaçan iş, kaybettiğimiz, kayıp tutar]

dimensions:
  - name: asama
    expression: asama
    type: VARCHAR
    label: aşama
    synonyms: [aşama, huni aşaması, safha, hangi aşamada, statü]
  - name: kayip_nedeni
    expression: kayip_nedeni
    type: VARCHAR
    label: kayıp nedeni
    synonyms: [kayıp nedeni, neden kaybettik, kaybetme sebebi, ret nedeni]
  - name: musteri_kod
    expression: musteri_kod
    type: VARCHAR
    label: müşteri
    synonyms: [müşteri, müşteriler, cari, potansiyel müşteri]
  - name: satis_temsilcisi
    expression: satis_temsilcisi
    type: VARCHAR
    label: satış temsilcisi
    sensitivity: person
    synonyms: [satış temsilcisi, temsilci, satışçı]

time_dimensions:
  - name: acilis_tarihi
    expression: acilis_tarihi
    type: DATE
