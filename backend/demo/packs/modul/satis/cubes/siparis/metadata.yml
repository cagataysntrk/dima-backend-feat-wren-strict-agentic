name: siparis
label: Satış siparişi / termin
base_object: satis_siparisleri

# SATIŞ SİPARİŞ CUBE'U (2026-08-05) — ERP-bağımsız dikey.
#
# 🔴 TÜRETME ÇAPASI: `satis_siparisleri` uydurulmadı, `partiler.siparis_no`dan kuruldu.
# Yani her sipariş GERÇEKTEN üretilmiş partilerin siparişidir ve "siparişin kaç kilosu
# üretildi" sorusu gerçek bir join'e dayanır.
#
# ⚠ TERMİN, bu cube'un varlık sebebidir. `partiler` üretimi biliyordu ama SÖZLEŞME
# TERMİNİNİ bilmiyordu — yani "zamanında teslim ediyor muyuz" sorusunun dayanağı yoktu.
# Bir üretim tesisinin müşterisine verdiği tek söz terminidir; onu ölçmeyen bir sistem
# müşteri ilişkisinin en kritik sayısını görmez.
#
# ⚠ "ciro/tutar" burada SİPARİŞ tutarıdır, faturalanan değil. Cube kimliğinde genel
# "ciro" TUTULMAZ (parti cube'uyla çakışırdı) — buraya "sipariş" kelimesiyle ulaşılır.
synonyms: [sipariş, siparişler, termin, teslimat, sevk termini, sipariş defteri,
           açık sipariş, teslim tarihi]

# 🔴 `M-2` — VARSAYILAN ÖLÇÜ. Sistem her şeyi biliyorken (dönem·kırılım·üstünlük)
# yalnız *«hangi ölçü»* diye sorup pes ediyordu; `cube_router` R4'te bu alanı zaten
# okuyor, alan **yoktu**. Gerekçe: sipariş **adedi** küpün kimliği; `r1`'de route zaten onu seçti.
# ⚠ Gerçekten belirsiz küplere (`ik` brüt/net · `cari` borç/alacak · `maliyet` ·
# `parti`) BİLEREK yazılmadı — orada sormak doğru davranıştır.
default_measure: siparis_adedi

measures:
  - name: siparis_adedi
    expression: "COUNT(DISTINCT siparis_no)"
    type: DOUBLE
    unit: "adet"
    additive: non
    synonyms: [sipariş adedi, sipariş sayısı, kaç sipariş, sipariş adet]
  - name: siparis_tutari
    expression: SUM(toplam_tutar)
    type: DOUBLE
    unit: "₺"
    synonyms: [sipariş tutarı, sipariş büyüklüğü, sipariş cirosu, alınan sipariş]
  - name: siparis_kg
    expression: SUM(toplam_kg)
    type: DOUBLE
    unit: "kg"
    synonyms: [sipariş miktarı, sipariş kilosu, sipariş kg, kaç kilo sipariş]
  - name: ort_gecikme_gun
    expression: "ROUND(AVG(gecikme_gun),1)"
    type: DOUBLE
    unit: "gün"
    additive: non
    synonyms: [ortalama gecikme, gecikme, kaç gün geç, gecikme günü, termin sapması]
  - name: zamaninda_teslim_yuzde
    # OTIF'in (on-time-in-full) termin yarısı. ⚠ Payda TÜM siparişler — "zamanında
    # teslim ettiklerimizin yüzde kaçı zamanında" gibi bir totoloji üretmez.
    expression: "ROUND(100.0 * SUM(CASE WHEN gecikme_gun <= 0 THEN 1 ELSE 0 END) / NULLIF(COUNT(*),0), 1)"
    type: DOUBLE
    unit: "%"
    additive: non
    synonyms: [zamanında teslim, termin performansı, otif, zamanında teslimat oranı,
               teslimat performansı, termine uyum]
  - name: ort_siparis_buyuklugu
    expression: "ROUND(AVG(toplam_tutar),0)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [ortalama sipariş, sipariş ortalaması, ortalama sipariş büyüklüğü]

dimensions:
  - name: musteri_kod
    expression: musteri_kod
    type: VARCHAR
    label: müşteri
    synonyms: [müşteri, müşteriler, cari, alıcı, müşteri kodu]
  - name: termin_durumu
    expression: termin_durumu
    type: VARCHAR
    label: termin durumu
    synonyms: [termin durumu, gecikme durumu, teslimat durumu]
  - name: kanal
    expression: kanal
    type: VARCHAR
    synonyms: [kanal, geliş kanalı, sipariş kaynağı, nereden geldi]
  - name: satis_temsilcisi
    expression: satis_temsilcisi
    type: VARCHAR
    label: satış temsilcisi
    # BEYAN: kişi tanımlar → LLM prompt'una değerleri GİRMEZ (Faz A1 deseni).
    sensitivity: person
    synonyms: [satış temsilcisi, temsilci, satışçı, sorumlu]

time_dimensions:
  - name: acilis_tarihi
    expression: acilis_tarihi
    type: DATE
