name: isg
label: İSG / iş kazası
base_object: is_kazalari

# İSG CUBE'U (2026-08-05) — İK modülünün üçüncü cube'u.
#
# ⚠ Bir üretim tesisinin İK verisi, kaza verisi olmadan eksiktir: İSG kanunen zorunlu
# raporlanan tek İK alanıdır ve "kaza sıklık oranı" yönetim kurulu gündemine giren tek
# İK sayısıdır.
#
# 🔴 `RAMAK KALA` kayıtları BİLEREK tutuluyor. *Yalnız yaralanmayı sayan bir sistem,
# önlenebilir olanı hiç görmez* — İSG'nin tüm literatürü ramak kalanın öncü gösterge
# (leading indicator), kazanın ise artçı gösterge olduğunu söyler. Ramak kalayı
# ayıklamak, sistemi yalnız geç kalmış haberi verebilir hâle getirirdi.
synonyms: [isg, iş kazası, kaza, kazalar, iş güvenliği, güvenlik, ramak kala,
           iş sağlığı, olay]

measures:
  - name: kaza_adedi
    expression: "COUNT(*)"
    type: DOUBLE
    synonyms: [kaza adedi, kaza sayısı, kaç kaza, olay sayısı]
  - name: kayip_is_gunu
    expression: SUM(is_gunu_kaybi)
    type: DOUBLE
    unit: "gün"
    synonyms: [kayıp iş günü, kayıp gün, iş günü kaybı, devamsızlık günü]
  - name: ciddi_kaza_adedi
    expression: "SUM(CASE WHEN siddet = 'CİDDİ' THEN 1 ELSE 0 END)"
    type: DOUBLE
    synonyms: [ciddi kaza, ağır kaza, kritik kaza]
  - name: ramak_kala_adedi
    expression: "SUM(CASE WHEN siddet = 'RAMAK KALA' THEN 1 ELSE 0 END)"
    type: DOUBLE
    synonyms: [ramak kala, ucuz atlatma, near miss, olay bildirimi]
  - name: ort_kayip_gun
    expression: "ROUND(AVG(is_gunu_kaybi),2)"
    type: DOUBLE
    unit: "gün"
    synonyms: [ortalama kayıp gün, kaza başına kayıp, ağırlık]

dimensions:
  - name: departman
    expression: departman
    type: VARCHAR
    synonyms: [departman, bölüm, birim]
  - name: kaza_turu
    expression: kaza_turu
    type: VARCHAR
    label: kaza türü
    synonyms: [kaza türü, kaza tipi, ne oldu, olay türü]
  - name: bolge
    expression: bolge
    type: VARCHAR
    label: bölge
    synonyms: [bölge, yer, nerede, lokasyon, alan]
  - name: siddet
    expression: siddet
    type: VARCHAR
    label: şiddet
    synonyms: [şiddet, ciddiyet, ağırlık, seviye]
  - name: kok_neden
    expression: kok_neden
    type: VARCHAR
    label: kök neden
    synonyms: [kök neden, sebep, neden, kaza nedeni]
  - name: kaza_vardiya
    expression: vardiya
    type: VARCHAR
    label: vardiya
    synonyms: [vardiya, vardiyası, hangi vardiya]

time_dimensions:
  - name: tarih
    expression: tarih
    type: DATE
