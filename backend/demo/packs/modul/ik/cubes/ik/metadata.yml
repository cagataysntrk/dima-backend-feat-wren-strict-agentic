name: ik
label: İK / bordro
# FAZ 2.2 (2 Ağustos 2026): VIEW → MODEL. TÜM ölçüler zaten `bordro`da; boyutlar
# `personel` üzerinden 1-2 sıçrama. View `personel_ozluk`a DOĞRUDAN join'liyordu
# (iki bağımsız 1-sıçrama); göç `personel` ÜZERİNDEN 2 sıçrama yapıyor. Öksüz taraması
# her yönde SIFIR (bordro→personel, bordro→özlük, özlük→personel) → sonuç birebir aynı.
base_object: bordro

# İK/bordro cube'u (YENİ modül, 2026-07-29) — sektörden bağımsız X-ekseni topic.
# Maaş/SGK/mesai/prim + personel demografisi (departman/cinsiyet/yaş/eğitim). Eski yapıda
# İK YOKTU → tümüyle yeni yetenek (logic ileri). Demografi köprüsü = `bordro_personel`
# ilişkisi (Faz 2.2 öncesi ik_zengin view'ıydı; view silindi).
# NOT: "personel/çalışan" parti operatör-boyutu + oee ile çakışır → cube kimliğinde
# TUTULMAZ (personel_sayisi ölçüsünde kalır). İK'ya ik/bordro/maaş/sgk ile ulaşılır.
synonyms: [ik, insan kaynakları, bordro, maaş, ücret, sgk, mesai, prim, kadro, işçilik,
           puantaj, özlük]

measures:
  - name: toplam_brut_maas
    expression: SUM(brut_maas)
    type: DOUBLE
    unit: "₺"
    synonyms: [brüt maaş, brüt ücret, toplam brüt, brüt]
  - name: toplam_net_maas
    expression: SUM(net_maas)
    type: DOUBLE
    unit: "₺"
    synonyms: [net maaş, net ücret, ele geçen, toplam net, net]
  - name: toplam_isveren_maliyeti
    # İşverene toplam maliyet = brüt + SGK işveren payı (bordro maliyeti).
    expression: "SUM(brut_maas + sgk_isveren)"
    type: DOUBLE
    unit: "₺"
    # ⚠ `işçilik maliyeti` KALDIRILDI → `maliyet.iscilik_maliyet_kg`in (kg başına birim
    # maliyet, ürün maliyetlendirmesinin parçası). Burası BORDRO toplamıdır.
    # ⚠ `toplam maliyet` KALDIRILDI — fazla jenerik: `maliyet` cube'unun kimliğiyle
    # çakışıyor ve envanter kapısı çözümün `ik`ten `maliyet`e kaydığını ölçtü.
    # İK'nın toplamı BORDRO toplamıdır; adı da onu söylemeli.
    synonyms: [işveren maliyeti, bordro maliyeti, kadro maliyeti, personel maliyeti]
  - name: toplam_mesai_ucreti
    expression: SUM(mesai_ucreti)
    type: DOUBLE
    unit: "₺"
    synonyms: [mesai, fazla mesai, mesai ücreti, ek mesai]
  - name: toplam_prim
    expression: SUM(prim)
    type: DOUBLE
    unit: "₺"
    synonyms: [prim, ikramiye, bonus]
  - name: toplam_sgk
    expression: "SUM(sgk_isci + sgk_isveren)"
    type: DOUBLE
    unit: "₺"
    synonyms: [sgk, sigorta, sgk primi, sosyal güvenlik]
  - name: ort_brut_maas
    expression: "ROUND(AVG(brut_maas),0)"
    type: DOUBLE
    unit: "₺"
    synonyms: [ortalama maaş, ortalama brüt, ortalama ücret, maaş ortalaması]
  - name: personel_sayisi
    expression: "COUNT(DISTINCT personel_kodu)"
    type: DOUBLE
    unit: "adet"
    synonyms: [personel sayısı, çalışan sayısı, kaç kişi, kadro, headcount, mevcut]

# PVM (Faz 5.1): bordro maliyeti = kişi başı maliyet × kadro. "İşçilik neden arttı"
# sorusunun klasik ayrımı budur — zam etkisi mi (fiyat), kadro büyümesi mi (miktar).
pvm:
  - value: toplam_isveren_maliyeti
    volume: personel_sayisi
    price_label: kişi başı maliyet (₺)

dimensions:
  - name: departman
    expression: personel_departman
    type: VARCHAR
    synonyms: [departman, bölüm, birim]
  - name: cinsiyet
    expression: personel_cinsiyet
    type: VARCHAR
    synonyms: [cinsiyet, kadın, erkek, cinsiyete göre]
  - name: egitim
    expression: personel_egitim
    type: VARCHAR
    label: eğitim
    synonyms: [eğitim, öğrenim, okul]
  - name: pozisyon
    expression: personel_pozisyon
    type: VARCHAR
    synonyms: [pozisyon, unvan, görev]
  - name: medeni_hal
    expression: personel_medeni_hal
    type: VARCHAR
    label: medeni hal
    synonyms: [medeni hal, medeni durum, evli, bekar]
  - name: personel_vardiya
    expression: personel_vardiya
    type: VARCHAR
    label: vardiya
    synonyms: [vardiya, vardiyası]
  - name: donem
    expression: donem
    type: VARCHAR
    label: dönem
    synonyms: [dönem, ay, periyot]
  - name: yas_grubu
    label: yaş grubu
    expression: "CASE WHEN personel_dogum_tarihi IS NULL THEN NULL WHEN date_diff('year', personel_dogum_tarihi, current_date) < 30 THEN '<30' WHEN date_diff('year', personel_dogum_tarihi, current_date) < 40 THEN '30-39' WHEN date_diff('year', personel_dogum_tarihi, current_date) < 50 THEN '40-49' ELSE '50+' END"
    type: VARCHAR
    synonyms: [yaş, yaş grubu, yaşa göre, yaş aralığı]

time_dimensions:
  - name: donem_tarih
    # View'da türetiliyordu (CAST(donem || '-01' AS DATE)); base MODEL olunca ifade
    # cube'a taşındı. `bordro.donem` 'YYYY-MM' biçiminde.
    expression: "CAST(donem || '-01' AS DATE)"
    type: DATE
