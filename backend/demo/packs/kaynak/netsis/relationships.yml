# Netsis çekirdek ilişkileri — kod alanları üzerinden (LOGICALREF yok).
relationships:
  - name: cari_hareket_cari
    join_type: MANY_TO_ONE
    models:
      - cari_hareketleri
      - cari_kartlar
    condition: "cari_hareketleri.CARI_KOD = cari_kartlar.CARI_KOD"
  - name: stok_hareket_stok
    join_type: MANY_TO_ONE
    models:
      - stok_hareketleri
      - stok_kartlari
    condition: "stok_hareketleri.STOK_KODU = stok_kartlari.STOK_KODU"
  - name: stok_hareket_cari
    join_type: MANY_TO_ONE
    models:
      - stok_hareketleri
      - cari_kartlar
    condition: "stok_hareketleri.STHAR_CARIKOD = cari_kartlar.CARI_KOD"
  - name: fatura_cari
    join_type: MANY_TO_ONE
    models:
      - faturalar
      - cari_kartlar
    condition: "faturalar.CARI_KODU = cari_kartlar.CARI_KOD"
