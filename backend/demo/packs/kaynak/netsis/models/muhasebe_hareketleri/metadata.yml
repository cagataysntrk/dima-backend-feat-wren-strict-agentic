# Netsis muhasebe fişi (GL/yevmiye) — GITAS2026F.TBLMUHFIS'ten (2026-07-25).
# Mizan buradan türetilir: HES_KOD (Tekdüzen hesap kodu), BA (1=borç 2=alacak),
# TUTAR, TARIH; HESAPISMI DENORMALİZE (hesap planı join'i gerekmez). Kolon seçimi
# gereksinim.yml'de yaşar. Salt-okunur ayna (ADR-0017).
name: muhasebe_hareketleri
table_reference:
  schema: dbo
  table: TBLMUHFIS
columns:
- name: HES_KOD
  type: VARCHAR
- name: BA
  type: VARCHAR
- name: TUTAR
  type: DOUBLE
- name: TARIH
  type: TIMESTAMP
- name: HESAPISMI
  type: VARCHAR
- name: SUBE_KODU
  type: INTEGER
- name: FISNO
  type: VARCHAR
