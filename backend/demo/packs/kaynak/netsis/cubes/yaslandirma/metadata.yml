name: yaslandirma
label: cari yaşlandırma
base_object: cari_hareketleri

# Cari yaşlandırma (cube-katalog §2a, P0 — #1 ERP raporu): açık bakiye vade
# tarihine göre kovalanır. Tek-tablo brüt yaşlandırma (açık-hesap eşleştirmesi
# yok — hareket net bakiyesi vade kovasına dağıtılır). Netsis: TBLCAHAR.VADE_TARIHI,
# BORC/ALACAK. Yaş = bugün − vade (gün). net bakiye pozitif = cari bize borçlu.
synonyms: [yaşlandırma, yaslandirma, vade analizi, vade, yaş, yas, gecikme,
           vadesi geçen, vadesi gecen, gecikmiş alacak, alacak yaşlandırma]

measures:
  - name: net_bakiye
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(BORC - ALACAK)"
    type: DOUBLE
    unit: "₺"
    additive: semi
    synonyms: [bakiye, net bakiye, açık bakiye, açık tutar]
  - name: vadesi_gecen
    lower_is_better: true   # B-5 · yüksek = KÖTÜ
    expression: "SUM(CASE WHEN CAST(VADE_TARIHI AS DATE) < CAST(GETDATE() AS DATE) THEN BORC - ALACAK ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    additive: semi
    synonyms: [vadesi geçen, gecikmiş, gecikme, muaccel, vadesi gecmis]

dimensions:
  # Yaş kovası (türev boyut, hafta_gunu deseni): bugün − vade gün farkı.
  - name: yas_kovasi
    label: yaş kovası
    expression: "CASE WHEN DATEDIFF(DAY, CAST(VADE_TARIHI AS DATE), CAST(GETDATE() AS DATE)) <= 0 THEN 'Vadesi gelmemiş' WHEN DATEDIFF(DAY, CAST(VADE_TARIHI AS DATE), CAST(GETDATE() AS DATE)) <= 30 THEN '0-30 gün' WHEN DATEDIFF(DAY, CAST(VADE_TARIHI AS DATE), CAST(GETDATE() AS DATE)) <= 60 THEN '31-60 gün' WHEN DATEDIFF(DAY, CAST(VADE_TARIHI AS DATE), CAST(GETDATE() AS DATE)) <= 90 THEN '61-90 gün' ELSE '90+ gün' END"
    type: VARCHAR
    synonyms: [yaş kovası, yas kovasi, vade aralığı, gün aralığı, yaşlandırma kovası]
  - name: cari_kodu
    expression: CARI_KOD
    type: VARCHAR
    label: cari kodu
    synonyms: [cari kod, hesap kodu, firma kodu]
  - name: cari_adi
    expression: cari_adi
    type: VARCHAR
    label: cari adı
    synonyms: [cari, müşteri, firma, hesap, kime, kimden]

time_dimensions:
  - name: tarih
    expression: TARIH
    type: TIMESTAMP
