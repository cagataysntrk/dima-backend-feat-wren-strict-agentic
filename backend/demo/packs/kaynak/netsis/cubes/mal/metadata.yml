name: mal
label: mal hareketi (miktar)
base_object: stok_hareketleri

# Netsis anlam sabitleri (GITAS2026F verisinden doğrulandı): STHAR_GCKOD
# 'G' = GİRİŞ (alış), 'C' = ÇIKIŞ (satış/sevk); miktar STHAR_GCMIK,
# satır tutarı = STHAR_GCMIK × STHAR_NF (birim net fiyat).
synonyms: [miktar, kilo, kg, ton!, tonaj, sevk, mal hareketi, stok hareketi, kaç kilo,
           ürün, urun, satılan, satilan]


# ⟳ FAZ 2.1(c2) AD GÖÇÜ (2026-08-04): `satis_tutari` → `satis_tutari_hareket`.
# Gerekçe: çekirdek sözleşmesi `satis_tutari` için kanonik grain'i **fatura** ilan etti
# (karar kalemi: `packs/cekirdek/metrik_sozlugu.yml`). Bu cube başka bir grain'de,
# dolayısıyla AYNI ADI TAŞIYAMAZ — aynı ad, karşılaştırılamaz iki sayı demekti.
# ⚠ SİNONİMLER DEĞİŞMEDİ: kullanıcı hâlâ 'satış'/'ciro' diye sorabilir; değişen
# yalnız metriğin KİMLİĞİ. Bir kullanıcıyı kendi kelimesinden etmek, sözleşmenin
# amacı değildir.
measures:
  - name: satis_miktari
    expression: "SUM(CASE WHEN STHAR_GCKOD = 'C' THEN STHAR_GCMIK ELSE 0 END)"
    type: DOUBLE
    unit: "kg"
    synonyms: [satış miktarı, satılan, sevk edilen, çıkış]
  - name: alim_miktari
    expression: "SUM(CASE WHEN STHAR_GCKOD = 'G' THEN STHAR_GCMIK ELSE 0 END)"
    type: DOUBLE
    unit: "kg"
    synonyms: [alım miktarı, alınan, toplanan, giriş]
  - name: satis_tutari_hareket
    cekirdek_metrik: satis_tutari
    expression: "SUM(CASE WHEN STHAR_GCKOD = 'C' THEN STHAR_GCMIK * STHAR_NF ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [satış tutarı, çıkış tutarı]
  - name: alim_tutari
    expression: "SUM(CASE WHEN STHAR_GCKOD = 'G' THEN STHAR_GCMIK * STHAR_NF ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [alım tutarı, giriş tutarı]
  - name: net_miktar
    expression: "SUM(CASE WHEN STHAR_GCKOD = 'G' THEN STHAR_GCMIK ELSE -STHAR_GCMIK END)"
    type: DOUBLE
    unit: "kg"
    additive: semi
    synonyms: [net miktar, stok değişimi, net stok, stok mevcudu, kalan stok, eldeki stok]
  # --- P0 satış genişletme (mal tarafı): realize edilmiş ORTALAMA fiyatlar (tutar/miktar —
  # tek ifade oran; stok/ay grananda doğru). NOT: gerçek brüt kâr/SMM ve stok DEĞERİ (maliyet-
  # bazlı) çok-tablo/period-end ister → Sınıf-B view cube'u (knowledge/metrics, Katman 2).
  - name: ort_satis_fiyati
    expression: "SUM(CASE WHEN STHAR_GCKOD = 'C' THEN STHAR_GCMIK * STHAR_NF ELSE 0 END) / NULLIF(SUM(CASE WHEN STHAR_GCKOD = 'C' THEN STHAR_GCMIK ELSE 0 END), 0)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [ortalama satış fiyatı, ortalama fiyat, birim fiyat, satış fiyatı, ort satış fiyatı]
  - name: ort_alis_fiyati
    expression: "SUM(CASE WHEN STHAR_GCKOD = 'G' THEN STHAR_GCMIK * STHAR_NF ELSE 0 END) / NULLIF(SUM(CASE WHEN STHAR_GCKOD = 'G' THEN STHAR_GCMIK ELSE 0 END), 0)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [ortalama alış fiyatı, ortalama maliyet, birim maliyet, alış fiyatı, ort alış fiyatı]

dimensions:
  - name: stok_adi
    expression: stok_adi
    type: VARCHAR
    label: stok adı
    synonyms: [stok, ürün, malzeme, mal, ne sattık, ne aldık]
  - name: cari_adi
    expression: cari_adi
    type: VARCHAR
    label: cari adı
    synonyms: [müşteri, tedarikçi, firma, kime, kimden]
  - name: stok_kodu
    expression: STOK_KODU
    type: VARCHAR
    label: stok kodu
    synonyms: [stok kodu, ürün kodu]
  - name: cari_kodu
    expression: STHAR_CARIKOD
    type: VARCHAR
    label: cari kodu
    synonyms: [cari, müşteri, tedarikçi]
  - name: depo
    expression: DEPO_KODU
    type: INTEGER
    label: depo
    synonyms: [depo, depoya göre]

  # Türev zaman boyutu (boyahane parti/oee deseni): haftanın günü — Pzt..Paz.
  # DATEFIRST'ten bağımsız: DATEDIFF(DAY, 0, x) % 7 → 0=Pzt (1900-01-01 Pazartesi).
  - name: hafta_gunu
    label: haftanın günü
    expression: "CASE DATEDIFF(DAY, 0, STHAR_TARIH) % 7 WHEN 0 THEN 'Pzt' WHEN 1 THEN 'Sal' WHEN 2 THEN 'Çar' WHEN 3 THEN 'Per' WHEN 4 THEN 'Cum' WHEN 5 THEN 'Cmt' ELSE 'Paz' END"
    type: VARCHAR
    synonyms: [haftanın gün, hafta gün, hangi gün, günlere göre, güne göre]

time_dimensions:
  - name: tarih
    expression: STHAR_TARIH
    type: TIMESTAMP
