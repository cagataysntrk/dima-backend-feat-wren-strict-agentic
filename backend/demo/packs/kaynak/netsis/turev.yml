# Türev-metrik BINDING'leri (kaynak faseti): jenerik metriklerin KANONİK yapı taşlarını
# bu ERP'nin fiziksel kolonlarına/kodlarına bağlar. Netsis: STHAR_GCKOD C=çıkış(satış),
# G=giriş(alış); miktar STHAR_GCMIK, birim fiyat STHAR_NF.
karlilik:
  base_model: stok_hareketleri
  stok_key: STOK_KODU
  name_model: stok_kartlari
  name_col: STOK_ADI
  name_key: STOK_KODU
  tarih: STHAR_TARIH
  sale_amount: "CASE WHEN STHAR_GCKOD = 'C' THEN STHAR_GCMIK * STHAR_NF ELSE 0 END"
  sale_qty: "CASE WHEN STHAR_GCKOD = 'C' THEN STHAR_GCMIK ELSE 0 END"
  purchase_amount: "CASE WHEN STHAR_GCKOD = 'G' THEN STHAR_GCMIK * STHAR_NF ELSE 0 END"
  purchase_qty: "CASE WHEN STHAR_GCKOD = 'G' THEN STHAR_GCMIK ELSE 0 END"
cari_finans:
  base_model: cari_hareketleri
  cari_key: CARI_KOD
  name_model: cari_kartlar
  name_col: CARI_ISIM
  name_key: CARI_KOD
  tarih: TARIH
  borc: BORC
  alacak: ALACAK
# Mizan: TBLMUHFIS. BA 1=borç 2=alacak; HES_KOD Tekdüzen hesap kodu (LTRIM: baştaki
# boşluk kırpılır ki LEFT(kod,1) sınıfı doğru gelsin). HESAPISMI denormalize hesap adı
# AMA bu firmada TÜM satırlarda BOŞ (canlı 2026-07-25: hesap_adi'ye göre gruplama 2 satıra
# çöküyordu) → isim boşsa hesap KODUNA düş (hesap planı tablosu da boş; kod tek güvenilir ad).
mizan:
  base_model: muhasebe_hareketleri
  hesap_kodu: "LTRIM(h.HES_KOD)"
  name_model: hesap_plani      # TBLMUPLAN — hesap adları (HESAP_KODU → HS_ADI)
  name_col: HS_ADI
  name_key: HESAP_KODU
  tarih: TARIH
  borc: "CASE WHEN h.BA = '1' THEN h.TUTAR ELSE 0 END"
  alacak: "CASE WHEN h.BA = '2' THEN h.TUTAR ELSE 0 END"
