name: ticaret
label: satış & alım
base_object: stok_hareketleri

# Mikro V16 anlam sabitleri: sth_tip 0 = GİRİŞ (alım), 1 = ÇIKIŞ (satış);
# tutar = sth_tutar, miktar = sth_miktar. İfadeler taşınabilir SQL.
synonyms: [satış, satis, ciro, gelir, alım, alim, alış, alis, sevk, sevkiyat,
           miktar, tonaj, stok hareketi, mal]


# ⟳ FAZ 2.1(c2) AD GÖÇÜ (2026-08-04): `satis_tutari` → `satis_tutari_hareket`.
# Gerekçe: çekirdek sözleşmesi `satis_tutari` için kanonik grain'i **fatura** ilan etti
# (karar kalemi: `packs/cekirdek/metrik_sozlugu.yml`). Bu cube başka bir grain'de,
# dolayısıyla AYNI ADI TAŞIYAMAZ — aynı ad, karşılaştırılamaz iki sayı demekti.
# ⚠ SİNONİMLER DEĞİŞMEDİ: kullanıcı hâlâ 'satış'/'ciro' diye sorabilir; değişen
# yalnız metriğin KİMLİĞİ. Bir kullanıcıyı kendi kelimesinden etmek, sözleşmenin
# amacı değildir.
measures:
  - name: satis_tutari_hareket
    lower_is_better: false   # B-5 · yüksek = İYİ
    cekirdek_metrik: satis_tutari
    expression: "SUM(CASE WHEN sth_tip = 1 THEN sth_tutar ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [satış, ciro, gelir, satış tutarı]
  - name: satis_miktari
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: "SUM(CASE WHEN sth_tip = 1 THEN sth_miktar ELSE 0 END)"
    type: DOUBLE
    unit: "kg"
    synonyms: [satış miktarı, satılan, sevk edilen]
  - name: alim_tutari
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(CASE WHEN sth_tip = 0 THEN sth_tutar ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [alım, alış, alım tutarı, hurda alımı]
  - name: alim_miktari
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(CASE WHEN sth_tip = 0 THEN sth_miktar ELSE 0 END)"
    type: DOUBLE
    unit: "kg"
    synonyms: [alım miktarı, alınan, toplanan]
  - name: net_miktar
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(CASE WHEN sth_tip = 0 THEN sth_miktar ELSE -sth_miktar END)"
    type: DOUBLE
    unit: "kg"
    synonyms: [net miktar, stok değişimi]
  - name: islem_sayisi
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: COUNT(*)
    type: DOUBLE
    unit: "adet"
    synonyms: [işlem sayısı, kaç işlem, işlem adedi]
  # P0 satış genişletme: realize edilmiş ortalama fiyatlar (tutar/miktar, tek-ifade oran).
  - name: ort_satis_fiyati
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: "SUM(CASE WHEN sth_tip = 1 THEN sth_tutar ELSE 0 END) / NULLIF(SUM(CASE WHEN sth_tip = 1 THEN sth_miktar ELSE 0 END), 0)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [ortalama satış fiyatı, ortalama fiyat, birim fiyat, satış fiyatı, ortalama satış]
  - name: ort_alis_fiyati
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(CASE WHEN sth_tip = 0 THEN sth_tutar ELSE 0 END) / NULLIF(SUM(CASE WHEN sth_tip = 0 THEN sth_miktar ELSE 0 END), 0)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [ortalama alış fiyatı, ortalama maliyet, birim maliyet, alış fiyatı]

dimensions:
  - name: stok_kodu
    expression: sth_stok_kod
    type: VARCHAR
    label: stok kodu
    synonyms: [stok, ürün, malzeme, mal]
  - name: cari_kodu
    expression: sth_cari_kodu
    type: VARCHAR
    label: cari kodu
    synonyms: [cari, firma kodu, müşteri kodu, tedarikçi]
  - name: evrak_tipi
    expression: sth_evraktip
    type: INTEGER
    label: evrak tipi
    synonyms: [evrak, evrak tip]

time_dimensions:
  - name: tarih
    expression: sth_tarih
    type: TIMESTAMP
