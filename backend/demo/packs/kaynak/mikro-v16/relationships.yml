# Mikro V16 çekirdek ilişkileri. FK constraint'leri kaynakta beyan edilmez
# (Mikro şeması constraint'siz) — ilişkiler alan bilgisiyle elle sabitlenir.
relationships:
  - name: cari_hareket_cari
    join_type: MANY_TO_ONE
    models:
      - cari_hesap_hareketleri
      - cari_hesaplar
    condition: "cari_hesap_hareketleri.cha_kod = cari_hesaplar.cari_kod"
  - name: stok_hareket_stok
    join_type: MANY_TO_ONE
    models:
      - stok_hareketleri
      - stoklar
    condition: "stok_hareketleri.sth_stok_kod = stoklar.sto_kod"
  - name: stok_hareket_cari
    join_type: MANY_TO_ONE
    models:
      - stok_hareketleri
      - cari_hesaplar
    condition: "stok_hareketleri.sth_cari_kodu = cari_hesaplar.cari_kod"
