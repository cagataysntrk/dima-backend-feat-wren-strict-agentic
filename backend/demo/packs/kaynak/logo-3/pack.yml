# Logo 3 serisi (Start/GO/Tiger ortak şema) KAYNAK pack'i (ADR-0017).
# Logo tek DB'de çok firmayı tablo önekiyle tutar: LG_<FFF>_<PP>_* (firma, dönem);
# kart tabloları dönemsizdir: LG_<FFF>_*. Bu yüzden MODELLER bu pack'te DURMAZ —
# gereksinim.yml şablonundan, şirketin firma/dönem kapsamıyla ŞİRKET katmanına
# üretilir (lab/generate_models.py --firma --donem --out). Pack yalnız anlam taşır:
# cube'lar, ilişkiler (soyut model adlarıyla), kurallar.
name: logo-3
tur: kaynak
datasource: mssql

fingerprint:
  tablolar: [L_CAPIFIRM, L_CAPIPERIOD]
  tablo_desenleri: ["LG[_]%[_]%"]
