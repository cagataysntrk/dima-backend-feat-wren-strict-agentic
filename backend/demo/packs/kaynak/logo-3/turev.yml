# Türev-metrik binding'leri — Logo 3: STLINE.IOCODE 1-2=giriş(alım), 3-4=çıkış(satış);
# miktar AMOUNT, tutar TOTAL; stok STOCKREF ↔ ITEMS.LOGICALREF; iptal CANCELLED=1.
karlilik:
  base_model: fatura_satirlari
  stok_key: STOCKREF
  name_model: stok_kartlari
  name_col: NAME
  name_key: LOGICALREF
  tarih: DATE_
  row_filter: "CANCELLED = 0"
  sale_amount: "CASE WHEN IOCODE IN (3, 4) THEN TOTAL ELSE 0 END"
  sale_qty: "CASE WHEN IOCODE IN (3, 4) THEN AMOUNT ELSE 0 END"
  purchase_amount: "CASE WHEN IOCODE IN (1, 2) THEN TOTAL ELSE 0 END"
  purchase_qty: "CASE WHEN IOCODE IN (1, 2) THEN AMOUNT ELSE 0 END"
cari_finans:
  base_model: cari_hareketleri
  cari_key: CLIENTREF
  name_model: cari_kartlar
  name_col: DEFINITION_
  name_key: LOGICALREF
  tarih: DATE_
  row_filter: "CANCELLED = 0"
  borc: "CASE WHEN SIGN = 0 THEN AMOUNT ELSE 0 END"
  alacak: "CASE WHEN SIGN = 1 THEN AMOUNT ELSE 0 END"
