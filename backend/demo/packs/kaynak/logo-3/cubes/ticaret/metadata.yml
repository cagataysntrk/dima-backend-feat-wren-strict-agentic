name: ticaret
label: satış & alım (fatura)
base_object: faturalar

# Logo 3 anlam sabitleri (GULTEKS_2021 verisinden doğrulandı): INVOICE.TRCODE
# 1 = mal ALIM faturası, 8 = toptan SATIŞ faturası; iptal CANCELLED=1;
# net tutar NETTOTAL, brüt GROSSTOTAL.
# always_filter (cube-katalog §5): iptal kayıtlar cube-düzeyinde dışlanır — ölçü
# ifadelerinden CANCELLED=0 tekrarı KALDIRILDI (LookML sql_always_where deseni).
always_filter: "CANCELLED = 0"
synonyms: [satış, satis, ciro, gelir, alım, alim, alış, alis, fatura, mal]

measures:
  - name: satis_tutari
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: "SUM(CASE WHEN TRCODE = 8 THEN NETTOTAL ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [satış, ciro, gelir, satış tutarı, net satış]
  - name: brut_satis
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: "SUM(CASE WHEN TRCODE = 8 THEN GROSSTOTAL ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [brüt satış, brüt]
  - name: alim_tutari
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(CASE WHEN TRCODE = 1 THEN NETTOTAL ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [alım, alış, alım tutarı, mal alımı]
  - name: satis_fatura_sayisi
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: "SUM(CASE WHEN TRCODE = 8 THEN 1 ELSE 0 END)"
    type: DOUBLE
    unit: "adet"
    synonyms: [fatura sayısı, satış fatura sayısı, kaç fatura, fatura adedi, satış fatura adedi]
  # Alış fatura sayısı — satışın simetriği (TRCODE 1=alış). Canlı 2026-07-25 bulgusu (netsis).
  - name: alim_fatura_sayisi
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(CASE WHEN TRCODE = 1 THEN 1 ELSE 0 END)"
    type: DOUBLE
    unit: "adet"
    synonyms: [alış fatura sayısı, alım fatura sayısı, kaç alış faturası, alış fatura adedi, alım fatura adedi]
  # P0 satış genişletme: AOV = ortalama fatura tutarı (satış/fatura sayısı, tek-ifade oran).
  - name: ort_fatura_tutari
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "SUM(CASE WHEN TRCODE = 8 THEN NETTOTAL ELSE 0 END) / NULLIF(SUM(CASE WHEN TRCODE = 8 THEN 1 ELSE 0 END), 0)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [ortalama fatura, ortalama sepet, sepet tutarı, aov,
               ortalama fatura tutarı, fatura başına]

dimensions:
  - name: cari_ref
    expression: CLIENTREF
    type: INTEGER
    label: cari ref
    synonyms: [cari, müşteri kodu, tedarikçi]
  - name: fatura_no
    expression: FICHENO
    type: VARCHAR
    label: fatura no
    synonyms: [fatura no, fiş no]

time_dimensions:
  - name: tarih
    expression: DATE_
    type: TIMESTAMP
