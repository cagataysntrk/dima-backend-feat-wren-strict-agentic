name: mal
label: mal hareketi (miktar)
base_object: fatura_satirlari

# Logo 3 anlam sabitleri (GULTEKS_2021 verisinden doğrulandı): STLINE.IOCODE
# 1-2 = GİRİŞ (alım), 3-4 = ÇIKIŞ (satış/sevk); miktar AMOUNT, tutar TOTAL.
# Birimler karışık olabilir (kg/metre/top) — bkz. kumas-ticareti sektör kuralı.
always_filter: "CANCELLED = 0"
synonyms: [miktar, kilo, kg, sevk, mal hareketi, stok hareketi, kaç kilo]


# ⟳ FAZ 2.1(c2) AD GÖÇÜ (2026-08-04): `satis_tutari` → `satis_tutari_kalem`.
# Gerekçe: çekirdek sözleşmesi `satis_tutari` için kanonik grain'i **fatura** ilan etti
# (karar kalemi: `packs/cekirdek/metrik_sozlugu.yml`). Bu cube başka bir grain'de,
# dolayısıyla AYNI ADI TAŞIYAMAZ — aynı ad, karşılaştırılamaz iki sayı demekti.
# ⚠ SİNONİMLER DEĞİŞMEDİ: kullanıcı hâlâ 'satış'/'ciro' diye sorabilir; değişen
# yalnız metriğin KİMLİĞİ. Bir kullanıcıyı kendi kelimesinden etmek, sözleşmenin
# amacı değildir.
measures:
  - name: satis_miktari
    expression: "SUM(CASE WHEN IOCODE IN (3, 4) THEN AMOUNT ELSE 0 END)"
    type: DOUBLE
    synonyms: [satış miktarı, satılan, sevk edilen, çıkış]
  - name: alim_miktari
    expression: "SUM(CASE WHEN IOCODE IN (1, 2) THEN AMOUNT ELSE 0 END)"
    type: DOUBLE
    synonyms: [alım miktarı, alınan, giriş]
  - name: satis_tutari_kalem
    cekirdek_metrik: satis_tutari
    expression: "SUM(CASE WHEN IOCODE IN (3, 4) THEN TOTAL ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [satış tutarı, çıkış tutarı]
  - name: alim_tutari
    expression: "SUM(CASE WHEN IOCODE IN (1, 2) THEN TOTAL ELSE 0 END)"
    type: DOUBLE
    unit: "₺"
    synonyms: [alım tutarı, giriş tutarı]
  # P0 satış genişletme: realize edilmiş ortalama fiyatlar (tutar/miktar, tek-ifade oran).
  - name: ort_satis_fiyati
    expression: "SUM(CASE WHEN IOCODE IN (3, 4) THEN TOTAL ELSE 0 END) / NULLIF(SUM(CASE WHEN IOCODE IN (3, 4) THEN AMOUNT ELSE 0 END), 0)"
    type: DOUBLE
    unit: "₺"
    synonyms: [ortalama satış fiyatı, ortalama fiyat, birim fiyat, satış fiyatı]
  - name: ort_alis_fiyati
    expression: "SUM(CASE WHEN IOCODE IN (1, 2) THEN TOTAL ELSE 0 END) / NULLIF(SUM(CASE WHEN IOCODE IN (1, 2) THEN AMOUNT ELSE 0 END), 0)"
    type: DOUBLE
    unit: "₺"
    synonyms: [ortalama alış fiyatı, ortalama maliyet, birim maliyet, alış fiyatı]

dimensions:
  - name: stok_ref
    expression: STOCKREF
    type: INTEGER
    label: stok ref
    synonyms: [stok, ürün, kumaş, malzeme]
  - name: cari_ref
    expression: CLIENTREF
    type: INTEGER
    label: cari ref
    synonyms: [cari, müşteri]

time_dimensions:
  - name: tarih
    expression: DATE_
    type: TIMESTAMP
