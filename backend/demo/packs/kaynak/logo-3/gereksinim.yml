# logo-3 kaynak pack'i — GEREKSİNİM LİSTESİ (ADR-0017 Karar 8).
# {firma} (3 haneli) ve {donem} (2 haneli) yer tutucuları, şirketin kapsamıyla
# doldurulur: lab/generate_models.py <pack> <db> --firma 121 --donem 1 --out <şirket>/models
# Logo'da PK LOGICALREF'tir (kimlik kolonu, tüm tablolarda).

modeller:
  - name: cari_kartlar
    tablo: "LG_{firma}_CLCARD"
    primary_key: LOGICALREF
    kolonlar: [LOGICALREF, CODE, DEFINITION_]

  - name: cari_hareketleri
    tablo: "LG_{firma}_{donem}_CLFLINE"
    kolonlar: [DATE_, SIGN, AMOUNT, TRCODE, CLIENTREF, TRANNO, LINEEXP, CANCELLED]

  - name: stok_kartlari
    tablo: "LG_{firma}_ITEMS"
    primary_key: LOGICALREF
    kolonlar: [LOGICALREF, CODE, NAME]

  - name: faturalar
    tablo: "LG_{firma}_{donem}_INVOICE"
    primary_key: LOGICALREF
    kolonlar: [LOGICALREF, TRCODE, FICHENO, DATE_, DOCODE, CLIENTREF, CANCELLED,
               GROSSTOTAL, NETTOTAL]

  - name: fatura_satirlari
    tablo: "LG_{firma}_{donem}_STLINE"
    kolonlar: [DATE_, TRCODE, IOCODE, LINETYPE, STOCKREF, CLIENTREF,
               AMOUNT, PRICE, TOTAL, CANCELLED]
