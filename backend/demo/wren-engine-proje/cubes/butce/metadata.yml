name: butce
label: Bütçe / hedef
base_object: butce_hedefleri

# BÜTÇE MODÜLÜ (2026-08-05) — ERP-bağımsız dikey, sektörden bağımsız.
#
# 🔴 ÖLÇÜLEN BOŞLUK: 47 tablonun hiçbiri bir HEDEF taşımıyordu. CFO korpusundaki
# "üçüncü çeyrek gerçekleşme nasıl" ve "hedefin neresindeyiz" sorularının cevabı
# veride YOKTU — sistem doğru davransa bile cevaplayacağı bir sayı yoktu.
#
# *Gerçekleşme tek başına bir gerçekleşme değildir; bir hedefe göre gerçekleşmedir.*
# Hedefsiz bir ERP'de bütçe sorusu sorulamaz — ve bütçe sorusu bir CFO'nun sorduğu
# ilk üç sorudan biridir.
#
# ⚠ CUBE KİMLİĞİ ÇAKIŞMASI: "ciro"/"maliyet" bu cube'un KALEM DEĞERLERİdir, ölçüsü
# değil. Cube kimliğinde tutulmaz — yoksa "bu ay ciro" sorusu parti yerine buraya
# düşer ve kullanıcı GERÇEKLEŞEN yerine HEDEFİ görür (sessiz-yanlış). Bütçeye
# "bütçe/hedef/plan/gerçekleşme" kelimeleriyle ulaşılır.
# ⚠ Çıplak `sapma` KALDIRILDI (dört sahipli); nitelenmiş `bütçe sapması` KALDI.
#
# 🔴🔴 **ÖLÇÜLDÜ (2026-08-12): YUKARIDAKİ UYARININ KENDİSİ BU KÜPTE GERÇEKLEŞİYOR.**
#
# Uyarı *«kullanıcı GERÇEKLEŞEN yerine HEDEFİ görür (sessiz-yanlış)»* diyor ve bir satır
# sonra `gerçekleşme` sinonim listesine giriyor. Canlı curl:
#
#     «bütçe gerçekleşme oranı»  → cube=butce · YALNIZ toplam_hedef · 12 satır
#     «hedefin neresindeyiz»     → cube=butce · YALNIZ toplam_hedef · 12 satır
#
# Üç düzeyde doğrulandı: bu küpte gerçekleşme ölçüsü **yok** (yalnız hedef ölçüleri);
# `butce_hedefleri` tablosunda gerçekleşme **kolonu yok** (`demo/genisletme.py:164`);
# ama küp kelimeyi **talep ediyor**.
#
# ⊘ **SİNONİMİ KALDIRMAK ÇÖZMEZ — ölçüldü ve çürütüldü.** Her iki soru da `bütçe`
# ya da `hedef` kelimesini **zaten** taşıyor; `gerçekleşme`yi listeden çıkarmak
# yönlendirmeyi değiştirmez, yalnız çıplak *«gerçekleşme»*yi etkiler. *Bir düzeltmeyi
# uygulamadan önce, düzelttiği vakayı gerçekten kapsayıp kapsamadığını ölçmek gerekir.*
#
# 🔴 **EKSİK OLAN BİR SİNONİM DEĞİL, BİR EŞLEMEDİR:** gerçekleşme = 12 bütçe kaleminin
# (Ciro · SMM · Hammadde · Kimyasal · Enerji · İşçilik · Bakım-Onarım · Personel ·
# Pazarlama · Nakliye · Genel Yönetim · Ar-Ge) **operasyonel küp karşılığı**. O eşleme
# şirketten şirkete değişir ve **iş tarafının beyanıdır** — uydurulamaz (`§38.4`).
# Mekanizma hazır: `demo/packs/modul/kpi/*.yml` (çapraz-küp KPI: `components.sql` +
# `formula` + `requires_views`). Eksik olan **veri değil, KARAR**.
#
# ⊙ Karnenin `§17 iş sözlüğü` kaleminin somut içeriği tam olarak budur.
synonyms: [bütçe, hedef, plan, planlanan, bütçelenen, gerçekleşme, bütçe sapması,
           bütçe hedefi]

measures:
  - name: toplam_hedef
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: SUM(hedef_tutar)
    type: DOUBLE
    unit: "₺"
    synonyms: [hedef, bütçe, planlanan tutar, bütçelenen, hedef tutar, plan]
  - name: ort_hedef
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: "ROUND(AVG(hedef_tutar),0)"
    type: DOUBLE
    unit: "₺"
    additive: non
    synonyms: [ortalama hedef, aylık ortalama bütçe, hedef ortalaması]
  - name: hedef_miktar_toplam
    lower_is_better: false   # B-5 · yüksek = İYİ
    expression: SUM(hedef_miktar)
    type: DOUBLE
    unit: "ton"
    synonyms: [hedef miktar, planlanan miktar, miktar hedefi]
  - name: kalem_sayisi
    lower_is_better: null   # B-5 · yön YOK — «en kötü» sorulursa SORULMALI
    expression: "COUNT(DISTINCT kalem)"
    type: DOUBLE
    unit: "adet"
    additive: non
    synonyms: [kalem sayısı, kaç kalem, bütçe kalemi]

dimensions:
  - name: kalem
    expression: kalem
    type: VARCHAR
    synonyms: [kalem, bütçe kalemi, gider kalemi, hesap adı]
  - name: bolum
    expression: bolum
    type: VARCHAR
    label: bölüm
    synonyms: [bölüm, departman, birim, sorumlu bölüm]
  - name: hesap_kodu
    expression: hesap_kodu
    type: VARCHAR
    label: hesap kodu
    synonyms: [hesap kodu, hesap, muhasebe kodu]
  - name: durum
    expression: durum
    type: VARCHAR
    synonyms: [durum, onay durumu, taslak, onaylı]
  - name: para_birimi
    expression: para_birimi
    type: VARCHAR
    label: para birimi
    synonyms: [para birimi, döviz cinsi, kur cinsi]

time_dimensions:
  - name: donem_tarih
    # yil/ay ayrı sütunlarda tutuluyor → dönem ekseni burada kurulur.
    expression: "make_date(yil, ay, 1)"
    type: DATE
