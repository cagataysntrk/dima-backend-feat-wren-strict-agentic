name: oee
label: OEE
base_object: oee_vardiya
synonyms:
- oee
- verim
- randıman
- vardiya
- kullanılabilirlik
- availability
- performans
- duruş
- arıza
- downtime
- çalışma
- üretim
default_measure: ort_oee
measures:
- name: ort_oee
  label: OEE
  lower_is_better: false
  expression: ROUND(100.0 * (1.0*SUM(calisma_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0))
    * (SUM(performans_PV*planli_uretim_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0))
    * (1.0*SUM(uretim_kg - hatali_kg)/NULLIF(SUM(uretim_kg),0)), 2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - oee
  - verim
  - randıman
  - toplam ekipman etkinliği
- name: ort_kullanilabilirlik
  lower_is_better: false
  expression: ROUND(100.0*SUM(calisma_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0),
    2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - kullanılabilirlik
  - availability
- name: ort_performans
  lower_is_better: false
  expression: ROUND(100.0*SUM(performans_PV*planli_uretim_suresi_dk)/NULLIF(SUM(planli_uretim_suresi_dk),0),
    2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - performans
- name: ort_kalite
  lower_is_better: false
  expression: ROUND(100.0*SUM(uretim_kg - hatali_kg)/NULLIF(SUM(uretim_kg),0), 2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - kalite
- name: toplam_durus_dakika
  expression: SUM(planli_durus_dk + plansiz_durus_dk)
  type: DOUBLE
  unit: dk
  synonyms:
  - duruş
  - arıza
  - downtime
  - duruş süresi
  lower_is_better: true
- name: plansiz_durus_dakika
  expression: SUM(plansiz_durus_dk)
  type: DOUBLE
  unit: dk
  synonyms:
  - plansız duruş
  - arıza duruşu
  - beklenmedik duruş
  lower_is_better: true
- name: toplam_uretim_kg
  lower_is_better: false
  expression: SUM(uretim_kg)
  type: DOUBLE
  unit: kg
  synonyms:
  - üretim
  - miktar
  - üretilen
- name: toplam_fire_kg
  expression: SUM(hatali_kg)
  type: DOUBLE
  unit: kg
  synonyms:
  - fire
  - hatalı
  - hurda
  lower_is_better: true
- name: ilk_seferde_tamam_yuzde
  lower_is_better: false
  expression: ROUND(SUM(ilk_seferde_tamam)*100.0/NULLIF(SUM(parti_sayisi),0),2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - ilk seferde tamam
  - rft
  - ilk sefer
- name: toplam_parti
  lower_is_better: null
  expression: SUM(parti_sayisi)
  type: DOUBLE
  unit: parti
  synonyms:
  - parti sayısı
  - kaç parti
  - adet
dimensions:
- name: makine
  expression: makine
  type: VARCHAR
  label: makine
  synonyms:
  - makin
  - cihaz
  - tezgah
- name: hat
  expression: hat
  type: VARCHAR
  synonyms:
  - hat
  - hattı
  - line
- name: vardiya
  expression: CASE vardiya WHEN 1 THEN '1. Vardiya (08-16)' WHEN 2 THEN '2. Vardiya
    (16-24)' WHEN 3 THEN '3. Vardiya (00-08)' ELSE CAST(vardiya AS VARCHAR) END
  type: VARCHAR
  synonyms:
  - vardiya
  - vardiyalar
- name: hafta_gunu
  label: haftanın günü
  expression: CASE isodow(tarih) WHEN 1 THEN 'Pzt' WHEN 2 THEN 'Sal' WHEN 3 THEN 'Çar'
    WHEN 4 THEN 'Per' WHEN 5 THEN 'Cum' WHEN 6 THEN 'Cmt' WHEN 7 THEN 'Paz' END
  type: VARCHAR
  synonyms:
  - haftanın gün
  - hafta gün
  - hangi gün
  - günlere göre
  - güne göre
- name: bolum
  expression: makineler_bolum
  type: VARCHAR
  label: bölüm
  synonyms:
  - bölüm
  - bolum
  - kısım
  - ünite
  - hangi bölüm
  - bölümlere göre
  properties:
    origin:
      model: makineler
      column: bolum
      relationship: oee_vardiya_makineler
      hops: 1
time_dimensions:
- name: tarih
  expression: tarih
  type: DATE
