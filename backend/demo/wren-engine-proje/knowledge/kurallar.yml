# 🔴 **YAPISAL İŞ KURALLARI** — `app/rules.py`'nin veri kaynağı. [bayrak: ui_knowledge_center]
#
# ## Neden ayrı bir dosya
#
# `knowledge/rules/boyahane.md` **düz metindir** ve LLM prompt'una gider (`business_rules`).
# `app/rules.py` ise yapısal `{id, metin, kapsam}` bekler ve çıktısı **anlatıya** girer,
# SQL'e değil. İkisi farklı tüketiciler: biri modeli yönlendirir, öteki kullanıcıya
# **kaynağı gösterilebilir** bir not verir.
#
# 🔴 **İÇERİK UYDURULMADI.** Aşağıdaki iki kural `boyahane.md`'nin kendi başlıklarından
# **yapılandırıldı** — yeni bir alan iddiası yok. *Bir bilgi merkezinin ilk kuralı,
# kendi kaynağını gösterebilmektir.*
#
# ⚠ `kapsam` **zorunlu ve daraltıcı**: kapsamsız bir kural her cevaba yapışan bir
# **dipnot** olurdu ve `rules.eslesen()` onu zaten eşleştirmez.
# ⚠ Kural **SQL alanı taşıyamaz** (`rules.YASAK_ALANLAR`): bilgi anlatıya girer, sorguya
# değil — *bir kural SQL'i değiştirebilseydi, kullanıcının görmediği bir yerde sayıyı
# değiştirirdi.*
kurallar:
  - id: boyahane.oran-toplam-uzerinden
    metin: >-
      Oran metrikleri (OEE, kullanılabilirlik, performans, kalite, fire oranı)
      gruplanırken SUM(pay)/SUM(payda) ile hesaplanır — satırdaki hazır oran kolonunun
      ortalaması ağırlıksız olduğu için sistematik sapar (tipik 2-5 puan). ISO 22400.
    kaynak: "knowledge/rules/boyahane.md · «Oran metrikleri → TOPLAM-üzerinden»"
    kapsam:
      cube: oee

  - id: boyahane.miktar-toplam
    metin: >-
      Miktar metrikleri (çalışma/duruş dakikası, üretim ve sağlam kg, fire kg, su, enerji,
      tutar) sayılabilir miktarlardır ve gruplanırken toplanır.
    kaynak: "knowledge/rules/boyahane.md · «Miktar metrikleri → TOPLAM (SUM)»"
    kapsam:
      cube: parti
