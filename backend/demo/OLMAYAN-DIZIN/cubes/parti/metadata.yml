measures:
- name: ort_hiz_m_dk
  expression: ROUND(AVG(hiz_m_dk),1)
  type: DOUBLE
  unit: m/dk
  additive: non
  synonyms:
  - ortalama hız
  - makine hızı
  - üretim hızı
  - metre dakika
  - çalışma hızı
  lower_is_better: false
- name: toplam_fire_kg
  expression: SUM(CASE WHEN ilk_seferde_tamam = 0 THEN kg ELSE 0 END)
  type: DOUBLE
  unit: kg
  synonyms:
  - fire
  lower_is_better: true
- name: fire_orani_yuzde
  expression: ROUND(SUM(CASE WHEN ilk_seferde_tamam = 0 THEN kg ELSE 0 END)*100.0/NULLIF(SUM(kg),0),2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - fire oranı
  - fire yüzdesi
  - hata oranı
  lower_is_better: true
- name: toplam_agirlik_kg
  lower_is_better: null
  expression: SUM(kg)
  type: DOUBLE
  unit: kg
  synonyms:
  - ağırlık
  - kilo
  - tonaj
  - işlenen
  - üretim
  - üretilen
  - miktar
- name: toplam_metre
  lower_is_better: null
  expression: SUM(metre)
  type: DOUBLE
  unit: m
  synonyms:
  - metre
  - metraj
  - uzunluk
- name: toplam_ciro
  lower_is_better: false
  expression: SUM(ciro_tl)
  type: DOUBLE
  unit: ₺
  synonyms:
  - ciro
  - gelir
  - tutar
  - satış
- name: kar
  lower_is_better: false
  expression: SUM(ciro_tl - enerji_toplam_tl - kimyasal_tl)
  type: DOUBLE
  unit: ₺
  synonyms:
  - kar!
  - kârımız
  - karımız
  - kârlı
  - karlı
  - kazanç
- name: kar_marji_yuzde
  lower_is_better: false
  expression: ROUND(SUM(ciro_tl - enerji_toplam_tl - kimyasal_tl)*100.0/NULLIF(SUM(ciro_tl),0),2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - kar oranı
  - kar yüzdesi
  - kâr marjı
  - kar marjı
  - karlılık oranı
  - karlılık
  - marj
- name: ort_renk_sapmasi
  expression: AVG(uretim_dE)
  type: DOUBLE
  unit: dE
  additive: non
  synonyms:
  - sapma
  - delta
  - renk sapması
  lower_is_better: true
- name: ilk_seferde_tamam_yuzde
  lower_is_better: false
  expression: ROUND(SUM(ilk_seferde_tamam)*100.0/NULLIF(COUNT(*),0),2)
  type: DOUBLE
  unit: '%'
  additive: non
  synonyms:
  - ilk seferde tamam
  - rft
  - ilk sefer
  - ilk seferde
- name: parti_sayisi
  lower_is_better: null
  expression: COUNT(*)
  type: DOUBLE
  unit: adet
  synonyms:
  - parti sayısı
  - kaç parti
  - adet
