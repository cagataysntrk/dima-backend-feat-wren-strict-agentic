- name: yas_grubu
  label: yaş grubu
  expression: CASE WHEN operator_dogum_tarihi IS NULL THEN NULL WHEN date_diff('year',
    operator_dogum_tarihi, current_date) < 30 THEN '<30' WHEN date_diff('year', operator_dogum_tarihi,
    current_date) < 40 THEN '30-39' WHEN date_diff('year', operator_dogum_tarihi,
    current_date) < 50 THEN '40-49' ELSE '50+' END
  type: VARCHAR
  synonyms:
  - yaş
  - yaş grubu
  - yaşa göre
  - yaş aralığı
  - kaç yaş
- name: hafta_gunu
  label: haftanın günü
  expression: CASE isodow(tarih) WHEN 1 THEN 'Pzt' WHEN 2 THEN 'Sal' WHEN 3 THEN 'Çar'
    WHEN 4 THEN 'Per' WHEN 5 THEN 'Cum' WHEN 6 THEN 'Cmt' WHEN 7 THEN 'Paz' END
  type: VARCHAR
  synonyms:
  - haftanın gün
