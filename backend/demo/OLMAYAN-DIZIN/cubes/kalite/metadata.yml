name: kalite
label: kalite / rework
base_object: tamir_rework
synonyms:
- rework
- tamir
- yeniden işlem
- ikinci banyo
- hata
- hatalı
- ret
- sebep
- tekrar
- düzeltme
- reprocess
- kalite hatası
measures:
- name: toplam_rework_kg
  expression: SUM(kg)
  type: DOUBLE
  unit: kg
  synonyms:
  - rework kg
  - tamir kg
  - yeniden işlenen
  - hatalı kg
  - tamir edilen
  lower_is_better: true
- name: rework_sayisi
  expression: COUNT(*)
  type: DOUBLE
  unit: adet
  synonyms:
  - rework sayısı
  - tamir sayısı
  - kaç rework
  - kaç tamir
  - hata sayısı
  - adet
  lower_is_better: true
- name: toplam_ek_sure_dk
  expression: SUM(ek_sure_dk)
  type: DOUBLE
  unit: dk
  synonyms:
  - ek süre
  - kayıp süre
  - ilave süre
  - rework süresi
  - tamir süresi
  lower_is_better: true
- name: ort_dE
  expression: ROUND(AVG(dE),2)
  type: DOUBLE
  unit: dE
  additive: non
  synonyms:
  - delta E
  - renk farkı
  - ortalama sapma
  - renk sapması
  lower_is_better: true
- name: tolerans_asma_sayisi
  expression: SUM(CASE WHEN dE > tolerans THEN 1 ELSE 0 END)
  type: DOUBLE
  unit: adet
  synonyms:
  - tolerans aşımı
  - tolerans dışı
  - şartname dışı
  - ret adedi
  lower_is_better: true
