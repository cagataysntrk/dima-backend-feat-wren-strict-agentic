services:
  metabase-app-db:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: ${MB_APP_DB_NAME:-metabaseappdb}
      POSTGRES_USER: ${MB_APP_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${MB_APP_DB_PASSWORD:-dima-metabase-app-lab}
    volumes:
      - metabase_app_db_data:/var/lib/postgresql/data
    networks:
      - metabase_lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_APP_DB_USER:-metabase} -d ${MB_APP_DB_NAME:-metabaseappdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  analytics-db:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME:-dima_analytics}
      POSTGRES_USER: ${ANALYTICS_DB_USER:-dima_analytics}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-dima-analytics-lab}
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
      - ./init/analytics-db:/docker-entrypoint-initdb.d:ro
    networks:
      - metabase_lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER:-dima_analytics} -d ${ANALYTICS_DB_NAME:-dima_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  metabase:
    image: metabase/metabase@sha256:1160b570cb11c107bce00e71293552df8a8363e01a32c2c7a048cee002dc8a73
    depends_on:
      metabase-app-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_APP_DB_NAME:-metabaseappdb}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${MB_APP_DB_USER:-metabase}
      MB_DB_PASS: ${MB_APP_DB_PASSWORD:-dima-metabase-app-lab}
      MB_DB_HOST: metabase-app-db
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3300}
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_INSTALL_ANALYTICS_DATABASE: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_AI_FEATURES_ENABLED: "true"
      MB_AGENT_API_ENABLED: "true"
      MB_MCP_EXECUTE_SQL_ENABLED: "false"
    ports:
      - "127.0.0.1:${METABASE_PORT:-3300}:3000"
    networks:
      - metabase_lab
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  metabase_app_db_data:
  analytics_db_data:

networks:
  metabase_lab:
    driver: bridge
